# ===========================================================================
# 메타: bond_cash 방의 특수성 — 2개 sleeve(bond, cash) 동시 스터디. 둘은 *상보 defensive
#   pair*: Investment Clock(regime_to_weights L74~79) 에서 Reflation=bond top·cash neutral
#   / Stagflation=cash top·bond down 으로 정확히 교차. 채권 = -듀레이션·Δyield (1차) +
#   convexity·(Δyield)² (2차) + carry(쿠폰) — 듀레이션이 종목(ETF)간 가중을 가르는 1차 축
#   이고, HY OAS·term spread 가 regime 분기점이다. stock_track 의 종목사이징(_extract_indicator_z)
#   이 아니라 regime_to_weights 의 *sleeve* 레이어 + sleeve 내부 듀레이션 bucket(부록 B
#   archetype) 으로 inject 한다. 매매 sleeve 임(macro 와 달리 자체 forward return 있음).
# 핵심 데이터: 현재 in_our_system 은 T10Y2Y/BAA10Y/HY OAS/T5YIE/NFCI/CFNAI 6종. 본체인
#   DGS10/DGS2/DFII10(real rate)/FEDFUNDS/MORTGAGE30US/장단기 듀레이션 ETF(TLT/IEF/SHY)는
#   부재 → 블록6 collector_plan 으로 main 요청. 분석은 가용 6종으로 *진행 가능*(§2 ② 충족).
# ===========================================================================

# 블록1: LENS (정성 렌즈 — LLM 주입용. ★가변: 블록5 flag 누적이 estimation_note·regime_reading·블록4 가중을 미세변동)
lens:
  pricing_principle: >
    채권 1차 근사: ΔP/P ≈ -Duration · Δy + 0.5 · Convexity · (Δy)² + carry(쿠폰 수익률).
    Duration = 금리민감도 = -(1/P)·(∂P/∂y). 30Y 채권 D≈18~20, 10Y D≈8~9, 2Y D≈1.9, 3M ≈0.25(현금).
    명목금리 y = real_rate + breakeven_inflation (Fisher 분해). 따라서 *real rate* 가 듀레이션
    리스크 본체이고 *breakeven* 이 인플레 hedge 축이다. 현금은 short-duration(D≈0) → rate-shock
    면역, 단 carry=단기금리(FEDFUNDS·DGS3MO). 신용채(HY/IG)는 위 + credit spread(=HY OAS / BAA10Y)
    추가: HY 가격 = -Duration·Δ(treasury y) - SpreadDuration·Δ(spread) + carry. spread duration ≈ duration
    이라 위험프리미엄 충격이 1:1 가산. 결국 채권/현금 자산군의 종목간 가중을 가르는 *프리미티브*는
    (1) duration bucket(long/mid/short/cash) (2) credit quality(Tsy/IG/HY) (3) curve location(belly/wing).
  report_relations:
    - "Fed funds(=정책금리) → 2Y(DGS2)→ 10Y(DGS10) 전달경로: 단기금리 인상기 = 2Y 가 10Y 보다 더 오름 = bear flattening → 침체 선행 시그널"
    - "10Y-2Y(T10Y2Y) 역전 → 12~18개월 침체 선행. 역전 *해소*(steepening) = recovery 진입 anchor. 데이터 보유"
    - "DGS10 = DFII10(real rate) + T5YIE(breakeven) → 명목금리 변동을 *real vs inflation* 으로 분해해야 듀레이션·실물(금) 영향 갈라진다"
    - "HY OAS(BAMLH0A0HYM2) 확대 → HY price↓ + 동시에 Tsy price↑(flight-to-quality) = HY 와 long Tsy 의 카운터-사이클 hedge 관계"
    - "Investment Clock 4국면 × 채권: Reflation(성장↑인플레↓) → long Tsy top(real rate↓+disinflation), HY 매력↑. Recovery → bond down(rate↑), credit IG 유지. Overheat → bond down·real rate↑·breakeven↑, short-duration 방어. Stagflation → cash top·bond down(인플레↑+신용↓), HY 위험"
    - "rate-shock 국면(real rate 급등) = 듀레이션 1차 페널티. 장기채(TLT) 손실>>중기(IEF)>>단기(SHY). 듀레이션 베타 = 종목간 가중 차등의 1차 근거"
    - "curve carry trade: 정상커브(steep) 에선 장기채 매수 → 시간경과로 yield 하락(roll-down) → 추가 capital gain. 평탄/역전 커브에선 carry 사라짐"
    - "credit cycle: 저금리·성장 → IG/HY spread 압축(차환 용이) → carry 우위 / 고금리·둔화 → spread 확대(default 위험) → HY 매도. NFCI/CFNAI 와 동조"
    - "엔캐리(BOJ YCC vs Fed) → 미-일 금리차 축소 시 일본 자금 미국채 매도 = bear steepening 외력. 글로벌 채권 펀딩채널"
  regime_reading: >
    Reflation(성장↑인플레↓): bond=top(real rate↓), long-duration 가중↑, HY spread 압축으로 carry 유리.
    Recovery(성장↑인플레↑초입): bond down(명목금리↑), credit IG 유지 cash neutral. duration 축소.
    Overheat(성장↑인플레↑): bond down(real rate·breakeven 동반↑), short-duration·TIPS 방어, HY 균열 시작.
    Stagflation(성장↓인플레↑): cash=top, bond=down(double penalty), HY 위험(default↑). long-duration 회피.
    rate-shock(real rate 급등 sub-regime): 전체 채권 sleeve 축소·cash 가중↑·HY 회피·breakeven 가중↑.
    risk-off(HY OAS spike): bond 내 long Tsy 가중↑(flight-to-quality)·HY 가중↓. credit↔duration 비대칭.
  estimation_note: >
    2026-05 추정(국면전환 anchor, 신뢰도 中, 외부지식 기반·OOS 재검증 대상): 커브 역전 해소 진행 +
    Fed 인하 사이클 + HY OAS 안정(중립) → **Recovery 진입** 단계. 채권은 명목금리 하락 여지 있어
    long-duration 점진 추가 매력, 단 인플레 끈끈하면 Overheat 회귀 위험. cash 는 단기금리(carry≈4~5%)
    여전히 매력적이라 *유리한 옵션 가치* — 비중 급감 금지(Stagflation 회귀 hedge). 이 추정은
    블록5 confidence_hooks (특히 duration_rate_sensitivity / curve_regime_transition) 가 OOS Rank-IC
    로 갱신한다 — 어긋나면 (거부) flag 로 long-duration 가중 하향 + cash hedge 강화.

