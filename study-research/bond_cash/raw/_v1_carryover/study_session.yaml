# 블록4: WEIGHT_RULES (★최종 산출 — 채권 sleeve 내부 종목/duration bucket 별 동적 가중 + cash 가중)
# ★bond_cash 특화: regime_to_weights 의 SLEEVE-LEVEL 비중은 BASE_WEIGHTS+REGIME_DIRECTION 가 이미 처리.
# 본 블록은 *sleeve 내부* (bond 안의 long/mid/short duration ETF 간, HY vs Tsy 간) 종목 가중 룰 +
# regime_to_weights 의 SLEEVE 가중 자체를 belief 신뢰도로 변조하는 룰. 부록 B hierarchical pooling 으로
# ticker 단위는 archetype shrinkage 처리(duration bucket = archetype). composed_weights(pi) 입력.
weight_rules:
  - {indicator_id: duration_bucket_id, base_weight: 0.30, modulate_by: [regime, name_specific],
     direction: "Reflation·rate-down 국면 → long-duration(TLT) 가중↑ (real rate↓·disinflation 수혜). Overheat·rate-shock → short-duration(SHY/BIL) 가중↑ + long penalty. archetype=duration bucket(long/mid/short/cash)",
     granularity: ticker}
  - {indicator_id: credit_quality_id, base_weight: 0.20, modulate_by: [regime],
     direction: "Reflation·Recovery → HY/IG 가중↑(carry 우위). Stagflation·risk-off → Tsy 가중↑(flight-to-quality), HY 회피",
     granularity: ticker}
  - {indicator_id: credit_spread_hy_oas, base_weight: 0.18, modulate_by: [regime],
     direction: "OAS Z-score↑(widening) → HY 가중↓ + long Tsy 가중↑(역카운터). OAS 압축 안정 → HY carry 신뢰",
     granularity: ticker}
  - {indicator_id: yield_10y_2y, base_weight: 0.15, modulate_by: [regime],
     direction: "Steepening (역전 해소) → Recovery 진입 anchor → bond sleeve 전체 가중 점진 회복 + long-duration 비중↑. 역전심화 → cash 가중↑·long 회피",
     granularity: sleeve}
  - {indicator_id: real_rate_10y, base_weight: 0.10, modulate_by: [regime],
     direction: "real rate Z↑ → 듀레이션 페널티(전 ETF) + cash 가중↑. real rate↓ → long-duration 우위 회복",
     granularity: sleeve}
  - {indicator_id: breakeven_5y, base_weight: 0.07, modulate_by: [regime],
     direction: "breakeven↑ → TIPS 가중↑(미보유 시 short-duration 우회) + 명목 long 페널티. Overheat 시 핵심",
     granularity: ticker}

# 블록5: CONFIDENCE_HOOKS (★신뢰도 누적 — 확신/거부 flag 코드 구현. weight_falsification 매핑)
# 매 거래마다 flag 누적 → 가정 신뢰도 → 렌즈 미세변화 → 동적 가중. 채권 자체 매매 sleeve 이므로
# forward return = sleeve 수익률(TLT/IEF/SHY ETF 단위) + sleeve 합산 PnL. 종목별 IC 와 sleeve IC 둘 다.
confidence_hooks:
  - hypothesis_id: duration_rate_sensitivity
    confirm_signal: "rate-shock 국면 분류 시 long-duration(TLT) 페널티가 OOS drawdown 방어(국면조건부 Rank-IC 양수 유지)"
    reject_signal: "rate-shock 페널티가 OOS 에서 음의 알파(과조정 — short-duration 으로 너무 일찍 회피) → e-CUSUM 단측 붕괴"
    emit_where: "backtest engine SELL outcome + regime 분류 직후 사후평가(L1 score=duration_bucket_id·rate_z vs forward return)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess (regime-conditional baseline_ic)"
    confidence_metric: "국면조건부 Rank-IC e-process + duration beta hat 의 sign stability"
    store: "registry weight.bond.{regime}.confidence_now + WeightAssumptionCard.secondary_falsification"
    action_threshold: "e-value ≥ 1/alpha(alpha=0.05) → PRIMARY kill(rate-shock 카드 retract live) / 안정 → base_weight 0.30 유지 또는 +0.02 강화"
    feeds_weight: "kill → derive_weights 재실행 시 duration_bucket_id IC→0 / 안정 → delta_regime 의 rate-shock 행 강화"
  - hypothesis_id: hy_oas_credit_regime
    confirm_signal: "HY OAS Z↑ 시 HY 가중↓ + long Tsy 가중↑ 사이징이 OOS 에서 sleeve PnL 방어(Rank-IC 양)"
    reject_signal: "HY OAS Z 신호 score Rank-IC e-CUSUM 단측 붕괴 (예: OAS widening 후 HY 가 곧 회복하는 false signal 누적)"
    emit_where: "backtest engine 신용 sleeve outcome + 라이브 judge 사후평가"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess (e-CUSUM 단측)"
    confidence_metric: "e-value anytime-valid 누적(Ville: 거짓 kill ≤ alpha=0.05)"
    store: "registry WeightAssumptionCard(weight.bond.credit).confidence_now + ValidationVerdict.evidence"
    action_threshold: "e-value ≥ 1/alpha → PRIMARY kill / 안정 → adopt 강화 (base_weight 0.18 → 0.20)"
    feeds_weight: "kill → HY 신호 IC→0 (Tsy 만 신호) / 안정 → derive_weights HY OAS 가중 유지·소폭 상향"
  - hypothesis_id: curve_inversion_recession_lag
    confirm_signal: "10Y-2Y 역전→해소 전환이 Recovery 진입을 12~18M 선행, OOS bond sleeve return rebound 정합"
    reject_signal: "curve 신호 lag 가 불안정(국면 오분류 → bond sleeve 가중 잘못 회복) → 단측 e-CUSUM 붕괴"
    emit_where: "장기 backtest(2018~) 국면전환 정합 + lag 민감도 sweep"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    confidence_metric: "lag-aligned Rank-IC e-process + curve flip event window 의 sleeve return"
    store: "weight.bond.transition 카드 confidence_now"
    action_threshold: "붕괴 → curve(yield_10y_2y) 가중 0.15→0.10 하향 / 안정 → 유지 + steepening 시점 entry signal 강화"
    feeds_weight: "transition anchor 신뢰도 → estimation_note(블록1) 갱신 + delta_regime[Recovery] 의 long-duration 비중 미세조정"
  - hypothesis_id: carry_to_total_return
    confirm_signal: "yield carry(쿠폰+roll-down) 가 forward 1M return 상관 양수 유지(OOS Rank-IC)"
    reject_signal: "carry 신호 IC 가 spread widening 국면에서 음반전(carry 무효) → e-CUSUM 단측 붕괴"
    emit_where: "backtest engine 채권 sleeve 보유기간 outcome (월별)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    confidence_metric: "Rank-IC e-process (carry vs forward return)"
    store: "weight.bond.carry 카드 confidence_now"
    action_threshold: "붕괴 → roll_carry_yield 가중 폐지(IC→0) / 안정 → 정상커브 국면에서 가중 강화"
    feeds_weight: "신뢰도 → derive_weights carry 행 미세조정 (정상커브 시 가중↑, 평탄·역전 시 가중↓)"
  - hypothesis_id: cash_optionality_value
    confirm_signal: "cash sleeve 가중 floor (≥5%) 유지가 Stagflation/risk-off shock event 에서 sleeve 손실 방어(drawdown limit)"
    reject_signal: "cash 보유의 기회비용(missed bond rally)이 사후 검증에서 sleeve return 유의 음(-) → e-CUSUM 양측 붕괴"
    emit_where: "backtest engine sleeve allocator + shock event window outcome"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess (양측 검정 옵션)"
    confidence_metric: "shock event Conditional Value-at-Risk + 정상기간 carry cost trade-off"
    store: "weight.cash.optionality 카드 confidence_now"
    action_threshold: "carry cost 우세(reject) → cash floor 5%→3% / shock 방어 입증(confirm) → floor 5% 유지·상향"
    feeds_weight: "BASE_WEIGHTS[cash]=0.09 의 동적 floor 보정 (regime_to_weights inject)"
  - hypothesis_id: bond_sleeve_omega_drift
    confirm_signal: "duration bucket × regime 의 partial-corr 구조(Ω)가 OOS 윈도에서 안정(‖ΔΩ‖ 작음)"
    reject_signal: "‖ΔΩ‖/‖Ω‖ > tau_fro(0.5) 또는 |Δlogdet| > tau_logdet(1.0) — 구조 drift(예: HY-Tsy 상관 sign flip)"
    emit_where: "배치 재학습 시점 Ω_new vs Ω_old 비교(train_weights 채권 sleeve 사이클)"
    accumulate_in: "core/assume/weight_falsification.omega_drift + needs_refit"
    confidence_metric: "상대 Frobenius + logdet divergence(SECONDARY, kill 아닌 re-fit trigger)"
    store: "WeightAssumptionCard.secondary_falsification + omega_hash 갱신"
    action_threshold: "drift>tau → TRANSITION(derive_weights 재실행) / score IC 견디면 비중 robust 유지"
    feeds_weight: "re-fit → 새 Ω_eff → delta_regime/delta_arch(duration bucket) 갱신, omega_hash pin 교체"

