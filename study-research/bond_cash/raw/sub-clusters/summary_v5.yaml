# ============================================================
# ★ P0-2 — Kim-Wright term premium = ACM real-time 대체 (audit D축 해소)
# ============================================================
kim_wright_vs_acm:
  rationale: |
    audit D축 격하 = ACM(Adrian-Crump-Moench) published xlsx 가 full-history revised series
    → latest revision = lookahead 잔존 가능. Kim-Wright(FRED THREEFYTP10/5, THREEFFTP10) cross-check 로
    ACM 단독 의존 완화. 둘 다 모델 추정치이나 독립 모델(KW=affine 3-factor / ACM=5-factor)이라
    교차검증 가치 有.
  series_fetched:
    - {id: THREEFYTP10, role: kw_term_premium_10y, rows: 9084, range: "1990-01-02~2026-05-22"}
    - {id: THREEFYTP5,  role: kw_term_premium_5y,  rows: 9084, range: "1990-01-02~2026-05-22"}
    - {id: THREEFFTP10, role: kw_forward_tp_10y_hence, rows: 9084, range: "1990-01-02~2026-05-22"}
  cross_check_10y:
    common_n: 9084
    level_corr_acm_kw: 0.8597
    d20_corr_acm_kw: 0.7241
    mean_diff_acm_minus_kw: 0.2553   # ACM 이 체계적으로 약간 높음 (bp)
    std_diff: 0.6763
  interpretation: |
    level corr 0.86 (<0.95) = 두 모델 본질 동일 아님, ★material 차이 (Fed FEDS Notes 2017
    long-maturity material difference 정합). d20(20일 변화) corr 0.72 = 단기 변화 방향은 더 약하게 일치.
    → ACM revised PIT 한계는 KW cross-check 로 부분 완화되나 ★완전 제거 아님 (KW 도 추정 모델).
    Phase 7 driver = ACM_TP10_d20 + KW_TP10_d20 ★병기(둘 중 한 모델 의존 회피), corr_prior 진입 시
    두 series 일치 구간만 sign-prior 신뢰 상향.
  audit_D_status: |
    부분 해소 — ACM 단독 lookahead 의존 완화. ★audit v5(2026-06-01) 정정: ACM·KW 둘 다 FRED/NYFed
    daily series(median gap 1일) = "monthly publish lag" 표현 부정확. 실제 PIT 잔여 = revision lag
    (single-vintage revised series, ALFRED real-time vintage 미적용). magnitude freeze + sign-prior only
    구조라 revision lookahead 가 alpha 박제로 이어지지 않아 hard 아님(P1 정확성 보강).

# ============================================================
# ★ P0-1 — walk-forward regime classifier (audit C축 해소)
# ============================================================
walk_forward_regime:
  rationale: |
    audit C축 격하 = hy_credit regime-conditional IC(in-sample) bonferroni_pass 박제 = over-fit 의심.
    expanding-window walk-forward(n_splits=5)로 IS→OOS 부호 일치 실측 = regime cell 이 실제 OOS 에서
    예측력 유지하는지 검증. ★합성 0, 실 panel 2007-12-18~2026-05-29 n=4814.
  hyg_regime_cells:   # MOVE_Z 기반 4 regime (rate dir × vol level)
    - {cell: rate_up_vol_high, n: 1036, sign_match_rate: 0.75, mean_ic_is: 0.0059,  mean_ic_oos: -0.0762,
       verdict: "★ OOS 부호 반전 (IS 양 → OOS 음) — in-sample artifact"}
    - {cell: rate_up_vol_low,  n: 1140, sign_match_rate: 0.75, mean_ic_is: 0.0809,  mean_ic_oos: 0.1119,
       verdict: "OOS 부호 유지 (양→양) — ★유일 상대적 안정 cell, 단 split 변동 큼(split2 -0.079)"}
    - {cell: rate_down_vol_high, n: 999, sign_match_rate: 0.75, mean_ic_is: 0.0183, mean_ic_oos: -0.0246,
       verdict: "★ OOS 부호 반전 — in-sample artifact"}
    - {cell: rate_down_vol_low, n: 1405, sign_match_rate: 0.25, mean_ic_is: -0.0021, mean_ic_oos: 0.0346,
       verdict: "★ sign_match 0.25 < chance, OOS 부호 반전 — 신호 부재"}
  finding: |
    4 regime cell 중 ★3개가 OOS 부호 반전 (mean_ic_is ↔ mean_ic_oos 부호 불일치). rate_up_vol_low 만
    OOS 부호 유지하나 split 간 변동 큼(개별 split ic_oos -0.079~+0.276). individual split 에 ic_oos -0.54
    (rate_up_vol_high split3) 등 극단 변동 = regime-conditional IC magnitude OOS 불안정 확정.
    → ★ audit C축 진단 완전 입증: v1 의 "HYG regime IC bonferroni-pass" = in-sample over-fit.
  audit_C_status: "해소 — walk-forward expanding-window 으로 regime cell OOS 불안정 실측. regime-conditional
    magnitude IC corr_prior 진입 ⛔. MOVE_Z regime gate = rate_up_vol_low cell 한정 sign-prior 검토 가능(TENTATIVE)."

