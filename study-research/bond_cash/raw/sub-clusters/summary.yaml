  - driver 공선 PCA 분해 (Phase 7 통합 yaml 시 weight_rules redundancy 제거)
  - regime cell = in-sample classification → Phase 6 walk-forward OOS 의무
  - BAMLH0A0HYM2 1996-2023 ICE 라이센스 부재 → BAA10Y proxy 채택 (DA H3 검증 경로 재사용 명시)
  - ACM TP10 daily ffill (monthly publish) — within-month lookahead 0 검증 필요
  - J축 거래비용 (TLT 0.02%, HYG 0.08%+) 차감 후 양 알파 검증 (alpha 주장 시 의무)
