     transform: level, vintage_policy: point_in_time, lag: 0}
  - {id: china_revenue_share, family: macro_sensitivity, is_core: false, in_our_system: false,
     source_or_collector: "DART 사업의 내용 '중국' 키워드 + 지역별 매출 비중 파싱. 화학·소재·디스플레이·화장품 sub-sector 한정. 블록6 D2",
     transform: level, vintage_policy: point_in_time, lag: 1}
  - {id: dividend_yield_payout, family: quality, is_core: false, in_our_system: true,
     source_or_collector: "dart_provider 배당총액 ÷ 시가총액 + 배당성향. 밸류업 주주환원 신호 + Slowdown 방어",
     transform: own_history_z, vintage_policy: point_in_time, lag: 1}
  - {id: kosdaq_retail_beta, family: macro_sensitivity, is_core: false, in_our_system: true,
     source_or_collector: "krx_flows 개인 순매수 vs 종목수익률 beta(KOSDAQ 한정). 양(+) = 개인 주도 모멘텀/테마 종목 = 단기 alpha + 반전 위험",
     transform: level, vintage_policy: point_in_time, lag: 0}
  - {id: governance_score, family: quality, is_core: false, in_our_system: false,
     source_or_collector: "KCGS(한국기업지배구조원) ESG/G 등급 + 밸류업 공시 ratio. 무료 인덱스 부재 → 블록6 D4(KCGS 또는 KCGI 데이터 라이센스)",
     transform: level, vintage_policy: point_in_time, lag: 1}

# ============================================================================
# 블록3: RELATIONSHIPS (관계 가설 — glasso prior. partial-corr 기준!)
# §8: 공통원인 매개 A-B 는 edge=0, C→A·C→B 분해. conditioning_set 필수.
# ============================================================================
relationships:
  - {node_a: foreign_net_buy, node_b: price_mom_12_1, edge_type: direct,
     conditioning_set: [credit_beta], lag_routing: lagged, prior_sign: pos, prior_strength: 0.55,
     theory_basis: "외국인 순매수가 대형 KOSPI 단기 가격 모멘텀을 선행. 글로벌 risk-on/off(credit_beta) 고정 후 직접효과 — 한국 핵심 가설"}
  - {node_a: dollar_beta, node_b: fwd_eps_momentum, edge_type: direct,
     conditioning_set: [usdkrw_export_exposure], lag_routing: lagged, prior_sign: pos, prior_strength: 0.5,
     theory_basis: "USDKRW 약세 시 수출주 EPS 모멘텀 증폭. 수출비중 고정 후 직접효과 — name_specific 가중의 근거"}
  - {node_a: semi_cycle_beta, node_b: fwd_eps_momentum, edge_type: direct,
     conditioning_set: [dollar_beta], lag_routing: lagged, prior_sign: pos, prior_strength: 0.6,
     theory_basis: "DRAM/NAND cycle turn → 반도체 sub-sector EPS revision 선행. KRW 효과 분리"}
  - {node_a: low_pbr_valueup, node_b: fwd_ep, edge_type: common_cause,
     conditioning_set: [], lag_routing: contemporaneous, prior_sign: pos, prior_strength: 0.7,
     theory_basis: "PBR·E/P 모두 valuation 정의에서 파생 → 직접엣지보다 공통원인(저평가 latent). 카테고리 내 1개로 직교화 후보"}
  - {node_a: credit_beta, node_b: foreign_net_buy, edge_type: direct,
     conditioning_set: [], lag_routing: contemporaneous, prior_sign: neg, prior_strength: 0.5,
     theory_basis: "글로벌 risk-off(HY OAS↑) → 한국 외국인 매도 압력 — 음의 직접효과(전이 채널)"}
  - {node_a: kosdaq_retail_beta, node_b: realized_vol, edge_type: direct,
     conditioning_set: [], lag_routing: contemporaneous, prior_sign: pos, prior_strength: 0.45,
     theory_basis: "개인 주도 KOSDAQ 종목은 변동성·반전 위험 동반 → 단기 alpha 와 vol 의 양의 직접효과"}
  - {node_a: china_revenue_share, node_b: oil_beta, edge_type: common_cause,
     conditioning_set: [credit_beta], lag_routing: contemporaneous, prior_sign: unsigned, prior_strength: 0.3,
     theory_basis: "중국 수요·원자재·글로벌 risk 는 공통원인 매개 — 직접엣지 약함, 거시 driver(global cycle) 로 분해"}

# ============================================================================
# 블록4: WEIGHT_RULES (★최종 산출 — 종목별 가중치 동적 변경)
# 부록B: granularity:ticker = 독립학습 아님 = 산업 prior 에서 종목 shrink(composed_weights pi)
# ============================================================================
weight_rules:
  # ★한국 1순위 — 외국인 수급
  - {indicator_id: foreign_net_buy, base_weight: 0.18, modulate_by: [regime, size],
     direction: "대형 KOSPI(시총상위) 가중↑(외국인 비중 30~50% 종목 한정). Recovery·Reflation 가중 추가↑. Slowdown 음신호. KOSDAQ 소형주는 cap 0.05(외국인 영향 작음)", granularity: ticker}
  # ★밸류업 + 코어 valuation
  - {indicator_id: fwd_ep, base_weight: 0.18, modulate_by: [regime, industry],
     direction: "Recovery 국면 → valuation 가중↑(저평가 재평가). Overheat → 금융·소재 값(이익) 우위. peak → 진입 자제. low_pbr_valueup 과 직교화(common_cause prior 0.7) — 대표 1개 채택 또는 0.5씩 분배", granularity: industry}
  - {indicator_id: low_pbr_valueup, base_weight: 0.10, modulate_by: [regime, name_specific],
     direction: "Recovery + 밸류업 공시 가이던스 종목 가중↑(re-rating 채널). 정책 fade 신호 시 mean-reversion 패널티(역부호 옵션)", granularity: ticker}
  # 모멘텀·리비전
  - {indicator_id: price_mom_12_1, base_weight: 0.08, modulate_by: [regime],
     direction: "한국 모멘텀 약효 → base 낮음. Reflation/Recovery early 에만 가중↑ / Slowdown 축소. KOSDAQ 단기 반전 위험 = 12-1 skip 필수", granularity: sleeve}
  - {indicator_id: earnings_revision_breadth, base_weight: 0.12, modulate_by: [regime, industry],
     direction: "Recovery 초입(국면전환점) 가중↑. 반도체·자동차 sub-sector turning point alpha. 컨센서스 부재 시 잠정실적 yoy 대체 데이터 fallback", granularity: industry}
  - {indicator_id: fwd_eps_momentum, base_weight: 0.10, modulate_by: [regime, industry],
     direction: "반도체 cycle turn 시 가중↑(semi_cycle_beta 와 lagged 결합). 화학·정유는 oil cycle 동반", granularity: industry}
  # 거시 sensitivity (한국 특수 dollar = USDKRW)
  - {indicator_id: dollar_beta, base_weight: 0.10, modulate_by: [regime, name_specific],
     direction: "★한국 특화: KRW 약세 국면 → 수출주(usdkrw_export_exposure 높은) 가중↑, 내수·항공 음부호 적용. name_specific 핵심", granularity: ticker}
  - {indicator_id: rate_beta, base_weight: 0.07, modulate_by: [regime, name_specific],
     direction: "미국 rate-shock + long-duration(2차전지·바이오·플랫폼) 종목 가중↑(부호 음 = 압박). 가치주(은행)는 양", granularity: ticker}
  - {indicator_id: credit_beta, base_weight: 0.08, modulate_by: [regime],
     direction: "Slowdown/리스크오프 → credit beta 가중↑(방어), 고leverage 종목 패널티. foreign_net_buy 와 음상관 동반 검증", granularity: industry}
  # 반도체/중국 특화
  - {indicator_id: semi_cycle_beta, base_weight: 0.08, modulate_by: [regime, industry],
     direction: "반도체 sub-sector(전기전자/IT부품) 한정 가중↑. cycle bottom(Recovery 초입) 가중 최대. cycle peak 진입 차단", granularity: industry}
