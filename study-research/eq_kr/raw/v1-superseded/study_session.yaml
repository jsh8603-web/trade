confidence_hooks:
  - hypothesis_id: foreign_flow_alpha   # 블록3 edge(foreign_net_buy→price_mom_12_1)
    confirm_signal: "외국인 순매수 상위 종목으로 진입한 대형 KOSPI outcome 의 Rank-IC ≥ +0.1 유지(t+5d~t+20d forward return)"
    reject_signal: "foreign_net_buy 신호 Rank-IC e-CUSUM 단측 붕괴(baseline +0.05 하회) — 외국인 정보우위 가설 무효화"
    emit_where: "backtest engine SELL outcome + 라이브 judge 사후평가(대형주 sleeve 한정)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    confidence_metric: "e-value anytime-valid 누적(e_cusum, Ville P(거짓kill)≤alpha)"
    store: "registry WeightAssumptionCard.confidence_now + RulePerformance"
    action_threshold: "e-value ≥ 1/alpha(=20) → adopt 강화 / 붕괴 reject → retract(라이브 차단)"
    feeds_weight: "route_lifecycle SECONDARY(Ω drift) → derive_weights 재적합 → base_weight 0.18 측정 IC 비례 재조정"
  - hypothesis_id: valueup_low_pbr_rerating   # 블록3 edge(low_pbr_valueup→fwd_ep common_cause + 정책 anchor)
    confirm_signal: "Recovery 국면 + 밸류업 가이던스 공시 종목의 fwd_ep·low_pbr 합성 score 가 OOS Rank-IC ≥ +0.15 유지. valuation→Δmultiple 재평가 mean-reversion 채널 작동"
    reject_signal: "정책 fade(밸류업 공시 시점 +12M 후 Rank-IC 평탄화) — 재평가 모멘텀 무효 → 가치함정 회귀"
    emit_where: "backtest engine SELL outcome regime 분해 + judge 사후평가(밸류업 공시 flag 단위)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess (밸류업 flag 서브패밀리)"
    confidence_metric: "regime별 Rank-IC e-process + valuation→Δmultiple mean-reversion 강도"
    store: "registry WeightAssumptionCard.confidence_now + 밸류업 flag 시계열"
    action_threshold: "Rank-IC 붕괴 → low_pbr_valueup base 0.10 하향 + fwd_ep 단독 가중으로 회귀. mean-reversion 깨지면 valuation 가설 자체 재검토"
    feeds_weight: "derive_weights 재적합 + lens.estimation_note 자동 갱신(re-rating anchor 폐기)"
  - hypothesis_id: usdkrw_exporter_beta_namespecific   # 블록3 edge(dollar_beta→fwd_eps_momentum)
    confirm_signal: "USDKRW 약세 국면에 수출비중 ≥50% 종목 가중↑가 outcome 손실 방어 + 내수·항공(usdkrw_export_exposure 음) 종목 패널티 적중"
    reject_signal: "dollar_beta 신호의 종목별 Rank-IC 분산이 무신호(name_specific 무효 → industry 평균만 작동)"
    emit_where: "judge 사후평가 종목 단위 + backtest 국면별·수출비중 quintile 분해"
    accumulate_in: "core/assume/weight_falsification.omega_drift + score_ic_breakdown_eprocess"
    confidence_metric: "regime별 Rank-IC e-process + Ω drift Frobenius(dollar_beta 행)"
    store: "registry 카드 confidence_now + composed_weights pi(ticker membership)"
    action_threshold: "name_specific IC 붕괴 → granularity ticker→industry 강등(shrink↑, 부모 산업 비중 회귀)"
    feeds_weight: "composed_weights delta_inter(교호항) 수축 → 부모(industry) 비중 회귀"
  - hypothesis_id: semi_cycle_turn_predictive   # 블록3 edge(semi_cycle_beta→fwd_eps_momentum)
    confirm_signal: "반도체 cycle bottom(DRAM 현물가 yoy 음→양 전환) 진입 시 semi sub-sector 가중↑가 outcome ≥ 시장 평균 +5%"
