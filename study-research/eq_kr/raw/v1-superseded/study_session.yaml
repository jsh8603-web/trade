study_id: eq_kr
asset_scope: [equity.kr]
as_of: "2026-05-30"

# ============================================================================
# 블록1: LENS (정성 렌즈 — LLM 주입용. 일반론+리포트+OSS 의 정제 결과)
# ★가변: 블록5 flag 누적(확신/거부)→신뢰도→이 필드(특히 estimation_note·regime_reading)와
#   블록4 가중치가 미세 변동. lens=초안, flag=갱신 경로.
# ============================================================================
lens:
  pricing_principle: >
    한국 상장주식 가격 = 멀티플 M × 이익 E.
    P = M(real_rate, credit_spread, USDKRW, governance_discount, 정책_re-rating) ×
        E(반도체/자동차/조선/화학 글로벌 cycle · 수출비중 × FX · 내수경기).
    핵심 1: 만성 **Korea discount** — 거버넌스(지배주주 agency · 낮은 payout · 순환출자) 와
            시클리컬 수출 의존도가 M 을 글로벌 평균 아래로 고정. 2024 FSC **밸류업 프로그램** 이
            이 고정점을 흔드는 정책 anchor — 저PBR + 자본효율(ROE) 개선 종목 re-rating 채널.
    핵심 2: **이익 E 의 글로벌 cycle 의존** — KOSPI 지수이익의 큰 부분이 반도체(메모리 cycle,
            DRAM/NAND 가격), 자동차(글로벌 수요), 조선·화학(중국 수요·유가). 따라서 같은 종목·
            지표라도 **글로벌 cycle 국면 + 한국 환율 국면** 에 따라 신호 의미·가중이 갈린다(R15).
    핵심 3: **외국인 수급이 가격 형성을 주도** — 대형 KOSPI 자유유통 외국인 비중 30~50%대,
            순매수 flow 가 단기 가격 압력의 1차 동인. 외국인 = 정보우위 + 글로벌 risk-on/off
            전이 채널 = "한국에서 잘 작동하는 alpha 의 절반" 가설.
    핵심 4: **KOSPI(대형·외국인주도) vs KOSDAQ(소형·개인주도)** 분절 — 시장 미시구조가 달라
            팩터 작동 양상이 갈린다. KOSDAQ 은 모멘텀·반전·테마 효과 강함 + 외국인 신호 약함.
    GICS 대신 **WICS**(FnGuide) 업종 분류, KrxSectorProvider 적재 사용.
  report_relations:
    - "외국인 순매수 ↑ → 대형 KOSPI 종목 단기 outperform 선행(특히 반도체·금융). KrxForeignFlowProvider 일별 flow."
    - "USDKRW ↑(원화 약세) → 수출주(반도체·자동차·조선) 이익 증폭 / 내수·항공·외화부채 종목 압박. name_specific 부호."
    - "미국 10Y 실질금리 ↑ → 한국 long-duration 성장주(2차전지·바이오·플랫폼) 멀티플 압박. 가치주(은행·통신)는 상대수혜. fwd_ep × rate_beta 교호."
    - "ISM PMI/중국 PMI ↑ → 반도체·소재·화학 fwd EPS 모멘텀 상향(글로벌 산업 cycle 선행). semi_cycle_beta·china_revenue_share 채널."
    - "HY OAS 확대(리스크오프) → 외국인 매도 + 대형주 디레이팅 + KRW 약세 동반(rho<0 한국 위험). credit beta."
    - "DRAM 현물가·재고 cycle → 반도체 fwd EPS revision 의 가장 강한 단일 driver(SK하이닉스·삼성전자 합산 KOSPI 이익의 ~25%)."
    - "밸류업(2024) 정책 트랙: 저PBR + ROE 개선 + 배당·자사주 가이던스 공시 종목 = re-rating 후보. 정책 모멘텀 fade 시 mean-reversion."
    - "Investment Clock: Reflation→KOSDAQ 성장주(바이오·2차전지) / Recovery→반도체·금융 / Overheat→소재·정유·조선 / Slowdown→통신·필수소비 방어."
  regime_reading: >
    Reflation(글로벌 성장↑인플레↓): KOSDAQ 성장주 + 반도체 early-cycle 가중↑, foreign_net_buy 가중↑, value 약세.
    Recovery(반도체 cycle turn): semi_cycle_beta·fwd_eps_momentum·foreign_net_buy 가중↑, low_pbr_valueup 동반.
    Overheat(원자재·인플레↑): 화학·정유·조선·해운(수출 cyclical late) 가중↑, oil_beta·china_exposure 채널, growth 축소.
    Slowdown/Stagflation: 통신·필수소비·고배당 방어주, realized_vol·credit_beta·dividend_yield 가중↑, 외국인 매도 압력 = foreign_net_buy 음신호.
    Korea-specific overlay: USDKRW 국면(약세/강세 × 수출/내수) 이 모든 regime 위에 곱해진다 — modulate_by=[regime, name_specific(KRW 노출)].
  estimation_note: >
    2026-05 추정: 2024 밸류업 이후 저PBR 대형(금융·자동차) 부분 re-rating 진행 + 반도체 cycle
    바닥 통과 가설(SK하이닉스 메모리 가격 회복). USDKRW 1,350~1,400 박스, 외국인 순매수 회복 진행.
    Recovery 초입 추정(확신도 중) — semi_cycle_beta·foreign_net_buy·low_pbr 동시 가중 anchor.
    ⚠️ 본 estimation 은 실데이터 IC 미측정. krx_flow_snapshots / dart 적재 후 블록5 hook 가
    라이브 검증(confirm/reject) — 실측치로 갱신될 anchor.

# ============================================================================
# 블록2: INDICATORS (정량 지표 — 우리 시스템 자료로 귀결)
# §6 주식 통일 하드룰 코어셋 = is_core:true (us/kr/intl/reit 비교가능성 보장)
# ============================================================================
indicators:
  # --- §6 코어셋 (통일 하드룰 — us/intl/reit 와 동일 family·is_core) ---
  - {id: fwd_ep, family: valuation, is_core: true, in_our_system: true,
     source_or_collector: "stock/data/dart_provider DartXbrlProvider (EPS, ifrs-full_ProfitLoss) + 가격 → forward E/P. DART_API_KEY 부재시 graceful empty → 블록6 D1",
     transform: own_history_z, vintage_policy: point_in_time, lag: 1}
  - {id: roe_margin_trend, family: quality, is_core: true, in_our_system: true,
     source_or_collector: "dart_provider Fundamentals(net_income/shareholders_equity, operating_income/revenue) yoy trend",
     transform: yoy, vintage_policy: point_in_time, lag: 1}
  - {id: earnings_revision_breadth, family: revision, is_core: true, in_our_system: false,
     source_or_collector: "한국 컨센서스(FnGuide/WiseFn 유료) 부재 → Naver Finance 무료 스크랩 또는 DART 8-K 한국 대응(잠정실적공시) 파싱. 블록6 D3",
     transform: own_history_z, vintage_policy: point_in_time, lag: 0}
  - {id: fwd_eps_momentum, family: revision, is_core: true, in_our_system: true,
     source_or_collector: "dart_provider 분기 EPS yoy 변화율(컨센서스 부재 시 실적 yoy 대체)",
     transform: yoy, vintage_policy: point_in_time, lag: 1}
  - {id: price_mom_12_1, family: momentum, is_core: true, in_our_system: true,
     source_or_collector: "FDR 가격 시계열(12M-1M 모멘텀, 한국 반전 강함 → 1M skip 필수)",
     transform: rank, vintage_policy: point_in_time, lag: 0}
  - {id: rate_beta, family: macro_sensitivity, is_core: true, in_our_system: true,
     source_or_collector: "종목수익률 vs FRED DGS10/실질금리 회귀 beta(글로벌 금리 전이)",
     transform: level, vintage_policy: point_in_time, lag: 0}
  - {id: dollar_beta, family: macro_sensitivity, is_core: true, in_our_system: true,
     source_or_collector: "★한국 핵심: 종목수익률 vs USDKRW(macro_market.py FxStore PIT) 회귀 beta. 수출주는 양(원화 약세 호재), 내수·외화부채는 음",
     transform: level, vintage_policy: point_in_time, lag: 0}
  - {id: oil_beta, family: macro_sensitivity, is_core: true, in_our_system: true,
     source_or_collector: "종목수익률 vs WTI(Yahoo collect_macro) 회귀 beta. 정유·해운 양, 항공·운송 음",
     transform: level, vintage_policy: point_in_time, lag: 0}
  - {id: credit_beta, family: macro_sensitivity, is_core: true, in_our_system: true,
     source_or_collector: "종목수익률 vs HY OAS(FRED BAMLH0A0HYM2 선구축) 회귀 beta — 글로벌 risk-off 전이",
     transform: level, vintage_policy: point_in_time, lag: 0}
  - {id: realized_vol, family: risk, is_core: true, in_our_system: true,
     source_or_collector: "FDR 가격 시계열 실현변동성(60D). 한국은 KOSDAQ 변동성 KOSPI 대비 평균 1.5~2배",
     transform: own_history_z, vintage_policy: point_in_time, lag: 0}
  # --- 한국 특화 (is_core:false + weight cap) ---
  - {id: foreign_net_buy, family: flow, is_core: false, in_our_system: true,
     source_or_collector: "★한국 1순위 alpha: krx_flows.KrxForeignFlowProvider 외국인 순매수(일별, 종목별). data/krx_flow_snapshots.jsonl PIT 적재",
     transform: own_history_z, vintage_policy: point_in_time, lag: 0}
  - {id: low_pbr_valueup, family: valuation, is_core: false, in_our_system: true,
     source_or_collector: "dart_provider shareholders_equity ÷ 시가총액 = 1/PBR. 밸류업 대상(저PBR + ROE 개선 가이던스) flag 부착",
     transform: own_history_z, vintage_policy: point_in_time, lag: 1}
  - {id: usdkrw_export_exposure, family: macro_sensitivity, is_core: false, in_our_system: false,
