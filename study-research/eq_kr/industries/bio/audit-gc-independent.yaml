priority_findings:
  flow_sell_conditional_genuine:   # 최우선1 + 최우선2
    verdict: "GENUINE (data-mining 아님), but low confidence"
    reproduced:
      interaction_t: {mom_6: -2.90, mom_12_1: -2.92, per_z: -2.29, rev_1m: -1.84(비유의), vol_60: -0.77(비유의)}
      main_effect: "전 신호 t_main < 1.4 = 비유의 (interaction 유의는 conditional 발현 = 약함 아님)"
      fdr: "m=105 BY_survivors=[] (정직 보고 확인, raw_p_min=0.0025)"
      flow_sell_distribution: "IS 10개월(2019-2022) / OOS 12개월(2023-2026) = 전기간 분산, 단일episode 아님"
    oos_survival_mechanism: >
      ★핵심 발견: OOS interaction(t -2.5~-3.06)이 IS(t -1.26~+1.21)보다 강한 것은 'flow_sell 신호 강화'가
      아니라 'unconditional(non-flow_sell)이 OOS 부호반전(artifact)으로 무신호화 -> 차분(interaction) 확대'.
      flow_sell conditional 직접 IC 는 IS(-0.14)->OOS(-0.16) 안정적. = unconditional artifact 의 거울상,
      conditional 생존은 실재. self-audit 의 'IS약->OOS강 regime shift tentative' 라벨은 메커니즘 부정확하나
      방향(conditional 생존) 결론은 정합.
    s5_attack_reproduced: "(a)8해 분산 pass (b)VIX 21.9~=20.1 pass (c)leave-2021-out mom_6 t=-2.94 생존 pass"
    robustness_kollon_drop: "코오롱티슈진 제외(37종): interaction mom_6 -2.90->-2.75, mom_12_1 -2.92->-2.75 = 생존(좀비종목 무관)"
    caveat: "★cell n 극소: flow_sell conditional IS n=7~9, OOS n=11. monitor-only + regime gate 적정. magnitude 단정 금지."

  unconditional_oos_reversal:   # 최우선2
    verdict: "격하 정당 (artifact, event_driven 정합)"
    reproduced: "mom_6 IS-0.055->OOS+0.009 / pbr_z -0.061->+0.043 / per_z -0.004->+0.061 = 부호반전. vol_60 -0.119->-0.008 magnitude 붕괴."
    judgment: "unconditional 가격/valuation OOS 부호반전 = in-sample artifact = 격하 정당. conditional 만 생존이 data-mining 아님은 위 메커니즘+S5+robustness 로 입증."

  survivorship_I_axis:   # ★최우선3 (hard-fail 직결)
    verdict: "I = PARTIAL (적정, FAIL 격상 불요)"
    survivorship_real:
      delisted_in_universe: 0   # prices 38종 거래끊김 0종 = FDR 현재스냅샷 생존자
      truly_missing: "신라젠(215600)/헬릭스미스(084990) = 원본 185종에도 누락 = 진짜 상폐 생존편향"
      zombie_present: "코오롱티슈진(950160)/케어젠(214370) = 존재하나 거래정지 carry-forward = D축 문제"
    bias_direction_check: >
      ★self-audit '누락->vol_60 과대평가' 방향 = 시뮬레이션 지지. 합성 상폐종목(고변동성+폭락+상폐) 5개
      추가 20회 시뮬: vol_60 uncond IC -0.074->-0.061 (편의 +0.013 = 현재가 진짜보다 더 음 = 과대).
      conditional -0.120->-0.109. 방향 정확.
    bias_magnitude: "vol_60 uncond 편의 = |IC|의 18% / conditional 편의 = 9% = 무효화 아님(신호 생존)"
    fail_vs_partial: >
      ★FAIL 격상 불요 근거: (1) 편의 방향은 신호를 약화(누락시 IC 강해짐)가 아니라 강화 쪽이나 크기 18%로
      부호/유의성 불변 (2) 핵심신호 flow_sell conditional 은 좀비종목 제외해도 robust (3) self-audit 이
      편의 방향 명시 = over-claim 회피. = PARTIAL + 좀비데이터 마스킹 remediation 이 적정. AUDIT-GUIDE I축
      'hard-fail=무효화' 기준 미충족(신호 무효화 안 됨).
    but_d_axis_escalation: >
      ★단 self-audit 이 D=PASS 박제한 것은 과함. 거래정지 carry-forward(코오롱 47.8%/케어젠 19%)가
      forward return=0 + vol 과소측정으로 IC 에 누설 = D(PIT/거래정지) PARTIAL 로 격하 의무.
      self-audit 'D PASS: 거래정지 처리' 미흡. 좀비 마스킹 후 재측정 = 최우선 remediation.

