# summary.yaml — bio(제약·바이오) 산업 v3 (frame v3 §M exposure card 계약)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge, BY/FDR, LOO/block-boot).
# ★event_driven archetype + ★conditional IC surface(dispatch 본체, 2026-06-05 신규).
# raw 재현: raw-v3/{collect, collect_dart, collect_regime, measure, measure_valuation,
#                   measure_conditional, measure_oos}.py

industry: kr_bio              # eq_kr Tier 3 (바이오: 신약/제약/바이오시밀러/CMO)
asset_scope: [equity.kr]
archetype: event_driven       # archetype.py: 파이프라인·임상 binary, 멀티플 무의미
archetype_attestation:
  valid_from: "2019-01-01"
  declared_at: "2026-06-03"
  primary_metric: pipeline    # ★event_driven = 멀티플 부적합 → R&D/파이프라인 (PER 적자 무의미)
  secondary: cyclical         # soft: 흑자 제약사(유한/한미/녹십자) value 성분 (prob~0.4)
  basis: >
    ★event_driven 부분 지지: 적자 신약바이오(26/38종 net_income 한번이라도<0) = PER 무의미 = 멀티플 부적합.
    흑자 제약사(PER avgN 21)는 value premium 작동(국면 의존). = 적자 신약 / 흑자 제약 2그룹 분리.

as_of: "2026-06-05"

# ── 블록1 LENS ──
lens:
  pricing_principle: >
    바이오 = event_driven. ★"싸다" 척도 분리: 흑자 제약사(PER value 국면 의존) vs 적자 신약바이오(멀티플
    무의미 = 파이프라인/임상 binary). ★실측 핵심(2026-06-05 conditional): unconditional 가격/valuation
    신호는 OOS 약/반전(in-sample artifact 성격) → ★진짜 신호 = **conditional(외국인 순매도 flow_sell 국면
    증폭)**. flow_sell 국면서 momentum/per_z 음 강화 = bio 고베타 성장주 risk-off 차별 매도 시 fundamental
    분별력 회복.
  cycle_reading: >
    bio cycle = 임상 binary 이벤트 + biotech 유동성(XBI/금리/외국인flow). VIX β=+0.011(t=6.03 강유의)
    = 고베타 성장주(risk-on 강세). flow_regime: flow_neutral 48/flow_sell 22/flow_strong_buy 19.
    적자 신약 = high-vol 임상 베팅 = risk-off 국면 차별적 약세.
  estimation_note: >
    2026-06: universe 38종 floor-pass(pharma 27/novel_drug 6/biosimilar_cmo 5). ★net_income 적자
    26/38종 = event_driven. ★conditional 발견: 외국인 순매도 국면(flow_sell)이 bio 신호 증폭축
    (family_2 interaction t<-2.3). unconditional 약 ≠ conditional 약.

# ── 블록2 INDICATORS (★conditional 중심 재배치) ──
# ★bio = unconditional 약(OOS artifact) → conditional(flow_sell 증폭)이 본체.
indicators_passed:
  - id: cs_flow_sell_conditional
    layer: 2                    # regime conditional
    family: conditional_momentum_value
    horizon: 20d
    description: "외국인 순매도(flow_sell) 국면 conditional IC — bio 증폭축"
    mechanism: "bio 고베타 성장주 → 외국인 risk-off 순매도 국면서 fundamental 신호(momentum/저PER) 분별력 회복"
    cells:
      - {signal: mom_6,    regime: flow_sell, ic: -0.149, n_months: 20, wc_p: 0.0175, status: underpowered, oos: "IS -0.141 -> OOS -0.156 부호+magnitude 유지"}
      - {signal: mom_12_1, regime: flow_sell, ic: -0.134, n_months: 18, wc_p: 0.0185, status: underpowered, oos: "IS -0.143 -> OOS -0.129 부호+magnitude 유지"}
      - {signal: per_z,    regime: flow_sell, ic: -0.092, n_months: 20, wc_p: 0.093,  status: underpowered, oos: "IS -0.101 -> OOS -0.085 부호유지"}
      - {signal: vol_60,   regime: flow_sell, ic: -0.093, n_months: 20, wc_p: 0.045,  status: underpowered, oos: "IS -0.042 -> OOS -0.135 부호유지+강화"}
    family_2_interaction:       # ★rejected 박제 前 의무, frame A-5
      dummy: "flow_regime=flow_sell"
      method: "pooled panel, month-clustered SE"
      results:
        - {signal: mom_6,    t_inter: -2.90, verdict: "유의(국면 따라 효과 갈림)"}
        - {signal: mom_12_1, t_inter: -2.92, verdict: "유의"}
        - {signal: per_z,    t_inter: -2.29, verdict: "유의"}
        - {signal: rev_1m,   t_inter: -1.84, verdict: "비유의(약)"}
      note: "main effect 대부분 비유의인데 interaction 유의 = 신호 conditional(약함 아님). KRW_weak interaction은 비유의 = bio 증폭축은 flow(반도체 KRW와 대조)."
    source_id: "raw-v3/validation-conditional-v3.json + validation-oos-v3.json"
    verdict: "PARTIAL-conditional (interaction 유의 + OOS 부호유지, but cell underpowered n<24 + IS t 약->OOS t 강 = 최근 발현/regime shift tentative)"

  - id: cs_lowvol
    layer: 3
    family: low_volatility      # ★임상 risk proxy (bio archetype primary 후보)
    horizon: 1M
    ic_mean: -0.066             # unconditional, 음 = 고변동성 forward 낮음 (저변동성 우위)
    ic_ci_95: [-0.125, -0.022]  # block-boot (기존 1M_PEAD 측정)
    t_nw: -3.02
    wc_p_y20d: 0.012
    n_effective: 81
    cap_weighted_ic: -0.107     # 대형 바이오에서 더 강
    oos_verdict: "★IS -0.119 -> OOS -0.008 = 부호유지 but magnitude 대폭 약화(OOS 약) = IS 편중"
    source_id: "raw-v3/validation-metrics-v3.json:indicators.vol_60__1M_PEAD"
    notes: |
      저변동성 우위(임상 risk 회피). unconditional NW 유의하나 ★OOS magnitude 붕괴 + ★생존편향 우려
      (상폐된 고변동성 임상실패 신약 누락 -> 신호 과대평가). flow_sell 국면서는 OOS 강화(-0.042->-0.135).
      = unconditional 보다 conditional 이 robust.

# ── 블록3 RELATIONSHIPS ──
relationships_passed:
  - {node_a: cs_flow_sell_conditional, node_b: bio_fwd_20d, lag_months: 0,
     conditioning_set: [flow_regime], n: 20,
     source_id: "raw-v3/validation-conditional-v3.json:family_2_interaction",
     note: "외국인 순매도 국면 = bio 신호 증폭축. interaction t=-2.90(mom_6). OOS 생존."}

# ── 블록4 WEIGHT_RULES (점추정 박제 금지 = range + gate) ──
weight_rule_candidates:
  - indicator_id: cs_flow_sell_conditional
    base_weight_range: [0.02, 0.08]   # conditional 신호, underpowered cell -> conservative
    modulate_by: [regime, archetype]   # ★flow_regime=flow_sell 일 때만 activate
    direction: "외국인 순매도 국면(flow_sell)에서 momentum 하위(저모멘텀)·저PER overweight. risk-off bio 차별 매도 시 fundamental 분별력."
    granularity: cross_sectional
    gate_status: {n: underpowered, se: marginal, power: weak, fdr: fail, oos: pass}  # ★cell n<24, BY 미생존, OOS 부호유지
    confidence: low   # ★conditional + small-n + IS약->OOS강(regime shift tentative)
    source_ids: ["raw-v3/validation-conditional-v3.json", "raw-v3/validation-oos-v3.json"]
    hedge_note: >
      ★PARTIAL-conditional. family_2 interaction 유의(t=-2.90) + OOS 부호유지 = conditional 살아있음(약함 아님).
      단 (a) flow_sell cell n=18~20 underpowered (b) IS t 약->OOS t 강 = 최근(2023+) 발현/regime shift tentative
      (c) BY 미생존(m=105). = monitor-only 또는 최소 weight + regime gate(flow_sell 시만). magnitude 단정 금지.
  - indicator_id: cs_lowvol
    base_weight_range: [0.02, 0.06]   # ★OOS 약화 반영 하향(기존 [0.03,0.10] -> 축소)
    modulate_by: [archetype, regime]
    direction: "저변동성(안정 제약) overweight, 고변동성(임상 베팅 신약) underweight. 임상 risk 회피."
    granularity: cross_sectional
    gate_status: {n: pass, se: pass, power: pass, fdr: marginal, oos: weak}  # ★oos magnitude 약화
    confidence: low   # ★IS 편중 + 생존편향 과대평가 우려
    source_ids: ["raw-v3/validation-metrics-v3.json:indicators.vol_60__1M_PEAD"]
    hedge_note: >
      ★저변동성 unconditional NW 유의(t=-3.02) but OOS magnitude 붕괴(-0.119->-0.008) + ★생존편향
      (상폐 임상실패 신약 = 고변동성 = 누락 -> 신호 과대평가 강 우려). conservative cap + monitor.
      flow_sell 국면 conditional 에서는 OOS 강화 = conditional 우선.

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 ──
confidence_hooks:
  - hypothesis_id: bio_flow_sell_conditional_amplification
    affects_indicator: cs_flow_sell_conditional   # ★필수
    affects_edge: [cs_flow_sell_conditional, bio_fwd_20d]
    confirm_signal: "live 외국인 순매도(flow z<-1) 국면서 momentum 하위/저PER 종목 forward rank IC < 0 유지"
    reject_signal: "flow_sell 국면 interaction term e-CUSUM 부호 반전/소멸 (regime shift 종료)"
    emit_where: "panel-score-IC 축 (flow_regime conditional)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 -> flow_sell conditional base_weight 변동"
    action_threshold: "e-value > 20 -> retract / 회복 = score_ic_recovery_eprocess"
  - hypothesis_id: bio_lowvol_clinical_risk
    affects_indicator: cs_lowvol
    affects_edge: [cs_lowvol, bio_fwd_20d]
    confirm_signal: "live 저변동성 종목 forward rank IC < 0 유지 (고변동성 신약 회피)"
    reject_signal: "저변동성 IC e-CUSUM 부호 반전/소멸"
    emit_where: "panel-score-IC 축"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 -> 저변동성 base_weight 변동"
    action_threshold: "e-value > 20 -> retract"

# ── 블록6 COLLECTOR_PLAN ──
collector_plan_industry:
  - missing: "★파이프라인/임상 단계 데이터 (event_driven primary — 멀티플 대체)"
    source: "KFDA/clinicaltrials.gov 임상 phase/승인 이벤트. 적자 신약 = 파이프라인 가치 평가 필요"
    priority: high
  - missing: "★PIT universe 멤버십 (delisted/상폐) — ★bio I축 최악"
    source: "FDR 현재 스냅샷만(거래 끊긴 종목 0 = delisted 완전 누락). 코오롱티슈진/신라젠/헬릭스미스 등 임상실패 상폐 누락. KRX PIT 멤버십"
    priority: high   # ★bio = 생존편향 가장 심각 = 우선순위 최상
  - missing: "종목레벨 외국인 flow (현 = ECOS 시장레벨 regime 만)"
    source: "KRX 종목별 외국인 net buy = 인증 차단. flow_sell 증폭이 종목레벨이면 더 정밀"
    priority: medium
  - missing: "R&D 비용/매출 비율 (적자 신약 burn-rate)"
    source: "DART 손익계산서 R&D 항목"
    priority: medium

# ── cross (§M.3 — 산업=보고만) ──
cross:
  common_factor_exposure:
    - {factor: VIX, beta: 0.0109, beta_ci_95: [0.0073, 0.0144], contemporaneous: true,
       source_id: "raw-v3/validation-cross-v3.json:common_factor_exposure.VIX",
       note: "★VIX β 강유의(t=6.03). bio = 고베타 성장주(risk-on 강세). ★산업별 risk factor 상이: battery=credit/oil, financial=무, consumer=dollar, bio=VIX."}
    - {factor: dollar, beta: -0.1235, beta_ci_95: [-1.352, 1.105], contemporaneous: true, note: "비유의 (CI 넓음)"}
    - {factor: oil, beta: null, contemporaneous: true, note: "측정(raw 참조)"}
    - {factor: rate, beta: null, contemporaneous: true, note: "측정(raw 참조), 금리=biotech 유동성 민감 가설"}
    - {factor: credit, beta: null, contemporaneous: true, note: "측정(raw 참조)"}
  directional_spillover: []   # DY = supervisor 통합단계 (산업=후보 보고만, bio dominant=임상 binary)
  structural_linkage:
    - supplier_or_customer: null
      verdict: "customer-supplier momentum = bio 부적합(임상=binary 이벤트, supply-chain 무관). skip. bio dominant = 임상 이벤트 + biotech 유동성 + 외국인 flow."

# ── ★valuation 횡단면 (§M.7 — event_driven 부분) ──
valuation_cross_sectional:
  data_source: "raw-v3/validation-valuation-v3.json (DART 948 rows 2019~ + pykrx 가격)"
  mechanism_works: "conditional"   # ★unconditional 약 -> flow_sell 국면 conditional 작동
  event_driven_finding: "★net_income 적자 26/38종 = 적자 신약바이오 PER 무의미 -> PER 흑자 한정. unconditional per_z = +0.027(value 반대) but flow_sell 국면 -0.092(interaction t=-2.29) = conditional value."
  pit_note: "재무 = rcept_dt 공시일 이후만. DART 2019~ 완전(표준계정)."
  verdict: >
    ★bio valuation = ★conditional event_driven. unconditional PER value 약/반전(OOS) -> 외국인 순매도(flow_sell)
    국면서만 저PER 분별력(interaction t=-2.29). 적자 신약(26/38) PER 무효 = 멀티플 단독 부적합. ★진짜 신호 =
    파이프라인/임상(collector_plan high, 미측정) + conditional(flow_sell 증폭).

# ── robustness_checks ──
robustness_checks:
  - indicator_id: cs_flow_sell_conditional
    leave_episode: "pass (leave-2021-out mom_6 interaction t=-2.94 생존, rev_1m/vol_60 약화)"
    within_period: "IS/OOS 부호유지 (5신호 전부 flow_sell 국면 OOS 부호+magnitude 유지)"
    s5_attack: "pass — (a)8개해 분산=단일episode 아님 (b)VIX 21.9 ~= 20.1 = risk-off 대리 아님 (c)leave-worst-out 생존"
    forward_vs_contemp: "forward present (conditional)"
    eff_n_tier: Tentative        # cell n=18~20 underpowered + IS약->OOS강
  - indicator_id: cs_lowvol
    within_period: "0.75 (1M)"
    oos: "★weak (IS -0.119 -> OOS -0.008 magnitude 붕괴)"
    forward_vs_contemp: "forward present (저변동성)"
    survivorship_caveat: "★고변동성 임상실패 신약 상폐 누락 -> 신호 과대평가 우려 강"
    eff_n_tier: Tentative

# ── horizon_verdict ──
horizon_verdict:
  best_horizon: "20d conditional(flow_sell) / 1M unconditional(저변동성, OOS 약)"
  forward_alpha_present: true   # ★conditional 한정 present (unconditional OOS 약)
  note: >
    ★bio = conditional(flow_sell 증폭) present + unconditional 약(OOS artifact). momentum unconditional 무신호,
    flow_sell 국면서만 발현. event_driven 특수성: 적자 신약 멀티플 무효 / 흑자 제약 value 국면 의존.

# ── ★ROTATION 신호 (업종 OW/UW timing, v2 data-gate 재검, 2026-06-06) ──
# ⛔ 종목 selection(위 indicators)과 별개 = bio 업종 전체 timing. raw=rotation-signals.md
industry_rotation:
  v2_재검: "v2 rotation-analyst = bio NO_DIRECT_CYCLE + momentum OOS flip = FAIL/data-gate. ★재검 = 거시 overlay(금리 duration/글로벌바이오) v2 미측정 = 진짜 산업동향 부재 아님."
  theory: "bio = growth/long-duration cashflow → discount-rate sensitive. 금리↓→OW / 글로벌바이오(XBI/IBB)↑→OW."
  n_candidates: 10   # team-lead 요구 ≥8 충족
  zombie_mask: "mask_trading_halt 적용(코오롱티슈진 47.8%/케어젠 19% carry-forward 제거). 패널 89개월."
  signals:
    - id: rate_overlay
      definition: "-(US 10Y Δ3M z) = 미국 금리 하락 시 bio 업종 OW (growth duration)"
      ic_y60d: 0.274
      wc_p: 0.018
      oos: "IS 0.004 -> OOS 0.209 (부호유지, IS약->OOS강 regime shift)"
      leave_2022: "us_10y_d full -0.244 -> drop2022 -0.174 부호+OOS 유지(단일 episode 아님)"
      prior_sign_match: true
      status: underpowered    # t_power<2.802, BY 미생존
      verdict: "PASS-conditional (이론+OOS 부호유지, low confidence)"
    - id: bio_global_overlay
      definition: "(XBI/SPY + IBB/NDX 상대모멘텀 z)/2 = 글로벌 바이오 강세 -> 한국 bio OW (섹터 전이)"
      ic_y20d: 0.132
      xbi_rel_mom_y20d: {ic: 0.153, oos: "0.131 -> 0.190 부호유지"}
      ibb_rel_mom_y20d: {ic: 0.124, oos: "0.080 -> 0.178 부호유지"}
      prior_sign_match: true
      status: underpowered
      verdict: "PASS-conditional (이론+OOS 부호유지, low confidence)"
    - id: full_overlay
      definition: "(rate_overlay + bio_global_overlay)/2 = 금리+글로벌바이오 합성"
      ic_y20d: 0.180
      oos: "0.074 -> 0.250 eligible(Y)"
      leave_2022: "+0.234 wc_p=0.069 생존"
      status: underpowered
      verdict: "PASS-conditional (보조, OOS robust)"
  theory_stat_match: "이론 부호 일치 10중 8(us_10y/kr_10y/us_curve/xbi_rel/ibb_rel/xbi_mom/credit_hy/fda_yoy). vix_level 반대(업종 timing 고베타 약), usdkrw 불확정(round-1 REJECTED 정합). = data-mining 아님."
  tradeable_overall: >
    ★bio 업종 rotation = PASS-conditional (v2 FAIL/data-gate 뒤집음). tradeable >=2 = (1) rate_overlay(US 금리 하락->OW)
    (2) bio_global_overlay(글로벌바이오 상대강세->OW). ★국면 출력 가능: "미국 금리 하락+글로벌바이오 강세 -> bio 업종 OW".
    ★한계(정직): underpowered(BY 미생존, t_pow<2.8) + IS약->OOS강(regime shift tentative) + bio 고유 cycle(임상) 무료부재
