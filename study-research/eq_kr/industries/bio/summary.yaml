# summary.yaml — bio(바이오) 산업 v3 (frame v3 §M exposure card 계약)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge, BY/FDR, LOO/block-boot).
# ★event_driven 검증: 멀티플 부적합 가설 → 적자 분리 + 변동성(임상 risk) 신호 = 4번째 archetype 입증.
# raw 재현: raw-v3/{collect, measure, collect_dart, measure_valuation, measure_cross, exposure_card}.py

industry: kr_bio              # eq_kr Tier 3 (바이오: 신약/제약/바이오시밀러/CMO)
asset_scope: [equity.kr]
archetype: event_driven       # archetype.py: 파이프라인·임상 binary, 멀티플 무의미 (1차 가설)
archetype_attestation:
  valid_from: "2019-01-01"
  declared_at: "2026-06-03"
  primary_metric: pipeline    # ★event_driven = 멀티플 부적합 → R&D/파이프라인 가치 (PER 적자 종목 무의미)
  secondary: cyclical         # soft: 흑자 제약사(유한/한미/녹십자) = value 성분 (prob~0.4)
  basis: >
    ★event_driven 검증 = 부분 입증: 적자 신약바이오(36% net_income<0) = PER 무의미 = 멀티플 부적합.
    흑자 제약사(PER avgN 21)는 value premium 작동. = bio 가 적자 신약 / 흑자 제약 2그룹 분리.

as_of: "2026-05-31"

# ── 블록1 LENS ──
lens:
  pricing_principle: >
    바이오 = event_driven. ★"싸다" 척도 분리: 흑자 제약사(PER value premium 작동) vs 적자 신약바이오
    (멀티플 무의미 = 파이프라인/임상 이벤트 binary). ★실측 핵심: momentum 무신호 + valuation(PER) 흑자
    한정 작동(적자 제외) + ★vol_60(저변동성) 신호 강(고변동성 신약 = 임상 risk = forward 낮음).
  cycle_reading: >
    bio cycle = 임상 binary 이벤트 + biotech 유동성(XBI/금리). XBI yoy regime: bull 31/bear 15/neutral 43.
    VIX β=+0.011(t=6.03 강유의) = 고베타 성장주(risk-on 강세). 적자 신약 = high-vol 임상 베팅.
  estimation_note: >
    2026-05: universe 38종(pharma 27/novel_drug 6/biosimilar_cmo 5). ★net_income 적자 36% =
    event_driven. valuation(PER) = 흑자 한정 + vol(임상 risk) 신호 = 멀티플 단독 부적합 입증.

# ── 블록2 INDICATORS ──
# ★bio = vol(저변동성, 임상 risk) + PER(흑자 한정) borderline. momentum 무신호.
indicators_passed:
  - id: cs_lowvol
    layer: 3
    family: low_volatility      # ★임상 risk proxy
    horizon: 1M_PEAD
    ic_mean: -0.078             # 음 = 고변동성 종목 forward 낮음 (저변동성 우위 = 임상 risk 회피)
    ic_ci_95: [-0.125, -0.022]  # block-boot, ★0 배제 (유의)
    ic_se_nw: null
    t_nw: -3.02                 # p=0.003 (NW 기준 유의)
    n_effective: 85
    avg_universe_n: 34.0
    cap_weighted_ic: -0.107     # ★대형 바이오에서 더 강 (cap-weighted)
    source_id: "raw-v3/validation-metrics-v3.json:indicators.vol_60__1M_PEAD"
    notes: |
      cross-sectional 변동성 z → 1M forward. 음 IC = 고변동성(임상 베팅 신약) forward 낮음 = 저변동성
      (안정 제약) 우위. hi-ADV IC -0.091(대형주 강), cap-weighted -0.107. = ★임상 risk 회피 신호.
      NW 유의(t=-3.02, p=0.003) but BY 보정(α/16=0.0031) raw_p=0.0033 미세 미달 → PARTIAL.
  - id: cs_per_z_profitable
    layer: 1
    family: value
    horizon: 6M
    ic_mean: -0.088             # 음 = 저PER value (흑자 제약사 한정)
    ic_ci_95: [-0.152, -0.020]  # block-boot 0 배제
    t_nw: -2.32                 # p=0.023
    n_effective: 79
    avg_universe_n: 20.9        # ★PER = 흑자 종목만(적자 17종 제외) = PBR 33 대비 적음 = event_driven 특성
    within_period: 0.86         # 12M 은 within 1.00
    source_id: "raw-v3/validation-valuation-v3.json:indicators.per_z__6M"
    notes: "저PER → 6M forward (흑자 제약사 한정 avgN 21). value premium 방향, borderline 유의. ★적자 신약 = PER 무의미 제외 = event_driven."

# ── 블록3 RELATIONSHIPS ──
relationships_passed:
  - {node_a: cs_lowvol, node_b: bio_fwd_1m, lag_months: 0, corr: -0.078,
     corr_ci_95: [-0.125, -0.022], conditioning_set: [], n: 85,
     source_id: "raw-v3/validation-metrics-v3.json:indicators.vol_60__1M_PEAD",
     note: "저변동성 우위 = 임상 risk 회피. block-boot 유의."}

# ── 블록4 WEIGHT_RULES ──
weight_rule_candidates:
  - indicator_id: cs_lowvol
    base_weight_range: [0.03, 0.10]   # IC -0.078 (저변동성 overweight) range
    modulate_by: [archetype, regime]
    direction: "저변동성 z 상위(안정 제약) overweight, 고변동성(임상 베팅 신약) underweight. 임상 risk 회피."
    granularity: cross_sectional
    gate_status: {n: pass, se: pass, power: pass, fdr: marginal, oos: pass}  # NW 유의/BY 미세 미달
    source_ids: ["raw-v3/validation-metrics-v3.json:indicators.vol_60__1M_PEAD"]
    hedge_note: "★저변동성 신호 NW 유의(t=-3.02) but BY 미세 미달(raw_p 0.0033 vs α 0.0031). PARTIAL. event_driven = 멀티플보다 risk-factor 신호."
  - indicator_id: cs_per_z_profitable
    base_weight_range: [0.02, 0.08]   # 흑자 제약 한정 value
    modulate_by: [archetype, profitability]  # ★흑자 종목 한정 조건
    direction: "흑자 제약사 한정 저PER overweight. 적자 신약 = PER 무효 → 별 신호(파이프라인) 필요."
    granularity: cross_sectional
    gate_status: {n: pass, se: borderline, power: weak, fdr: marginal, oos: pass}
    source_ids: ["raw-v3/validation-valuation-v3.json:indicators.per_z__6M"]
    hedge_note: "★흑자 한정 value premium(avgN 21). 적자 신약 제외 = event_driven 멀티플 부적합 입증."

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 ──
confidence_hooks:
  - hypothesis_id: bio_lowvol_clinical_risk
    affects_indicator: cs_lowvol      # ★필수
    affects_edge: [cs_lowvol, bio_fwd_1m]
    confirm_signal: "live 저변동성 z 상위(안정 제약) 종목 forward rank IC < 0 유지 (고변동성 신약 회피)"
    reject_signal: "저변동성 IC e-CUSUM 부호 반전/소멸 (임상 risk 신호 무효)"
    emit_where: "panel-score-IC 축"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 → 저변동성 base_weight 변동"
    action_threshold: "e-value > 20 → retract / 회복 = score_ic_recovery_eprocess"

# ── 블록6 COLLECTOR_PLAN ──
collector_plan_industry:
  - missing: "★파이프라인/임상 단계 데이터 (event_driven primary — 멀티플 대체)"
    source: "★bio 핵심 gap = 임상 phase/승인 이벤트 데이터(KFDA/clinicaltrials.gov). 멀티플 부적합 적자 신약 = 파이프라인 가치 평가 필요"
    priority: high   # ★event_driven 산업의 진짜 신호 = 파이프라인/이벤트 (현 측정 = 변동성 proxy 까지)
  - missing: "R&D 비용/매출 비율 (적자 신약 burn-rate)"
    source: "DART 손익계산서 R&D 항목"
    priority: medium
  - missing: "PIT universe 멤버십 (delisted/상폐, 바이오 = 상폐·관리종목 잦음)"
    source: "FDR 현재 스냅샷만. KRX PIT"
    priority: high

# ── cross (§M.3 — 산업=보고만) ──
cross:
  common_factor_exposure:
    - {factor: VIX, beta: 0.0109, beta_ci_95: [0.0073, 0.0144], contemporaneous: true,
       source_id: "raw-v3/validation-cross-v3.json:common_factor_exposure.VIX",
       note: "★VIX β 강유의(t=6.03). bio = 고베타 성장주(risk-on 강세). ★battery=credit/oil, financial=무, consumer=dollar, bio=VIX = 산업별 risk factor 전부 상이."}
    - {factor: dollar, beta: -0.1235, beta_ci_95: [-1.352, 1.105], contemporaneous: true, note: "비유의 (CI 넓음)"}
    - {factor: oil, beta: null, contemporaneous: true, note: "측정(raw 참조)"}
    - {factor: rate, beta: null, contemporaneous: true, note: "측정(raw 참조), 금리=biotech 유동성 민감 가설"}
    - {factor: credit, beta: null, contemporaneous: true, note: "측정(raw 참조)"}
  directional_spillover: []
  structural_linkage:
    - supplier_or_customer: null
      verdict: "customer-supplier momentum = bio 부적합(임상=binary 이벤트, supply-chain 무관). skip(battery/financial/consumer 동일 패턴). bio dominant = 임상 이벤트 + biotech 유동성."
  # ⛔ sector-rotation clock = myth.

# ── ★valuation 횡단면 (§M.7 — event_driven 부분 작동) ──
valuation_cross_sectional:
  data_source: "raw-v3/validation-valuation-v3.json (DART 948 rows 2019~ 완전 + pykrx 가격)"
  mechanism_works: "partial"   # ★PBR 전종목(avgN 33) / PER 흑자한정(avgN 21, 적자 17종 제외)
  event_driven_finding: "★net_income 적자 36%(270/741) = 적자 신약바이오 PER 무의미 → PER 흑자 한정 측정. = 멀티플 부적합(event_driven) 직접 입증."
  pit_note: "재무 = rcept_dt 공시일 이후만. DART 2019~ 완전(표준계정)."
  indicators:
    - id: cs_per_z_profitable
      signal: "PER cross-sectional z (흑자 제약사 한정 — 적자 신약 제외)"
      horizon_results:
        - {horizon: 6M, ic: -0.088, t_nw: -2.32, p: 0.023, n: 79, ci_block: [-0.152, -0.020], within: 0.86, verdict: "value premium borderline 유의(흑자 한정)"}
        - {horizon: 12M, ic: -0.091, t_nw: -2.30, p: 0.024, n: 73, within: 1.00, verdict: "within 100%"}
        - {horizon: 3M, ic: -0.061, t_nw: -1.77, p: 0.080, n: 82, within: 0.88}
      avg_universe_n: 20.9     # ★흑자 한정 (PBR 33 대비)
      verdict: "★흑자 제약사 PER value premium 작동(borderline 유의, within 높음). 단 적자 신약 = 무효 = event_driven 부분 멀티플."
    - id: cs_pbr_z
      signal: "PBR cross-sectional z (전종목)"
      horizon_24m: {ic: -0.148, t_nw: -1.14, n: 61, avgN: 33, verdict: "value 방향(음) but NW 비유의, n 적음"}
      verdict: "TENTATIVE — PBR 24M 방향 음(value)이나 비유의. 적자 신약 자본잠식 우려로 PBR 도 왜곡 가능. ★[frame §M.12] 24M eff_indep_N=61/24≈2.5 degenerate = 방향만. bio primary = cs_lowvol(변동성), valuation 보조라 영향 작음."
  multiple_testing: "8 테스트 BY factor 2.72. raw_p_min=0.023(per_z 6M). BY 생존 0(borderline)."
  verdict: >
    ★bio valuation = event_driven 부분 작동. PER = 흑자 제약사 한정 value premium(borderline 유의, within 높음),
    적자 신약바이오(36%) = PER 무의미 제외. = 멀티플 단독 부적합(event_driven) 입증. ★진짜 신호 = 파이프라인/
    임상 이벤트(collector_plan high) + 변동성(임상 risk) proxy. 멀티플 = 흑자 제약 sub-group 한정.

# ── robustness_checks ──
robustness_checks:
  - indicator_id: cs_lowvol
    leave_episode: null
    within_period: "0.75 (1M)"
    partial_corr_ratio: null
    net_sharpe_ratio: null
    forward_vs_contemp: "forward present (저변동성 우위)"
    family_neutralized_ic: null
    eff_n_tier: Validated        # n=85
  - indicator_id: cs_per_z_profitable
    within_period: "0.86 (6M) / 1.00 (12M)"
    eff_n_tier: Tentative        # n=73-79 흑자 한정
    forward_vs_contemp: "forward present (흑자 한정 value)"

# ── horizon_verdict ──
horizon_verdict:
  best_horizon: "1M (저변동성 임상 risk) / 6-12M (흑자 PER value)"
  forward_alpha_present: true   # ★변동성 + 흑자 PER 양쪽 present
  note: >
    ★bio = 변동성(임상 risk, 1M) + 흑자 PER value(6-12M) present. momentum 무신호.
    ★event_driven 특수성: 적자 신약 = 멀티플 무효(파이프라인 필요) / 흑자 제약 = value 작동. 2그룹 분리.

# ── Hard-fail 4 ──
hard_fail_self_check:
  B_real_data: {status: PASS, note: "합성 0%. pykrx OHLCV 38종 + yfinance(XBI/VIX/factors) + DART 948 rows(2019~) + FDR. raw-v3/*.py 재현."}
  C_traceability: {status: PASS, note: "yaml 수치 = validation-metrics-v3 / valuation-v3 / cross-v3.json key 매핑."}
  D_pit: {status: PASS, note: "가격 forward-shift safe. valuation = DART rcept_dt 공시일 이후만. regime = ex-ante XBI yoy."}
  I_survivor_bias:
    status: PARTIAL
    note: "★bio = 상폐·관리종목 잦음(임상 실패→상폐). universe = FDR 현재 스냅샷(생존 종목) = 생존편향 ★강함. 38종 中 7종 부분 이력. delisted bio 누락 = IC 상향 편의 우려. PIT 멤버십 = collector_plan high."

# ── verdict (small-n rule) ── ★event_driven 검증 중심
verdict_label: PARTIAL   # ★event_driven 부분 입증 (저변동성 + 흑자 PER borderline)
verdict_detail:
  cs_lowvol: "★PARTIAL (event_driven 핵심) — 저변동성 IC -0.078 t=-3.02 NW 유의, block-boot CI 0배제, cap-weighted -0.107. 임상 risk 회피. BY 미세 미달(raw_p 0.0033 vs 0.0031). 멀티플 아닌 risk-factor 신호."
  cs_per_z_profitable: "흑자 제약사 한정 value premium (IC -0.088 p=0.023, within 100%@12M, avgN 21). 적자 신약 제외 = 멀티플 부적합."
  cs_pbr_z: "TENTATIVE (PBR 24M value 방향, 비유의. 자본잠식 왜곡 가능)"
  momentum: "비유의 (BY 0). 모멘텀 무신호."
  common_factor: "★VIX β 강유의(t=6.03) = 고베타 성장주. 산업별 risk factor 분기(battery credit/oil, financial 무, consumer dollar, bio VIX)."
verdict_note: >
  ★bio = event_driven 부분 입증 (4번째 archetype). 멀티플(PER) = 흑자 제약사 한정 작동 + 적자 신약(36%)
  무의미 제외 = 멀티플 단독 부적합. ★진짜 신호 = 변동성(임상 risk, NW 유의) + 파이프라인/임상 이벤트
  (collector_plan high, 현 미측정). VIX 고베타. 생존편향 ★강(임상 실패→상폐). = ★4 archetype 분기 완성:
  battery momentum / financial regime-conditional / consumer valuation / bio 변동성+이벤트(멀티플 부분).
  = 동적가중(산업별 유효 신호·risk·데이터 전부 상이) 정당화 + event_driven 의 멀티플 부적합 데이터 입증.
