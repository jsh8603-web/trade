# summary.yaml — steel(철강·금속) 산업 v3 (frame v3 §M exposure card 계약)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge 어휘, BY 보정, LOO/block-boot).
# ★철강 universe 협소(23종, avg cross-section ~20) = small-breadth → magnitude haircut + breadth-adj IR 의무.
# 산출 범위 = §M.7 exposure card (측정 전용). semiconductor summary.yaml 미러.
# raw 재현: raw-v3/{collect, measure, measure_cross, measure_valuation, measure_conditional, measure_fundamentals_cycle, collect_dart, collect_dart_extended}.py

industry: kr_steel            # eq_kr 12산업 中 Tier 3 (철강·금속)
asset_scope: [equity.kr]
archetype: cyclical           # 초자산집약 commodity 장치산업 (고로/제강/압연 설비 + 중국 수요 cycle)
archetype_attestation:
  valid_from: "2019-01-01"    # ★PIT 사전선언 (§M.5 ex-post 금지). 철강 = 구조적 cyclical 일관(transition 없음)
  declared_at: "2026-06-05"   # 선언 시점 (사후편향 hazard 낮음 = 철강 = 항상 cyclical)
  primary_metric: pbr         # ★cyclical primary. PER 양방향 왜곡(정점 peak-EPS + 다운 trough-적자) → PBR robust
  secondary: asset_stable     # soft/probabilistic: 저성장·고배당 defensive 성격 (prob~0.2)
  basis: >
    초자산집약 장치산업(고로 수조원 capex) + 중국 수요·철광석 원가 commodity cycle 1차 가설. ★실측 검증:
    cross-sectional momentum forward IC = 음(-0.181 12M reversal, BY 생존) = cyclical peak-reversal 정합(battery 양과 반대) →
    cyclical 지지. ★capex_ratio forward IC = 음(-0.084 y_60d, ★자산집약도 레벨 anomaly = low-turnover value-like, asset growth 아님) = 초자산집약 cyclical 정합.
as_of: "2026-05-31"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    철강 = cyclical 초자산집약. "싸다" = P/B (★PER 양방향 왜곡: 사이클 정점 EPS 高→PER 低 trap + 다운사이클 적자→PER 무의미).
    primary_metric=pbr. ★실측 결론: (a) 가격 momentum(12M)이 forward 강한 **음의 예측력**(IC -0.181 reversal, BY 생존) =
    사이클 정점 종목 되돌림 (b) ★capex_ratio(유형/총자산) forward 음(-0.084 y_60d) = ★자산집약도 레벨 anomaly(low-turnover value-like, ppe_yoy 증설변화율은 무신호) =
    초자산집약 산업 핵심 (c) vol_60(저변동) 음(-0.105 y_60d, BY 생존) = defensive quality. valuation = PBR○ PER✗(§valuation_cross_sectional).
  cycle_reading: >
    2019-2026 = 중국 부동산둔화·공급과잉(2019)→COVID 회복·철강가격 급등(2020-21)→중국 수요둔화·spread 압박(2022-24)→
    감산·구조조정(2025-26). SLX(글로벌 철강 ETF) yoy regime ex-ante: bull 32 / neutral 51 / bear 6 month. 철강 cycle = 반도체보다 완만(중국 정책 driven).
  estimation_note: >
    2026-05 시점: universe 23종(시총≥1000억 ∧ ADV≥1억, 1차철강+태웅). ★반도체(85종)의 1/4 = small-breadth.
    횡단면 avg N ~20.5 = magnitude inflation 위험(frame §M.12) → point estimate 보수 cap + breadth-adj IR 병기.
    POSCO홀딩스(005490) 시총 압도(30조, universe 60%+) → cap-weighted IC 점검 필수(대형주 reversal 확인됨 = artifact 아님).

# ── 블록2 INDICATORS (forward 횡단면 Rank-IC, horizon-tagged) ──
