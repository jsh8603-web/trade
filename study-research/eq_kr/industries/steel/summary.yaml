      ★★dispatch capex 일반화 핵심. 유형자산/총자산 횡단면 z → 60d forward IC = **음**(prior 일치). wild_cluster_p=0.0005 강유의, walk-forward OOS 부호유지.
      ★★[mechanism 정정 — steel-audit 2026-06-05]: primary mechanism = **자산집약도 *레벨* anomaly**(low-asset-turnover, value-like)지 증설 cycle(asset growth) 아님.
