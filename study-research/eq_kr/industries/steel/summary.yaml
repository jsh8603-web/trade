# ════════════════════════════════════════════════════════════════════
# ── ★★CONDITIONAL IC SURFACE (dispatch 원의도 본체, S2) ──
# IC(지표, regime, horizon) = "어느 국면에 어느 지표가 forward return 예측하나".
# 측정: raw-v3/measure_conditional.py (G-F 7항 헤더 선언) → validation-conditional-v3.json
# regime: Macro(CLI amplitude-adj 4) × KRW(DEXKOUS yoy 3) × flow(ECOS 외국인순매수 28d z 3)
# ════════════════════════════════════════════════════════════════════
conditional_ic_surface:
  cell_collapse: >
    ★36셀 full(Macro4×KRW3×flow3) N>=24 cell = 0개(실측, small-universe + 월간) → INSUFFICIENT.
    측정 = 단일축(Macro 4 / KRW 3 / flow 3 각각) conditional IC + family_2 interaction. 2축 merge = 통합단계.
  fdr_family:
    m_naive: 102              # powered cell 수 (단일 FDR family, G-F §3)
    m_eff_signal: 3.0         # ★Li-Ji M_eff (가격4신호 상관보정). naive 6신호 → 유효 ~3
    by_survivors: []          # naive m=102 BY 보정 후 0 (raw_p_min=0.0005 ≈ Bonferroni α 0.00049 = 간발 경계)
    bonferroni_note: "Bonferroni α/102=0.00049. vol_60 y_60d / pbr_z y_60d (raw_p=0.0005) = 경계 간발(생존/미생존 경계)."
    note: "★M_eff 통합 보정 = supervisor 통합단계(M.7 분담). 산업 = naive + M_eff_signal 박제."
  # ── ★핵심 발견: regime별 IC 증폭/반전 (y_20d/y_60d, wild-cluster p) ──
  key_findings:
    - finding: "★KRW_neutral regime = 신호 증폭축 (반도체 KRW_weak 과 다름 = 철강 특수성)"
      cells:
