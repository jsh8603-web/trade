      유동성-티어: hi-ADV -0.233 / lo-ADV -0.093 / cap-weighted -0.244 (대형주 reversal 강 = microcap 아티팩트 아님).
      ★★small-universe(avg 20종) magnitude inflation 주의 = point estimate -0.181 literal 금지, breadth-adj IR -0.81 병기, magnitude 50% haircut 권고.
