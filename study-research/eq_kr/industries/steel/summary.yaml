      ★자동차 capex_ratio(음, high_confidence)가 철강서 재현 = 자산집약 4섹터 일반화 1보. ★단 "증설 cycle"이 아니라 "자산집약도 레벨 spread가 forward 예측" 한정해석(메인 종합 대상).
