    - date: "2024-02-26"
      name: "밸류업 1차 (세미나)"
      low_pbr_caar_short: -0.077    # [-5,+5]
      low_pbr_caar_mid: -0.054      # [+1,+60]
      spread_low_minus_high: -0.083
      verdict: "★예상 반대(음). 1차 세미나 무반응/역행. 'sell the news'"
