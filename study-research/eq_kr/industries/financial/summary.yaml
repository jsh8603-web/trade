# summary.yaml — financial(금융) 산업 conditional IC v3 (frame v3 + dispatch conditional 양식)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge, BY/FDR, wild-cluster/block-boot).
# ★verdict 중심 = sub-sector 부호 이질(은행/보험 금리+ vs 증권 금리−) = 통합 cross-sectional IC cancel = frame §1.6 분리 의무.
# raw 재현: raw-v3/{collect_regime, measure_conditional, measure_oos_event}.py + validation-{conditional,oos-event,attack}-v3.json
#   (+ 기존 v2 부분 활용: measure_valuation/measure_cross/validation-{valuation,cross,metrics}-v3.json)

industry: kr_financial        # eq_kr 12산업 中 Tier 2 (금융: 은행11/증권10/보험9/지주3/카드1)
asset_scope: [equity.kr]
archetype: spread_driven      # 금리·신용 regime 민감 (NIM·credit spread)
archetype_attestation:
  valid_from: "2019-01-01"    # ★PIT 사전선언 (§M.5 ex-post 금지)
  declared_at: "2026-06-05"
  primary_metric: pbr         # 은행 P/B·ROE (sales_yield 부적합=이자수익 레버리지)
  secondary: rate_regime_conditional
  basis: >
    spread_driven = 금리커브(NIM)·credit spread regime 민감. ★단 sub-sector 부호 이질(은행/보험 금리+ vs 증권 금리−).
    ★검증: 은행 pbr_z y60d IC -0.161 wc_p=0.0165(value premium) vs 증권 +0.146 → 차이 t=-3.18 유의(cancel 입증).
as_of: "2026-05-29"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    금융 = spread_driven, 단 ★sub-sector 부호 이질이 본질. "싸다" = P/B·ROE(은행/지주). 증권은 금리하락 수혜로
    부호 반대. ★실측 핵심: 금융 전체 eq-weight cross-sectional IC = sub-sector 부호 cancel 로 약(기존 v2 "전부 비유의"의
    근본 원인). sub-sector 분리 시 은행 저PBR value premium(IC 음 -0.161) 발현 = frame §1.6(분석unit↔portfolio 분리).
  cycle_reading: >
    금리 regime(국고3Y 6M Δ): rate_up 30 / rate_down 26 / rate_flat 33 month. curve(10Y-3Y): steepen 43/flatten 34.
    credit(AA−-국고3Y): wide 36/normal 53. 은행=금리상승 NIM 수혜(+), 증권=금리하락 거래대금(−), 보험=금리상승 자산운용·IFRS17(+).
    ★★cell 곱셈 금지(team-lead 2026-06-05): base 36셀(Macro4×KRW3×flow3) = 12산업 공통 보존. 금리 3축은 ⛔곱하지 않고
    (108셀 붕괴 회피) ★독립 1D 금융전용 보조 surface(권고 b) + family_2 interaction(권고 a)으로 별도 layer. 실측 cell candidate = 단일축 합 18.
  estimation_note: >
    2026-05: universe 34종. ★통합 unconditional 신호 약(sub-sector cancel). sub-sector 분리 = 은행 PBR value(tentative,
    DART 2023~ n=27) + rev_1m reversal(IS/OOS 부호유지) + 밸류업 2차 re-rating(+0.076 spread). momentum = structural break(단정 금지).

# ── 블록2 INDICATORS (sub-sector 분리 cross-sectional IC, ★cancel 점검 핵심) ──
# ★financial 핵심 = sub-sector 부호 이질. 통합 IC 약 / 분리 시 발현. n<30 hedge 의무.
indicators_passed:
  - id: bank_pbr_z_value
    layer: 1
    family: value
    subsector: bank          # ★sub-sector 분리 (frame §1.6)
    horizon: y_60d
    ic_mean: -0.161          # 저PBR value premium (음 = 저PBR→고forward)
    ic_ci_block_boot: [-0.30, -0.02]   # ★block-boot, 0 배제(단 n=27 wide)
    wild_cluster_p: 0.0165   # ★small-block size-invalid 회피 (asymptotic t 대체)
    n_effective: 27          # ★DART 2023~ 제약 = short-sample
    avg_universe_n: 11.0     # 은행 11종
    cancel_evidence:         # ★S5 반증3 = 통합 cancel 입증
      bank_ic: -0.161
      securities_ic: 0.146   # ★증권 = 반대 부호(고PBR→고forward)
      diff_t_naive: -3.18    # ★naive (자기상관 미보정 — 60d overlapping)
      diff_autocorr_corrected:   # ★fin-audit G-C remediation 1 (라벨 정밀화, 격하 아님)
        lag1_autocorr: 0.452       # 60d overlapping → diff 자기상관
        t_nw_hac_lag3: -2.64       # NW-HAC lag3 보정 → 여전히 유의(|t|>2)
        n_eff: 14.7
        t_neff: -2.35              # n_eff 보정 → 여전히 유의
        wild_cluster_p: 0.0045     # ★다른 지표 동일 적용(cancel diff만 naive였음 → 보정)
        block_boot_ci95: [-0.60, -0.14]   # 0 배제
      diff_t: "naive -3.18 / NW-HAC lag3 -2.64 / n_eff(14.7) -2.35 + wc_p 0.0045 + CI[-0.60,-0.14] 0배제"
      verdict: "★통합 cross-sectional IC cancel = frame §1.6. 은행 value / 증권 반대 → 분리 의무. ★자기상관 보정 후에도 부호 결론 robust(NW-HAC t=-2.64, wc_p=0.0045, CI 0배제). fin-audit 독립재현 + bank vs insur t=-2.56 도 유의."
    robustness:
      leave_top2_out: -0.202  # 대형주(KB/신한) 제외 시 강화 = microcap/대형주 아티팩트 아님
      within_period: "2023 +0.14 / 2024 -0.02 / 2025 -0.36 / 2026 +0.02 = 부호 불안정(short-sample)"
      oos_split: "★IS(2019-22) n=0 (DART 2023~ 제약) = OOS split 불가 = data-gate"
    source_id: "raw-v3/validation-conditional-v3.json:conditional_ic_surface.bank.pbr_z.y_60d + validation-attack-v3.json:pbr_cancel_diff"
    verdict: "★PARTIAL — 은행 저PBR value premium 방향 robust(부호 음 + leave-top2 강화 + 증권 대비 t=-3.18). ★단 DART 2023~ n=27 short-sample = magnitude tentative, OOS split 불가(data-gate). within-period 부호 불안정."

  - id: ratePOS_rev_1m
    layer: 3
    family: reversal
    subsector: rate_POS      # 은행/보험/지주/카드 24종
    horizon: y_20d
    ic_mean: -0.058          # 단기 reversal
    wild_cluster_p: 0.061    # borderline
    ic_ci_block_boot: [-0.12, 0.00]
    n_effective: 81
    conditional:
      KRW_weak: {ic: -0.16, wc_p: 0.003, n: 34}    # ★원화약세(위험회피) reversal 강
      macro_Slowdown: {ic: -0.17, wc_p: 0.007, n: 25}
    oos_split: "★IS(2019-22) -0.061 → OOS(2023-26) -0.055 = ★부호유지(가장 robust)"
    robustness: {leave_2020_out: -0.039, leave_2022_out: -0.026, verdict: "부호유지, 2022 부분의존"}
    source_id: "raw-v3/validation-conditional-v3.json + validation-oos-event-v3.json:walk_forward_oos.ratePOS_rev1m_y20d"
    verdict: "★PARTIAL — rate_POS 단기 reversal IS/OOS 부호유지(가장 robust 신호). KRW_weak/Slowdown 위험회피 국면 증폭(wc_p<0.01). magnitude 약(-0.05) = live tentative."

  - id: securities_roe_z_quality   # ★약신호 부활 측정(team-lead 지시 2026-06-05) — TENTATIVE, tradeable 미승격
    layer: 1
    family: quality
    subsector: securities          # ★증권 sub-sector 한정 (보험은 반대 부호)
    horizon: y_60d
    ic_mean: 0.317                 # ★증권 고ROE quality premium (양 = 고ROE→고forward)
    wild_cluster_p: 0.0025
    n_effective: 22                # ★DART 2023~ short-sample
    within_period: "2024 +0.51 / 2025 +0.19 / 2026 +0.35 = 전부 양(일관)"
    cancel_evidence:               # ★PBR cancel 구조 ROE축 재확인
      securities_roe_ic: 0.317
      insurance_roe_ic: -0.177     # ★보험 = 반대 부호
      diff_t_naive: 5.57
      diff_t_nw_hac_lag3: 5.28     # 자기상관 보정 후에도 강함
      verdict: "★증권 고ROE+ vs 보험 고ROE− = sub-sector 부호 이질 ROE축 재확인(PBR cancel 동형)."
    robustness: {leave_2024_out: 0.21, leave_2025_out: 0.47, verdict: "부호유지(단일 episode 종속 아님)"}
    oos_split: "★IS(2019-22) n=0 (DART 2023~) = walk-forward OOS split 불가 = data-gate"
    gate_status: {n: tentative, se: tentative, power: weak_mde_미달, fdr: not_survive_m22, oos: data_gate}
    source_id: "raw-v3/validation-quality-v3.json:quality_ic_surface.securities.roe_z.y_60d"
    verdict: "★TENTATIVE (부분 부활, tradeable 미승격) — 증권 고ROE quality premium within-period 일관(+0.317, leave-year 부호유지) + 증권 vs 보험 차이 t=5.28. ★단 DART 2023~ IS n=0(OOS 불가) + BY 미생존(m=22) + n_eff MDE 미달 = magnitude tentative, live 제외. unblock = DART 2019-22 확보."

  - id: bank_mom_12_1
    layer: 3
    family: momentum
    subsector: bank
    horizon: y_60d
    ic_mean: 0.090           # long-horizon continuation (2023~ 양)
    wild_cluster_p: 0.0445
    n_effective: 74
    structural_break:        # ★핵심 주의 = in-sample artifact 아닌 regime break
      pre_2023: "2020 -0.04 / 2021 -0.06 / 2022 -0.06 (reversal)"
      post_2023: "2023 +0.25 / 2024 +0.11 / 2025 +0.25 / 2026 +0.67 (continuation)"
      oos_split: "IS -0.054 → OOS +0.228 = ★부호반전 = structural break(밸류업 2024~ 은행주 추세)"
    source_id: "raw-v3/validation-conditional-v3.json + validation-oos-event-v3.json:walk_forward_oos.bank_mom12_1_y60d"
    verdict: "★TENTATIVE — 은행 long-momentum 2023~ continuation 강하나 ★structural break(pre-2023 reversal → post-2023 continuation). regime/밸류업 의존 = magnitude 단정 금지, OOS 부호반전."

# ── 블록3 RELATIONSHIPS ──
relationships_passed: []  # unconditional 유의 partial-corr 없음(sub-sector cancel). regime-conditional/sub-sector 분리 = indicators.

# ── 블록4 WEIGHT_RULES — ★sub-sector 분리 + 점추정 박제 금지 ──
weight_rule_candidates:
  - indicator_id: bank_pbr_z_value
    base_weight_range: [0.00, 0.08]   # ★은행 sub-sector 한정. 점추정 금지. DART 데이터 보강 전 상한 낮춤.
    modulate_by: [subsector, regime]  # ★subsector = 핵심 modulator (은행 only, 증권 제외)
    direction: "은행 sub-sector 내 저PBR(낮은 z) overweight. ★증권 sub-sector 는 반대(제외 또는 부호반전)."
    granularity: cross_sectional_within_subsector
    gate_status: {n: tentative, se: tentative, power: weak, fdr: not_survive, oos: data_gate}  # n=27 short
    source_ids: ["raw-v3/validation-conditional-v3.json:bank.pbr_z.y_60d"]
    hedge_note: >
      ★DART 2023~ n=27 short-sample = TENTATIVE. 부호(value premium 음) robust(증권 대비 t=-3.18 + leave-top2 강화)
      나 magnitude·OOS = data-gate(IS n=0). live 제외. ★supervisor 통합 시 rate_POS sleeve vs 증권 sleeve 분리 권고.

  - indicator_id: ratePOS_rev_1m
    base_weight_range: [0.00, 0.05]   # ★reversal 약효(IC -0.05). regime 함수.
    modulate_by: [subsector, regime]
    direction: "rate_POS(은행/보험/지주) 단기수익 z 상위 underweight(reversal). KRW_weak/Slowdown 국면 증폭."
    granularity: cross_sectional
    gate_status: {n: ok, se: tentative, power: ok, fdr: not_survive, oos: sign_hold}
    source_ids: ["raw-v3/validation-conditional-v3.json + validation-oos-event-v3.json"]
    hedge_note: >
      ★IS/OOS 부호유지 = 가장 robust 신호이나 magnitude 약(-0.05) + BY 미생존. TENTATIVE, live 보류.

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 ──
confidence_hooks:
  - hypothesis_id: financial_subsector_value_heterogeneity
    affects_indicator: bank_pbr_z_value
    affects_edge: [bank_pbr_z_value, bank_fwd_60d]
    confirm_signal: "은행 sub-sector 내 저PBR z 상위 종목 60d forward rank IC < 0 유지 + 증권 대비 부호 반대 지속"
    reject_signal: "은행 PBR IC e-CUSUM 부호반전 OR 증권과 부호 동일화(cancel 구조 붕괴)"
    emit_where: "panel-score-IC 축 (sub-sector 분리)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights sub-sector 분리 재적합 → 은행 sleeve value / 증권 sleeve 분리"
    action_threshold: "e-value > 20 → retract / DART 2019-22 확보 시 재평가"

