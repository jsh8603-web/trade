# summary.yaml — financial(금융) 산업 v3 (frame v3 §M exposure card 계약)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge, BY/FDR, LOO/block-boot).
# ★verdict 중심 = regime-conditional 발견(금리 regime별 모멘텀 부호 반전) = 동적가중 정당화 직접 증거.
# raw 재현: raw-v3/{collect, measure, collect_dart, measure_valuation, measure_cross, exposure_card}.py

industry: kr_financial        # eq_kr 12산업 中 Tier 2 (금융: 은행/증권/보험)
asset_scope: [equity.kr]
archetype: spread_driven      # archetype.py: 은행 NIM·credit spread regime 민감 (1차 가설)
archetype_attestation:
  valid_from: "2019-01-01"    # ★PIT 사전선언 (§M.5 ex-post 금지)
  declared_at: "2026-06-03"
  primary_metric: pbr         # spread_driven primary = P/B·ROE (trap=신용사이클 대손)
  secondary: asset_stable     # soft: 보험/금융지주 배당 (prob~0.3)
  basis: >
    spread_driven = NIM·credit spread regime 민감. ★검증: regime-conditional 모멘텀이 rate_up 국면
    +0.102 / rate_down -0.054 = 금리(NIM) regime 의존 강 입증 → spread_driven 지지(tentative, n small).
as_of: "2026-05-31"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    금융 = spread_driven. "싸다" = P/B·ROE (trap=신용사이클 대손, 저PBR 함정).
    ★실측 핵심: unconditional 신호는 momentum/valuation 모두 비유의. 단 **regime-conditional**
    (금리 상승 국면)에서 모멘텀 IC 양전(+0.102) = NIM 수혜 = "지표 유효성이 regime 함수"(사용자 핵심).
    valuation(PBR/PER) = DART 금융재무 2023~ 제약으로 n 부족 → TENTATIVE/INSUFFICIENT.
  cycle_reading: >
    금리 regime: rate_up 22 / rate_down 21 / rate_flat 46 month (US 10Y 3M Δ, KR proxy).
    은행 NIM = 금리 상승 수혜, 증권 = 거래대금·시황 민감, 보험 = 금리(자산운용수익)·할인율.
  estimation_note: >
    2026-05: universe 34종(은행11/증권10/보험9/기타3/카드1). ★unconditional 신호 약 →
    regime-conditional 동적가중(derive_weights w∝Θ_signal·IC, regime 함수)이 financial 핵심.

# ── 블록2 INDICATORS (forward 횡단면 Rank-IC) ──
# ★financial unconditional 신호 = 전부 비유의 (BY 생존 0). regime-conditional 만 신호.
indicators_passed:
  - id: cs_mom_6m_rate_up        # ★regime-conditional 한정
    layer: 3
    family: momentum
    horizon: 12M_mom
    regime: rate_up              # ★조건부 — 금리 상승 국면만
    ic_mean: 0.102
    ic_ci_95: [-0.026, 0.228]     # ★[#21] regime별 block-boot CI(block=5, n=21 wide) = 0 약간 포함 → magnitude hedge
    n_effective: 21              # months in rate_up regime (small)
    avg_universe_n: 31.5
    interaction_t:               # ★[#21] "rate_up에서만 양" claim 통계근거 (S6 audit 보강)
      regression: "IC_t ~ const + ΔRate_3M_t (NW HAC lag=12): slope=+0.126 t=+2.01 p=0.0488 (유의 borderline)"
      welch: "rate_up IC +0.102 vs pooled(down+flat) -0.051, Welch t=+2.65 p=0.0121 (유의)"
      verdict: "★interaction+Welch 둘 다 유의 = 'rate_up only 양' claim 통계근거 O = regime-conditional 신호 강화. 단 n=21<30 magnitude hedge + interaction p=0.049 borderline."
      regime_ci: "rate_up [-0.026,0.228](0 포함, n21 wide) / rate_down -0.054 [-0.168,0.070] / rate_flat -0.049 [-0.159,0.037]"
    source_id: "raw-v3/validation-metrics-v3.json:regime_g1.regime_conditional_ic.rate_up + raw-v3/validation-interaction-v3.json"
    notes: |
      ★regime-conditional 핵심 발견. mom_6 → 12M forward IC: rate_up +0.102 / rate_down -0.054 / rate_flat -0.049.
      = 금리 상승 국면(은행 NIM 수혜)에서만 모멘텀 양. unconditional 비유의(부호 상쇄)를 regime 이 가림.
      ★small-n(n=21) → TENTATIVE DIRECTIONAL. 단정 금지. block-boot/regime별 CI = 추가 측정.
      = 사용자 "지표 상관 계속 변하는 그림" + 동적가중(regime-conditional IC) 정당화 직접 증거.

# ── 블록3 RELATIONSHIPS (partial-corr) ──
relationships_passed: []  # unconditional 유의 관계 없음. regime-conditional 만 = indicators_passed.

# ── 블록4 WEIGHT_RULES — ★regime-conditional 동적가중 ──
weight_rule_candidates:
  - indicator_id: cs_mom_6m_rate_up
    base_weight_range: [0.00, 0.08]   # ★regime 함수: rate_up 시 ↑, rate_down/flat 시 ~0(또는 음). 점추정 금지.
    modulate_by: [archetype, regime]  # ★regime = 핵심 modulator (금리 국면)
    direction: "rate_up regime → cross-sectional 6M 모멘텀 z 상위 overweight. rate_down/flat → 비활성(IC 음/0)."
    granularity: cross_sectional
    gate_status: {n: tentative, se: tentative, power: weak, fdr: regime_conditional, oos: tentative}  # n=21 small
    source_ids: ["raw-v3/validation-metrics-v3.json:regime_g1"]
    hedge_note: >
      ★n=21(rate_up) small-n. TENTATIVE. regime-conditional 동적가중 prototype = supervisor Σ_signal·Ω 단계 정밀화.
      ★★[#21 측정 완료] interaction t 부착(S6 audit 보강): regression IC~ΔRate slope +0.126 NW t=2.01 p=0.0488 +
      Welch t=2.65 p=0.0121 → ★둘 다 유의 = "rate_up only 양" claim 통계근거 O(점추정 부재 우려 해소). 단 ⛔ (a)
      interaction p=0.049 borderline (b) rate_up block-boot CI [-0.026,0.228] 0 포함 n=21 wide → ★magnitude hedge
      유지 + TENTATIVE + live 제외(n<30, regime-conditional = supervisor Σ_signal 단계 정밀화).

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 ──
confidence_hooks:
  - hypothesis_id: financial_nim_regime_momentum
    affects_indicator: cs_mom_6m_rate_up   # ★필수
    affects_edge: [cs_mom_6m_rate_up, financial_fwd_12m]
    confirm_signal: "rate_up regime 진입 시 6M 모멘텀 z 상위 종목 12M forward rank IC > 0 유지"
    reject_signal: "rate_up regime 에서도 모멘텀 IC e-CUSUM 붕괴 (NIM 가설 무효)"
    emit_where: "panel-score-IC 축 (regime-conditional)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights regime-conditional 재적합 → rate regime 따라 모멘텀 base_weight 변동"
    action_threshold: "e-value > 20 → retract / regime 전환 시 재평가"

# ── 블록6 COLLECTOR_PLAN ──
collector_plan_industry:
  - missing: "금융업 재무 2019-2022 (DART fnlttSinglAcntAll = 2023~만, IFRS 보험/은행 별도양식)"
    source: "KB금융 등 2019-2022 status 013(데이터 없음) 확인. DART 금융업 전용 양식 OR 사업보고서 원문 파싱 OR 데이터벤더"
    priority: high   # ★valuation IC 검증의 핵심 제약 — financial valuation 게이트 통과 불가 원인
    status: "deferred (supervisor 2026-06-03). 'value 산업 분기 검증' = consumer 로 이관."
  - missing: "PIT universe 멤버십 (시점별 섹터 편입/편출 + delisted/M&A)"
    source: "FDR KRX-DESC 현재 스냅샷만. KRX PIT 섹터분류 인증 필요"
    priority: high
  - missing: "KR 금리 (KORIBOR/국고채) + KR HY credit spread"
    source: "현 = US 10Y(^TNX) proxy + US HY OAS proxy. KR 금리 = 한국은행 ECOS API"
    priority: medium  # regime 정밀화 (현 US proxy)
  - missing: "은행 NIM·연체율, 증권 거래대금, 보험 손해율 (산업 cycle 지표)"
    source: "금융감독원 금융통계정보시스템 / 한국거래소"
    priority: medium

# ── ★cross (분석 단위 간 상관) — §M.3 (산업=보고만) ──
cross:
  common_factor_exposure:
    - {factor: credit, beta: -0.0535, beta_ci_95: [-0.1473, 0.0403], contemporaneous: true,
       source_id: "raw-v3/validation-cross-v3.json:common_factor_exposure.credit", note: "비유의 (t=-1.12). battery 대비 약."}
    - {factor: VIX, beta: 0.0009, beta_ci_95: [-0.0029, 0.0048], contemporaneous: true, note: "비유의"}
    - {factor: dollar, beta: -0.515, beta_ci_95: [-1.700, 0.670], contemporaneous: true, note: "비유의"}
    - {factor: oil, beta: -0.0245, beta_ci_95: [-0.216, 0.167], contemporaneous: true, note: "비유의"}
    - {factor: rate, beta: -0.0419, beta_ci_95: [-0.189, 0.105], contemporaneous: true,
       note: "★contemporaneous rate β 비유의 — 단 regime-conditional(rate Δ 3M)에선 모멘텀 IC 부호 반전(indicators 참조). level β ≠ regime effect."}
  directional_spillover: []
  structural_linkage:
    - supplier_or_customer: null
      verdict: "customer-supplier momentum = financial 부적합(upstream 정의 불명확). skip(battery=null 동일 패턴). 금융은 macro(금리/credit) regime 의존이 supply-chain 보다 dominant."
  # ⛔ sector-rotation clock = myth(Molchanov 2024).

# ── ★valuation 횡단면 (§M.7, DART 재구성 — 데이터 제약) ──
valuation_cross_sectional:
  data_source: "raw-v3/validation-valuation-v3.json (DART 312 rows = ★2023~만 + pykrx 가격)"
  mechanism_works: true   # cross-sectional 작동 (PBR avgN 29 / PER 20). 단 시계열 짧음.
  data_constraint: "★DART 금융재무 = 2023 회계연도부터만(IFRS 보험/은행 별도양식). 2019-2022 status 013. → forward IC n 급감."
  pit_note: "재무 = rcept_dt 공시일 이후만. financial 보고지연 = 분기보고 ~90일."
  indicators:
    - id: cs_pbr_z
      signal: "PBR cross-sectional z (저PBR=value, spread_driven primary)"
      horizon: 12M
      ic_mean: -0.019       # 저PBR value 방향(음)이나 ≈0
      ic_ci_95_block_boot: [-0.097, 0.102]  # 0 포함
      t_nw: -0.43
      n_effective: 19
      avg_universe_n: 28.8
      source_id: "raw-v3/validation-valuation-v3.json:indicators.pbr_z__12M"
      verdict: "TENTATIVE DIRECTIONAL — 저PBR value premium 방향성 약 prior. 비유의(CI 0 포함), n=19 데이터 제약. ★primary_metric(pbr) 이나 IC 약."
    - id: cs_per_z
      signal: "PER cross-sectional z"
      horizon: 24M_value
      ic_mean: 0.185        # 양수 = 고PER forward 높음 (value premium 반대 OR 금융 PER 왜곡)
      t_nw: 21.2            # ★허수 — n=7
      n_effective: 7        # ★INSUFFICIENT (small-n rule: n<10 단정 금지)
      avg_universe_n: 15.0
      source_id: "raw-v3/validation-valuation-v3.json:indicators.per_z__24M_value"
      verdict: "★INSUFFICIENT — n=7(DART 2023~ 제약). t=21.2 는 small-n 허수(within=0, CPCV=nan). 단정 금지. 금융 PER = 보험 일회성손익 왜곡 가능. ★★[frame §M.12] 24M eff_indep_N = 7/24 ≈ 0.3 = ★전 산업 최악 degenerate(독립표본 < 1). t=21.2 완전 무의미."
  multiple_testing: "8 테스트 BY factor 2.72. per_z__24M(n=7) 만 형식상 생존하나 INSUFFICIENT 격하 → 실질 생존 0."
  verdict: >
    valuation 횡단면 메커니즘 작동(PBR avgN 29). 단 ★DART 금융재무 2023~ 제약으로 forward IC n 부족 →
    PBR TENTATIVE(약·비유의), PER INSUFFICIENT(n=7). "금융=value 우세" 분기 검증 = 데이터 제약으로 보류
    → consumer(표준계정 value 산업)로 이관. financial 진짜 신호 = regime-conditional 모멘텀(NIM).

# ── robustness_checks ──
robustness_checks:
  - indicator_id: cs_mom_6m_rate_up
    leave_episode: null          # n=21 small, regime-conditional → leave-episode 부적합
    within_period: null          # regime subsample 자체가 sub-split
    partial_corr_ratio: null
    net_sharpe_ratio: null
    forward_vs_contemp: "forward present (regime-conditional only)"
    family_neutralized_ic: null
    eff_n_tier: Weak             # n=21 (30-50 Weak 미만) → 사실상 Weak/INSUFFICIENT 경계
  - indicator_id: cs_pbr_z
    leave_episode: null
    within_period: "fail (0.67, n=19)"
    eff_n_tier: Weak             # n=19 (데이터 제약)
    forward_vs_contemp: "forward present (weak, 비유의)"

# ── horizon_verdict ──
horizon_verdict:
  best_horizon: "12M (regime-conditional rate_up)"
  forward_alpha_present: true   # ★단 regime-conditional 한정 (unconditional 부재)
  note: >
    unconditional forward alpha = 부재(momentum/valuation 비유의). ★regime-conditional(rate_up) 에서만 present.
    = §D falsifier 정직 적용: "regime = refinement 도구". financial 은 unconditional 단독 베팅 근거 부족,
    금리 regime 조건부 + valuation(데이터 보강 후) 결합 필요.

# ── Hard-fail 4 (B C D I) self-check ──
hard_fail_self_check:
  B_real_data: {status: PASS, note: "합성 0%. pykrx OHLCV 34종 + yfinance(^TNX/factors) + DART 312 rows + FDR. raw-v3/*.py 재현."}
  C_traceability: {status: PASS, note: "모든 yaml 수치 = validation-metrics-v3 / valuation-v3 / cross-v3.json key 매핑."}
  D_pit:
    status: PASS
    note: "가격 PIT-safe(forward shift). valuation = DART rcept_dt 공시일 이후만. regime = ex-ante 금리 Δ(진입시점 관측)."
  I_survivor_bias:
    status: PARTIAL
    note: "universe = FDR 현재 스냅샷(생존 종목). delisted/M&A 누락(금융 = 합병 잦음, 외환은행/하나 등 = 생존편향 잔존). 34종 中 3종 부분 이력. PIT 멤버십 = collector_plan high."

# ── verdict (small-n rule) ── ★regime-conditional 중심
verdict_label: TENTATIVE   # ★전체 = TENTATIVE (regime-conditional 발견은 의미있으나 n small + valuation 데이터 제약)
verdict_detail:
  cs_mom_6m_rate_up: "★TENTATIVE DIRECTIONAL (regime-conditional 핵심) — rate_up 모멘텀 IC +0.102 vs pooled -0.051. ★[#21] interaction t 통계근거 O(regression p=0.049 + Welch t=2.65 p=0.012 둘 다 유의) = 'rate_up only 양' claim 입증, NIM 가설 정합. 단 n=21<30 + interaction borderline + block-boot CI 0포함 = magnitude hedge, live 제외. = 동적가중 정당화 증거."
  cs_mom_unconditional: "비유의 (BY 생존 0, mom_6→12M IC -0.006). ★battery(CONFIRMED +0.086) 정반대 = 산업별 신호 상이 = 동적가중 근거."
  valuation_pbr: "TENTATIVE DIRECTIONAL (저PBR value 방향, 비유의, n=19 데이터 제약)"
  valuation_per: "★INSUFFICIENT (n=7, DART 금융재무 2023~ 제약. t=21.2 허수)"
  common_factor: "전부 비유의 (battery는 credit/oil 유의 — financial 은 macro factor 약)"
verdict_note: >
  ★financial 핵심 = regime-conditional 모멘텀(금리 상승 국면만 양). unconditional 신호 비유의(momentum
  battery 대조 + valuation 데이터 제약). = 사용자 "지표 상관 변하는 그림" + 동적가중(regime-conditional IC)
  정당화 직접 증거. "금융=value 우세" 가설은 DART 금융재무 2023~ 제약으로 검증 보류 → consumer 이관.
  ★pilot 분기 학습: 산업마다 (a) 유효 신호 다름(battery=momentum / financial=regime-conditional)
  (b) 데이터 양식 다름(제조=fnlttSinglAcntAll 충분 / 금융=2023~ 부족) → 산업별 측정·universe 화이트리스트 필수.
