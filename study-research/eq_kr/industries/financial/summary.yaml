# ── ★cross (분석 단위 간 상관) — §M.3 (산업=보고만) ──
# 기존 v2 common factor β (level, 비유의) + ★금리 regime conditional 로 재해석
cross:
  common_factor_exposure:
    - {factor: credit, beta: -0.0535, beta_ci_95: [-0.1473, 0.0403], contemporaneous: true,
       source_id: "raw-v3/validation-cross-v3.json (기존 v2)", note: "★level β 비유의(US HY proxy). 단 credit_regime(KR AA−-국고3Y) conditional 로 재측정 = credit_wide 에서 신호 변조(indicators 참조)."}
    - {factor: rate, beta: -0.0419, beta_ci_95: [-0.189, 0.105], contemporaneous: true,
       note: "★level β 비유의. 단 rate_regime(KR 국고3Y Δ) conditional 에선 sub-sector 부호 갈림(은행+ 증권−). level β ≠ regime effect."}
    - {factor: VIX, beta: 0.0009, beta_ci_95: [-0.0029, 0.0048], contemporaneous: true, note: "비유의"}
    - {factor: dollar, beta: -0.515, beta_ci_95: [-1.700, 0.670], contemporaneous: true, note: "비유의"}
  directional_spillover: []   # ★산업단계 = 후보 보고. financial = 금리/credit regime 의존이 dominant, DY spillover = supervisor 통합단계
  structural_linkage:
    - supplier_or_customer: null
      verdict: "customer-supplier momentum = financial 부적합(upstream 정의 불분명). 금융은 macro(금리/credit) regime 의존이 supply-chain 보다 dominant."
  # ⛔ sector-rotation clock = myth(Molchanov 2024).

# ── ★valuation 횡단면 (§M.7, DART 재구성 — ★2023~ 데이터 제약) ──
valuation_cross_sectional:
  data_source: "raw-v3/validation-valuation-v3.json (기존 v2, DART 312rows 2023~) + conditional-v3(sub-sector 분리)"
  data_constraint: "★DART 금융재무 = 2023 회계연도부터만. forward IC n 급감(PBR n=27~29). ★sub-sector 분리 시 N 더 작음(은행 11)."
  pit_note: "재무 = rcept_dt 공시일 이후만. 보고지연 ~90일."
  indicators:
    - id: bank_cs_pbr_z
      signal: "은행 sub-sector PBR cross-sectional z (저PBR=value)"
      horizon: y_60d
      ic_mean: -0.161
      wild_cluster_p: 0.0165
      n_effective: 27
      verdict: "★PARTIAL — 은행 저PBR value premium 방향 robust(증권 대비 t=-3.18). DART 2023~ n=27 short = magnitude tentative."
    - id: securities_cs_pbr_z
      signal: "증권 sub-sector PBR cross-sectional z"
      horizon: y_60d
      ic_mean: 0.146           # ★양 = 증권은 고PBR→고forward (은행과 반대)
      wild_cluster_p: 0.024
      n_effective: 28
      verdict: "★증권 = PBR 부호 반대(value premium 역). = sub-sector cancel 구조 핵심. growth/거래대금 종목 prox 가능."
    - id: cs_per_z
      signal: "PER cross-sectional z (전 sub-sector)"
      horizon: y_20d
      ic_mean: 0.034
      wild_cluster_p: 0.537
      verdict: "★비유의. bank per_z -0.19(약). 보험 IFRS17 일회성 peak-EPS 왜곡. ★기존 v2 per_z 24M t=21.2 = n=7 허수(eff_indep 0.3 degenerate) 확정."
  multiple_testing: "★m=862 naive(sub-sector 6그룹 × 신호 × horizon × regime cell) BY survivors=[]. M_eff 과대(중복+신호상관) → 독립 = sub-sector 3 + M_eff_signal 3-4, 통합 supervisor."
  verdict: >
    ★valuation 핵심 = sub-sector 부호 이질(은행 저PBR value -0.161 vs 증권 +0.146, 차이 t=-3.18). 통합 cross-sectional IC
    cancel = frame §1.6. 단 DART 금융재무 2023~ 제약(n=27) = PBR magnitude TENTATIVE, OOS split 불가(data-gate).
    PER INSUFFICIENT(보험 IFRS17 왜곡). "은행=value 우세" = 부호 robust / magnitude DART 보강 후 확정.

