# summary.yaml — auto(자동차) 산업 v3 conditional (frame v3 §M + dispatch 원의도 = conditional IC surface)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge 어휘, BY 보정, LOO/block-boot, n<30 hedge).
# ★본 산출 = conditional IC surface(지표×regime×horizon) = dispatch 본체. 반도체 summary.yaml conditional 미러.
# raw 재현: raw-v3/{measure_conditional, measure_oos, measure_fundamentals_cycle, measure_critique, merge_fdr_family}.py
#   + 기존 v3: {collect, measure, measure_cross, measure_valuation, collect_dart_extended}.py
# regime 데이터 = collect_regime.py (FRED CLI/DEXKOUS + ECOS 외국인순매수, 반도체와 시장공통 재사용)

industry: kr_auto             # eq_kr 12산업 中 Tier 2 (자동차)
asset_scope: [equity.kr]
archetype: cyclical           # 경기민감 (완성차/부품/타이어, 판매량(volume) cycle — ★반도체 ASP(가격) cycle 과 원천 다름)
archetype_attestation:
  valid_from: "2019-01-01"    # ★PIT 사전선언 (§M.5 ex-post 금지). cyclical = 자동차 판매량 사이클
  declared_at: "2026-06-03"   # 선언 시점 (사후편향 hazard 방지 attestation)
  primary_metric: ev_ebitda   # cyclical primary (peak-EPS trap — 자동차 = peak-EPS trap 대표산업)
  secondary: null
  basis: >
    ★실측 결론(conditional, 2026-06-05): 가격 momentum/reversal = unconditional 비유의 + ★conditional cell 거의 전부
    walk-forward OOS 부호반전(in-sample artifact). PBR value premium(y_60d)만 OOS robust + capex_ratio(asset growth)
    신규 신호 발견(OOS 강화, 통합 FDR 생존). PER peak-EPS trap 무신호 → cyclical archetype 지지(가격신호 약, valuation+자산성장 우위).
as_of: "2026-05-31"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    자동차 = cyclical (판매량 cycle). "싸다" = EV/EBITDA·P/B (★peak-EPS 함정: 자동차 = peak-EPS trap 대표산업.
    사이클 정점 판매량·EPS 극대 → 저PER 착시 → 인센티브↑·재고↑·마진희석으로 함정). primary_metric=ev_ebitda.
    ★실측 핵심: ① 가격 momentum/reversal = conditional 측정 결과 OOS flip(in-sample artifact, 반도체보다 약) ②
    PBR value(y_60d) = OOS robust(size 통제 후 독립) ③ ★capex_ratio(유형자산/총자산 asset growth) = 신규 진짜 신호(OOS 강화).
  cycle_reading: >
    2019-2026 = COVID 공급망(2020-21 차량반도체 부족)→수요회복(2022-23 생산정상화)→전동화 전환(2024-26).
    regime 분포(2019~): Macro[Slowdown 31/Recovery 26/Reflation 22/Overheat 10] × KRW[neutral 41/weak 38/strong 10]
    × flow[neutral 48/sell 22/strong_buy 19]. 글로벌 자동차 수요(CARZ) contemporaneous 동조 강(forward 부재).
  estimation_note: >
    2026-05 시점: universe 17종(시총≥3000억 ∧ ADV≥30억, 완성차3+부품12+타이어2). avg N ~14-15종(반도체 73·battery 26 대비 작음).
    ★universe 17종 협소 → magnitude 과대 위험 최대 = 부호·방향만, magnitude hedge. 본 산출 = conditional IC surface + peer z card.
    ★현대차/기아/모비스 시총 ~70% (반도체 93% 보다 덜 극단, 부품주 분산) → eq-weight cross-sectional.

# ── ★블록2-A CONDITIONAL IC SURFACE (dispatch 원의도 본체, measure_conditional.py) ──
# 측정 = IC(지표, regime 36셀, horizon) = "어느 국면에 어느 지표가 forward return 예측하나".
# ★점추정 금지: ic_mean + wild_cluster_p(G-F §7) + n_months + n_eff + walk-forward OOS(IS/OOS split).
conditional_ic_surface:
  source: "raw-v3/validation-conditional-v3.json + validation-merged-fdr-v3.json + walk_forward_oos"
  meta:
    horizons_days: {y_5d: 5, y_20d: 20, y_60d: 60}
    regime_axes: "Macro 4 × KRW 3 × flow 3 (36셀 full N>=24=0 → 단일축 측정, 2축 merge=supervisor)"
    gf_contract: "measure_conditional.py 헤더 G-F 7항 선언 (regime/interaction/단일FDR/null-MDE/PIT/turnover/wild-cluster)"
    calibration: "★small-block asymptotic NW t = size-invalid(Kiefer-Vogelsang) → wild-cluster bootstrap(Rademacher B=2000) per-cell p"
    floor_censored_caveat: >
      ★[G-C remediation 1, 2026-06-05] 통합 FDR survivors 5개 wc_p = 전부 0.0005 = wild-cluster bootstrap floor(1/(B+1)=1/2001)에 censored.
      = "auto survivors=5 > 반도체/battery survivors=0" 는 ★방향성 우위(보정 후 생존 여부)는 맞으나 ★magnitude 비교는 floor-censored
      (B↑ 시 0.0005 미만으로 더 작아질 수 있음, 5개 간 상대 강도 구분 불가). 산업 간 "얼마나 더 강한지" 정량 비교 금지, "생존 여부" 만 비교.

  # ── 가격신호 (unconditional 비유의 + conditional OOS flip = in-sample artifact) ──
  price_signals:
    - id: mom_6
      family: momentum
      prior: "음(reversal), 반도체보다 약 (volume cycle)"
      uncond: {horizon: y_20d, ic_mean: -0.0276, wc_p: 0.4168, n: 81, status: powered}
      uncond_y60: {ic_mean: null, ic_y60_is: -0.1259, ic_y60_oos: -0.0022}   # uncond y_60d IS 음 강 but OOS 소멸
      best_conditional: {cell: "krw_regime=KRW_weak (y_20d)", ic_mean: -0.0033, wc_p: 0.949, n: 34, note: "unconditional 약, KRW_weak 도 약"}
      walk_forward_oos:
        - {cell: "uncond y_20d", is_ic: -0.0529, oos_ic: -0.0004, sign_hold: true, note: "OOS 소멸(IS 약신호 → OOS ~0)"}
        - {cell: "KRW_weak y_20d", is_ic: -0.0981, oos_ic: 0.1498, sign_hold: false, note: "★OOS 부호반전(+) = in-sample artifact"}
        - {cell: "KRW_weak y_60d", is_ic: -0.1424, oos_ic: 0.0789, sign_hold: false, note: "★OOS flip"}
      verdict: "TENTATIVE→REJECTED(OOS) — unconditional 비유의 + conditional cell OOS flip. 자동차 momentum 무효 확정(반도체보다 약)."
    - id: mom_12_1
      family: momentum
      prior: "음(reversal)"
      uncond: {horizon: y_20d, ic_mean: -0.0075, wc_p: 0.8046, n: 75, status: powered}
      family_2_interaction: {dummy: "krw_regime=KRW_weak", b_inter: 0.1231, t_inter: 2.18, note: "★interaction 유의(t=2.18) but 부호 양(+) = KRW_weak서 momentum continuation, prior(reversal 음)와 반대"}
      walk_forward_oos:
        - {cell: "uncond y_20d", is_ic: -0.0815, oos_ic: 0.0609, sign_hold: false, note: "★OOS flip"}
        - {cell: "KRW_weak y_60d", is_ic: -0.0354, oos_ic: 0.1516, sign_hold: false}
      verdict: "REJECTED(OOS) — uncond+conditional 전부 OOS flip. family_2 interaction 유의하나 OOS 불안정."
    - id: rev_1m
      family: reversal
      prior: "음(단기 reversal)"
      uncond: {horizon: y_20d, ic_mean: 0.0200, wc_p: 0.5792, n: 81, status: powered}
      walk_forward_oos:
        - {cell: "uncond y_20d", is_ic: -0.0127, oos_ic: 0.0552, sign_hold: false}
        - {cell: "KRW_weak y_20d", is_ic: -0.1213, oos_ic: 0.1969, sign_hold: false, note: "★IS 강 음 → OOS 강 양 = 극단 flip"}
      verdict: "REJECTED(OOS) — IS 음 reversal → OOS 양 momentum 극단 flip = in-sample artifact 전형."
    - id: vol_60
      family: low_vol
      prior: "음(low-vol anomaly) 또는 무"
      uncond: {horizon: y_20d, ic_mean: 0.0051, wc_p: 0.8946, n: 81, status: powered}
      family_2_interaction: {dummy: "krw_regime=KRW_weak", b_inter: 0.2268, t_inter: 2.75, note: "★interaction 유의(t=2.75) but OOS flip 동반 = 신뢰 불가"}
      walk_forward_oos:
        - {cell: "KRW_weak y_20d", is_ic: 0.0508, oos_ic: 0.2811, sign_hold: true, note: "부호유지(양)이나 magnitude 폭증 = 불안정"}
      verdict: "TENTATIVE — uncond 무신호. KRW_weak interaction 유의하나 magnitude 불안정(OOS 0.28 폭증)."

  # ── ★valuation (PBR = OOS robust value premium / PER = peak-EPS trap 무신호) ──
  valuation_signals:
    - id: pbr_z
      family: value
      prior: "음(저PBR→고forward, value premium)"
      uncond: {horizon: y_20d, ic_mean: -0.0331, wc_p: 0.2849, n: 81, status: powered}
      uncond_y60: {ic_mean: -0.108, note: "y_60d uncond IS=-0.1084/OOS=-0.1173 = ★OOS robust"}
      best_conditional:
        - {cell: "y_60d uncond", ic_mean: -0.108, is_ic: -0.1084, oos_ic: -0.1173, sign_hold: true, note: "★OOS 부호+magnitude 유지"}
        - {cell: "y_60d macro=Slowdown", ic_mean: -0.1839, wc_p: 0.0005, is_ic: -0.1742, oos_ic: -0.1839, sign_hold: true, note: "★raw_p_min, OOS 강화 = robust"}
        - {cell: "y_60d flow_strong_buy", is_ic: -0.2051, oos_ic: -0.0817, sign_hold: true, note: "펀더멘털 자금 regime서 value 강(theory M3 정합), OOS 유지"}
      size_orthogonal: {b_pbr: -0.1148, t_pbr: -2.67, b_size: -0.0185, t_size: -0.38, horizon: y_60d, note: "★Q6 기각: PBR|Size t=-2.67 유의, size 비유의 = value premium = size 위장 아님(Fama-MacBeth)"}
      effective_n_label:   # ★[G-C remediation 2, 2026-06-05] y_60d 중첩 자기상관 보정
        horizon: y_60d
        ar1: 0.494           # PBR IC 시계열도 60d 중첩 강상관
        n_months: 82
        eff_n: 34.2          # effective-N (full autocorr)
        t_naive_iid: -3.72
        t_eff_corrected: -2.40   # ★eff-N 보정 t = -2.16~-2.40. 여전히 유의(|t|>2). Fama-MacBeth size-orth t=-2.67 도 eff-N 보정 시 약 -2.2 권역
        note: "★y_60d PBR IC AR1=0.494 → eff-N=34.2. naive t=-3.72 → eff-N 보정 -2.16~-2.40. ★보정 후에도 유의. t 박제 시 eff-N 병기. source=validation-neff-label-v3.json"
      tier: structural_prior_high_confidence   # ★[G-C 2026-06-05] OOS robust + size 독립 + eff-N 보정 후 유의. ⛔validated alpha 단정 보류
      verdict: "PARTIAL CONFIRMED(tentative, OOS robust, tier=structural_prior_high_confidence) — PBR value premium y_60d = ★OOS 부호+magnitude 유지 + size 독립(t=-2.67). ★effective-N 보정 t=-2.40(여전히 유의). ★단 universe 17종 magnitude hedge(점추정 인용 금지, 방향+breadth-adj 권역만). validated alpha 단정 보류."
    - id: per_z
      family: value
      prior: "무효(peak-EPS trap)"
      uncond: {horizon: y_20d, ic_mean: -0.0001, wc_p: 1.00, n: 41, status: powered, note: "★IC≈0 = peak-EPS trap 확인"}
      verdict: "INSUFFICIENT/무신호 — PER 횡단면 IC≈0 = ★peak-EPS trap(정점 EPS↑→저PER 왜곡). cyclical archetype 정의 데이터 지지. E/P·EV-EBITDA 대체 권고."

  # ── ★신규 cycle 지표 (DART 재구성, ★이연 금지 이행) — capex_ratio = 자동차 진짜 신규 신호 ──
  fundamental_cycle_signals_source: "raw-v3/validation-fundamentals-cycle-v3.json (DART dart_extended.parquet, rcept_dt PIT)"
  fundamental_cycle_signals:
    - id: capex_ratio
      signal: "유형자산/총자산 (asset growth, ★음 prior = 과잉투자 anomaly)"
      family: investment
      uncond: {y_20d: {ic_mean: -0.075, wc_p: 0.0125}, y_60d: {ic_mean: -0.1031, wc_p: 0.0015}}
      walk_forward_oos:
        - {horizon: y_20d, is_ic: -0.0551, oos_ic: -0.0975, sign_hold: true, note: "★OOS 부호유지+강화"}
        - {horizon: y_60d, is_ic: -0.0435, oos_ic: -0.1722, sign_hold: true, note: "★OOS 강화 (asset growth anomaly robust)"}
      size_orthogonal: {b_capex: -0.1851, t_capex: -3.78, b_size: -0.1288, t_size: -2.23, horizon: y_60d,
                        note: "★capex|Size t=-3.78 유의(독립). ★단 size 도 t=-2.23 유의 = 자동차 small-cap effect 공존(collinear 일부). multivariate(pbr+capex+size): capex t=-3.38 유지."}
      effective_n_label:   # ★[G-C remediation 2, 2026-06-05] 60d 중첩 자기상관 보정
        horizon: y_60d
        ar1: 0.426              # IC 시계열 AR(1) (60d 중첩 = 인접월 강상관)
        n_months: 82
        eff_n: 39.7            # effective-N (full autocorr) = n=82 의 약 절반 (eff_n_ar1=33.0)
        t_naive_iid: -3.61    # IID 가정 t (eff-N 미보정 = 과대)
        t_eff_corrected: -2.52   # ★effective-N 보정 t (full autocorr) = -2.45~-2.52 권역. ★여전히 유의(|t|>2)
        note: "★y_60d 중첩(AR1=0.426) → eff-N=39.7(n의 절반). naive t=-3.61 = 과대 → eff-N 보정 t=-2.45~-2.52. ★보정 후에도 유의(robust)지만 t 박제 시 eff-N 보정값 병기 의무. source=validation-neff-label-v3.json. (y_20d 는 AR1=0.087 낮음 → eff-N 보정 영향 미미, t_eff=-2.43)"
      fdr: {merged_family_survivor: true, note: "★통합 단일 FDR m=168 survivors=5 中 capex_ratio 3 cell 생존(garden-of-forking-paths 차단 후). ★단 survivors wc_p 전부 floor-censored(meta.floor_censored_caveat) = 생존 여부만, magnitude 비교 금지"}
      tier: structural_prior_high_confidence   # ★[G-C 2026-06-05] LOO 17종 전부 음 + PIT-safe + size 독립 3중 검증. ⛔validated alpha 단정은 보류(차기 vintage pristine OOS 후 승격)
      verdict: "PARTIAL CONFIRMED(tentative, OOS robust, tier=structural_prior_high_confidence) — ★자동차 진짜 신규 신호. asset growth anomaly(Cooper-Gulen-Schill 2008) prior 음 정합 + OOS 강화 + size 통제 후 독립(multivariate t=-3.38) + 통합 FDR 생존. ★effective-N 보정 t=-2.52(여전히 유의) + size 공존 + universe 17종 = magnitude hedge. ★validated alpha 단정 보류(차기 vintage pristine OOS 후)."
    - id: inv_ratio
      signal: "재고자산/총자산 (재고순환, 음 prior)"
      uncond: {y_20d: {ic_mean: -0.0342, wc_p: 0.2899}, y_60d: {ic_mean: -0.0512, wc_p: 0.1559}}
      walk_forward_oos: [{horizon: y_20d, is_ic: -0.0247, oos_ic: -0.045, sign_hold: true}, {horizon: y_60d, is_ic: 0.0093, oos_ic: -0.1213, sign_hold: false}]
      verdict: "TENTATIVE DIRECTIONAL — 부호 음(prior 정합) but 약/비유의. y_60d OOS flip. capex 대비 약."
    - id: ppe_yoy
      signal: "유형자산 yoy (CAPEX cycle, 음 prior)"
      uncond: {y_20d: {ic_mean: 0.0003, wc_p: 0.995}, y_60d: {ic_mean: -0.0174, wc_p: 0.6072}}
      verdict: "INSUFFICIENT — 비유의 + OOS flip. (level capex_ratio 가 yoy 보다 강 = stock 변수 우위)"
    - id: rnd_ratio
      signal: "무형자산/총자산 (R&D proxy, 양 prior)"
      uncond: {y_20d: {ic_mean: -0.0152, wc_p: 0.6697}}
      verdict: "INSUFFICIENT — 비유의 + prior(양)와 약하게 반대. OOS flip."
    - id: inv_yoy
      signal: "재고 yoy (음 prior)"
      verdict: "INSUFFICIENT — 비유의(IC +0.016~0.036, prior 음과 반대 방향)."

  # ── ★family_2 interaction (G-B 의무, rejected 박제 前) ──
  family_2_interaction:
    method: "pooled cross-sectional panel, month-clustered SE (measure_conditional.measure_interaction_terms)"
    dummy: "krw_regime=KRW_weak (y_20d)"
    results:
      - {signal: mom_6, b_main: -0.0485, t_main: -1.07, b_inter: 0.0458, t_inter: 0.67, verdict: "interaction 비유의"}
      - {signal: mom_12_1, b_main: -0.0530, t_main: -1.49, b_inter: 0.1231, t_inter: 2.18, verdict: "★interaction 유의(t=2.18) 부호 양 = KRW_weak서 momentum continuation"}
      - {signal: rev_1m, b_main: 0.0328, t_main: 0.84, b_inter: -0.0293, t_inter: -0.40, verdict: "interaction 비유의"}
      - {signal: vol_60, b_main: -0.0868, t_main: -1.81, b_inter: 0.2268, t_inter: 2.75, verdict: "★interaction 유의(t=2.75)"}
    note: >
      ★frame A-5 의무 충족(rejected 박제 前 family_2 검정). mom_12_1/vol_60 KRW_weak interaction 유의(t=2.18/2.75)
      = "국면 따라 부호 갈림" 입증. ★단 부호 양(+) = 반도체(KRW_weak서 reversal 음 증폭)와 반대 + ★해당 cell 들 OOS flip
      → interaction 유의해도 OOS 불안정 = 채택 보류(flip-register). 자동차 = 반도체와 conditional 패턴 다름(정직 박제).

# ── 블록3 WEIGHT_RULES — derive_weights 입력 (range, 점추정 금지) ──
weight_rule_candidates:
  - indicator_id: cs_pbr_z   # ★primary value (OOS robust, size 독립)
    base_weight_range: [-0.20, -0.08]   # 저PBR value premium 음 IC. ★universe 17종 magnitude hedge → posterior 권역(EB shrinkage).
    modulate_by: [archetype, regime, cycle_phase]
    direction: "저PBR z 상위(저평가) 종목 forward 양 = IC 음. y_60d Slowdown regime서 강(value 작동)."
    granularity: cross_sectional
    gate_status: {n: pass, se: pass, power: pass, fdr: pass, oos: pass}  # ★y_60d uncond+Slowdown = 통합 FDR 생존 + OOS robust
    source_ids: ["raw-v3/validation-conditional-v3.json:pbr_z", "raw-v3/validation-critique-v3.json:y_60d.pbr_plus_size"]
    hedge_note: >
      ★PBR value premium = OOS robust(y_60d IS-0.108/OOS-0.117) + size 통제 후 독립(t=-2.67). ★단 universe 17종 협소
      = point estimate magnitude 과대(small-universe). base_weight = 방향+breadth-adj 권역, 점추정 인용 금지. y_20d 는 약(t=-1.39).
