collector_plan_industry:
  - missing: "EV-EBITDA (cyclical primary_metric, 부채/현금 = DART BS) + 시점별 발행주식수(시총 PIT)"
    source: "DART fnlttSinglAcntAll(부채총계/현금성자산) + stockTotqySttus. 현 = FDR 현재주식수 근사."
    priority: high   # ★cyclical primary=ev_ebitda 미산출 = 핵심 gap (PBR/PER 만 §10)
    status: "PBR/PER cross-sectional = §10(DART 재구성). EV-EBITDA = 후속 high."
  - missing: "PIT universe 멤버십 (시점별 섹터 편입/편출 + delisted 종목)"
    source: "FDR KRX-DESC = 현재 스냅샷만. KRX PIT 섹터분류 인증 필요"
    priority: high   # 생존편향 (현 = 상장 시점 차이만, 17종 中 3종 부분이력)
