       source_id: "raw-v3/validation-cross-v3.json:common_factor_exposure.credit",
       note: "약 음 방향성 (t=-1.58 비유의). ★자동차 공통인자 노출 약 = idiosyncratic (반도체 credit 강 -0.190 과 대조)."}
    - {factor: oil, beta: -0.1660, beta_ci_95: [-0.3881, 0.056], contemporaneous: true, note: "약 음 (t=-1.47 비유의, 원가 oil 노출 약)"}
    - {factor: rate, beta: -0.0445, beta_ci_95: [-0.14, 0.0509], contemporaneous: true, note: "비유의"}
    - {factor: dollar, beta: -0.0837, beta_ci_95: [-1.538, 1.3706], contemporaneous: true, note: "비유의 (CI 넓음, 수출주 환율 약)"}
    - {factor: VIX, beta: -0.0013, beta_ci_95: [-0.0114, 0.0089], contemporaneous: true, note: "비유의"}
  directional_spillover: []   # §M.3: DY = supervisor 통합
  structural_linkage:
    - supplier_or_customer: global_auto_demand   # CARZ(글로벌 자동차)/SLX(철강 원가)
      io_weight: null
      lagged_return_signal: 0.220  # lag0 CARZ corr (contemporaneous 유의 p=0.043)
      p_value: 0.043               # lag0 (forward lag1-3 = 비유의)
      source_id: "raw-v3/validation-cross-v3.json:customer_supplier_momentum"
      verdict: >
        REJECTED as alpha — CARZ/SLX lag0(contemporaneous) 유의(+0.22/+0.23 p<0.05) but ★forward(lag1-3) 비유의(p>0.06).
        = 글로벌 자동차 수요 contemporaneous 동조 강하나 forward 예측 부재(§D falsifier 작동). 동조성분 RegimeGlasso Ω 흡수.
        ★반도체보다 contemporaneous corr 강(글로벌 cycle 동조) = cyclical 특성.
  # ⛔ sector-rotation business-cycle clock = 학술 myth(Molchanov 2024).

# ── ★valuation 횡단면 (§M.7 핵심 — DART 재구성, 2026-06-03 측정 완료) ──
valuation_cross_sectional:
  data_source: "raw-v3/validation-valuation-v3.json (DART 417 rows 2019~ + pykrx 가격)"
  mechanism_works: true   # PBR avgN 14 / PER 10. ★PBR value premium 강 / PER peak-EPS 무신호.
  pit_note: "재무 = rcept_dt(공시일) 이후만(lookahead 회피). ★현대차 2019 FY rcept 2022-02(정정공시 지연 outlier, PIT 자동처리)."
  cyclical_finding: >
    ★PER 횡단면 무신호(per 3M/6M/12M IC=0.003/0.004/-0.007) = peak-EPS trap(정점 EPS↑→PER↓ 왜곡)
    데이터 지지. PBR(자본 기반) value premium 방향 강 = archetype.py cyclical 'primary=P/B, trap=peak-EPS' 정합(magnitude n=14 hedge).
  indicators:
    - id: cs_pbr_z
      signal: "PBR cross-sectional z (저PBR=value, cyclical primary)"
      horizon_results:
        - {horizon: 3M, ic: -0.122, t_nw: -2.98, p: 0.004, n: 82, within: 0.88}
        - {horizon: 6M, ic: -0.165, t_nw: -2.56, p: 0.013, n: 79, within: 0.86}
        - {horizon: 12M, ic: -0.216, t_nw: -2.76, p: 0.007, n: 73, ci_block: [-0.336, -0.108], within: 0.71}
        - {horizon: 24M_value, ic: -0.463, t_nw: -17.59, p: 0.000, n: 61, within: 1.00, loo_robust: true}
      avg_universe_n: 14.3
      verdict: "★PBR value premium 방향 강(전 horizon 음, BY 4 생존, LOO 안정적 17종 [-0.537,-0.395], within 높음). ★단 magnitude(-0.46 t=-17.6) = n=14 협소 과대 = small-n hedge."
    - id: cs_per_z
      signal: "PER cross-sectional z (★peak-EPS trap 무신호)"
      horizon_results:
        - {horizon: 3M, ic: 0.003, t_nw: 0.06, within: 0.38}
        - {horizon: 12M, ic: -0.007, t_nw: -0.08, within: 0.57}
      verdict: "★INSUFFICIENT/무신호 — PER 횡단면 IC ≈ 0. cyclical peak-EPS trap 으로 PER 무효 = EV/EBITDA 대체 필요."
  multiple_testing: "8 테스트 BY factor 2.72. ★BY 4개 생존(pbr 24M/12M/6M/3M, per 전부 미생존). PER 무신호=peak-EPS. ★n=14 협소 magnitude hedge."
  verdict: >
    ★auto = cyclical valuation 진짜 신호. PBR value premium 방향 강(BY 4 생존, LOO 안정적, within 100%@24M) =
    ★가격 momentum 무효를 valuation 이 대체(kr-semi 예고 적중). ★PER = peak-EPS trap 무신호(IC≈0) =
    archetype.py cyclical 정의 데이터 지지. ★단 universe 17종 협소 → PBR magnitude 과대(small-universe).
    방향 신뢰/magnitude hedge. EV/EBITDA 대체 권고(collector_plan high).

# ── robustness_checks (측정 17종 통과 기록, 지표별) ──
robustness_checks:
  - indicator_id: cs_mom_6m_reversal_weak   # primary (약)
    leave_episode: null              # n 충분하나 약신호 (확인 후 박제)
    within_period: marginal          # 0.75 (경계)
    partial_corr_ratio: null         # 통합 RegimeGlasso 단계
    net_sharpe_ratio: null           # |IC| 0.064 ~ 16.5bps/월 = marginal, 비유의라 net 무의미
    forward_vs_contemp: "forward present (약 음 reversal, 비유의)"
    family_neutralized_ic: null
    eff_n_tier: Tentative            # n=80 months 이나 universe 17종 + 비유의 = Weak/Tentative 경계
    multiple_testing_gate: fail      # ★BY/Bonferroni 미생존 (raw_p 0.096)
    significance: insignificant      # ★CI 0 포함 = 비유의 (battery/반도체 와 결정적 차이)

# ── horizon_verdict (forward alpha falsifier) ──
horizon_verdict:
  best_horizon: "★[frame §M.12 primary 재배치] 3M/6M/12M (PBR value, eff_N 높음·NW 유의·BY 생존) = primary 근거. 24M_value = ★보조(eff_N≈2.5 degenerate, 방향만). 가격 momentum 무효, valuation 이 진짜 신호."
  forward_alpha_present: true        # ★PBR value premium forward alpha = present(가격 momentum 은 부재, valuation 방향으로 잠정)
  note: >
    ★자동차 가격 momentum/reversal = 전 horizon 비유의(BY 생존 0). ★단 valuation(PBR) value premium forward
    present 강(BY 4 생존, LOO 안정적) = 가격신호 무효를 valuation 이 대체(kr-semi 예고 적중). ★PER peak-EPS 무신호.
    cyclical archetype: PBR value + peak-EPS trap. universe 17종 협소 = PBR magnitude 과대 한계.

# ── net-cost (KR 비대칭) ──
net_cost:
  model: "spread/2 + commission + STT_sell(0.20%, 매도측만) — §M.4 비대칭"
  roundtrip_bps: 33.0
  monthly_cost_bps: 16.5
  note: "가격신호 비유의라 net Sharpe 무의미. valuation·regime 신호 측정 보강 후 재평가. sqrt impact = supervisor."

# ── Hard-fail 4 (B C D I) self-check ──
hard_fail_self_check:
  B_real_data: {status: PASS, note: "합성 0%. pykrx OHLCV 17종(1818일) + yfinance(CARZ/SLX/factors) + DART + FDR. raw-v3/*.py 재현."}
  C_traceability: {status: PASS, note: "모든 yaml 수치 = raw-v3/validation-metrics-v3.json + validation-cross-v3.json key 매핑. valuation = §10 DART 후."}
  D_pit:
    status: PASS
    note: >
      가격신호 = PIT-safe(forward shift). ★valuation 횡단면 = DART rcept_dt(공시일) 이후만 적용 = lookahead 회피
      (FY 보고지연 median 108-120일). 시총=Close×현재주식수(시점별 주식수 정밀화 = collector_plan high).
  I_survivor_bias:
    status: PARTIAL
    note: >
      universe = FDR 현재 스냅샷(생존 종목만). delisted/M&A 누락(쌍용차 법정관리→KG모빌리티 등 자동차 구조조정 多 = 생존편향 우려).
      상장 시점 차이 정량화(17종 中 3종 부분이력). PIT 멤버십 = collector_plan high. ★화이트리스트 = 현재 스냅샷 큐레이션.

# ── verdict (small-n rule) ──
