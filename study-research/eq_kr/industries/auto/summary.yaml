verdict_note: >
  산업 전체 = PARTIAL. ★핵심 발견 = 자동차 가격 momentum/reversal 신호 = 약 음(reversal 방향, 반도체 동부호)이나 ★전부 비유의
  (BY 생존 0, universe 17종 작음) = 가격신호 무효. customer momentum = 글로벌 자동차 수요 contemporaneous 동조 강(반도체보다)
  but forward 부재 REJECTED. ★3산업 비교(battery 양 momentum CONFIRMED / 반도체 음 reversal PARTIAL / 자동차 음 reversal 비유의)
