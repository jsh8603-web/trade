# summary.yaml — auto(자동차) 산업 v3 (frame v3 §M exposure card 계약)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge 어휘, BY 보정, LOO/block-boot).
# 산출 범위 = §M.7 exposure card (측정 전용). battery/반도체 summary.yaml 미러.
# raw 재현: raw-v3/{collect, measure, measure_cross, exposure_card, collect_dart, measure_valuation}.py

industry: kr_auto             # eq_kr 12산업 中 Tier 2 (자동차)
asset_scope: [equity.kr]
archetype: cyclical           # 경기민감 (완성차/부품/타이어, 글로벌 자동차 수요 사이클)
archetype_attestation:
  valid_from: "2019-01-01"    # ★PIT 사전선언 (§M.5 ex-post 금지). cyclical = 자동차 판매 사이클
  declared_at: "2026-06-03"   # 선언 시점 (사후편향 hazard 방지 attestation)
  primary_metric: ev_ebitda   # cyclical primary (peak-EPS trap — 사이클 정점 EPS 高→PER 低 value trap)
  secondary: null
  basis: >
    자동차 판매/생산 capex 사이클 1차 가설. ★실측 검증: 가격 momentum forward IC = 약 음(reversal 방향, 반도체와 동부호)
    이나 ★전부 비유의(universe 17종 작음). customer momentum = 글로벌 자동차 수요(CARZ) contemporaneous 동조(lag0 유의)
    but forward 부재 = cyclical 동조 패턴 지지. → cyclical 지지(가격신호 약, valuation 우위 예상).
as_of: "2026-05-31"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    자동차 = cyclical. "싸다" = EV/EBITDA·P/B (★peak-EPS 함정: 사이클 정점 EPS 高 → PER 낮아 보임 = value trap).
    primary_metric=ev_ebitda. ★실측 결론: 가격기반 cross-sectional momentum = 약 음(reversal 방향)·비유의 →
    자동차는 가격 신호보다 valuation 횡단면(§10, DART)이 우위일 것(cyclical value, 완성차/부품 멀티플 분산).
  cycle_reading: >
    2019-2026 = COVID 공급망(2020-21 반도체 부족)→수요 회복(2022-23)→전동화 전환(2024-26). 글로벌 자동차 수요(CARZ)
    contemporaneous 동조 강(lag0 corr +0.22 유의). 단 forward 예측 부재. 현대차/기아 시총 압도(universe 17종 中 cap 70%+).
  estimation_note: >
    2026-05 시점: universe 17종(시총≥3000억 ∧ ADV≥30억, ★이름 화이트리스트=완성차3+부품12+타이어2, 조선/해운/보험/2차전지 배제).
    avg N 15종(battery 26·반도체 73 대비 작음). 가격신호 약 = momentum 비유의 → valuation·regime-conditional 우위 가능. 본 산출 = 측정+peer-relative z card.

# ── 블록2 INDICATORS (forward 횡단면 Rank-IC, horizon-tagged) ──
# ★점추정 금지: ic_mean + ic_ci_95(block-boot ∧ NW) + n_effective + oos(CPCV)
# ★자동차 = 가격신호 약·비유의 → indicators_passed 에 TENTATIVE 만 (BY 생존 0)
indicators_passed:
  # ★primary = cs_pbr_z_24m (valuation = 자동차 진짜 신호, momentum 무효 대체). 2026-06-03 측정.
  - id: cs_pbr_z_24m
    layer: 1                  # valuation (DART 펀더멘털)
    family: value
    horizon: 24M_value        # ★cyclical primary = PBR (PER 은 peak-EPS 무효)
    ic_mean: -0.463           # 저PBR value premium 강. ★단 n=14 협소 magnitude 과대.
    magnitude_haircut: "★[frame §M.12] n=14<20 cross-sectional Spearman = 협소 artifact. 50-70% haircut(EB/James-Stein shrinkage): 점추정 ρ=-0.463 → posterior -0.12~-0.20 권역. ⛔ -0.46 literal 인용 금지. breadth-adjusted IR = IC·√(breadth 14 × eff_indep_N 2.5) → 보수 = supervisor collector_plan."
    ic_ci_95: [-0.336, -0.108]  # block-boot(12M). 0 배제. magnitude 신뢰 X(small-universe).
    t_nw: -17.59              # ★허수 경계 — n=14 극단화 (haircut 후 posterior -0.12~-0.20)
    n_effective: 61
    avg_universe_n: 14.3
    oos_ratio: 1.00
    loo_robust: true          # ★LOO 17종 제외 IC [-0.537,-0.395] 전부 음
    within_period: 1.00
    source_id: "raw-v3/validation-valuation-v3.json:indicators.pbr_z__24M_value"
    notes: |
      저PBR cross-sectional z → 24M forward. ★자동차 진짜 신호(가격 momentum 무효 대체). value premium
      방향 안정적(LOO 17종 전부 음, within 100%, BY 생존). ★magnitude(-0.46 t=-17.6) = n=14 협소 과대 = hedge.
      ★PBR 만 작동(PER peak-EPS 무신호) = cyclical archetype 정합.
      ★★[frame §M.12 정정] 24M overlap eff_indep_N = 61/24 ≈ 2.5 = degenerate. t=-17.6 = small-universe(17종)
      × 24M overlap **이중 inflation**(역설: t 최대=증거 최약). ⛔ magnitude+significance 둘 다 보류, ★방향만.
      primary 증거 = 3M/6M/12M(eff_N 높음), 24M_value = 보조(degenerate).
      ★peak-EPS 메커니즘 정정: 1차 원인 = earnings cycle 진폭(흑자도 정점 EPS↑→저PER trap), 적자 = 2차 증폭.
      ⛔시총 인과 귀속 금지(시총은 earnings 안정성 proxy일 뿐). PER → E/P(earnings yield) 대체 권고.
  - id: cs_mom_6m_reversal_weak
    layer: 3                  # 가격 cycle proxy (cross-sectional 모멘텀 → 약 reversal). ★비유의 = 보조.
    family: momentum          # 부호 음(reversal 방향, 반도체 동부호) 단 비유의
    horizon: 3M               # 가장 강(그래도 약): mom_6 → 3M forward
    ic_mean: -0.064
    ic_ci_95: [-0.141, 0.005]  # block-bootstrap. NW CI [-0.138, 0.010]. ★0 포함 = 비유의.
    ic_se_nw: 0.0379
    t_nw: -1.69
    n_effective: 80           # months
    oos_ratio: 0.87           # CPCV OOS hit=0.87 (부호 약 일관)
    avg_universe_n: 14.9
    source_id: "raw-v3/validation-metrics-v3.json:indicators.mom_6__3M"
    notes: |
      cross-sectional 6M 모멘텀 z → 3M forward = 약 음(reversal 방향, 반도체 동부호). ★p_NW=0.096 비유의.
      within-period 0.75. cap-weighted -0.083 (대형주 reversal 방향, 동일가중 -0.064 보다 강) = 반도체 cyclical 패턴 유사.
      ★BY 보정(16 테스트) raw_p_min=0.096 → 생존 0. ★전 16 신호 비유의 = 자동차 가격신호 무효 = TENTATIVE DIRECTIONAL.
  - id: cs_mom_6m_reversal_6m
    layer: 3
    family: momentum
    horizon: 6M_mom
    ic_mean: -0.062
    ic_ci_95: [-0.156, 0.019]  # block-boot 0 포함
    ic_se_nw: 0.0528
    t_nw: -1.18
    n_effective: 77
    oos_ratio: 0.73
    avg_universe_n: 14.9
    source_id: "raw-v3/validation-metrics-v3.json:indicators.mom_6__6M_mom"
    notes: "6M 모멘텀 → 6M forward reversal 방향. within 0.57. cap-weighted -0.124(대형주 reversal 강). BY 미생존, 비유의. TENTATIVE."

# ── 블록3 RELATIONSHIPS (partial-corr) — RegimeGlasso 통합 단계 입력 ──
relationships_passed:
  - {node_a: cs_mom_6m_reversal_weak, node_b: auto_fwd_3m, lag_months: 0, corr: -0.064,
     corr_ci_95: [-0.141, 0.005], conditioning_set: [], n: 80,
     source_id: "raw-v3/validation-metrics-v3.json:indicators.mom_6__3M",
     note: "본 corr = cross-sectional IC(unconditional, 약 음 reversal, 비유의). partial-corr = 통합 RegimeGlasso 단계."}

# ── 블록4 WEIGHT_RULES — derive_weights(w∝Θ_signal·IC) 입력 (range, 점추정 금지) ──
weight_rule_candidates:
  - indicator_id: cs_mom_6m_reversal_weak
    base_weight_range: [-0.08, 0.0]   # ★약 음 IC·비유의 → weight 거의 0 (방향성만, 신호 약). CI 0 포함.
    modulate_by: [archetype, regime, cycle_phase]
    direction: "cross-sectional 6M 모멘텀 z 상위(많이 오른) 종목 약 underweight (reversal 방향). 단 비유의 = 거의 중립."
    granularity: cross_sectional
    gate_status: {n: pass, se: marginal, power: weak, fdr: fail, oos: pass}  # ★SE marginal + power weak + FDR fail
    source_ids: ["raw-v3/validation-metrics-v3.json:indicators.mom_6__3M"]
    hedge_note: >
      n=80 months 이나 universe 17종 작음. CI [-0.141, 0.005] 0 포함 = 비유의. ★가격 momentum 은 자동차에서 거의 무효 →
      supervisor 가 weight ~0 처리 + valuation(§10)·regime-conditional 신호로 대체 권장.

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 (비우면 결선 dead) ──
confidence_hooks:
  # ★primary hook = valuation (자동차 진짜 신호). FHC wire 연결.
  - hypothesis_id: auto_pbr_value_premium
    affects_indicator: cs_pbr_z_24m   # ★★필수 — primary indicator
    affects_edge: [cs_pbr_z_24m, auto_fwd_24m]
    confirm_signal: "live 저PBR z 상위 종목 forward rank IC < 0 유지 (value, rolling 24M)"
    reject_signal: "PBR value premium IC e-CUSUM 부호 반전/소멸"
    emit_where: "panel-score-IC 축"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 → PBR base_weight 변동 (★PER 제외 peak-EPS)"
    action_threshold: "e-value > 20 → retract. ★n=14 협소 안정성 모니터 강화."
  - hypothesis_id: auto_cs_momentum_weak_reversal
    affects_indicator: cs_mom_6m_reversal_weak  # ★보조 — momentum 비유의 (weight ~0)
    affects_edge: [cs_mom_6m_reversal_weak, auto_fwd_3m]
    confirm_signal: "live 횡단면 6M 모멘텀 z → 3M forward rank IC 음 유지 + 유의화(t<-2) 시 reversal 신호 강화 (rolling 12M)"
    reject_signal: "Rank-IC e-CUSUM 부호 양 전환 누적 K=3 month (reversal 소멸/momentum 전환)"
    emit_where: "panel-score-IC 축 (backtest SELL 아님)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 → 가격신호 weight 변동 (현 ~0, 유의화 시 음 강화)"
    action_threshold: "e-value > 1/alpha=20 → retract / 회복 = score_ic_recovery_eprocess"

