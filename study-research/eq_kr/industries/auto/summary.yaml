  cs_pbr_z_24m: "★PARTIAL→hedge (자동차 진짜 신호) — PBR value premium 방향 안정적(LOO 17종, within 100%). ★단 24M eff_N≈2.5 degenerate + n=14 협소 = magnitude+significance 둘 다 inflation(t=-17.6 허수). ★방향만, 단정 불가. 가격 momentum 무효 대체."
  cs_per_z: "★PER 무신호(IC≈0) — ★peak-EPS trap = earnings cycle 진폭(흑자도 정점 EPS↑→저PER 왜곡), ⛔시총 인과 금지. E/P 대체 권고. 미국 us_cyclical PER○ = consistent-with(시장·시총 의존, 재측정 아님)."
