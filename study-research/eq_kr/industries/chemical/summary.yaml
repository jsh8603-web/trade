# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: "석유화학 = cyclical 장치산업. 에틸렌-납사 spread/유가/중국 cycle이 산업 timing 결정. 종목 selection은 저변동(vol)·역모멘텀(reversal)·저PER value가 forward 예측. ★capex anomaly는 화학 REJECTED — 종목별 capex 분산은 존재(cross-sectional CV 0.241, 범위 0.236~0.617)하나 forward 예측력 부재(panel n_obs=1312 powered인데 IC≈0 = 측정 못함 아니라 예측력 없음). auto/steel(분산+예측력 유효, within=0.96)과 대비."
  cycle_reading: "cyclical 정점→둔화 국면(Slowdown)에서 저변동·역모멘텀 강세. 중국 자급률 상승 구조적 역풍. 2024-25 공급과잉 down-cycle."
  estimation_note: "2026-05 현 시점 = 중국 증설 공급과잉 지속 down-cycle 추정 (theory-notes §3). PBR 역사적 밴드 하단. 단 측정은 cross-sectional selection만, cycle timing은 regime 변수."

