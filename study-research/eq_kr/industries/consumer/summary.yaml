# summary.yaml — consumer(소비재) 산업 v3 (frame v3 §M exposure card 계약)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge, BY/FDR, LOO/block-boot).
# ★[2026-06-05 S2 갱신] conditional IC surface + ★A-4 sub-sector 부호 CANCEL(화장품 cyclical vs 음식료 defensive) +
#   G-G v2 tradeable 2축 + walk-forward OOS 추가. verdict = PARTIAL (화장품 per_z TENTATIVE + A-4 분리 트리거 + dollar risk-monitor).
# raw 재현: raw-v3/{collect, collect_dart, collect_regime, measure_conditional, measure_valuation, measure_cross}.py

industry: kr_consumer         # eq_kr Tier 3 (소비재: 식품/유통/화장품/음료/의류)
asset_scope: [equity.kr]
archetype: asset_stable       # archetype.py: 방어·배당, per primary (1차 가설)
archetype_attestation:
  valid_from: "2019-01-01"    # ★PIT 사전선언
  declared_at: "2026-06-03"
  primary_metric: per         # asset_stable primary = PER·배당수익률 (trap=금리쇼크·규제)
  secondary: cyclical         # soft: 경기소비재(유통/의류) cyclical 성분 (prob~0.3)
  basis: >
    asset_stable = 방어·배당. ★검증: momentum 무신호(asset_stable 정합) + valuation(per) 방향 일관
    (전 horizon value premium 음, within 100%, 24M block-boot 유의) → asset_stable value 지지.
as_of: "2026-05-31"

# ── 블록1 LENS ──
lens:
  pricing_principle: >
    소비재 = asset_stable. "싸다" = PER·배당수익률 (trap=금리쇼크·규제). ★실측: momentum 무신호
    (방어주 = 모멘텀 안 먹힘) + valuation(PER/PBR) value premium 방향 일관(저밸류→고forward).
    = ★valuation 방향 약 prior 산업, TENTATIVE (battery momentum / financial regime-conditional 과 분기).
  cycle_reading: >
    소비재 cycle = 내수·소비심리·환율(수입원가). dollar β=-1.19(t=-2.57 유의) = 원화 약세 시 약세
    (수입원가↑/내수위축). 방어 성격이나 환율 노출 = pure asset_stable 보다 경기소비재 성분.
  estimation_note: >
    2026-05: universe 28종(retail10/food9/cosmetics4/apparel3/beverage2). ★valuation(per) =
    primary 신호 (방향 일관, borderline 유의). derive_weights w∝Θ_signal·IC 에서 valuation 비중↑.

# ── 블록2 INDICATORS (forward 횡단면 Rank-IC) ──
# ★consumer = valuation 우세 (momentum 무신호). per_z = primary.
indicators_passed:
  - id: cs_per_z_24m
    layer: 1                  # valuation (DART 펀더멘털)
    family: value
    horizon: 24M_value        # ★value 3-5Y 장기(§M.2)
    ic_mean: -0.141           # 음 = 저PER value premium (싼 종목 forward 높음)
    ic_ci_95: [-0.245, -0.041]  # block-bootstrap, ★0 배제 (block-boot 기준 유의)
    ic_se_nw: null            # NW t=-1.39 (보수, 24M overlap autocorr) = NW 기준 비유의
    t_nw: -1.39
    n_effective: 61
    oos_ratio: 0.80           # CPCV OOS hit
    avg_universe_n: 20.4
    source_id: "raw-v3/validation-valuation-v3.json:indicators.per_z__24M_value"
    notes: |
      저PER cross-sectional z → 24M forward. value premium 방향(음). block-boot CI 0 배제(유의) but
      NW 비유의(24M overlap 보수). ★전 horizon(3M/6M/12M/24M) 부호 일관 음 = value premium 방향 일관.
      PBR 24M 도 동일 방향(CI_block [-0.124,-0.001] 0 배제).
      ★★[frame §M.12 정정] 24M overlap eff_indep_N = 61/24 ≈ 2.5 = degenerate → ★primary 증거 = cs_per_z_3m
      (within 100%, n=82, eff_N≈27), 24M_value = 보조. block-boot 0배제도 eff_N 2.5 = 단정 불가, ★방향 일관성만 신뢰.
  - id: cs_per_z_3m
    layer: 1
    family: value
    horizon: 3M
    ic_mean: -0.077
    ic_ci_95: [-0.153, 0.001]   # block-boot, 상단 0 근접 (borderline)
    t_nw: -1.89               # p=0.062 (borderline 유의)
    n_effective: 82           # ★n 충분 (battery/financial 대비)
    avg_universe_n: 20.9
    within_period: 1.0        # ★연도별 부호 일관 100%
    source_id: "raw-v3/validation-valuation-v3.json:indicators.per_z__3M"
    notes: "저PER → 3M forward. within-period 100%, n=82, p=0.062 borderline. value premium 단기도 일관."

# ── 블록3 RELATIONSHIPS ──
relationships_passed:
  - {node_a: cs_per_z_24m, node_b: consumer_fwd_24m, lag_months: 0, corr: -0.141,
     corr_ci_95: [-0.245, -0.041], conditioning_set: [], n: 61,
     source_id: "raw-v3/validation-valuation-v3.json:indicators.per_z__24M_value",
     note: "block-boot 유의(NW 보수 비유의). partial-corr = 통합 RegimeGlasso."}

# ── 블록4 WEIGHT_RULES — valuation 동적가중 ──
weight_rule_candidates:
  - indicator_id: cs_per_z_24m
    base_weight_range: [0.04, 0.12]   # IC -0.141 (방향=저PER overweight) 점추정 금지 range
    modulate_by: [archetype, regime, cycle_phase]
    direction: "cross-sectional 저PER z 상위(싼) 종목 overweight (value). long-only-implementable. 부호=싼것 매수."
    granularity: cross_sectional
    gate_status: {n: pass, se: borderline, power: weak, fdr: marginal, oos: pass}  # block-boot 유의/NW 비유의
    source_ids: ["raw-v3/validation-valuation-v3.json:indicators.per_z__24M_value"]
    hedge_note: "★value premium 방향 일관(전 horizon 음 + within 100%) but borderline 유의(NW 보수). ★TENTATIVE (비-degen 유의 horizon 0 + BY 미생존, §M.12). 점추정 박제 금지·약 prior."

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 ──
confidence_hooks:
  - hypothesis_id: consumer_value_premium
    affects_indicator: cs_per_z_24m   # ★필수
    affects_edge: [cs_per_z_24m, consumer_fwd_24m]
    confirm_signal: "live 저PER z 상위 종목 forward rank IC < 0 유지 (저밸류→고forward, rolling 24M)"
    reject_signal: "value premium IC e-CUSUM 부호 반전/소멸 (저PER 효과 무효)"
    emit_where: "panel-score-IC 축"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 → valuation base_weight 변동 (regime conditional)"
    action_threshold: "e-value > 20 → retract / 회복 = score_ic_recovery_eprocess"

# ── 블록6 COLLECTOR_PLAN ──
collector_plan_industry:
  - missing: "시점별 발행주식수 (시총 PIT 정밀화) + EV-EBITDA + 배당수익률(asset_stable primary 보완)"
    source: "DART stockTotqySttus + 배당 공시. 현 = FDR 현재주식수 근사"
    priority: medium  # valuation 횡단면 = DART 707 rows 충분(2019~). 잔여 = 주식수 PIT + 배당.
  - missing: "PIT universe 멤버십 (delisted/M&A)"
    source: "FDR 현재 스냅샷만. KRX PIT 섹터분류 인증"
    priority: high
  - missing: "소비심리지수(CCSI) + 소매판매액 (산업 cycle 지표)"
    source: "한국은행 ECOS + 통계청 KOSIS"
    priority: medium

