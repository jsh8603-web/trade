  cs_per_z_24m: "★TENTATIVE (value premium 핵심, ★PARTIAL-TENTATIVE→TENTATIVE) — IC -0.141, block-boot CI [-0.245,-0.041] 0배제(유의)이나 ★24M eff_N≈2.5 degenerate. NW 보수 비유의(p=0.17). 비-degen 재독: 3M p0.062 borderline / 6M p0.23 / 12M p0.46 비유의 = 유의 horizon 0, BY 생존 0. asset_stable primary 방향 약 prior(단정 불가)."
  cs_per_z_3m: "borderline (IC -0.077 p=0.062, within 100% n=82). value premium 단기 일관."
  cs_pbr_z: "TENTATIVE (저PBR value 방향, per 보다 약)"
  momentum: "비유의 (BY 0, raw_p_min=0.31). ★asset_stable = 모멘텀 무신호 정합 (battery CONFIRMED 대조)."
  common_factor: "★dollar β 유의(t=-2.57, 원화 약세→약세). battery=credit/oil, financial=무, consumer=dollar 분기."
verdict_note: >
  ★consumer = valuation 방향 약 prior 산업 (supervisor 가설 부분 지지, ★단 TENTATIVE). DART 표준계정 2019~ 완전(financial 2023~ 제약 대조)
  → valuation 측정 안정적. per_z value premium 방향 일관(전 horizon 음, 3M within 100%, 24M block-boot 유의 degen). ★단 비-degen 유의 horizon 0 + BY 생존 0 = 단정 불가.
  momentum 무신호 = asset_stable 정합. ★3산업 분기: battery(momentum CONFIRMED)·financial(regime-conditional TENTATIVE)·
  consumer(valuation TENTATIVE) = "산업마다 유효 신호 다름" 데이터 지지 = 동적가중(regime/산업 conditional IC) 정당화.

