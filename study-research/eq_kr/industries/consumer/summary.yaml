  mechanism_works: true   # PBR avgN 26 / PER 20. coverage PBR 2268 / PER 1793 cells (financial 933 대비 풍부 = 표준계정 완전성)
  data_advantage: "★DART 표준계정 2019~ 완전(financial 2023~ 제약 대조). KT&G 2019 Q1부터 = 표준계정 산업의 valuation 측정 가능성 지지."
  pit_note: "재무 = rcept_dt 공시일 이후만. FY 보고지연 median ~85일."
  indicators:
    - id: cs_per_z
      signal: "PER cross-sectional z (저PER=value, asset_stable primary)"
      horizon_results:
        - {horizon: 3M, ic: -0.077, t_nw: -1.89, p: 0.062, n: 82, within: 1.00, verdict: "borderline 유의, within 100%"}
