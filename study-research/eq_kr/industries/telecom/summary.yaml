    status: PARTIAL
    note: "universe = FDR 현재 스냅샷. 통신 = 합병 잦음(LG텔레콤/데이콤 등 과거 통합). 14종 中 1종 부분 이력. ★universe 협소 자체가 더 큰 제약. PIT 멤버십 = collector_plan."

# ── verdict (small-n rule) ── ★value premium 강 but universe 협소
verdict_label: PARTIAL   # ★value premium 방향 강(안정적) but magnitude 과대(n=13) = PARTIAL (CONFIRMED 격하)
verdict_detail:
  primary_evidence: "★[frame §M.12] primary 증거 = 3M/6M/12M(eff_indep_N 높음). 24M_value = ★보조(eff_N≈2.5 degenerate). telecom = ★t −12 = small-universe × 24M overlap 이중 inflation = 방향만 신뢰."
  cs_pbr_z_24m: "★PARTIAL→hedge — value premium 방향 강(LOO 안정적 14종, within 100%). ★단 24M eff_N≈2.5 degenerate + n=13 협소 = magnitude+significance 둘 다 inflation(t=-12 허수). ★방향만, 단정 불가."
  cs_per_z_12m: "value premium 방향 (avgN 10.7 협소, 12M eff_N≈5). magnitude hedge."
  momentum: "비유의 (BY 0). asset_stable = 모멘텀 무신호 정합 (consumer/battery 대조)."
  service_sub_only: "★INSUFFICIENT (통신서비스 3종 = cross-sectional 불가). 시계열 분석 대안 필요."
  common_factor: "전부 비유의 (n 협소로 β 추정 불안정)."
verdict_note: >
  ★telecom = asset_stable value 산업 (consumer 재현·강화). PBR/PER value premium 방향 강(BY 6 생존, LOO
  안정적, within 100%). ★단 universe 14종(service 3 + equipment 11) 협소 → IC magnitude 과대평가(small-universe
  Spearman 극단화). 방향 신뢰/magnitude small-n hedge. service sub 단독 = INSUFFICIENT(n=3). ★consumer 와 동일
  archetype(asset_stable) valuation 유효 재현 = 동적가중 분기 강화. ★universe 협소 = 양식의 경계 케이스 시사
  (cross-sectional 최소 종목 수 ~13 = magnitude 신뢰 하한). = 6산업 batch 시 협소 산업 magnitude hedge 의무.
