# summary.yaml — telecom(통신) 산업 v3 conditional (frame v3 §M + dispatch conditional IC surface)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge 어휘, BY 보정, LOO/block-boot, n<30 hedge).
# ★★CRITICAL 분석 unit 분리(frame §1.6): 통신 = 2 archetype 혼재.
#   (A) 통신서비스 3사 과점 → cross-sectional INSUFFICIENT → frame M2 시계열(배당주 금리 duration).
#   (B) 통신장비 10종 → cross-sectional 가능(cyclical). ★service 와 pool 금지(★측정축 차이[service 시계열 vs 장비 cross-sectional] + archetype driver 본질차[bond-proxy vs cyclical], 부호 cancel 아님).
# ★6/3 옛 v3(archetype=asset_stable, service3+equipment11 한 풀 n=13 cross-sectional, IC -0.542) = ★24M overlap horizon artifact(eff_N≈2.5 degenerate)지 PBR 부호 cancel 아님(pool/장비/service PBR 60d 셋 다 음 -0.16~-0.20). 분리 근거 = 측정축·driver 본질차. → 본 재작업 정정.
# raw 재현: raw-v3/{collect_telecom_cycle, measure_telecom, measure_robustness}.py
#   → validation-telecom-v3.json + validation-robustness-v3.json
# regime 데이터 = data/regime_*.parquet (refining서 복사, 시장공통 FRED CLI/DEXKOUS + ECOS 외국인순매수)

industry: kr_telecom           # eq_kr 12산업 中 Tier 3 (통신: 서비스 3사 defensive + 장비 cyclical)
asset_scope: [equity.kr]
archetype: asset_stable        # ★통신서비스 1차(defensive 배당·금리민감 bond-proxy). 장비 sub = cyclical
archetype_attestation:
  valid_from: "2019-01-01"     # ★PIT 사전선언 (§M.5 ex-post 금지). asset_stable = defensive 고배당 bond-proxy
  declared_at: "2026-06-05"    # 선언 시점 (사후편향 hazard 방지 attestation)
  primary_metric: dividend_yield  # asset_stable primary (배당수익률·PER). 단 배당 line 미수집 → 금리 duration 직접
  secondary: cyclical          # ★soft: 통신장비(equipment) sub = 5G capex cyclical (value/momentum)
  basis: >
    ★실측 결론(2026-06-05): (A) 통신서비스 3사 과점 = cross-sectional INSUFFICIENT(정유 2종 패턴 동형) →
    시계열 금리 duration 측정 = ★INCONCLUSIVE/약(부호 prior 위배 + episode-poor single cycle + level I(1)).
    (B) 통신장비 10종 cross-sectional = 저PBR value premium raw BY 생존 ★but size confound 68% = TENTATIVE.
    momentum 무신호, per underpowered. asset_stable = 배당주 duration 가설 표본서 미확인.
as_of: "2026-05-29"

# ★★ data-gate 선언 (B/C/D self-check 前 최우선 박제) ──────────────────────
data_gate:
  status: "분리 — service cross-sectional 불가(3종) / equipment 가능(10종) / ARPU·5G data-gate"
  service_floor_pass_strict: 3   # 시총3000억∧ADV30억 = SKT017670 + KT030200 + LGU032640
  service_total: "전기 통신업 = 다수이나 microcap 다수, strict 통과 3종(3사 과점)"
  equipment_floor_pass_strict: 10  # 한화비전489790/RFHIC218410/케이엠더블유032500/인텔리안189300/쏠리드050890 등
  service_cross_sectional_verdict: "★INSUFFICIENT — Spearman IC min 8종 필요, 통신서비스 3사 과점. → frame M2 시계열."
  equipment_cross_sectional_verdict: "가능(10종) — cyclical archetype. ★service(defensive)와 별도 측정(frame §1.6)."
  arpu_5g_data_gate: "★ARPU/5G 가입자 = MSIT/통계청 월별 공시, 무료 clean time-series API 부재 = 미측정(이연 아님=데이터 부재)."
  dividend_data_gate: "배당수익률 = DART dart_financials(equity/net_income/assets) 배당 line 미수집 → KR10Y 금리 민감도로 duration 직접 측정."
  scope_boundary: "통신장비 = 본 telecom scope(통신 cycle 종속). AI tech(SI/SW)·반도체장비는 별 teammate scope."

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    통신 = asset_stable/defensive(서비스 3사) + cyclical(장비 10종) 혼재. "싸다" = 배당수익률·PER(서비스) / PBR(장비).
    ★실측 핵심: (A) 통신서비스 = 배당주 bond-proxy duration 가설(금리↑→통신 forward 음) = ★표본서 미확인
    (전 horizon 비유의 + 부호 prior와 반대 + level I(1) + episode-poor). (B) 통신장비 저PBR value premium 방향 강
    (BY 생존, LOO robust) ★but size confound 68%(저PBR↔소형 +0.55) = 사실상 소형주 효과 = TENTATIVE.
  cycle_reading: >
    2019-2026 = 저금리(2020 KR10Y 1.37%)→급격 인상(2022 4.27%)→고착(2026 3.74%). ★single rate cycle = duration
    episode-poor. regime(시장공통): Macro[Slowdown/Recovery/Reflation/Overheat] × KRW[neutral/weak/strong] × flow.
    통신서비스 금리 민감도 = reflation/금리상승 국면서 오히려 양(+, bond-proxy 약화 가능성, underpowered).
  estimation_note: >
    2026-05 시점: 통신서비스 3사(SKT/KT/LGU+) = cross-sectional 불가 = 종목선택 신호 측정 불능. 금리 duration
    시계열 = INCONCLUSIVE(약). 통신장비 10종 = 저PBR value(raw -0.167 BY 생존) but size-neutral -0.05 marginal.
    ★breadth: service 3종(정유 2종 다음 최협소) + equipment 10종 소형 KOSDAQ. 매매 alpha 누적 = 구조적 제한.

# ── ★블록2 측정 결과 (2 archetype 분리) ──
# ★점추정 금지: rho/IC + wild_cluster_p + n + n_eff + eff-N 보정 t + walk-forward OOS + size-neutral.
conditional_ic_surface:
  source: "raw-v3/validation-telecom-v3.json + validation-robustness-v3.json"
  meta:
    measurement_unit: "★2 archetype: (A) service 패널 시계열(3사 동일가중) / (B) equipment cross-sectional(10종)."
    horizons: "5d/20d/60d + contemporaneous + forward 1M/3M (frame §D falsifier: 동시 vs 예측)"
    regime_axes: "Macro 4 × KRW 3 × flow 3 (시장공통 regime_labels) + rate Δ split"
    calibration: "★small n(service n_months 88 / equipment avgN 9.2) + overlap autocorr → eff-N 보정 t + wild-cluster(Rademacher B=2000) + block-boot CI"
    fdr_single_family: "★단일 BY family m=24. survivors=[eqp_y_60d_pbr_z] 1개(raw_p_min=0.0005). service 신호 = BY 미생존 = 배당주 duration 약 정직."

  # ── (A) 통신서비스 시계열 (frame M2, 배당주 duration) ──
  service_timeseries:
    - id: kr_rate10y_duration
      family: rate_duration
      unit: "service 3사 동일가중 패널 (cross-sectional 아님, 3사 과점)"
      prior: "음(-, 배당주 bond-proxy duration: 금리↑→디레이팅)"
      contemporaneous: {kr10y_delta_rho: 0.073, wc_p: 0.4733, t_eff: 0.68, n: 88, note: "★비유의 + 부호 prior(음)와 반대(양)"}
      forward:
        fwd_1m_level: {rho: 0.061, wc_p: 0.5847, t_eff: 0.57, note: "비유의"}
        fwd_3m_level: {rho: 0.007, wc_p: 0.9445, t_eff: 0.03, n: 86, note: "≈0"}
        fwd_1m_delta: {rho: 0.182, wc_p: 0.0655, t_eff: 1.62, note: "marginal 양(★duration 음 prior와 반대)"}
      horizon_sweep:
        y_5d: {rho: -0.025, wc_p: 0.8696, note: "비유의"}
        y_20d: {rho: -0.239, wc_p: 0.1009, t_eff: -1.72, note: "★유일하게 음(duration 방향) marginal"}
        y_60d: {rho: 0.057, wc_p: 0.6892, note: "양 비유의"}
      walk_forward_oos: {is_rho: -0.324, oos_rho: -0.117, sign_hold: true, full_rho: 0.007, note: "★IS/OOS 음(sign_hold) but full≈0 = episode-driven 불안정"}
      leave_episode: {leave_covid_hike_rho: 0.170, full_rho: 0.007, note: "★2020저금리+2022인상 제외 시 +0.17 역전 = episode 의존"}
      adf: {kr_rate10y_level: "I(1) p=0.808 비정상", d_kr_rate10y: "I(0) p<<0.001", service_fwd3_ret: "I(0) p=0.40", note: "★level I(1) → level-on-level spurious 위험"}
      unit_check: {level_fwd3_rho: 0.007, d_fwd3_rho: 0.114, note: "★level(I1)·Δ 둘 다 duration 음 prior와 반대 부호"}
      rate_regime_split: {up_rho: -0.125, up_n: 37, down_rho: -0.092, down_n: 26, note: "금리상승/하락기 둘 다 약 음(duration 방향)이나 n 작고 비유의"}
      family_2_interaction: {dummy: "macro=Slowdown", b_inter: 0.019, t_inter: 0.99, note: "비유의 (A-5 충족: interaction 테스트했으나 미생존)"}
      regime_conditional: {reflation_rho: 0.503, reflation_wc_p: 0.0075, reflation_n: 22, status: underpowered, note: "★reflation/금리상승 국면 양(+, bond-proxy 약화?) but underpowered n=22 + 부호 prior 반대"}
      placebo: {random_rho: 0.058, wc_p: 0.5672, note: "비유의 = 파이프 정상"}
      verdict: >
        ★INCONCLUSIVE/약 — 배당주 duration(금리↑→통신 forward 음) 가설 **미확인**. 전 horizon 비유의 +
        부호 대부분 prior(음)와 반대(양) + horizon 20d만 음 marginal + level I(1) spurious + leave-episode 부호역전 =
        episode-poor(2019-26 single rate cycle). = bond-proxy duration 표본서 약. 종목선택 0 + 산업 timing 비채택(부호 불안정).
    - id: arpu_5g_capex
      family: telecom_fundamental
      unit: service 시계열
      prior: "양(+, ARPU/5G/capex peak-out)"
      status: "★DATA-GATE — ARPU/5G 가입자 무료 time-series 부재 = 미측정. 3사 과점 = cross-sectional 분산 없음."
      verdict: "INSUFFICIENT(데이터 부재) — collector_plan 등록. 측정 가능해질 시 service 시계열 양 검증."

  # ── (B) 통신장비 cross-sectional (cyclical, 10종) ──
  equipment_cross_sectional:
    - id: cs_pbr_z
      family: value
      unit: "equipment 10종 cross-sectional (avgN 9.2)"
      prior: "음(-, 저PBR value premium)"
      horizon_ic:
        y_5d: {ic: -0.078, wc_p: 0.0175, t_eff: -1.95, avgN: 9.2, n_months: 84}
        y_20d: {ic: -0.078, wc_p: 0.0175, t_eff: -1.95, avgN: 9.2, n_months: 84}
        y_60d: {ic: -0.167, wc_p: 0.0005, t_eff: -2.62, avgN: 9.2, n_months: 82, by_survivor: true}
      by_fdr: "★survivors=[eqp_y_60d_pbr_z] (통신 유일 BY 생존, m=24 raw_p_min=0.0005)"
      loo: {full_60d: -0.167, range: [-0.195, -0.150], all_neg: true, drop_hanwhavision: -0.165, note: "10종 LOO 전부 음 = 단일종목 의존 아님, 한화비전(최근상장) outlier 아님"}
      within_neg_frac: 0.671
      walk_forward_oos: {is_ic: -0.041, oos_ic: -0.119, sign_hold: true, note: "OOS 강화(음)"}
      size_confound:  # ★★CRITICAL (G-A A-4)
        pbr_z_vs_size_z_corr: 0.554
        raw_ic_60d: -0.167
        size_neutral_ic_60d: -0.053
        shrink_pct: 68
        note: "★PBR value premium 의 68% = size confound(저PBR↔소형 +0.55). size-neutral 후 IC -0.05 marginal = 순수 value 약 = 사실상 소형주 효과. KOSDAQ 소형 10종 = value≈size 분리 어려움."
      verdict: >
        ★TENTATIVE/PASS-conditional — raw 저PBR value premium 방향 강(BY 생존, LOO robust 전부 음, OOS 강화)
        ★but size confound 제거 후 IC -0.05 marginal = 순수 value 약(소형주 효과). + KOSDAQ 소형 capacity 제약(J축).
        → conservative cap + size 분리 주의. 점추정 -0.167 literal 인용 금지(size-neutral -0.05 권역).
    - id: cs_mom_12_1
      family: momentum
      unit: equipment cross-sectional
      prior: "양(+, 12-1 momentum)"
      horizon_ic: {y_5d: {ic: -0.021, wc_p: 0.6267}, y_20d: {ic: -0.021, wc_p: 0.6267}, y_60d: {ic: -0.067, wc_p: 0.1464}}
      verdict: "INSUFFICIENT/무신호 — 전 horizon 비유의 + 부호 prior(양)와 반대 약. 통신장비 momentum 무신호."
    - id: cs_per_z
      family: value
      unit: equipment cross-sectional (흑자 한정 avgN 6.3)
      prior: "음(-, 저PER value) — but 협소"
      horizon_ic: {y_60d: {ic: -0.132, wc_p: 0.057, avgN: 6.3, status: underpowered}}
      coverage: "흑자 공시 138/215 (적자 빈발 KOSDAQ 소형)"
      verdict: "INSUFFICIENT/underpowered — y_60d 방향(음=value) 힌트 but avgN 6.3<8 = 단정 불가."

  # ── A-3 cross (분석 단위 간 상관, 빈[] 금지) ──
  cross:
    common_factor_exposure:   # service (6/3 raw validation-cross-v3.json, contemporaneous)
      - {factor: dollar, beta: -1.4378, beta_ci_95: [-3.251, 0.375], t: -1.55, contemporaneous: true, note: "비유의(CI 넓음, n 협소 β 불안정)"}
      - {factor: VIX, beta: -0.0029, beta_ci_95: [-0.011, 0.005], t: null, contemporaneous: true, note: "비유의"}
      - {factor: rate_kr10y, beta: null, contemporaneous: true, note: "★service duration = 시계열서 INCONCLUSIVE(상기). bond-proxy 약."}
    directional_spillover:    # ★A-3 빈[] 금지: 선행신호 후보
      - {candidate: kr_rate10y_level, service_forward_rho: 0.007, note: "금리 선행 → service forward ≈0 = 선행신호 약(duration 미확인)"}
      - {candidate: equipment_pbr_z, lead: "value 횡단면", note: "통신장비 저PBR = forward 음(60d) but size confound"}
      - {supervisor_note: "DY(Diebold-Yilmaz) 정식분해 = supervisor 통합단계. ★service 선행신호 후보 = 금리 duration(약, 미확인). equipment = pbr value(size-confounded)."}
    structural_linkage:
      - {supplier: "글로벌 통신장비(화웨이/에릭슨/노키아) scope 외", customer: "통신사 capex → 장비", verdict: "service(통신사)→equipment(장비) 내부 supply-chain이나 service 3종 협소 + equipment 소형 = customer-supplier momentum 측정 무의미(skip). battery/financial/consumer 동일 skip 패턴."}
    placebo: {service_random_rho: 0.058, p: 0.5672, verdict: "비유의 = 측정 파이프 정상"}

# ── 블록3 WEIGHT_RULES — derive_weights 입력 (점추정 금지) ──
weight_rule_candidates:
  - indicator_id: equipment_cs_pbr_z   # ★equipment 저PBR value (size-confounded)
    base_weight_range: [0.02, 0.06]   # ★raw IC -0.167 = size confound 68% → size-neutral -0.05 권역. conservative cap.
    modulate_by: [archetype, regime]   # equipment cyclical sub만
    direction: "통신장비 저PBR z 상위(싼) 종목 overweight (value). ★단 size confound 68% = 사실상 소형주 효과 + KOSDAQ capacity 제약."
    granularity: cross_sectional       # equipment 10종만 (service 3사 제외)
    gate_status: {n: pass, se: marginal, power: pass, fdr: pass, oos: pass, size_confound: fail}  # BY 생존 but size-neutral marginal
    source_ids: ["raw-v3/validation-telecom-v3.json:equipment_cross_sectional.y_60d.pbr_z", "validation-robustness-v3.json:equipment_pbr_size_neutral"]
    hedge_note: >
      ★통신장비 저PBR value = raw BY 생존(60d IC -0.167 wc_p=0.0005) + LOO robust + OOS 강화 ★but size confound 제거 후
      IC -0.05 marginal = 순수 value 약(소형주 효과). base_weight 보수 cap + size 분리 주의. ⛔ -0.167 literal 금지.
      KOSDAQ 소형 10종 = capacity 제약(J축). service 3사 제외(cross-sectional 불가).
  - indicator_id: service_rate_duration   # ★service 배당주 duration = 미확인
    base_weight_range: [0.0, 0.0]   # ★INCONCLUSIVE = 비채택
    modulate_by: []
    direction: "★통신서비스 배당주 금리 duration = 표본서 미확인(부호 prior 반대 + 비유의 + episode-poor). 종목선택 불가(3종) + 산업 timing 비채택(부호 불안정)."
    granularity: industry_timeseries
    gate_status: {n: pass, se: fail, power: fail, fdr: fail, oos: marginal}  # ★전 horizon 비유의 + 부호 prior 반대
    source_ids: ["raw-v3/validation-telecom-v3.json:service_timeseries.kr_rate10y_duration"]
    hedge_note: "★service 금리 duration weight 0 = INCONCLUSIVE(약). over-trade 차단. 추가 rate cycle 누적 시 재측정(episode-poor)."

# ── 블록4 CONFIDENCE_HOOKS ──
confidence_hooks:
  - hypothesis_id: telecom_equipment_value
    affects_indicator: equipment_cs_pbr_z
    affects_edge: [equipment_pbr_z, equipment_fwd_60d]
    confirm_signal: "live 통신장비 저PBR z 상위 forward IC < 0 유지 (60d, ★size-neutral 잔존 확인)"
    reject_signal: "value premium IC 부호 반전 OR size-neutral IC → 0 수렴(순수 size effect 확정)"
    emit_where: "equipment cross-sectional value 축"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights equipment value base_weight (size-neutral 권역)"
    action_threshold: "e-value > 20 → retract. ★size confound 모니터: size-neutral IC 추적 의무."
  - hypothesis_id: telecom_service_rate_duration
    affects_indicator: service_rate_duration
    affects_edge: [kr_rate10y, service_fwd_3m]
    confirm_signal: "추가 rate cycle(금리 하락기 재진입)서 KR10Y↑→service forward 음 유의 전환"
    reject_signal: "n/a (현 INCONCLUSIVE, episode-poor)"
    emit_where: "service 산업 timing 축 (현 비채택)"
    accumulate_in: "core/assume/weight_falsification rate-duration tracker"
    feeds_weight: "★현 weight 0. rate episode ≥2 누적 시 재측정 트리거."
    action_threshold: "rate cycle 2회+ 후 forward 음 유의 → duration 신호 승격 재평가."
  - hypothesis_id: telecom_arpu_5g_data_gate
    affects_indicator: arpu_5g_capex
