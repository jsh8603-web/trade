horizon_verdict:
  best_horizon: "★[frame §M.12 primary 재배치] 3M/6M/12M (PBR/PER value, NW 유의·BY 6생존) = primary 근거. 24M_value = ★보조(eff_N≈2.5 degenerate, 방향만). magnitude n=13 협소 hedge."
  forward_alpha_present: true   # ★value premium present (방향 안정적)
  note: >
    ★value premium forward present 강(방향 안정적). momentum 무신호. ★단 magnitude = n=13 협소 과대.
    asset_stable value = consumer 재현. universe 협소 = 본 산업 핵심 한계.

# ── Hard-fail 4 ──
hard_fail_self_check:
  B_real_data: {status: PASS, note: "합성 0%. pykrx OHLCV 14종 + yfinance(^TNX/factors) + DART 357 rows(2019~) + FDR. raw-v3/*.py 재현."}
