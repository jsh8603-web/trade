    - finding: "★flow_strong_buy regime = reversal 증폭축 (aitech 핵심 conditioning)"
      cells:
        - {signal: mom_12_1, horizon: y_20d, regime: "flow=flow_strong_buy", ic: -0.1498, wc_p: 0.0145, n: 17, status: underpowered}
        - {signal: vol_60, horizon: y_20d, regime: "flow=flow_strong_buy", ic: -0.1245, wc_p: 0.01, n: 18, status: underpowered}
        - {signal: pbr_z, horizon: y_20d, regime: "flow=flow_strong_buy", ic: -0.1138, wc_p: 0.0155, n: 18, status: underpowered}
      mechanism: "외국인 강매수기(passive 지배) → momentum 종목 차익실현 + 저평가 rotation = reversal/value 증폭. Choe-Kho-Stulz flow herding."
    - finding: "★per_z KRW_weak = conditional 최강 powered cell"
      cells:
        - {signal: per_z, horizon: y_60d, regime: "krw=KRW_weak", ic: -0.1536, wc_p: 0.0025, n: 34, status: powered}
        - {signal: pbr_z, horizon: y_60d, regime: "krw=KRW_weak", ic: -0.110, wc_p: 0.0005, status: powered}
