  valid_from: "2019-01-01"   # ★PIT 사전선언 (§M.5 ex-post 금지)
  declared_at: "2026-06-05"
  primary_metric: pbr        # ★실측: 저PBR value premium 작동(BY 생존, size 위장 아님)
  secondary: event_driven    # soft: 게임 신작 cycle (momentum reversal game-dominant)
