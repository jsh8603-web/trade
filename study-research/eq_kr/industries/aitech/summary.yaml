    m_naive: 105
    m_eff_signal: 3.0         # Li-Ji M_eff (가격4신호 상관보정)
    by_survivors: []          # naive m=105 BY 보정 후 0 (raw_p_min=0.0005 > BY_thresh)
    note: "★M_eff 통합 보정 = supervisor(M.7). 산업 = naive + M_eff_signal 박제. ★valuation 독립 family(m=8) = BY 7개 생존(별 measurement, multiplicity 차이)."
