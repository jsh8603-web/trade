as_of: "2026-05-31"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    AItech = 성장주이나 "싸다(저PBR)"가 작동. 2022 플랫폼/P2E 버블 붕괴 후 valuation dispersion 커져 저PBR 종목 mean-reversion 강.
    primary_metric=pbr (저PBR value premium, size 위장 아님). 가격 momentum = ★reversal(음=battery 반대, 게임 신작 buy-the-rumor/sell-the-news).
    per_z = 작동하나 episode 종속(버블기 부호반전) + 게임 적자 40% 양수편의 → 격하.
  cycle_reading: >
    2019-2026 = 코로나 비대면 수혜(2020-21 멀티플 버블)→금리인상 성장주 폭락(2022)→AI 회복(2023-26). QQQ yoy regime
    ex-ante: bull 51 / neutral 28 / bear 10 month (2023~ AI 랠리 bull 편중). sub-cluster: internet(광고)/game(신작 event)/saas(구독 AI수혜).
  estimation_note: >
    2026-05: universe 26종(시총≥3000억 ∧ ADV floor + 핵심종목 화이트리스트, FDR 오분류 EXCLUDE 정제). 횡단면 avg N ~24/월.
    game 13 / saas 8 / internet 5. ★valuation primary tradeable(BY 생존), momentum reversal 보조(BY 미생존, game-dominant). 본 산출 = 측정 + peer-relative z card.

