# ════════════════════════════════════════════════════════════════════
# ── ★★CONDITIONAL IC SURFACE (dispatch 원의도 본체, S2 신규 2026-06-05) ──
# IC(지표, regime, horizon) = "어느 국면에 어느 지표가 forward return 예측하나".
# 측정: raw-v3/measure_conditional.py (G-F 7항 헤더 선언) → validation-conditional-v3.json
# regime: Macro(FRED CLI amplitude-adj 4) × KRW(DEXKOUS yoy 3) × flow(ECOS 외국인순매수 28d z 3)
# horizon: y_5d/y_20d(메인)/y_60d 일간 forward. per-cell = wild-cluster bootstrap p + n_eff + block-boot CI.
# ════════════════════════════════════════════════════════════════════
conditional_ic_surface:
  cell_collapse: >
    ★36셀 full(Macro4×KRW3×flow3) N>=24 cell = 0개(실측, 최대 N=13) → INSUFFICIENT.
    측정 = 단일축(Macro 4 / KRW 3 / flow 3 각각) conditional IC + family_2 interaction. 2축 merge = 통합단계.
  fdr_family:
    m_naive: 90               # powered cell 수 (단일 FDR family, G-F §3)
    m_eff_signal: 3.0         # ★Li-Ji M_eff (가격4신호 상관보정: mom_6↔mom_12_1=0.58 등). naive 6신호 → 유효 3
    by_survivors: []          # naive m=90 BY 보정 후 0 (raw_p_min=0.0005 > BY_thresh 0.00022)
    bonferroni_note: "Bonferroni α/90=0.00056 로는 pbr_z KRW_weak(0.0005) 1건 생존. m=90 과대(M_eff 미통합)."
    note: "★M_eff 통합 보정 = supervisor 통합단계(M.7 분담). 산업 = naive + M_eff_signal 박제."
  # ── ★핵심 발견: regime별 IC 증폭/반전 (y_20d 메인, wild-cluster p) ──
  key_findings:
    - finding: "KRW_weak regime = 신호 증폭축"
      cells:
        - {signal: pbr_z, horizon: y_5d, regime: "krw=KRW_weak", ic: -0.1005, wc_p: 0.0005, n: 34, status: powered}
        - {signal: mom_6, horizon: y_20d, regime: "krw=KRW_weak", ic: -0.0962, wc_p: 0.0055, n: 34, status: powered}
        - {signal: rev_1m, horizon: y_20d, regime: "krw=KRW_weak", ic: -0.0914, wc_p: 0.0025, n: 34, status: powered}
      mechanism: "원화약세기(수출 cycle stress) value/reversal 증폭. theory-notes M4(USDKRW)+M1(reversal) 정합."
    - finding: "pbr_z value premium = 전 horizon robust (unconditional)"
      cells:
        - {signal: pbr_z, horizon: y_5d, ic: -0.0609, wc_p: 0.001, n_eff: 82}
        - {signal: pbr_z, horizon: y_20d, ic: -0.0495, wc_p: 0.0045, n_eff: 68.6}
        - {signal: pbr_z, horizon: y_60d, ic: -0.0594, wc_p: 0.0025, n_eff: 31.6}
      mechanism: "cyclical value premium horizon 무관 robust. theory M2(PBR○) 정합. ★단 BY 보정 후 비유의(small-n hedge)."
    - finding: "flow_strong_buy regime → momentum 부호 반전/소멸"
      cells:
        - {signal: mom_6, horizon: y_20d, regime: "flow=flow_strong_buy", ic: 0.0065, status: underpowered}
      mechanism: "외국인 강매수 regime = passive 지배 → 개별신호 IC 감소. theory M3(Choe-Kho-Stulz) 정합."
  # ── ★★family_2 interaction (G-B 의무, rejected 박제 前 = frame A-5) ──
  # ★measure_conditional.measure_interaction_terms() 정식 통합 → validation-conditional-v3.json:family_2_interaction
  family_2_interaction:
    method: "pooled panel: ret_rank ~ sig_rank + sig_rank×KRW_weak_dummy, month-clustered SE (자유도 보존, split 보다 power↑)"
    results:
      - {signal: mom_6, horizon: y_20d, b_main: 0.0184, t_main: 0.74, b_interaction: -0.1181, t_interaction: -2.95, n_months: 81, verdict: "interaction 유의"}
      - {signal: rev_1m, horizon: y_20d, b_main: -0.0092, t_main: -0.44, b_interaction: -0.0805, t_interaction: -2.33, n_months: 81, verdict: "interaction 유의"}
      - {signal: mom_12_1, horizon: y_20d, b_main: -0.0039, t_main: -0.16, b_interaction: -0.0478, t_interaction: -1.14, n_months: 81, verdict: "interaction 비유의"}
      - {signal: vol_60, horizon: y_20d, b_main: -0.0357, t_main: -1.28, b_interaction: -0.0153, t_interaction: -0.36, n_months: 81, verdict: "interaction 비유의"}
    interpretation: >
      ★mom_6/rev_1m: main effect 비유의인데 interaction term 유의(t=-2.95/-2.33) = "국면 따라 신호 효과 갈림"(frame A-5 정의) 입증.
      = 신호가 약한 게 아니라 **conditional**. unconditional momentum 약(-0.029)이 KRW_weak regime 에서 reversal 로 명확 발현.
      ★mom_12_1/vol_60 = interaction 비유의(정직 보고) → KRW_weak conditional 은 mom_6·rev_1m 한정.
      ⛔ G-B "신호 약함" 단정 부적합 — family_2 (mom_6·rev_1m) 살아있음. sign-flip 13건.
  gb_status:
    trigger_check: "BY 생존 0 AND raw_p_min(0.0005) > 2×BY_thresh(0.000437) = 트리거 충족(간발)"
    verdict: >
      ★"약함" 아님 = (a) Bonferroni 1건 생존 (b) family_2 interaction 유의(t=-2.95) (c) m=105 과대(M_eff 미통합).
      → G-B 자동자문 발동 여부 = supervisor 판단(보고). 산업 판정 = "conditional 강함, unconditional+naive-FDR 약" = 동적가중 정당화.
  # ── ★비판검토 실측 (2차 리서치 반증조건 데이터 검정, S6 방어) ──
  critique_validation:
    - critique: "Q6: PBR value premium = size factor 위장 아닌가? (Asness 2013 방법)"
      test: "Fama-MacBeth: ret_rank ~ PBR_rank + Size_rank, y_20d, 매월 cross-section 회귀 → 계수 시계열 t-test"
      result: "PBR univariate b=-0.051 t=-3.15 → PBR|Size 통제후 b=-0.043 t=-2.47 유의유지. Size|PBR b=-0.018 t=-0.99 비유의."
      verdict: "★기각(PBR 독립 alpha) = size 위장 아님. value premium robust."
    - critique: "Q10: HBM/AI cycle(2023-26) 표본 지배 → episode 종속? (Bai-Perron 1998)"
      test: "sub-period IC: pre-HBM(2019-2022) vs HBM(2023-2026) 부호 일관성"
      result: "mom_6(-0.005/-0.055) rev_1m(-0.062/-0.025) pbr_z(-0.034/-0.071) = 3신호 부호 일관(structural break 없음)"
      verdict: "★기각(episode 종속 아님). 단 각 기간 단독 약(small-n) = full/conditional 적합."
    - critique: "Q5: momentum reversal = 대형주(삼성/SK) 의존? (Hou-Xue-Zhang 2020)"
      test: "기존 leave-episode(ex-peak 생존) + cap-weighted IC -0.092(대형주서 강)"
      verdict: "부분 점검(대형주서 더 강 = artifact 아님). ⏳삼성/SK 각각 제외 LOO = falsifier 후속."
  # ── ★S5 역공격 (최강 반증 직접 투척 → 수렴, dispatch lifecycle) ──
  adversarial_s5:
    target: "KRW_weak conditional (family_2 핵심)"
