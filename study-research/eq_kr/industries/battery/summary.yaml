    layer: 3
    family: momentum          # ★부호 양 = continuation (2차전지 성장 + 종목차별화, 반도체 reversal 과 반대)
    horizon: y_60d            # 6M 신호 → 60d forward 본진 (장기 momentum)
    ic_mean: 0.0751
    ic_ci_95: null            # block-boot CI = validation-conditional-v3.json:conditional_ic_surface.mom_6.y_60d.unconditional.ci95_block_boot
    wild_cluster_p: 0.0125    # ★asymptotic NW-HAC t 대신 wild-cluster bootstrap (G-F §7, small-block size-invalid 회피)
    n_months: 80
    n_eff: 38.7
    walk_forward_oos: "IS(2019-22) +0.0780 → OOS(2023-26) +0.0720 = ✅부호+magnitude 유지"
    leave_2022_out: "+0.0751 → +0.1020 (wc_p 0.012→0.002 강화) = ★2022 리튬붕괴 episode 종속 아님(오히려 2022가 약화 요인)"
    source_id: "raw-v3/validation-conditional-v3.json:conditional_ic_surface.mom_6.y_60d"
    notes: |
      cross-sectional 6M 모멘텀 z → 60d forward Rank-IC = ★양(continuation). flow_neutral regime 에서 +0.123(wc_p=0.001, 최강 cell).
      ★BY 미생존(merged family m=177, raw_p_min 0.0005). 방향 안정적(wc_p<0.05 + OOS 부호유지 + leave-2022-out 강화) but 다중검정 후 비유의 → small-n hedge, PARTIAL.
  - id: cs_mom_12_1
    layer: 3
    family: momentum
    horizon: y_60d
    ic_mean: 0.0554
    wild_cluster_p: 0.064
    n_months: 74
    walk_forward_oos: "IS +0.0156 → OOS +0.0932 = ✅부호유지+강화"
    leave_2022_out: "+0.0554 → +0.0698 (wc_p 0.064→0.041)"
    source_id: "raw-v3/validation-conditional-v3.json:conditional_ic_surface.mom_12_1.y_60d"
    notes: "12-1 모멘텀 → 60d forward continuation. flow_neutral +0.106. BY 미생존. PARTIAL."
  - id: cs_rev_1m
    layer: 3
    family: reversal
    horizon: y_20d
    ic_mean: -0.0294
    wild_cluster_p: 0.3333
