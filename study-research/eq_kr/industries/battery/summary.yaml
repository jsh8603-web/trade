    notes: "1M 단기 reversal 약 음 (uncond 비유의). KRW_weak regime -0.073. TENTATIVE."
  - id: inv_ratio
    layer: 1                   # ★신규 cycle 지표 (재고/총자산) — ★prior 반증
    family: inventory
    horizon: y_60d
    ic_mean: 0.1121
    wild_cluster_p: 0.0005     # ★merged family 최강 raw_p (m=177 중 1위)
    n_months: 82
