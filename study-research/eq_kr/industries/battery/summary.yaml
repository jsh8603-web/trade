# summary.yaml — battery(2차전지) 산업 v3 (frame v3 §M exposure card 계약)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge 어휘, BY 보정, LOO/block-boot).
# supersedes: v2 (robustness/cross/horizon 필드 부재). 산출 범위 = §M.7 exposure card (측정 전용).
# raw 재현: raw-v3/{collect.py, measure.py, measure_cross.py, exposure_card.py}

industry: kr_battery          # eq_kr 12산업 中 Tier 2 (2차전지)
asset_scope: [equity.kr]
archetype: cyclical           # archetype.py DEFAULT_SECTOR_ARCHETYPE["kr_battery"] = cyclical (capex/리튬 사이클)
archetype_attestation:
  valid_from: "2019-01-01"    # ★PIT 사전선언 (§M.5 ex-post 금지). cyclical = capex 주도 사이클 산업
  declared_at: "2026-06-03"   # 선언 시점 (사후편향 hazard 방지 attestation)
  primary_metric: ev_ebitda   # cyclical primary (peak-EPS trap 경계 — 정점에 멀티플 낮음)
  secondary: event_driven     # soft/probabilistic: IRA/FEOC 정책 event 비중 (보조, prob~0.3)
  basis: "리튬/capex 사이클 1차 가설. 검증: 가격기반 모멘텀 IC 가 cyclical 모멘텀 패턴(3-12M 본진) 정합 확인 → cyclical 지지."
as_of: "2026-05-31"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    2차전지 = cyclical. "싸다" = EV/EBITDA·P/B (peak-EPS 함정: 사이클 정점에 멀티플 낮아 보임).
    ★실측 결론: 가격기반 cross-sectional 모멘텀(6M)이 강한 forward 예측력(IC +0.086, 12M horizon).
    valuation 횡단면(PBR/PER) = 데이터 부재(pykrx 스냅샷 KRX 인증 차단)로 미측정 = primary gap.
  cycle_reading: >
    2019-2026 = 리튬 hyper-cycle 1회 완주 (2021-22 bull → 2023-24 down → 2025-26 bottoming).
    LIT yoy regime ex-ante 라벨: neutral 44 / bull 31 / bear 14 month. 양극재 cost-pass-through proxy.
  estimation_note: >
    2026-05 시점: universe 29종(시총≥3000억 ∧ ADV≥30억). 모멘텀 시변 IC 가 regime 함수 —
    derive_weights w∝Θ_signal·IC 로 동적 가중(통합 단계). 본 산출 = 측정 + peer-relative z card 까지.

# ── 블록2 INDICATORS (forward 횡단면 Rank-IC, horizon-tagged) ──
# ★점추정 금지: ic_mean + ic_ci_95(block-boot ∧ NW) + n_effective + oos(CPCV)
indicators_passed:
  - id: cs_mom_6m
    layer: 3                  # 가격 cycle proxy (cross-sectional 모멘텀)
    family: momentum
    horizon: 12M_mom          # ★horizon-tagged (§M.2): 6M 신호 → 12M forward 본진
    ic_mean: 0.086
    ic_ci_95: [0.032, 0.132]  # block-bootstrap(block=3M,B=2000). NW CI [0.043,0.130] 정합. 0 비포함.
    ic_se_nw: 0.0223          # Newey-West HAC (lag=horizon=12, overlapping forward 보정)
    t_nw: 3.87
    n_effective: 71           # months (autocorr 보정 전 raw; Validated tier ≥? — 아래 eff_n_tier 참조)
    oos_ratio: 1.00           # CPCV OOS hit=1.00 (15 folds, purge=12M, embargo=1)
    avg_universe_n: 26.0      # 횡단면 평균 종목수 (★cross-sectional 작동 = 기존 4종 대비 결정적)
    source_id: "raw-v3/validation-metrics-v3.json:indicators.mom_6__12M_mom"
    notes: |
      cross-sectional 6M 모멘텀 z-score → 12M forward return Rank-IC.
      within-period 연도별 부호 일관 100% (2019-2025 전부 양). leave-episode 생존.
      유동성-티어: hi-ADV IC +0.070 / lo-ADV +0.096 / cap-weighted +0.046 (microcap 지배 아님).
      BY 보정(16 테스트, factor 3.38) 후 유일 생존 지표.
  - id: cs_mom_6m_6Mfwd
    layer: 3
    family: momentum
    horizon: 6M_mom
    ic_mean: 0.083
    ic_ci_95: [0.013, 0.148]  # block-boot. NW CI [0.005,0.161]. 하단 0 근접(weaker).
    ic_se_nw: 0.0393
    t_nw: 2.10
    n_effective: 77
    oos_ratio: 0.93           # CPCV OOS hit=0.93
    avg_universe_n: 26.2
    source_id: "raw-v3/validation-metrics-v3.json:indicators.mom_6__6M_mom"
    notes: "6M 모멘텀 → 6M forward. within-period 0.71(2022/2025 음 flip). BY 미생존 → TENTATIVE."
  - id: cs_rev_1m_12Mfwd
    layer: 3
    family: reversal
    horizon: 12M_mom
    ic_mean: 0.050
    ic_ci_95: [0.001, 0.101]  # block-boot 하단 0 근접
    ic_se_nw: 0.0184
    t_nw: 2.73
    n_effective: 76
    oos_ratio: 1.00
    avg_universe_n: 26.2
    source_id: "raw-v3/validation-metrics-v3.json:indicators.rev_1m__12M_mom"
    notes: "1M 단기수익 z → 12M forward (장기 모멘텀 동조). BY 미생존. TENTATIVE."

# ── 블록3 RELATIONSHIPS (partial-corr) — RegimeGlasso 통합 단계 입력 ──
relationships_passed:
  - {node_a: cs_mom_6m, node_b: battery_fwd_12m, lag_months: 0, corr: 0.086,
     corr_ci_95: [0.032, 0.132], conditioning_set: [], n: 71,
     source_id: "raw-v3/validation-metrics-v3.json:indicators.mom_6__12M_mom",
     note: "본 corr = cross-sectional IC(unconditional). partial-corr(공통인자 통제) = 통합 RegimeGlasso 단계."}

# ── 블록4 WEIGHT_RULES — derive_weights(w∝Θ_signal·IC) 입력 (range, 점추정 금지) ──
weight_rule_candidates:
  - indicator_id: cs_mom_6m
    base_weight_range: [0.06, 0.13]   # ic_mean=0.086 ± CI → 보수 range. 점추정 박제 금지.
    modulate_by: [archetype, regime, cycle_phase]
    direction: "cross-sectional 6M 모멘텀 z 상위 종목 overweight (peer-relative). long-only-implementable."
    granularity: cross_sectional       # ★universe-relative z (own-history 아님)
    gate_status: {n: pass, se: pass, power: pass, fdr: pass, oos: pass}  # 5게이트 ALL (G2=BY 생존)
    source_ids: ["raw-v3/validation-metrics-v3.json:indicators.mom_6__12M_mom"]
    hedge_note: "n=71 months Tentative-Validated 경계. CI [0.032,0.132] 유지. ★supervisor 가 cap/Σ_signal 조립."

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 (비우면 결선 dead) ──
confidence_hooks:
  - hypothesis_id: battery_cs_momentum_persistence
    affects_indicator: cs_mom_6m       # ★★필수 — indicators_passed.id 와 매칭
    affects_edge: [cs_mom_6m, battery_fwd_12m]
    confirm_signal: "live 횡단면 6M 모멘텀 z 상위 종목의 12M forward rank IC > 0 유지 (rolling 12M)"
    reject_signal: "Rank-IC e-CUSUM 단측 붕괴 (baseline 0.043=CI하단 미달 누적 K=3 month)"
    emit_where: "panel-score-IC 축 (backtest SELL 아님)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 → cross-sectional 모멘텀 base_weight 변동"
    action_threshold: "e-value > 1/alpha=20 → retract(live 차단) / 회복 = score_ic_recovery_eprocess"

# ── 블록6 COLLECTOR_PLAN ──
collector_plan_industry:
  - missing: "시점별 발행주식수 (시총 PIT 정밀화) + EV-EBITDA(부채/현금 = DART BS 추가 계정)"
    source: "DART stockTotqySttus(주식총수). 현 = FDR 현재주식수 근사(증자 잦은 종목 PIT 부정확 잔존)"
    priority: medium  # ★valuation 횡단면 = DART fnlttSinglAcntAll 로 해소(PBR/PER 산출 완료). 잔여 = 주식수 PIT + EV/EBITDA.
    status: "PBR/PER cross-sectional = 해소(2026-06-03). EV-EBITDA·시점주식수 = 후속."
  - missing: "PIT universe 멤버십 (시점별 섹터 편입/편출 + delisted 종목)"
    source: "FDR KRX-DESC = 현재 스냅샷만. KRX PIT 섹터분류(get_market_sector_classifications) 인증 필요"
    priority: high   # 생존편향 완전 보정 (현 = 상장 시점 차이만 정량화)
  - missing: "KR HY credit spread (공통인자 credit β KR-local)"
    source: "현 = US BAML HY OAS proxy(FRED). KR 회사채 spread = 금융투자협회/한국신용평가 유료"
    priority: medium
  - missing: "DART 분기 펀더멘털 시계열 (R&D/매출/OP margin, rcept_dt PIT stamp)"
    source: "DART_API_KEY(.env 보유) — fnlttSinglAcntAll 종목당 fetch. Layer 1 펀더멘털 IC"
    priority: medium

# ── ★cross (분석 단위 간 상관) — §M.3 3소비자 라우팅 (산업=보고만) ──
cross:
  # (a) 공통인자 exposure β (contemporaneous) → 통합 supervisor Σ_return 입력
  common_factor_exposure:
    - {factor: credit, beta: -0.1642, beta_ci_95: [-0.2941, -0.0344], contemporaneous: true,
       source_id: "raw-v3/validation-cross-v3.json:common_factor_exposure.credit",
       note: "credit risk-off 시 battery 약세 (t=-2.48 유의). ★credit=US HY OAS proxy(KR HY 부재), n=35 small."}
    - {factor: oil, beta: 0.2481, beta_ci_95: [0.0124, 0.4837], contemporaneous: true,
       source_id: "raw-v3/validation-cross-v3.json:common_factor_exposure.oil",
       note: "oil/risk-on 약 양 노출 (t=+2.06). CI 하단 0 근접 = tentative."}
    - {factor: VIX, beta: 0.0008, beta_ci_95: [-0.0177, 0.0192], contemporaneous: true, note: "비유의"}
    - {factor: dollar, beta: -1.305, beta_ci_95: [-4.334, 1.724], contemporaneous: true, note: "비유의 (CI 넓음)"}
    - {factor: rate, beta: -0.0824, beta_ci_95: [-0.268, 0.103], contemporaneous: true, note: "비유의"}
  # (b) 방향성 spillover (DY) = 통합 단계 (산업별 매번 X) → skip
  directional_spillover: []   # §M.3: DY connectedness = supervisor 통합, I-O centrality = optional 최하위
  # (c) 구조 linkage (customer-supplier momentum) — alpha 후보 검증 결과
  structural_linkage:
    - supplier_or_customer: lithium_upstream   # LIT/ALB (리튬 공급망 upstream)
      io_weight: null            # BEA I-O = US, KR I-O 부재 → 정성 supply-chain
      lagged_return_signal: 0.086  # lag3 corr (3M upstream momentum → battery fwd 1M)
      p_value: 0.441
      source_id: "raw-v3/validation-cross-v3.json:customer_supplier_momentum.lithium_upstream"
      verdict: "REJECTED as alpha — 전 lag(0-3) 비유의. forward 예측력 부재(§D falsifier 작동). 동조성분은 RegimeGlasso Ω 흡수."
  # ⛔ sector-rotation business-cycle clock = 학술 myth(Molchanov 2024). 모멘텀 rotation 만 tentative.

# ── ★valuation 횡단면 (§M.7 핵심, 결함1 해소 — DART 재구성 2026-06-03) ──
# DART fnlttSinglAcntAll 재무 + pykrx 가격 → PBR/PER cross-sectional z → forward IC.
# ★PIT 엄수: rcept_dt(공시일) 이후만 적용. 시총=Close×현재주식수(시점별 주식수=collector_plan).
valuation_cross_sectional:
  data_source: "raw-v3/validation-valuation-v3.json (DART 698 rows + pykrx 가격)"
  mechanism_works: true   # ★cross-sectional 작동 — PBR 횡단면 avgN 26(전종목)/PER 20(순이익 양수). coverage PBR 2231/PER 1664 cells.
  pit_note: "재무 = rcept_dt 공시일 이후만(lookahead 회피). FY 보고지연 median 80일."
  indicators:
    - id: cs_per_z
      signal: "PER cross-sectional z (저PER=value)"
      horizon: 24M_value    # ★value 3-5Y 장기(§M.2)
      ic_mean: -0.116       # 부호 음 = value premium 방향(저PER→고forward) 일치
      ic_ci_95_nw: [-0.281, 0.049]      # NW(n=61, 24M overlap 보수) = 0 포함 → 비유의
      ic_ci_95_block_boot: [-0.196, -0.042]  # block-boot = 0 배제 (NW 와 불일치, 보수적으로 NW 채택)
      t_nw: -1.38
      n_effective: 61
      cpcv_oos_hit: 0.80
      within_period: 0.67
      avg_universe_n: 19.7
      source_id: "raw-v3/validation-valuation-v3.json:indicators.per_z__24M_value"
      verdict: "TENTATIVE DIRECTIONAL — 저PER value premium 방향성 약 prior(장기). NW 비유의(p=0.17), BY 미생존. CI 넓음, 추가 검증 필요. ★[frame §M.12] 24M eff_indep_N=61/24≈2.5 degenerate = 방향만. battery primary = cs_mom_6m(momentum), valuation 약·보조."
    - id: cs_pbr_z
      signal: "PBR cross-sectional z (저PBR=value)"
      horizon: 24M_value
      ic_mean: -0.019       # 거의 0
      ic_ci_95_nw: [-0.329, 0.292]
      t_nw: -0.12
      n_effective: 61
      avg_universe_n: 25.2
      source_id: "raw-v3/validation-valuation-v3.json:indicators.pbr_z__24M_value"
      verdict: "INSUFFICIENT signal — IC≈0, 무방향. battery PBR 횡단면은 forward 예측 부재."
  multiple_testing: "8 테스트(2 신호×4 horizon) BY factor 2.72. raw_p_min=0.174(per_z__24M). ★BY 생존 0 = 전 valuation 지표 비유의."
  verdict: >
    valuation 횡단면 메커니즘 = 작동(avgN 20-26, PBR 전종목/PER 순이익양수). 단 battery 내 IC = 약·비유의
    (PER value premium 방향성 약 prior 장기 horizon, PBR 무신호). ★momentum(cs_mom_6m CONFIRMED)이
    battery 의 dominant 신호 — valuation 은 보조. 사용자 요구("PER/PBR 평균대비 골고루") 산출 구조는 완성,
    IC 유효성은 battery 한정 약(다른 산업에선 다를 수 있음 = 6산업 batch 가 검증).

# ── robustness_checks (측정 17종 통과 기록, 지표별) ──
robustness_checks:
  - indicator_id: cs_mom_6m          # primary
    leave_episode: pass              # ex-peak +0.067 (full +0.086), 부호·magnitude 생존
    within_period: pass              # 연도별 부호 일관 100% (2019-2025)
    partial_corr_ratio: null         # 통합 RegimeGlasso 단계 (산업 = unconditional IC 까지)
    net_sharpe_ratio: null           # net IC haircut 33bps 왕복 / monthly 16.5bps (IC +0.086 >> cost) → gross 보존
    forward_vs_contemp: "forward present"  # ★forward IC 유효 (§M.2 forward=primary, coin fallback 프레임 폐기)
    family_neutralized_ic: null      # FF5/KR-factor neutralize = 통합 단계 (region-matched)
    eff_n_tier: Tentative            # n=71 months (50-100 = Tentative). 종목 breadth 26 보완.
  - indicator_id: cs_mom_6m_6Mfwd
    leave_episode: pass
    within_period: fail              # 0.71 (2022/2025 음 flip) — 6M horizon less robust
    eff_n_tier: Tentative
    forward_vs_contemp: "forward present (weaker)"
  - indicator_id: cs_rev_1m_12Mfwd
    leave_episode: pass
    within_period: pass              # 0.71 (경계)
    eff_n_tier: Tentative
    forward_vs_contemp: "forward present (weak)"

# ── horizon_verdict (forward alpha falsifier) ──
horizon_verdict:
  best_horizon: "12M (6M 모멘텀 신호 → 12M forward)"
  forward_alpha_present: true        # ★present — 단독 베팅 근거 O (risk-monitor 격하 아님)
  note: >
    horizon 구조 = 모멘텀 3-12M 본진(§M.2 정합): 12M>6M>3M 단조. 1M_PEAD/reversal 약(단기 reversal).
    customer momentum forward = null(REJECTED) → upstream lead-lag alpha 부재. 가격 모멘텀이 primary.

# ── net-cost (KR 비대칭) ──
net_cost:
  model: "spread/2 + commission + STT_sell(0.20%, 매도측만) — §M.4 비대칭"
  roundtrip_bps: 33.0
  monthly_cost_bps: 16.5   # turnover 0.5/월 가정
  note: "IC +0.086 (annualized IR breadth 26종) >> 16.5bps/월 → net 보존. ★sqrt impact·size-tier = CPCV 캘리브레이션(supervisor)."

# ── Hard-fail 4 (B C D I) self-check ──
hard_fail_self_check:
  B_real_data: {status: PASS, note: "합성 0%. pykrx OHLCV 실측 29종 + yfinance(LIT/factors) + DART + FDR. raw-v3/*.py 재현."}
  C_traceability: {status: PASS, note: "모든 yaml 수치 = raw-v3/validation-metrics-v3.json + validation-cross-v3.json + validation-valuation-v3.json key 매핑."}
  D_pit:
    status: PASS
    note: >
      가격신호 = PIT-safe(forward return shift). ★valuation 횡단면 = DART rcept_dt(공시일) 이후만 적용
      = lookahead·restatement 회피(FY 보고지연 median 80일 실측). 시총=Close×현재주식수(시점별 주식수 정밀화 = 잔여 medium).
  I_survivor_bias:
    status: PARTIAL
    note: >
      universe = FDR 현재 스냅샷(생존 종목만). delisted/M&A 종목 누락 = 생존편향 잔존. 상장 시점 차이 정량화
      (29종 中 6종 부분 이력: LG엔솔 2022상장 등) = look-back gap. PIT 멤버십 = collector_plan high.

# ── verdict (small-n rule) ──
verdict_label: PARTIAL  # ★전체 산업 = PARTIAL CONFIRMED
verdict_detail:
  cs_mom_6m__12M: "CONFIRMED (n=71 months≥30, t_NW=3.87 p<0.001, BY 생존, CPCV OOS hit 1.00, within-period 100%, leave-episode 생존, 유동성티어 부호 일관). battery dominant 신호. ★단 avg_universe_n=26(<30) = magnitude 보수."
  cs_mom_6m__6M: "PARTIAL (within-period flip, BY 미생존)"
  cs_rev_1m__12M: "TENTATIVE (CI 하단 0 근접, BY 미생존)"
  valuation_cross_sectional: "★해소(DART 재구성) — 메커니즘 작동(PBR avgN 26/PER 20). per_z 24M value = TENTATIVE DIRECTIONAL(저PER value premium 약 prior, NW 비유의 p=0.17, BY 미생존) / pbr_z = INSUFFICIENT(무신호). battery 한정 valuation IC 약."
  customer_momentum: "REJECTED (forward 예측력 부재, 전 lag 비유의)"
  common_factor: "credit/oil tentative (credit US proxy, n=35 small)"
verdict_note: >
  산업 전체 = PARTIAL. momentum(cs_mom_6m) CONFIRMED = dominant. valuation 횡단면 결함 = 해소(산출 구조 완성)
  하나 battery 내 valuation IC 는 약·비유의(per value premium 방향성만). ★pilot 결론: cross-sectional 메커니즘
  (momentum + valuation 양쪽) 작동(파이프라인 산출 정상). valuation IC 유효성은 산업별 상이 가능 → 6산업 batch 가 일반화 검증.
