    note: "합성·시뮬 데이터 0%. FDR/yfinance 실측만."
  C_traceability:
    status: "PASS"
    note: "ic_mean / corr 모든 yaml 수치가 validation-*.md 의 cell + raw/validation-metrics.json key 매핑."
  D_pit:
    status: "PARTIAL"
    note: "Adj Close 사용 (FDR — 액면분할 자동 보정). 단 vintage_policy = final_revised (point_in_time 미적용, FDR/yfinance 제한). DART 펀더멘털 부재 → PIT 측정 불가. 다음 라운드 보강."
