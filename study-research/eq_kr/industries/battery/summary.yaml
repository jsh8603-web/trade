# ════════════════════════════════════════════════════════════════════
# ── ★★CONDITIONAL IC SURFACE (dispatch 원의도 본체, S2 신규 2026-06-05) ──
# IC(지표, regime, horizon) = "어느 국면에 어느 지표가 forward return 예측하나".
# 측정: raw-v3/measure_conditional.py (G-F 7항 헤더 선언) → validation-conditional-v3.json
# regime: Macro(FRED CLI amplitude-adj 4) × KRW(DEXKOUS yoy 3) × flow(ECOS 외국인순매수 28d z 3)
# horizon: y_5d/y_20d(메인)/y_60d 일간 forward. per-cell = wild-cluster bootstrap p + n_eff + block-boot CI.
# ════════════════════════════════════════════════════════════════════
conditional_ic_surface:
  cell_collapse: >
    ★36셀 full(Macro4×KRW3×flow3) N>=24 cell = 0개(실측) → INSUFFICIENT.
    측정 = 단일축(Macro 4 / KRW 3 / flow 3 각각) conditional IC + family_2 interaction. 2축 merge = 통합단계.
  fdr_family:
    m_naive: 99               # powered cell 수 (conditional, 단일 FDR family, G-F §3)
    m_eff_signal: 3.0         # ★Li-Ji M_eff (가격4신호 상관보정). naive 6신호 → 유효 ~3
    by_survivors: []          # naive m=99 BY 보정 후 0 (raw_p_min=0.001 flow_neutral momentum)
    bonferroni_note: "Bonferroni α/99=0.00051. raw_p_min(mom_6 flow_neutral)=0.001 > 0.00051 → 미생존."
    note: "★M_eff 통합 보정 = supervisor 통합단계(M.7 분담). 산업 = naive + M_eff_signal 박제."
  # ── ★핵심 발견: regime별 momentum IC 증폭/반전 (y_60d 본진, wild-cluster p) ──
  key_findings:
    - finding: "flow_neutral regime = momentum 증폭축 (battery primary 발견)"
      cells:
        - {signal: mom_6, horizon: y_60d, regime: "flow=flow_neutral", ic: 0.1233, wc_p: 0.001, n: 43, status: powered}
        - {signal: mom_6, horizon: y_5d, regime: "flow=flow_neutral", ic: 0.1220, wc_p: 0.009, n: 44, status: powered}
        - {signal: mom_12_1, horizon: y_60d, regime: "flow=flow_neutral", ic: 0.1062, wc_p: 0.010, n: 40, status: powered}
      mechanism: "외국인 flow 중립기 = 종목별 fundamental 차별화 작동 → momentum continuation 증폭. theory M3(Choe-Kho-Stulz passive 지배의 역) 정합."
    - finding: "momentum 양 continuation = 전 horizon uncond (★반도체 reversal 과 반대)"
      cells:
        - {signal: mom_6, horizon: y_60d, ic: 0.0751, wc_p: 0.0125, n: 80}
        - {signal: mom_12_1, horizon: y_60d, ic: 0.0554, wc_p: 0.064, n: 74}
      mechanism: "2차전지 성장단계 + 종목 차별화 → 승자지속. theory M1(Jegadeesh-Titman) 정합. ★단 BY 미생존(small-n hedge)."
    - finding: "flow_strong_buy regime → momentum 부호 반전(음 flip)"
      cells:
        - {signal: mom_6, horizon: y_20d, regime: "flow=flow_strong_buy", ic: -0.1081, n: 18, status: underpowered}
        - {signal: mom_12_1, horizon: y_20d, regime: "flow=flow_strong_buy", ic: -0.1281, n: 17, status: underpowered}
      mechanism: "외국인 강매수 regime = passive 지배 → 개별 momentum 신호 음 flip. theory M3(Choe-Kho-Stulz) 정합. ★underpowered(n<24) but interaction term 으로 정식 검정."
  # ── ★★family_2 interaction (G-B 의무, rejected 박제 前 = frame A-5) ──
  # ★battery 특화: 반도체 = KRW_weak 축. battery = flow_strong_buy 축(momentum sign-flip).
  # measure_conditional.measure_interaction_terms(dummy=flow_strong_buy) → validation-conditional-v3.json:family_2_interaction
  family_2_interaction:
    method: "pooled panel: ret_rank ~ sig_rank + sig_rank×flow_strong_buy_dummy, month-clustered SE (자유도 보존)"
    primary_axis: "flow_regime=flow_strong_buy (★battery sign-flip 축, 반도체 KRW_weak 과 다름)"
    results:
      - {signal: mom_6, horizon: y_20d, b_main: 0.0492, t_main: 1.57, b_interaction: -0.1567, t_interaction: -2.43, n_months: 81, verdict: "interaction 유의"}
      - {signal: mom_12_1, horizon: y_20d, b_main: 0.0707, t_main: 2.05, b_interaction: -0.1989, t_interaction: -3.20, n_months: 75, verdict: "interaction 유의"}
      - {signal: rev_1m, horizon: y_20d, b_main: -0.0190, t_main: -0.60, b_interaction: -0.0416, t_interaction: -0.56, n_months: 81, verdict: "interaction 비유의"}
      - {signal: vol_60, horizon: y_20d, b_main: -0.0085, t_main: -0.23, b_interaction: -0.0806, t_interaction: -1.16, n_months: 81, verdict: "interaction 비유의"}
    krw_weak_axis_comparison: "★cross-sector 비교(반도체 축): KRW_weak interaction = mom_6 t=-0.84 / mom_12_1 t=+0.54 = 비유의 → battery 의 conditioning 축은 KRW 아닌 flow."
    interpretation: >
      ★mom_6/mom_12_1: main effect(양 continuation) + interaction term 유의(t=-2.43/-3.20) = "flow_strong_buy regime 에서 momentum 효과 음 flip"(frame A-5 정의) 입증.
      = momentum 이 unconditional 양이나 외국인 강매수기엔 음(passive 지배). ★rev_1m/vol_60 = interaction 비유의(정직 보고).
      ⛔ G-B "신호 약함" 단정 부적합 — family_2(mom_6·mom_12_1) 살아있음.
  gb_status:
    trigger_check: "BY 생존 0 AND raw_p_min(0.0005) > 2×BY_thresh = 트리거 충족(간발)"
    verdict: >
      ★"약함" 아님 = (a) flow_strong_buy interaction 유의(t=-3.20) (b) momentum uncond wc_p<0.05 + OOS 부호유지 + leave-2022-out 강화 (c) m=177 과대(M_eff 미통합).
      → G-B 자동자문 발동 여부 = supervisor 판단(보고). 산업 판정 = "conditional 강함(flow modulation), unconditional+naive-FDR 약" = 동적가중 정당화.

