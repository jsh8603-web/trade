    walk_forward_oos: "IS +0.1703 → OOS +0.0447 = ✅부호유지(약화)"
    source_id: "raw-v3/validation-fundamentals-cycle-v3.json:indicators.inv_ratio.horizons.y_60d"
    notes: |
      ★prior 음 → 측정 양 = REVERSED. 메커니즘 재해석: 高재고/자산 = 성장·생산확대 종목 proxy(리튬 재고 cycle 음 신호 아님).
      ★반도체 inv_ratio 와 동일 반증 패턴 = 재고/자산 = 성장 proxy 공통(memory enum). OOS 부호유지하나 약화 + size/growth confound 미분리 → TENTATIVE.

