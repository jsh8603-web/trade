# supersedes: v3 exposure-card(2026-06-03, unconditional only). 본 버전 = conditional IC surface + walk-forward OOS + 신규 cycle 지표 추가(2026-06-05).
# 반도체 파일럿(semiconductor/summary.yaml) 미러. ★battery momentum = 양 continuation (반도체 음=reversal 와 반대 부호).
# raw 재현: raw-v3/{collect, collect_dart, collect_dart_extended, collect_regime, measure, measure_valuation, measure_conditional, measure_fundamentals_cycle, measure_walkforward, merge_fdr_family}.py

industry: kr_battery          # eq_kr 12산업 中 Tier 2 (2차전지)
asset_scope: [equity.kr]
archetype: cyclical           # archetype.py DEFAULT_SECTOR_ARCHETYPE["kr_battery"] = cyclical (리튬/capex 사이클)
archetype_attestation:
  valid_from: "2019-01-01"    # ★PIT 사전선언 (§M.5 ex-post 금지)
  declared_at: "2026-06-03"
  primary_metric: ev_ebitda   # cyclical primary (단 2차전지 성장주 = 적자 多 → EV/GWh 대안 권고)
  secondary: event_driven     # IRA/FEOC 정책 event 비중 (보조, prob~0.3)
  basis: >
    리튬/capex 사이클 + EV adoption S-curve 1차 가설. ★실측 검증: cross-sectional momentum forward IC = 양
    (+0.075, 60d continuation) = ★반도체(음 reversal)와 반대 부호 = archetype cyclical 이나 cycle 위상 다름(EV 성장단계 + 종목 차별화).
as_of: "2026-05-29"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    2차전지 = cyclical(리튬 사이클) + 성장(EV S-curve). "싸다" valuation = 성장주 왜곡으로 약(PER 적자 多 무효, PBR 무신호).
    ★실측 결론: 가격기반 cross-sectional momentum(6M·12-1M)이 forward(60d 본진)에 ★양의 예측력(IC +0.075 continuation) =
    승자지속(수주·증설·고객 차별화 누적). 반도체(음 reversal)와 반대 = archetype 내 이질성. valuation 은 보조(약·비유의).
  cycle_reading: >
    2019-2026 = 리튬 hyper-cycle 1회 완주(2021-22 bull → 2023-24 down → 2025-26 bottoming) + EV 침투율 takeoff(15-20%).
    ★flow regime(외국인 passive)이 momentum IC 변조 핵심축: flow_neutral → momentum 증폭(IC +0.123), flow_strong_buy → 음 flip.
  estimation_note: >
    2026-05 시점: 측정 cross-section 29종(시총≥3000억∧ADV floor). ★breadth 작음(반도체 85종 1/3) → magnitude 보수 cap.
    momentum 시변 IC = flow regime 함수 → derive_weights w∝Θ_signal·IC 동적가중(통합 단계). 본 산출 = 측정 + conditional surface.

# ── 블록2 INDICATORS (forward 횡단면 Rank-IC, horizon-tagged, 일간) ──
