weight_rule_candidates:
  - indicator_id: cs_mom_6m
    base_weight_range: [0.04, 0.12]   # ★양의 IC continuation → weight 부호 양. CI 반영 보수 range(breadth 29종 hedge).
    modulate_by: [archetype, regime, cycle_phase]
    direction: >
      cross-sectional 6M 모멘텀 z 상위(많이 오른) 종목 overweight (continuation, peer-relative). long-only-implementable.
      ★flow regime modulation 필수: flow_neutral 증폭 / flow_strong_buy 음 flip(passive 지배) → weight 축소·반전.
    granularity: cross_sectional
    gate_status: {n: pass, se: pass, power: pass, fdr: fail, oos: pass}  # ★G2(BY/Bonferroni) FAIL = 반도체와 동일
    source_ids: ["raw-v3/validation-conditional-v3.json:conditional_ic_surface.mom_6.y_60d"]
    hedge_note: >
      n=80 months Tentative tier + breadth 29종 small. wc_p=0.0125 + OOS 부호유지 + leave-2022-out 강화 = 방향 안정적.
      ★FDR 게이트 FAIL(merged m=177 BY 미생존) → supervisor conservative cap + flow-regime modulation 조립 시 hedge weight.

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 ──
confidence_hooks:
  - hypothesis_id: battery_cs_momentum_continuation
    affects_indicator: cs_mom_6m
    affects_edge: [cs_mom_6m, battery_fwd_60d]
    confirm_signal: "live 횡단면 6M 모멘텀 z 상위 종목의 60d forward rank > 하위 유지 (rolling 12M, continuation 지속, flow_neutral regime)"
    reject_signal: "Rank-IC e-CUSUM 부호 반전 붕괴 (IC 양→음 전환 누적 K=3 month = momentum crash/reversal 전환, Daniel-Moskowitz)"
    emit_where: "panel-score-IC 축 (backtest SELL 아님)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 → cross-sectional momentum base_weight 변동 (부호 양 유지 조건)"
    action_threshold: "e-value > 1/alpha=20 → retract(live 차단) / 회복 = score_ic_recovery_eprocess"
  - hypothesis_id: battery_flow_strong_buy_momentum_flip
    affects_indicator: cs_mom_6m
    affects_edge: [cs_mom_6m, battery_fwd_20d]
    confirm_signal: "flow_strong_buy regime 진입 시 momentum IC 음으로 flip (interaction t<-2, passive 지배)"
    reject_signal: "flow_strong_buy 에서 momentum IC 양 유지 (interaction |t|<1 = passive 지배 가설 소멸)"
    emit_where: "regime-conditional weight modulation 축"
    accumulate_in: "core/assume/weight_falsification.flow_regime_interaction_eprocess"
    feeds_weight: "flow regime 따라 momentum weight 부호 modulation"
    action_threshold: "interaction OOS t 부호 반전 누적 → flow modulation 제거"

