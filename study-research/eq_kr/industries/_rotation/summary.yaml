# ★valuation-band track (team-lead 명시 + plan "지표 이연 금지" 이행, measure_rotation_valband.py)
# 산업 aggregate PBR(PIT, Σ시총/Σequity rcept_dt 이후) → rolling z(24M) → forward 예측.
# ════════════════════════════════════════════════════════════════════
valuation_band:
  method: "산업 aggregate PBR = Σ(price×shares_approx) / Σ(equity, DART rcept_dt 이후 PIT) → rolling z(24M) → forward"
  caveat: "★shares_approx = Marcap/최근종가 근사(PIT shares 부재 = collector_plan) → PBR level 절대값보다 z-score(상대) 신뢰."
  tradeable_oos_eligible:   # OOS 부호유지 산업만 (rotation valuation 신호)
    - {industry: chemical, horizon: y_60d, rho: 0.448, oos: "IS +0.49 → OOS +0.58 (강화)", direction: "★양 = PBR 高→forward 강세 = mean-reversion 아닌 성장/추세 프리미엄(mom_3 양과 일관). status: underpowered"}
    - {industry: steel, horizon: y_60d, rho: -0.145, oos: "IS -0.03 → OOS -0.29", direction: "음 = valuation mean-reversion(비싸면 약세). underpowered"}
    - {industry: consumer, horizon: y_60d, rho: -0.092, oos: "IS -0.12 → OOS -0.14", direction: "음 = 내수 valuation reversion. 약. underpowered"}
    - {industry: battery, horizon: y_60d, rho: 0.196, oos: "IS +0.32 → OOS +0.38", direction: "양 = 성장 프리미엄. underpowered"}
  rejected_oos_flip:        # OOS 부호 불안정 (valuation band 부적합 산업)
    - {industry: telecom, note: "y_60d IS-0.59→OOS+0.61 flip = valuation band 부적합(통신=carry tilt 권고와 정합)"}
    - {industry: aitech, note: "IS+0.52→OOS-0.23 flip"}
    - {industry: shipbuilding, note: "IS-0.63→OOS-0.08 약화 flip"}
    - {industry: auto, note: "IS+0.27→OOS-0.41 flip"}
    - {industry: financial, note: "INSUFFICIENT = 은행 equity 특성상 PBR 부적합 + 데이터 부족(pbr n<36)"}
  verdict: >
    ★valuation-band = 일부 산업만 OOS 견고(chemical 양/steel·consumer 음). 다수 OOS flip(telecom/aitech/shipbuilding/auto)
    = 산업별 valuation 부호 불안정 = momentum/rel_mom 대비 약신호. FDR 생존 0(전부 underpowered). ★chemical 은
    valuation(양)+momentum(양) 일관 = 추세 산업. = valuation-band 는 momentum/rel_mom 의 보조 confirm 용도(독립 primary 아님).
  fdr_valband: {m_powered: 0, survivors_BY: [], note: "powered cell 0 = 전부 underpowered (small-n + 60d overlap)"}

