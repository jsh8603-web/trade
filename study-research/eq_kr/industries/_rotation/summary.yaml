# ★단일 FDR family (G-F §3, plan §10 "12산업×지표 multiplicity 큼, BY 엄격")
# ════════════════════════════════════════════════════════════════════
fdr_family_single:
  m_powered: 1                    # powered cell(t_obs≥2.802 AND n≥24 AND n_eff≥6) = financial cli_chg 1개만
  survivors_BY: [financial__cli_chg__y_60d]
  raw_p_min: 0.0005
  by_note: >
    ★powered 게이트(MDE breakeven t_obs≥2.802) 통과 = financial cli_chg 1개. 나머지 rotation 신호는
    underpowered(small-n, 60d overlap eff_N 작음) = BY family 미진입. ★G-G v2 핵심: underpowered ≠ 신호부재 =
    MDE/power artifact. OOS 부호유지(eligibility) + non-overlap 견고 + placebo<0.05 = tradeable 후보(conviction 약).
  ⛔주의: "60d horizon overlapping → asymptotic t 과대 위험. non-overlap sub-sample IC(stride=3M)로 교차검증 = 부호 일관 확인 완료(robustness)."

