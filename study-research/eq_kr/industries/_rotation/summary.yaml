    verdict: "★FAIL = monitor-only(rotation 비중 0). over-trade 차단(약신호 강제투입 금지, G-G v2). bio 종목선택(capsule) 별도 활용."

# ════════════════════════════════════════════════════════════════════
# ★gated 설계 (자문 gemini+claude 수렴 — over-trade 차단, plan §10 S5.5)
# ════════════════════════════════════════════════════════════════════
gated_design:
  rationale: "rotation 신호 대부분 underpowered(small-n) + BY 미생존 = 약신호. 강제 투입 = over-trade. 자문 gated 설계로 sizing 보수화."
  components:
    - {name: default_weight_zero, desc: "rotation 신호 무발현 시 산업 비중 = static sleeve 기본(rotation tilt 0). 약신호=무포지션=무거래."}
    - {name: hysteresis_dead_band, desc: "상단 진입(신호 강) · 하단 이탈(신호 약) 비대칭 임계 → 중립대 whipsaw 차단. rank-space 히스테리시스(거래 빈도 억제)."}
    - {name: cost_aware_no_trade, desc: "★net-alpha gate(return-space): 기대 rotation α > k×roundtrip_cost 일 때만 rebalance. thin KR name 고비용이 marginal trade 자연 억제. dead-band 와 별 공간(결합 운용)."}
    - {name: live_oos_falsification, desc: "Rank-IC e-CUSUM / precision drift → sleeve weight downward-only attenuation 연동. 죽은 신호 자동 0 수렴."}
    - {name: telecom_dividend_carry, desc: "★통신 = timing 보다 dividend-carry/quality 정적 tilt primary(자문) + 규제 event blackout. rotation timing 은 보조."}
  net_cost:
    roundtrip_bps: 23.0            # STT_sell 0.20% + 편도수수료 0.015%×2 (KR 비대칭, 매도측 STT)
    monthly_cost_bps: 11.5        # turnover 0.5/월 가정 (rotation=sleeve-level, 종목선택보다 낮음)
    note: "rotation tilt magnitude |rho| 0.2~0.36 = 약~중. net-alpha 보존 marginal → cost-aware no-trade 필수. sqrt impact = 통합단계."
  ⛔미접촉: "weight 차등·sizing·배선(WIRE5) = supervisor 통합단계(study_session.yaml). 본 capsule = 측정+gated 설계 권고만. go-live 미접촉."

