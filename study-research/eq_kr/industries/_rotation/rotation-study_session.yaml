# rotation-study_session.yaml — S7 통합 rotation 배선 (cross-industry rotation 최종)
# ⛔ 점추정 prior 박제 금지 — 분포 + CI + gate. small-n hedge(전 신호 underpowered = magnitude tentative).
# ⛔ go-live·실주문·WIRE5 push 미접촉 (monitor-only weight 0, 사람게이트 D1~D5).
# ★입력 = 12산업 rotation-signals.md(각 analyst 이론→통계 verdict) + S6 residual-PCA sleeve(k=2) + 자문 RESULTS B~F.
# raw 재현 = measure_integration.py(residual N_eff+clustering+좀비마스킹) + measure_pca_sleeve.py(D1~D7).

scope: eq_kr_rotation_integration
layer: 2_dynamic_rotation_tilt          # 1층 자산배분 / 2층 sleeve(static RP + ★동적 rotation tilt) / 3층 종목 selection
unit: industry_eq_weight_panel          # strict universe (refining=strict2 교체, 좀비 마스킹)
as_of: "2026-05-29"
integrated_at: "2026-06-06"
panel_window: "2019-01 ~ 2026-05 (88~89 월)"
go_live: 미접촉                          # ★실주문·push = 사람게이트 (D1~D5)

# ════════════════════════════════════════════════════════════════════
# §1. 2층 rotation × 3층 selection 배선식 (자문 D, double-count 회피)
# ════════════════════════════════════════════════════════════════════
combination_formula:
  capital_weight: "w_j = W_i(rotation L2) × v_{j|i}(종목 selection L3, Σ_j v=1)"   # ★곱 = fund-of-sleeves
  double_count_회피:
    rule: "★L3 selection 신호 = 산업 내 macro-neutral demean → 산업 자체 KRW/flow beta 제거. macro exposure 전부 L2 소유, L3=idiosyncratic selection alpha만"
    L축_1회계상: "★telecom tradeable '외국인flow' = 전산업 공통 인자 = 2층 sleeve 배분에서 1회 계산 → telecom 고유 rotation 중복 계상 ⛔금지. telecom 진짜 고유 = semi_ppi(반도체 cycle 방어) 한정"
    cli_chg_분리: "cli_chg(경기선행) = MACRO 공통(12산업 거의 동일, N_eff≈1) = ★1층 자산배분 성분(시장 timing). 산업 rotation 차등 아님 → L2 rotation tilt 에서 제외"
  검증: "조립 후 portfolio net common-factor(KRW/flow/export) exposure 산출 → 의도 L2 tilt 대조. 실현 KRW beta > 의도면 L3서 neutralize. attribution: r_p−r_base ≈ ΣΔW_i·r_i(L2) + ΣW_i·intra(L3) + interaction(L3 macro-neutral → 작음=double-count 없음 증명)"

# ════════════════════════════════════════════════════════════════════
# §2. sleeve 구조 (S6 residual-PCA k=2 확정 + sub-singleton gating)
# ════════════════════════════════════════════════════════════════════
sleeve_structure:
  source: "measure_pca_sleeve.py D1~D7. ★residual PC1 분산 50.4% + k*(parallel)=1 = 깨끗 분리 약함 → 보수 k=2"
  k_star: {parallel_analysis: 1, marchenko_pastur: 1, note: "noise선 넘는 PC=1개 = 한국 공통인자(외국인flow) 지배 극심"}
  sleeves:
    - {id: export_cyclical, members: [semiconductor, auto, financial, battery, chemical, refining, shipbuilding, steel, consumer], label: "수출 cyclical (외국인flow+글로벌 수요 동조)", pc: PC1}
    - {id: defensive_it, members: [bio, telecom, aitech], label: "방어·IT (공통인자 노출 약, idiosyncratic)", pc: PC2}
    # ★financial/consumer = validation D3 varimax PC1 블록 포함(잔여 flow 노출). 단 hierarchical clustering k=4 = {financial,consumer} 내수금융 = sub-cluster 후보(S7+ 재검, 현 k=2서는 export_cyclical 소속)
  bio_singleton: "★bio = residual 상관 전산업 <0.27 + PC2 방어 블록 = singleton 격리 (임상 idiosyncratic). 별도 sleeve 또는 PC2 내 독립"
  sub_singleton_gating: "★refining/shipbuilding = export sleeve 묶임(strict2도 flow 잔여 noise) → sleeve 멤버지만 ★고유 cycle 신호 발현 시만 독립 tilt, 평소 sleeve risk-parity (자문 idiosyncratic 보존 + 데이터 묶임 타협)"
  caveat: "★k=4(clustering) PC2+ noise선 미달 = spurious 위험 → sleeve 잘게 쪼개기보다 k=2 + sub-gating. S6 subsample 안정성 0.755(spurious 아님)"

