# ════════════════════════════════════════════════════════════════════
# §4. hierarchical sleeve-gatekeeping FDR (자문 E, flat BY 금지)
# ════════════════════════════════════════════════════════════════════
fdr_design:
  rule: "★flat BY(12×K) = power 학살(N_eff~3.5인데 12K 평탄보정). 2단계 hierarchical:"
  step1_sleeve_level: "sleeve-level FDR (2 sleeve × K, 고power) 먼저 test"
  step2_within_sleeve: "통과 sleeve 만 within-sleeve local FDR (Yekutieli 2008 conditional)"
  program_dsr: "★program-level DSR/PSR = 12산업 × 신호 × regime축 전체 시도 config forking-path → 단일 deflated SR = 'rotation 프로그램 켤지' conviction gate (per-sleeve FDR 와 별개)"
  현단계: "sleeve 미확정 단계 = sleeve 구조 제안(k=2) + FDR 설계. 실제 sleeve-gatekeeping 적용 = supervisor 통합 yaml(본 yaml 입력)"
  ⛔: "현 단일 BY 측정값(각 산업 미생존)은 hierarchical 미적용 = power 과소 = magnitude tentative 주 원인. hierarchical 적용 시 survivor 증가 가능(supervisor)"

# ════════════════════════════════════════════════════════════════════
# §5. gated 설계 (자문 C, over-trade 차단)
# ════════════════════════════════════════════════════════════════════
gated_design:
  base: "sleeve-level residual risk-parity (각 sleeve 등위험, bio singleton 도 한 sleeve몫 risk budget=자연 floor). 등위험≠등weight"
  tilt: "★additive-on-active-share + clip 병행 (multiplicative ⛔금지=low-base singleton refining서 gate 열려도 tilt≈0 구조함정). per-name clip(Δmax) + active-share budget(Σ|Δw|≤τ, τ≈20-40%)"
  over_trade_3중:
    - "① hysteresis no-trade band (|s_new−s_cur|>band 일 때만 rebalance)"
    - "② persistence (regime k개월 지속 or EWMA)"
    - "③ ★cost-aware gate (기대 tilt benefit > turnover cost, KR STT 0.2% 비대칭 매도측). 소형시장 sector-timing = cost gate 가 주 필터"
  kappa: "κ(공격성) = program DSR × N_eff(3.5, floor=3 cap) × live-OOS falsification(Rank-IC e-CUSUM reject 시 κ→0 decaying). 약신호 sleeve κ→0 default"
  tilt_capacity: "standalone IC/Sharpe 신뢰도 (★base weight 비례 금지). 약신호=conservative cap"
  monitor_only: "shipbuilding = default weight 0 (rotation tilt 0). financial=credit_spread gated overlay(default 0, 신용 spread 확대 국면만 UW tilt)"
  net_cost: {roundtrip_bps: 23.0, monthly_cost_bps: 11.5, note: "turnover 0.5/월, rotation=sleeve-level(종목선택보다 낮음). |IC| 0.25~0.43 vs cost → cost-aware 필수. sqrt impact=통합 후"}

# ════════════════════════════════════════════════════════════════════
# §6. N_eff (false breadth 정량, 자문 B)
# ════════════════════════════════════════════════════════════════════
n_eff:
  raw: {value: 3.01, ci95: [2.45, 3.92]}
  residual: {value: 3.52, ci95: [2.79, 4.53]}     # 공통인자 제거 후 participation ratio
  pc1_var: {raw: 0.555, residual: 0.504}
  mean_pairwise: {raw: 0.504, residual: 0.446}
  verdict: "★residual N_eff ≈ 3.5 = 자문 '진짜 독립차원 ~3-4' 입증. 12산업 개별 rotation=false breadth. ★동시 active tilt 수=floor(3.5)=3 cap. bet sizing=N_eff scale(n=12 아님)"
  zombie_masking: "★audit minor1: 좀비(obs_ratio<0.5 OR nonzero<0.3) 마스킹 후 N_eff 거의 불변(3.49→3.52) = robust"

