    6M/12M OOS 반전 재현, 흑전 +294% 착시 실증) — 진짜 신호를 죽인 것 아님. capex 무신호 = multiplicity 인식한
    정직 보고. 구조적 약(PC1 74.5% + 상관 0.66) = 방법 결함 아닌 신호 본질. vol_60 TENTATIVE 적정. over-claim 0.
    G-C 통과. G-G v2 = PASS-conditional 최약(monitor-only + 보강 권고). 코드화 진행 시 conservative cap.
