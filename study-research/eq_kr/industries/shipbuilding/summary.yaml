# ════════════════════════════════════════════════════════════════════
# ── ★★CONDITIONAL IC SURFACE (dispatch 원의도 본체, S2) ──
# IC(지표, regime, horizon) = "어느 국면에 어느 지표가 forward return 예측하나".
# 측정: raw-v3/measure_conditional.py (G-F 7항 헤더 선언) → validation-conditional-v3.json
# regime: Macro(FRED CLI amplitude-adj 4) × KRW(DEXKOUS yoy 3) × flow(ECOS 외국인순매수 28d z 3)
# ════════════════════════════════════════════════════════════════════
conditional_ic_surface:
  cell_collapse: >
    ★36셀 full(Macro4×KRW3×flow3) N>=24 cell = 0개(실측, 최대 N=18) → INSUFFICIENT.
    측정 = 단일축(Macro 4 / KRW 3 / flow 3 각각) conditional IC + family_2 interaction.
  fdr_family:
    m_naive: 87
    m_eff_signal: 3.0         # ★Li-Ji M_eff (가격4신호 상관보정). naive 6신호 → 유효 ~3
    by_survivors: []          # ★naive m=87 BY 보정 후 0 (raw_p_min=0.065 = 전부 비유의)
    bonferroni_note: "Bonferroni α/87=0.00057 로도 0건. raw_p_min=0.065(mom_6 y_5d uncond) = ★전 신호 비유의."
    note: "★조선 = unconditional·conditional 전부 BY/Bonferroni 미생존. M_eff 통합 = supervisor."
  key_findings:
    - finding: "★vol_60(저변동성) = 유일 OOS 생존 신호 (low-vol anomaly)"
      cells:
        - {signal: vol_60, horizon: y_20d, regime: unconditional, ic: -0.0568, wc_p: 0.1284, n: 81, status: powered, ci95: [-0.129, 0.0202]}
        - {signal: vol_60, horizon: y_20d, regime: "macro=Reflation", ic: -0.1546, wc_p: 0.03, n: 20, status: underpowered}
        - {signal: vol_60, horizon: y_20d, regime: "flow=flow_neutral", ic: -0.0884, wc_p: 0.088, n: 43, status: powered}
      mechanism: "deep-cyclical 저변동 종목 forward 우위(low-vol anomaly). Reflation/flow_neutral서 증폭. ★단 BY 미생존."
    - finding: "★momentum = OOS 소멸 (cyclical reversal 약)"
      cells:
        - {signal: mom_6, horizon: y_20d, ic: -0.0416, wc_p: 0.2874, n: 81, oos: "IS -0.073 → OOS -0.008 소멸"}
      mechanism: "momentum 음(약 reversal, cyclical 정합 방향) but OOS 거의 0 = 슈퍼사이클 구간 momentum 전환. battery(양)와 반대."
    - finding: "★valuation(pbr/per) = OOS 반전 또는 degenerate artifact"
      cells:
        - {signal: pbr_z, horizon: y_20d, ic: -0.0119, oos: "IS -0.038 → OOS +0.016 ★반전"}
        - {signal: per_z, horizon: 24M_value, ic: 0.2041, t_nw: 4.47, avg_universe_n: 6.9, note: "★BY 생존했으나 artifact (아래 critique_validation)"}
      mechanism: "PER 적자/peak trap(H3) + 24M degenerate + 흑자7종 small-universe = artifact. PBR OOS 반전."
  # ── ★★family_2 interaction (G-B 의무, rejected 박제 前 = frame A-5) ──
  family_2_interaction:
    method: "pooled panel: ret_rank ~ sig_rank + sig_rank×KRW_weak_dummy, month-clustered SE (자유도 보존)"
    results:
      - {signal: mom_6, horizon: y_20d, b_main: -0.0746, t_main: -1.37, b_interaction: 0.0846, t_interaction: 1.14, n_months: 81, verdict: "interaction 비유의"}
      - {signal: mom_12_1, horizon: y_20d, b_main: -0.0348, t_main: -0.56, b_interaction: 0.0147, t_interaction: 0.18, n_months: 81, verdict: "interaction 비유의"}
      - {signal: rev_1m, horizon: y_20d, b_main: -0.0412, t_main: -1.00, b_interaction: 0.0093, t_interaction: 0.14, n_months: 81, verdict: "interaction 비유의"}
      - {signal: vol_60, horizon: y_20d, b_main: -0.0813, t_main: -1.75, b_interaction: 0.0641, t_interaction: 0.87, n_months: 81, verdict: "interaction 비유의"}
    interpretation: >
      ★조선 = KRW_weak family_2 interaction 전부 비유의 (반도체와 차이 — 반도체는 mom_6/rev_1m t=-2.95/-2.33 유의).
      = "국면 따라 신호 효과 갈림"(A-5)이 ★조선엔 미입증. sign-flip 28건 있으나 interaction term 정식 측정 = 전부 비유의.
      ★G-B "약함" 단정 前 family_2 검정 의무 이행 → family_2도 비유의 = 신호 본질 약(방법 결함 아님 = H9 산업베타 지배).
  gb_status:
    trigger_check: "★BY 생존 0/87 AND raw_p_min(0.065) > 2×BY_thresh = ★G-B 트리거 충족"
    verdict: >
      ★G-B 트리거 충족 (BY 0 + 약신호). ★단 family_2 interaction 검정 의무 이행 = 전부 비유의 +
      Gemini 리서치(H9 산업베타 지배) = "방법 결함 아닌 신호 본질 구조적 약" 강한 근거. → team-lead G-B 자문 발동 여부 판정 보고.
      ⛔ 단정 회피 = "신호 약함" 대신 "tradeable 약(vol_60 방향 prior만, BY 미생존) + 산업베타 지배 = cross-sectional 구조적 약(H9 학술 정합)".
  # ── ★비판검토 실측 (S6 방어) ──
  critique_validation:
    - critique: "per_z 24M IC +0.204(t=4.47, BY 생존) = 진짜 신호인가?"
      test: "walk-forward OOS(6M/12M/24M) + within-period + avgN + 24M overlap eff_N"
      result: "per_z 6M IS-0.132→OOS+0.086 ★반전 / 12M IS-0.120→OOS+0.140 ★반전 / 24M 부호유지(양). avgN=6.9(흑자7종). within-period 2020-21 적자전환기 IC +0.16~+0.33"
      verdict: >
        ★artifact 확정 = (a) 6M/12M OOS 부호반전(불안정) (b) avgN 6.9 = 흑자 7종 한정 small-universe inflation
        (c) 24M overlap eff_indep_N=61/24≈2.5 degenerate(frame §M.12) (d) 적자→흑자 전환+슈퍼사이클 구간 표본 지배.
        = ★BY 생존했으나 tradeable 자격 X (frame §M.12 격하 의무). per_z 양 IC = "적자기 PER무효 종목 흑자전환 후 급등" 착시.
    - critique: "vol_60 low-vol = microcap artifact 아닌가? (협소 universe)"
      test: "유동성-티어 IC (strict 9종 vs 전체 16종) + cap 점검"
      result: "strict tier(고유동성 9종) IC -0.078(wc_p=0.096) > 전체 16종 -0.057 = ★대형주서 더 강"
      verdict: "★microcap artifact 아님(대형주서 강). 단 BY 미생존 = 방향 prior만(magnitude 비유의)."
    - critique: "H9: 산업 베타 지배 → cross-sectional selection 구조적 약?"
      test: "조선 산업 eq-weight 누적수익(슈퍼사이클) + cross-sectional IC 강도 + 전 신호 BY 생존"
      result: "산업 누적 2022→2025 5.09x(슈퍼사이클) + cross-sectional 전 신호 BY 생존 0 + 종목 상관 高"
      verdict: "★입증 = 산업 베타(timing) 지배 → cross-sectional alpha 구조적 약. Gemini 리서치(Maritime Economics)·실측 정합. = 신호 본질 약(방법 결함 아님)."
  # ── ★S5 역공격 (최강 반증 직접 투척 → 수렴) ──
  adversarial_s5:
    target: "vol_60 low-vol (유일 OOS 생존 신호)"
    attacks:
      - {attack: "단일 슈퍼사이클 episode(2023-25) 종속?", test: "walk-forward IS(2019-22)/OOS(2023-26)", result: "IS -0.065 → OOS -0.049 부호+magnitude 유지", verdict: "부분 기각(OOS 생존)"}
      - {attack: "microcap 협소 universe artifact?", test: "strict tier 9종", result: "strict -0.078 > 전체 -0.057(대형주 강)", verdict: "기각(artifact 아님)"}
      - {attack: "★magnitude 유의한가?", test: "block-boot CI + wild-cluster p", result: "CI [-0.129, +0.020] ★0 포함 / wc_p 0.128 > 0.05", verdict: "★magnitude 비유의 = 방향 prior만(TENTATIVE)"}
    convergence: >
      ★vol_60 = 방향(low-vol) OOS 생존 + microcap 아님 = 방향 prior 견고. ★단 magnitude 비유의(CI 0포함+BY 미생존) =
      TENTATIVE DIRECTIONAL. = 조선 cross-sectional 신호의 ★구조적 약함(H9) 정합. S5 수렴 = "방향 있으나 약".

# ── ★신규 cycle 지표 (재고/CAPEX/R&D, ★이연 금지 = 측정완료) ──
# ★★capex 부호 prior 재검토 (team-lead capex 일반화 = 조선 orderbook 특수성)
fundamentals_cycle:
  source: "DART dart_extended.parquet (16종 371rows, coverage inv 92%/ppe 100%/intangible 84%). PIT rcept_dt."
  measured: "★사용자 박제 '이연 금지' 이행 — 불확실해도 지금 측정 + verdict 박제."
  capex_generalization_verdict:  # ★team-lead 핵심 관심사
    question: "자동차/반도체 capex_ratio 음 prior(asset growth anomaly, structural_high)가 조선에 적용되나?"
    조선_특수성: "조선 = orderbook(수주잔고) 기반 → asset growth 가 (a)과잉투자 음 (b)수주확대 양 = ★two-sided (one-sided 단정 금지)"
    result: "capex_ratio uncond IC +0.0034(wc_p=0.91 비유의) / ppe_yoy uncond IC -0.029(wc_p=0.37 비유의, 약한 음=일반론 방향)"
    verdict: >
      ★조선 capex_ratio = ★무신호 (IC≈0, 비유의). 자동차/반도체의 음 prior asset growth anomaly 가 조선엔 ★약하게도 미발현.
      ppe_yoy 만 약한 음(일반론 방향) but 비유의. = ★capex 일반화 가설은 조선에 ★미적용 (two-sided 였던 게 데이터로 "무신호" 판정).
      메커니즘: 조선 산업 베타 지배(H9) + 슈퍼사이클 구간 = capex 부호효과가 산업 timing 에 압도됨. ★one-sided 단정 회피한 게 정답.
  indicators:
    - {id: capex_ratio, family: asset_growth, prior: "two-sided(음약+양가능)", ic_y20d: 0.0034, wc_p_y20d: 0.91, verdict: "INSUFFICIENT(무신호, capex 일반화 ★조선 미적용)"}
    - {id: ppe_yoy, family: asset_growth, prior: "two-sided", ic_y20d: -0.029, wc_p_y20d: 0.37, verdict: "INSUFFICIENT(약한 음=asset growth 일반론 방향이나 비유의)"}
    - {id: inv_ratio, family: inventory, prior: "two-sided(양가능:재공품)", ic_y20d: 0.0142, wc_p_y20d: 0.67, verdict: "INSUFFICIENT(약한 양=재공품 가설 방향이나 비유의)"}
    - {id: inv_yoy, family: inventory, prior: "two-sided", ic_y20d: 0.0121, wc_p_y20d: 0.75, verdict: "INSUFFICIENT(비유의)"}
    - {id: rnd_ratio, family: rnd, prior: "양(친환경선기술)", ic_y20d: -0.013, wc_p_y20d: 0.74, verdict: "INSUFFICIENT(비유의, prior 양과 약하게 반대)"}
  verdict: >
    ★신규지표 전부 비유의(BY 미생존, m=78 survivors=0). capex_ratio 무신호 = ★capex 일반화 가설 조선 미적용(two-sided→무신호).
    = 정직 박제(over-claim 0). 사용자 "이연 금지" 이행. 조선 = 펀더멘털 cross-sectional 신호도 ★약(산업베타 지배 H9).
  fdr_family_merged:  # ★team-lead 순서3: 단일 FDR family 합산
    m_total: 165
    composition: "conditional 87 + fundamentals 78"
    survivors_BY: 0
