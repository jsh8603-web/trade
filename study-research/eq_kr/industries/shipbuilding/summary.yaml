# ── ★섹터 timing 부활 측정 (team-lead 지시 2026-06-05, frame M2 시계열) ──
# cross-sectional 종목선택 아님 = "조선 산업 PBR 밴드 저밴드→비중↑, 고밴드→↓" (정유 유가 mean-reversion 동형)
# 측정: raw-v3/measure_sector_timing.py → validation-sector-timing-v3.json
# ════════════════════════════════════════════════════════════════════
sector_timing:
  method: "산업 합산 PBR(Σ시총/Σ자본, PIT rcept_dt) rolling36M z-score → 산업 eq-weight forward return. cross-sectional 아닌 시계열 timing."
  pbr_band: "PBR 범위 0.58x(2020 불황)~5.34x. 현재(2026-05) 4.36x = ★역사밴드 크게 초과(슈퍼사이클 정점). PBR_z 현재 +1.19(밴드 상단)."
  signal_test: "저밴드(낮은 PBR_z)→고 forward = IC 음(mean-reversion 가설). horizon 1M/3M/6M/12M."
  results:
    - {horizon: 1M, ic: -0.0985, wc_p: 0.4863, n: 67, n_eff: 10.0, ci95: [-0.206, 0.178], oos: "IS -0.488→OOS -0.026 부호유지(소멸)"}
    - {horizon: 3M, ic: -0.0285, wc_p: 0.7876, n: 65, n_eff: 9.6, ci95: [-0.287, 0.445], oos: "IS -0.662→OOS -0.024 부호유지(소멸)"}
    - {horizon: 6M, ic: 0.0875, wc_p: 0.1524, n: 62, n_eff: 9.5, oos: "IS -0.850→OOS +0.249 ★부호반전"}
    - {horizon: 12M, ic: 0.3734, wc_p: 0.0005, n: 56, n_eff: 11.3, ci95: [0.003, 0.729], oos: "IS -0.582→OOS +0.412 ★부호반전", note: "★BY 생존(m=18)했으나 artifact"}
  fdr_family:
    m: 18
    survivors_BY: ["pbr_band__12M__uncond", "pbr_band__12M__flow_neutral", "pbr_band__12M__KRW_weak"]
    raw_p_min: 0.0005
    note: "★12M BY 생존 3건 = ★artifact (walk-forward 부호반전). per_z 24M 동일 패턴(BY생존≠tradeable)."
  verdict: >
    ★PBR 밴드 timing = ★부활 실패 (측정했으나 약/불안정). (1) 12M IC +0.373 BY 생존했으나 ★artifact:
    walk-forward IS 음(-0.582 mean-reversion 정상방향)→OOS 양(+0.412) = ★슈퍼사이클 trend 가 mean-reversion 뒤집음
    (2024-06 PBR_z +1.88 高밴드 → 12M_fwd +104.6% = 高PBR서 폭등). (2) 1M/3M = OOS 부호유지(음=mean-reversion)하나
    IS 극단(-0.49/-0.66, n=27 small)→OOS 거의 0(-0.026/-0.024) = 소멸. (3) n_eff 10(PBR_z 강한 persistence) = 통계력 약.
    ★결론 = 조선 섹터 timing 도 cross-sectional 처럼 ★약. mean-reversion 가설이 2023-26 슈퍼사이클 구간에서 반전.
    = ★섹터 timing sleeve 격상 ★불가 (종목선택 0 + 섹터 timing 도 불안정). 현재 PBR 4.36x 역사밴드 초과 = mean-reversion 신호로는
    "고평가"이나 trend 는 상승 = 신호 충돌. ★정직 박제: 측정했으나 약(deferral 아님). 슈퍼사이클 종료 후 OOS = 미래 보너스.
  sector_timing_gg_v2: >
    ★G-G v2 = PBR 밴드 timing tradeable 자격 ★X (12M artifact + 1M/3M 소멸). = 조선 종목선택 0 + 섹터 timing 도 약
    → ★PASS-conditional 최약~FAIL 유지(team-lead 판정 정합). 섹터 timing sleeve 격상 불가. monitor-only(슈퍼사이클 정점 경계 = de-risk 참고용).

