# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge 어휘, BY 보정, LOO/block-boot).
# 산출 범위 = §M.7 exposure card (측정 전용). semiconductor summary.yaml 미러.
# raw 재현: raw-v3/{collect, measure_conditional, measure_valuation, measure_fundamentals_cycle, measure_cross, merge_fdr_family}.py

industry: kr_shipbuilding     # eq_kr 12산업 中 Tier 3 (조선)
asset_scope: [equity.kr]
archetype: cyclical           # ★orderbook(수주잔고) 기반 deep-cyclical (운임→수주→선가 cycle). 반도체(ASP)·battery(growth)와 다른 sub-type
archetype_attestation:
  valid_from: "2019-01-01"    # ★PIT 사전선언 (§M.5 ex-post 금지)
  declared_at: "2026-06-05"
  primary_metric: ev_ebitda   # cyclical primary. ★조선 = PBR 밴드 보조 (PER 적자/peak trap)
  secondary: null
  basis: >
    ★조선 = deep-cyclical (orderbook 수주 cycle). 실측 검증: 산업 베타 지배(2022→2025 누적 5.09x 슈퍼사이클),
    cross-sectional selection 신호 ★구조적 약(H9 입증). momentum 음(약 reversal)·저변동성 음(low-vol)이 cyclical 정합.
    PER cross-sectional 무효(적자/peak trap, H3) = deep-cyclical 정합. universe 협소(16종) = breadth 부족.
as_of: "2026-05-31"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    조선 = deep-cyclical. "싸다" = PBR 밴드 하단(저점 0.5x, 정점 1.5-2x). ★PER ✗ (적자기 분모 음 / 정점기 저PER 함정 =
    Damodaran value trap, H3 실증). 주가가 실물지표(운임·수주)보다 ★선행 → 운임 lagged forward 예측력 약(H8 REJECTED).
    ★핵심 = 산업 베타(슈퍼사이클 timing) 지배 → cross-sectional selection alpha 구조적 약(H9, Maritime Economics §cycle).
  cycle_reading: >
    2019-2026 = 불황(2019-21 저가수주 적자)→회복(2022 흑자전환)→슈퍼사이클(2023-25 고선가 수주 인식, LNG/친환경선).
    적자 종목수: FY2021 7종/FY2022 6종 → FY2024 0종(전종목 흑자). = PER cross-sectional 시기별 무효 구간 多.
    현 시점(2026-05) = 슈퍼사이클 정점 부근(선가 고점, 후판 원가 부담 cycle 후반 진입 가능).
  estimation_note: >
    2026-05 시점: universe 16종(시총≥1000억 ∧ ADV≥5억, ★floor 완화 — strict 3000억/30억 통과 9종뿐 = 협소 universe 대응).
    조선 4대장(HD현대중공업/한화오션/삼성중공업/HD한국조선해양) + 엔진(한화엔진/HD현대마린엔진/STX엔진) + 기자재.
    ★small breadth hedge: 반도체 85종/battery 29종 대비 구조적 breadth 부족 → magnitude 보수 cap + 단정 금지.

# ── 블록2 INDICATORS (forward 횡단면 Rank-IC, horizon-tagged) ──
# ★점추정 금지: ic_mean + ic_ci_95(block-boot ∧ NW) + n_effective + oos(walk-forward)
# ★조선 = tradeable 신호 ★약 (BY 생존 0, 대부분 OOS 반전/CI 0포함). vol_60(저변동성)만 OOS 부호유지.
indicators_passed:
  - id: cs_lowvol_60d
    layer: 3                  # 가격 cycle proxy (cross-sectional 저변동성)
    family: low_volatility    # ★부호 음 = 저변동(낮은 vol_z) 종목 forward 高 (low-vol anomaly, bio 동형)
    horizon: 20d
    ic_mean: -0.0568
    ic_ci_95: [-0.129, 0.0202]  # ★block-bootstrap(block=3,B=2000) — ★0 포함(상단 +0.02) = 비유의 경계
    ic_se_nw: 0.0395
    t_nw: -1.44
    n_effective: 81
    wild_cluster_p: 0.1284     # ★BY/Bonferroni 미생존, wc_p>0.05
    oos_sign_hold: true        # ★walk-forward IS -0.065 → OOS -0.049 부호유지 (유일 OOS 생존 신호)
    liquidity_tier: "strict 9종 IC -0.078 (wc_p=0.096) > 전체 16종 -0.057 = microcap artifact 아님 (대형주서 강)"
    avg_universe_n: 13.5
    source_id: "raw-v3/validation-conditional-v3.json:conditional_ic_surface.vol_60.y_20d.unconditional"
    notes: |
      cross-sectional 60d 변동성 z-score → 20d forward Rank-IC = ★음(저변동→고forward = low-vol anomaly).
      ★유일하게 walk-forward OOS 부호유지(IS -0.065→OOS -0.049) + Reflation regime IS -0.197→OOS -0.091 부호유지 +
      strict tier(고유동성 9종)서 더 강(-0.078) = microcap artifact 아님. ★단 BY/Bonferroni 미생존(wc_p 0.128) +
      block-boot CI 0 포함(+0.02) = 방향 prior 만, magnitude 비유의. = TENTATIVE DIRECTIONAL.

# ── 블록3 RELATIONSHIPS (partial-corr) — RegimeGlasso 통합 단계 입력 ──
relationships_passed:
  - {node_a: cs_lowvol_60d, node_b: ship_fwd_20d, lag_months: 0, corr: -0.0568,
     corr_ci_95: [-0.129, 0.0202], conditioning_set: [], n: 81,
     source_id: "raw-v3/validation-conditional-v3.json:conditional_ic_surface.vol_60.y_20d.unconditional",
     note: "★corr = cross-sectional IC(unconditional, 음=low-vol). CI 0 포함(비유의 경계). partial-corr = 통합 RegimeGlasso 단계."}

# ── 블록4 WEIGHT_RULES — derive_weights(w∝Θ_signal·IC) 입력 (range, 점추정 금지) ──
weight_rule_candidates:
  - indicator_id: cs_lowvol_60d
    base_weight_range: [-0.06, 0.0]   # ★음 IC=low-vol → 저변동 종목 overweight. ★CI 0 포함 = 상한 0(monitor-only 경계)
    modulate_by: [archetype, regime, cycle_phase]
    direction: >
      ★cross-sectional 60d 변동성 z 하위(저변동) 종목 overweight, 상위 underweight (low-vol anomaly, peer-relative).
      long-only-implementable = 저 vol_z 종목 top-quantile overweight vs benchmark. ★단 방향만(magnitude 비유의).
    granularity: cross_sectional       # ★universe-relative z
    gate_status: {n: pass, se: fail, power: pass, fdr: fail, oos: pass}  # ★se FAIL(CI 0포함) + fdr FAIL = monitor-only 경계
    confidence: low                    # ★TENTATIVE DIRECTIONAL (방향 OOS 생존하나 CI 0포함 + BY 미생존)
    source_ids: ["raw-v3/validation-conditional-v3.json:conditional_ic_surface.vol_60.y_20d.unconditional"]
    hedge_note: >
      ★조선 = tradeable 신호 ★약. vol_60(저변동)만 OOS 부호유지(방향 prior) but CI 0 포함 + BY 미생존 = magnitude 비유의.
      supervisor 가 monitor-only OR 최소 weight + Σ_signal hedge. ★G-G v2 = PASS-conditional 최약(또는 FAIL 경계, supervisor 판정).

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 (비우면 결선 dead) ──
confidence_hooks:
  - hypothesis_id: ship_cs_lowvol_persistence
    affects_indicator: cs_lowvol_60d   # ★★필수 — indicators_passed.id 와 매칭
    affects_edge: [cs_lowvol_60d, ship_fwd_20d]
    confirm_signal: "live 횡단면 저변동성 종목 20d forward rank > 고변동 유지 (rolling 12M, low-vol 지속)"
    reject_signal: "Rank-IC e-CUSUM 부호 반전 붕괴 (IC 음→양 = low-vol 소멸, 슈퍼사이클 momentum 전환)"
    emit_where: "panel-score-IC 축 (backtest SELL 아님)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 → cross-sectional low-vol base_weight 변동 (부호 음 유지 조건)"
    action_threshold: "e-value > 1/alpha=20 → retract(live 차단) / 회복 = score_ic_recovery_eprocess"

