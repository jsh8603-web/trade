    source: "기존 raw-v3 IC + avg_universe_n + eff_indep_N 재계산만(신규 fetch 0)"
    priority: high
    affects: [kr_telecom, kr_auto, kr_bio, kr_consumer, kr_financial]   # ★net_cost·breadth-IR 5산업 보강 (telecom illiquid 우선)
    status: pending

  - gap: size_orthogonal_PBR
    desc: "small-cap value 위장 점검 — PBR value premium 이 size factor 노출 아닌지 직교화(⛔시총 인과 금지, frame §M.12)"
    source: "기존 PBR z + 시총 분위 직교 회귀(재계산)"
    priority: high
