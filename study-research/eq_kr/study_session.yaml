# ── 블록1 LENS ──
lens:
  pricing_principle: >
    한국 주식 cross-sectional = archetype별 유효 신호 차등(frame §M.11). cyclical(battery momentum 양 / semi·auto PBR value, PER peak-EPS✗) /
    spread_driven(financial regime-conditional NIM) / asset_stable(consumer·telecom valuation 방향, momentum 무효) / event_driven(bio 변동성, 멀티플 부적합).
    ★PER → E/P 또는 Gross Profitability 대체 권고(cyclical, peak-EPS = earnings cycle 진폭 1차, ⛔시총 인과 금지).
  report_relations:
    - "frame §M.11: 7산업 유효신호/부호/valuation 적합도/risk factor/데이터 양식 전부 상이 = 동적가중 방향 지지(battery만 CONFIRMED, 나머지 PARTIAL/TENTATIVE)"
    - "frame §M.12: 24M_value = degenerate(eff_indep_N≈2.5). primary 3M/6M/12M 재배치. magnitude+significance overlap inflation = 방향만"
    - "frame §M.12: n<20 magnitude = 50-70% haircut(EB/James-Stein) 또는 breadth-IR 병기. ⛔점추정 covariance prior 박제 금지"
    - "frame §M.12: financial regime-conditional = hypothesis-generating only(independent episode≈2 overfit, ⛔live 제외, interaction term 권고)"
    - "산업별 risk factor: battery=credit/oil, semi=credit(강), financial=무, consumer=dollar, bio=VIX(고베타), auto=idiosyncratic, telecom=n협소"
  regime_reading: >
    rate_up: financial NIM momentum 양전(TENTATIVE·live 제외) + asset_stable 배당 디레이팅 / reflation: battery momentum 우위, semi/auto peak reversal /
    risk-off: bio 고베타 약세, credit risk-off → battery/semi 약세 / dollar 강세: consumer 약세(수입원가).
  estimation_note: >
    2026-05 anchor: battery momentum CONFIRMED(BY생존 유일) / semi reversal·auto PBR PARTIAL(magnitude hedge) /
    financial TENTATIVE(n=21 live 제외) / consumer ★TENTATIVE(비-degen 유의 0) / telecom PARTIAL(n=13 haircut) / bio PARTIAL(변동성). 24M 전산업 degenerate.

