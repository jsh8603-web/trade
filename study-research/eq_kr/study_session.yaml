  - gap: "KR HY credit spread (L축 credit proxy 개선)"
    source: "현 = US BAML HY OAS proxy(FRED 2023~만). 대안: FRED BAMLC0A4CBBB-BAMLC0A1CAAA(BBB-AAA). 또는 KR 회사채 BBB-CD91 spread."
    priority: high
    affects: [kr_battery, kr_semiconductor]
    status: pending

  - gap: "DART 분기 펀더멘털 시계열 (PBR/PER PIT 정밀화)"
    source: "DART_API_KEY 보유. fnlttSinglAcntAll 종목당. rcept_dt PIT stamp."
