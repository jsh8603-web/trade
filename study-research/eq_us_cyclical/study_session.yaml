  trust_tier:
    label: structural_prior_low_confidence
    validated_alpha: false
    rationale: |
      ★v4 격하 근거 (main Verify stage PARTIAL 회신):
      - G2 stationary bootstrap: 14/16 cell CI cross-zero (E2 SOXX / E4 XLI 만 cross-zero=false)
      - K Bonferroni α/16=0.003125: 0/16 cell 생존
      - K BH FDR: 0/16 cell 생존
      - G4 LOEO OOS: 부호일치 4/16 (chance 8/16 미만), R²_OOS 4/4 산업 음수
      → δ_regime = descriptive (epoch 사후 평균), NOT predictive

  formula:
    intent: "direction-aware (B 안) — 부호 prior 까지만 유효, magnitude 미지지"
    formula_sign_only: "regime_tag → sign(δ_regime) ∈ {+1, 0, -1}, magnitude freeze"
    deprecated_A: "ann_ret × sign(Sharpe_cyc) / 100 — XLE anti-cyclical 본성 정 반대 표현으로 폐기"
    deprecated_v3_magnitude: "★v4 폐기 — clip [-0.15, +0.15] 매트릭스 직접 박제 금지. Verify 사후 14/16 CI cross-zero / 0/16 Bonferroni / R²_OOS 음수 = magnitude predictive 신호 부재"
    rationale: |
      B 안 부호 prior 의 도메인 정합 = XLE anti-cyclical 본성 (E1/E3 sleeve 부호 반대 outperform) 보존,
      4 산업 부호 prior 도메인 정합 (synthesis §1.2). 단 magnitude (±0.15 clip 값) = Verify 검증 사후 데이터 미지지.

  sign_prior_matrix:
    # ★v4 = 부호 (+1/-1/0) prior 만, magnitude freeze
