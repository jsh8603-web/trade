note: |
  ★v3 = v2 핵심 보존 + main 합의 5건 반영 (2026-05-31 btn-Codlearn 회신).
  - v2 (2026-05-30) = 17 indicators + 9 relationships + 12 weight_rules + 4단계 code_change_plan 보존.
  - v3 신규 = industry × regime δ matrix (4 산업 × 4 epoch) + scenarioA long-frame β 비교 + collector 우선순위 갱신.
  main 합의 5건 (synthesis §7 R15.1~R15.8 → yaml v3):
    (1) 공식 의도 = direction-aware (B 안). XLE anti-cyclical 본성에서 A 안 (sign×Sharpe) 폐기.
    (2) clip = 옵션 C 확정. cyclical_core (XLB/XLI) 만 R15 cap [-0.15, +0.15]. XLE/SOXX outlier = composed_weights 외 별도 sleeve allocation key.
    (3) XLE/SOXX 별도 key = 점진 (코드폭 큼). v3 round = cyclical_core (XLB/XLI) δ_regime 만 활성, XLE/SOXX 별도 sleeve key = 후속 round (deferred).
    (4) δ_arch 23종 등록 OK. collector 우선순위 = energy 4종 (즉시 가용) → materials → EDGAR → industrials 최후.
    (5) Verify stage 주체 = main (G2 stationary bootstrap + G4 LOEO OOS + K Bonferroni + 산업 vol). 12축 audit subagent.
  v2 H1/H6 DEFERRED + H3/H5 REJECT + H4 PARTIAL 보존. EDGAR 적재 후 재검증 의무.

# ============================================================================
# 블록1: LENS (정성 렌즈 — LLM 주입용)
# ★가변: 블록5 flag 누적 → lens 갱신 경로. 본 v2 lens 는 이론 + 실검증 종합 후 보수화.
# ============================================================================
lens:
  pricing_principle: >
    P = M_norm × E_norm × C(regime, capital_cycle, credit_cycle).
    M_norm = (1-g/ROE_norm)/(r_e-g) 펀더멘털만 (multiple-independent, H10 동어반복 차단).
    g = min(ROE·(1-b), 명목 GDP 3.5-4%) Damodaran stable-growth cap. (r_e-g) ≥ 2% guardrail.
    E_norm = mid-cycle EBIT margin × 추세매출 (사이클 성분 ↔ 구조 성분 분리, Damodaran).
    경기민감주 = 매출(GDP/산업생산 탄력) + 영업레버리지(DOL) + 재무레버리지(DFL) 3중 증폭.
    스팟 P/E는 trough 高 peak 低 (역방향 = peak_trap 본질) → 정상화 이익이 시스템 골격.
  report_relations:
    - "Capital Cycle (Chancellor): ROIC↑ → capex 가속 → 공급과잉 → 마진 붕괴 (lag 2-3년)"
    - "Asset Growth Anomaly (Cooper-Gulen-Schill 2008 JF, Titman-Wei-Xie 2004 JFQA): 자산 성장 상위 ↔ fwd 음 IC (CMA 팩터)"
    - "EBP (Gilchrist-Zakrajsek 2012 AER): TRACE+Merton DD 정공법 / 빈자판 = BAA10Y-AAA10Y 직교화"
    - "Investment Clock (Greetham-Hartnett 2004): 가설 생성기로만, ground truth 금지"
    - "Yield Curve Inversion (Estrella-Mishkin 1998): 10Y-2Y 역전 → 12-18M 후 침체 logit"
    - "Grinold-Kahn IR = IC × √breadth × TC, breadth_eff = N/[1+(N-1)·ρ̄] (Choueifaty-Coignard 2008)"
    - "QMJ (Asness-Frazzini-Pedersen 2019): trough/early-recovery 정크 랠리 → quality 교호항"
    - "★실검증: ΔVIX 가 d_IG spread 보다 강한 동시 risk 공통원인 (VIX|IG IC=-0.343 / IG|VIX=-0.025)"
  regime_reading: >
    2국면(확장/수축) = testable layer (stat test power 확보, Fama-MacBeth + DK SE).
    4국면(Reflation/Recovery/Overheat/Slowdown) = structured prior overlay (Bayesian shrinkage λ=τ²/(τ²+σ²/n)).
    HMM = predicted prob P(S_t|y_{1:t-1}) = π_{t-1}·P (b(t) predictable 보존, mixture e-process supermartingale).
    BOCD = break overlay만 (recurring 4국면 분류 불가).
    룰베이스 BMA 주(primary) + filtered HMM 교차검증 + BOCD overlay 계층.
    ★실검증: 매크로 → cyclical-defensive excess return lead-lag 신호 매우 약함 (IC < 0.10 at 316M).
    Lead alpha 부재, contemporaneous risk-on/off 채널이 dominant.
  estimation_note: >
    2026-05 추정: 2024-Q4 커브 역전 해소 + ISM 50 회복 시도 → mid-cycle 진입 추정(확신도 중).
    ★v2 검증 후 자기확신 축소:
    (1) v1 IC=+0.658 = 합성 DGP 직접 인코딩 또는 look-ahead 강한 신호. 실 26년 sector ETF 검증
        에서 ISM/EBP/rate 단순 lead-lag IC 모두 0.10 미만. 대폭 shrink 각오.
    (2) H4 부분 통과: ΔVIX → cyclical-defensive excess 동시 IC=-0.378 매우 유의 (단 lead 부재 → contemp risk-off beta).
    (3) H3·H5 reject (현 검증 단계): 종속 재정의·종목 단위 EDGAR 적재 후 재검증 필요.
    (4) H1·H6 backbone 미검증 = 시스템 골격 핵심이 미입증 상태. EDGAR + Damodaran ERP 적재 1순위.
    ⚠️ 본 lens는 backbone H1·H6 적재·재검증 시점에 큰 폭 갱신될 것 (블록5 hook 라이브 갱신 경로).

