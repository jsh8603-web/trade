  - raw/theory-notes.md                            # 이론 학습 (Damodaran/Chancellor/GZ/Grinold/Hamilton 6 최상위)
  - raw/validation-H{3,4,5}.md + validation-H1-H6-deferred.md  # 실데이터 검증 (v2)
