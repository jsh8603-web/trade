study_id: eq_us_cyclical
asset_scope: [equity.us]
as_of: "2026-06-01"
version: v5
basis_raw:
  - raw/round-{1,2,3}-{question,gemini,claude}.md  # 자문 다회 (Gemini + Claude, 3R 수렴)
  - raw/theory-notes.md                            # 이론 학습 (Damodaran/Chancellor/GZ/Grinold/Hamilton 6 최상위)
  - raw/validation-H{3,4,5}.md + validation-H1-H6-deferred.md  # 실데이터 검증 (v2)
  - raw/validation-metrics.json + run_validation.py + fred/*.csv + yfinance/sector_etf_close.csv
  # v3 신규
  - raw/m3-findings.md + m3-metrics.json + m3_analysis.py    # M3 거시연관 분석 (4 epoch × 산업 driver loading)
  - raw/industry-{semi,materials,industrials,energy}-delta.md  # 4 산업 δ_regime/δ_arch 산출
  - raw/industry-delta-synthesis.md + industry-delta-metrics.json  # 12축 audit-ready synthesis
  - raw/long-frame-scenarioA.md + scenarioA_metrics.json + long_frame_scenarioA.py  # 24.8년 시나리오 A (Newey-West HAC + Bonferroni)
  - raw/pit-vintage-prescan.md + long-frame-prescan.md  # ALFRED + 장기 frame 사전조사
  # ★v4 신규 — main Verify stage 산출 (격하 reference)
  - raw/verify_delta.py + verify-delta-metrics.json  # G2 stationary bootstrap + G4 LOEO + K Bonferroni/FDR + 산업 자체 vol
  # ★v5 신규 — merit 선행변수 무료 탐구 (ISM 유료 대체) + 독립 12축 audit
  - raw/validation-merit-cyclical-leading.{md,py,json} + merit-pit-probe.json + fetch_merit_leading.py  # DGORDER→XLE live-PIT forward, NAIVE vs LIVE 착시 정량, Bonferroni 0/96
  - raw/validation-merit-regional-fed-diffusion.{md,py,json} + regional-fed-pit-probe.json + fetch_regional_fed.py  # 지역연준 diffusion(Empire/Philly) → Empire→SOXX 음 forward Bonferroni 2/84(첫 생존), 적시성≠예측력
note: |
  ★v5 = merit 선행변수 무료 탐구(ISM 유료 대체) 통합 + 독립 12축 audit 충실(hard0, opus subagent 2026-06-01).
    핵심: DGORDER_yoy→XLE forward = live PIT 생존 최상위 후보(단 Bonferroni 0/96 → 단정 금지, sign(+) prior 만, magnitude freeze, tier=structural_low).
    NEWORDER_yoy→XLE = live 정렬 시 붕괴(p=0.10 CI cross0) = lookahead 착시 실증(eq_intl credit 재발 방지 D축 모범 — naive→live 양측 보고로 자가 적발).
    ACOGNO_yoy→SOXX/XLB/XLI = 음(-) forward live 생존(OOS MATCH), structural_low. curve/PERMIT/copper-forward = REJECTED. 상세 = merit_leading_vars 블록.
  ★v4 = v3 격하 보수 (main Verify stage PARTIAL 회신 2026-05-31, btn-Codlearn).
  v3 → v4 격하 의무 5건:
    (1) δ_regime ±0.15 magnitude 박제 금지 → regime_tag 부호 prior 만 유효, magnitude freeze
        - prior_tier = structural_prior_low_confidence, validated_alpha = false
        - 근거: G2 stationary bootstrap = 14/16 CI cross-zero (heuristic Gaussian CI 가 10-30배 underestimate)
        - 근거: K Bonferroni α/16=0.003125 = 0/16 생존, BH = 0/16 생존
    (2) direction-aware B 안 공식 유효하나 부호 prior 까지만 (magnitude 미지지)
        - clip [-0.15, +0.15] 박제 폐기, James-Stein λ 적용 보류 (magnitude 박제 X)
    (3) heuristic sleeve-proxy CI 폐기 → 산업 자체 vol 기반 SE 사용
        - 실측 산업 vol vs sleeve_vol: SOXX 1.5~1.7배, XLE 1.3~1.5배, XLB/XLI ≈ 1배
        - heuristic 이 SOXX 1.6배 / XLE 1.3배 underestimate 확정
    (4) δ_regime live 적용 = live regime 분류기 OOS 검증 선행 조건
        - 근거: G4 leave-one-epoch-out OOS = 부호일치 4/16 < chance (8/16), R²_OOS 4/4 산업 음수
        - 함의: 현 epoch 라벨은 사후 (post-hoc) 분류, live trading 적용 시 regime tag 자체의 predictive 검증 필요
        - 결론: δ_regime = descriptive (epoch 사후 평균), NOT predictive
    (5) XLE 별도 sub-sleeve = 부호근거 지지, magnitude 미지지 (E1/E3 sleeve 부호 반대 outperform 본성 보존)
  v3 (2026-05-31) = main 합의 5건 반영 + industry × regime δ matrix + scenarioA long-frame β + collector 우선순위.
  v2 (2026-05-30) = 17 indicators + 9 relationships + 12 weight_rules + 4단계 code_change_plan 보존.
  v2 H1/H6 DEFERRED + H3/H5 REJECT + H4 PARTIAL 보존. EDGAR 적재 후 재검증 의무.

# ============================================================================
# 블록1: LENS (정성 렌즈 — LLM 주입용)
# ★가변: 블록5 flag 누적 → lens 갱신 경로. 본 v2 lens 는 이론 + 실검증 종합 후 보수화.
# ============================================================================
lens:
  pricing_principle: >
    P = M_norm × E_norm × C(regime, capital_cycle, credit_cycle).
    M_norm = (1-g/ROE_norm)/(r_e-g) 펀더멘털만 (multiple-independent, H10 동어반복 차단).
    g = min(ROE·(1-b), 명목 GDP 3.5-4%) Damodaran stable-growth cap. (r_e-g) ≥ 2% guardrail.
    E_norm = mid-cycle EBIT margin × 추세매출 (사이클 성분 ↔ 구조 성분 분리, Damodaran).
    경기민감주 = 매출(GDP/산업생산 탄력) + 영업레버리지(DOL) + 재무레버리지(DFL) 3중 증폭.
    스팟 P/E는 trough 高 peak 低 (역방향 = peak_trap 본질) → 정상화 이익이 시스템 골격.
  report_relations:
    - "Capital Cycle (Chancellor): ROIC↑ → capex 가속 → 공급과잉 → 마진 붕괴 (lag 2-3년)"
    - "Asset Growth Anomaly (Cooper-Gulen-Schill 2008 JF, Titman-Wei-Xie 2004 JFQA): 자산 성장 상위 ↔ fwd 음 IC (CMA 팩터)"
    - "EBP (Gilchrist-Zakrajsek 2012 AER): TRACE+Merton DD 정공법 / 빈자판 = BAA10Y-AAA10Y 직교화"
    - "Investment Clock (Greetham-Hartnett 2004): 가설 생성기로만, ground truth 금지"
    - "Yield Curve Inversion (Estrella-Mishkin 1998): 10Y-2Y 역전 → 12-18M 후 침체 logit"
    - "Grinold-Kahn IR = IC × √breadth × TC, breadth_eff = N/[1+(N-1)·ρ̄] (Choueifaty-Coignard 2008)"
    - "QMJ (Asness-Frazzini-Pedersen 2019): trough/early-recovery 정크 랠리 → quality 교호항"
    - "★실검증: ΔVIX 가 d_IG spread 보다 강한 동시 risk 공통원인 (VIX|IG IC=-0.343 / IG|VIX=-0.025)"
  regime_reading: >
    2국면(확장/수축) = testable layer (stat test power 확보, Fama-MacBeth + DK SE).
    4국면(Reflation/Recovery/Overheat/Slowdown) = structured prior overlay (Bayesian shrinkage λ=τ²/(τ²+σ²/n)).
    HMM = predicted prob P(S_t|y_{1:t-1}) = π_{t-1}·P (b(t) predictable 보존, mixture e-process supermartingale).
    BOCD = break overlay만 (recurring 4국면 분류 불가).
    룰베이스 BMA 주(primary) + filtered HMM 교차검증 + BOCD overlay 계층.
    ★실검증: 매크로 → cyclical-defensive excess return lead-lag 신호 매우 약함 (IC < 0.10 at 316M).
    Lead alpha 부재, contemporaneous risk-on/off 채널이 dominant.
  estimation_note: >
    2026-05 추정: 2024-Q4 커브 역전 해소 + ISM 50 회복 시도 → mid-cycle 진입 추정(확신도 중).
    ★v2 검증 후 자기확신 축소:
    (1) v1 IC=+0.658 = 합성 DGP 직접 인코딩 또는 look-ahead 강한 신호. 실 26년 sector ETF 검증
        에서 ISM/EBP/rate 단순 lead-lag IC 모두 0.10 미만. 대폭 shrink 각오.
    (2) H4 부분 통과: ΔVIX → cyclical-defensive excess 동시 IC=-0.378 매우 유의 (단 lead 부재 → contemp risk-off beta).
    (3) H3·H5 reject (현 검증 단계): 종속 재정의·종목 단위 EDGAR 적재 후 재검증 필요.
    (4) H1·H6 backbone 미검증 = 시스템 골격 핵심이 미입증 상태. EDGAR + Damodaran ERP 적재 1순위.
    ⚠️ 본 lens는 backbone H1·H6 적재·재검증 시점에 큰 폭 갱신될 것 (블록5 hook 라이브 갱신 경로).

