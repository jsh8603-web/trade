# summary.yaml — us_cyclical sleeve v3 (frame v3 §M exposure card 계약)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge, BY/FDR, LOO/block-boot).
# ★미국 1단계 = EDGAR/yfinance/FRED 파이프라인 검증 겸함(작동 입증). ★PER○(한국 auto PER✗ peak-EPS 와 반대 발견).
# raw 재현: raw-v3/{collect, measure}.py + data/{prices, edgar_fundamentals, macro, universe}.parquet

industry: us_cyclical         # eq_us Tier 1 sleeve (SOXX/XLB/XLI/XLE/XLF)
asset_scope: [equity.us]
archetype: cyclical           # archetype.py: 경기민감, ev_ebitda·P/B primary (peak-EPS 경계)
archetype_attestation:
  valid_from: "2015-01-01"    # ★PIT 사전선언 (yfinance 가용 시작)
  declared_at: "2026-06-04"
  primary_metric: per         # ★미국 cyclical = PER value 작동(한국 auto PER✗ 와 반대). peak-EPS trap 약(대형주 earnings 안정).
  secondary: null
  basis: >
    ★미국 cyclical 발견 = 한국 auto/반도체(PER✗ peak-EPS / PBR○)와 **반대**: PER value premium 작동(per_z 24M
    IC -0.119 t=-2.76 block-boot 유의, LOO sector robust) > PBR 약(비유의). = ★미국 대형 cyclical 은 적자 비율 낮아
    (3-16%) peak-EPS 왜곡 약 → PER 유효. archetype.py cyclical "trap=peak-EPS"의 ★시장·시총 의존성 발견.
as_of: "2026-05-28"

# ── 블록1 LENS ──
lens:
  pricing_principle: >
    미국 cyclical(SOXX/XLB/XLI/XLE/XLF) = ★PER value premium 작동(한국 auto 와 반대). 대형주 earnings 안정
    → peak-EPS trap 약. vol_60 변동성 프리미엄(고변동성 forward↑ = 고베타 보상). HY OAS regime 강(risk-on/off).
  cycle_reading: >
    HY OAS regime = cyclical↔defensive rotation 주요 분류기(direction R1, 상대 강). ★단 BAMLH0A0HYM2 = 2023-05~만(37mo)
    = regime-conditional INSUFFICIENT(eq_us_defensive H3 ERROR 패턴 회피). dollar β = 비유의(Bruno-Shin US 도달 약, R2 정합).
  estimation_note: >
    2026-05: universe 60종(5 sector × 12). cross-sectional avgN 60(가격)/35-40(valuation, 적자 제외). ★PER value
    = primary. derive_weights valuation 중심. ★미국 1단계 = EDGAR/yfinance/FRED 파이프라인 작동 검증 완료.

# ── 블록2 INDICATORS ──
# ★PER value premium (primary, block-boot 유의 LOO robust) + vol 프리미엄.
indicators_passed:
  - id: cs_per_z_24m
    layer: 1                  # valuation (EDGAR PIT)
    family: value
    horizon: 24M_value
    ic_mean: -0.119           # 저PER value premium (한국 auto PER✗ 와 반대 = 미국 PER 작동)
    ic_ci_95: [-0.169, -0.075]  # block-bootstrap. 0 배제(유의).
    t_nw: -2.76               # p=0.007 (NW 유의)
    n_effective: 113
    avg_universe_n: 35.1      # 적자 종목 제외 (PBR 40 대비)
    oos_ratio: 1.00           # CPCV OOS hit
    loo_sector_robust: true   # ★LOO sector 제외 IC [-0.136,-0.066] 전부 음
    within_period: 0.70
    source_id: "raw-v3/validation-metrics-v3.json:indicators.per_z__24M_value"
    notes: |
      저PER cross-sectional z → 24M forward (EDGAR PIT filed date 이후만). value premium 강(block-boot 0배제,
      NW 유의 t=-2.76, CPCV 1.00, LOO sector robust). ★per_z 3M 도 t=-2.47 유의. = ★미국 cyclical PER 작동
      (한국 auto PER✗ peak-EPS 와 반대 — 미국 대형주 earnings 안정 → peak-EPS 약). BY 보정 미생존(borderline).
      ★★[frame §M.12 정정] 24M overlap eff_indep_N = 113/24 ≈ 4.7 = degenerate(한국 2.5보다 나으나 여전히 hedge).
      → ★primary 증거 = per_z 3M(t=-2.47, eff_N≈45 = n134/3), 24M_value = 보조. ★peak-EPS 메커니즘 = earnings
      cycle 진폭(흑자도 trap), ⛔시총 인과 금지. 미국 PER○ = ★consistent-with 한국 PER✗(시장·시총 의존, explained-by 아님).
  - id: cs_vol_60_24m
    layer: 3
    family: volatility
    horizon: 24M_value
    ic_mean: 0.151            # ★양 = 고변동성 forward↑ (US 변동성/고베타 프리미엄, 저변동성 anomaly와 반대)
    ic_ci_95: [0.084, 0.215]  # block-boot 0 배제
    t_nw: 2.29
    n_effective: 111
    avg_universe_n: 59.5
    within_period: 0.80
    source_id: "raw-v3/validation-metrics-v3.json:indicators.vol_60__24M_value"
    notes: "고변동성 종목 forward↑ = US large-cap cyclical 고베타 보상(저변동성 anomaly 반대). block-boot 유의. BY 미생존."

# ── 블록3 RELATIONSHIPS ──
relationships_passed:
  - {node_a: cs_per_z_24m, node_b: us_cyclical_fwd_24m, lag_months: 0, corr: -0.119,
