# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 ──
confidence_hooks:
  - hypothesis_id: us_cyclical_pbr_value_premium
    affects_indicator: cs_pbr_z   # ★필수
    affects_edge: [cs_pbr_z, us_cyclical_fwd_12m]
    confirm_signal: "live 저PBR sector-neutral z 상위 종목 forward rank IC < 0 유지 (value, rolling 12M)"
    reject_signal: "PBR value premium IC e-CUSUM 부호 반전/소멸 (sector-level trap 흡수 또는 peak-EPS 전환)"
    emit_where: "panel-score-IC 축"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 → PBR base_weight 변동"
    action_threshold: "e-value > 20 → retract / 회복 = score_ic_recovery_eprocess"
  - hypothesis_id: us_cyclical_ev_ebitda_value
    affects_indicator: cs_ev_ebitda
    affects_edge: [cs_ev_ebitda, us_cyclical_fwd_12m]
    confirm_signal: "live 저EV/EBITDA sector-neutral z(ex-financials) forward rank IC < 0 유지"
    reject_signal: "EV/EBITDA IC e-CUSUM 부호 반전/소멸"
    emit_where: "panel-score-IC 축"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights → EV/EBITDA base_weight"
    action_threshold: "e-value > 20 → retract"

