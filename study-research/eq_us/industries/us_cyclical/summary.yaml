    비율 낮아(financials 2.9%/industrials 6.9%/materials 8.7%/semi 9.7%/energy 16.4%) peak-EPS 왜곡 약 → PER 유효.
    = archetype.py cyclical "trap=peak-EPS"의 ★시장·시총 의존성(미국 대형 ≠ 한국 중형). PBR 은 약(비유의).
  indicators:
    - id: cs_per_z
      signal: "PER cross-sectional z (저PER=value, ★미국 cyclical 작동)"
      horizon_results:
        - {horizon: 3M, ic: -0.062, t_nw: -2.47, p: 0.015, n: 134, within: 0.75}
        - {horizon: 6M, ic: -0.066, t_nw: -1.79, p: 0.076, n: 131, within: 0.73}
        - {horizon: 12M, ic: -0.084, t_nw: -1.69, p: 0.094, n: 125, within: 0.64}
        - {horizon: 24M_value, ic: -0.119, t_nw: -2.76, p: 0.007, n: 113, ci_block: [-0.169, -0.075], within: 0.70, loo_sector_robust: true}
      avg_universe_n: 35.1
      verdict: "★PER value premium 작동(block-boot 유의, NW 유의 3M/24M, LOO sector robust). = 미국 cyclical PER 유효(한국 auto 와 반대). BY borderline."
    - id: cs_pbr_z
      signal: "PBR cross-sectional z"
      horizon_24m: {ic: -0.100, t_nw: -1.21, ci_block: [-0.168, -0.024], n: 113, avgN: 40, verdict: "value 방향(음), block-boot 0배제 but NW 비유의"}
      verdict: "TENTATIVE — 저PBR value 방향이나 NW 비유의(PER 보다 약). = 미국 cyclical 은 PER > PBR."
  multiple_testing: "20 테스트 BY factor 3.60. raw_p_min=0.0068(per_z 24M). ★BY 생존 0(borderline). 단 block-boot 유의 + LOO robust = value premium prior 지지."
  verdict: >
    ★미국 cyclical = PER value premium 작동(EDGAR PIT, block-boot 유의, LOO sector robust). = ★한국 auto/반도체
    (PER✗ peak-EPS / PBR○)와 **반대 패턴** = peak-EPS trap 의 시장·시총 의존성 발견(미국 대형 cyclical earnings 안정).
    + vol 프리미엄(고베타 보상) + HY OAS β 강(단 2023~ 한정 hedge). ★미국 1단계 데이터 파이프라인(EDGAR/yfinance/FRED) 작동 검증 완료.

