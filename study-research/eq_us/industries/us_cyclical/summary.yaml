# summary.yaml — us_cyclical sleeve v3 (재작업 2026-06-03, sector-neutral z 정식)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge, BY/FDR, LOO/block-boot). sector당 12종 = magnitude 보수.
# ★재작업 핵심 = (1) S1 신규 신호(EDGAR 12 concept) (2) 자문 R2 4수정(family 3분리/M_eff/eff_N/basket불필요)
#   (3) ★방법 결함 발견·교정 = universe-demean → sector-neutral z (frame §M.7 계약, BY 생존 0→8 회복).
# raw 재현: raw-v3/{collect, measure}.py + data/{prices, edgar_fundamentals, macro, universe}.parquet → validation-metrics-v3.json

industry: us_cyclical         # eq_us Tier 1 sleeve (SOXX/XLB/XLI/XLE/XLF, 60종 = 5 sector × 12)
asset_scope: [equity.us]
archetype: cyclical           # peak-EPS trap → peak-EPS-robust value(PBR/EV-EBITDA) primary
archetype_attestation:
  valid_from: "2015-01-01"    # ★PIT 사전선언 (yfinance 가용 시작)
  declared_at: "2026-06-03"
  primary_metric: pbr         # ★PBR value premium (sector-neutral, BY 생존, CONFIRMED). + EV/EBITDA. PER 약(peak-EPS).
  secondary: ev_ebitda
  basis: >
    ★미국 cyclical = peak-EPS-robust value(PBR/EV-EBITDA) sector-neutral cross-sectional 작동 = 한국 auto/반도체
    (PBR○ PER✗ peak-EPS) **정합**. PBR sector-neutral IC −0.117(12M, t−3.19, BY 생존) / EV-EBITDA −0.110(t−3.39).
    PER 약(peak-EPS trap, IC≈0). ★핵심 = universe-demean(기존 결함) → sector-neutral z 전환 시 BY 생존 0→8 회복.
as_of: "2026-05-28"

# ── ★재작업 방법 정정 (자문 R2 4수정 + sector-neutral 결함 교정) ──
method_corrections:
  z_standardization: >
    ★sector-neutral z (frame §M.7 'within-industry peer-relative cross-sectional z') 정식 채택. 기존 measure.py =
    universe-demean = multi-sector sleeve 에서 계약 위반 버그(sector mixing 신호 희석). 단일산업(한국 7산업)은
    sector-neutral = universe-demean byte-identical(battery 검증 max abs diff 0.00e+00) = 무회귀.
  sector_z_mechanism: >
    ★검증(b): sector-z 분해 — universe-z(pbr 24M −0.077)는 within-sector-z(−0.146 진짜)와 sector-LEVEL-component
    (+0.157 부호 반대 = sector value trap)이 ★섞인 희석 결과(⛔IC 단순 가산 항등식 아님 — Spearman IC 비선형이라
    −0.146++0.157 ≠ uni −0.077; 부호 상쇄 직관). within value(싼 종목)=양수익, sector-level value(싼 sector)=음수익 →
    universe-demean 이 두 반대부호 성분 mixing 으로 희석. sector-neutral 이 sector-level 반대성분 제거 → within value
    순수 추출. ★G-C hedge: sector-LEVEL trap magnitude 는 n_sector=5(매월 5점) = pbr sector-level t1.36~1.92
    (비유의~경계)·ev_ebitda 만 강유의(t4.6~5.1) → 방향만 신뢰·magnitude over-claim 금지. frame line 322 =
    over-neutralize 우려인데 cross-std≈1(분산 보존)로 기각, 단 small-N(sector당 12종) 우려는 hedge 흡수(완전 반박
    아님). BY 8 = 진짜 신호(G-C 독립 재현 raw_p 0.46→0.0018 PASS).
  by_family_3way: "family_1 unconditional 예측 IC(BY 검정) / family_2 regime-conditional gated(baa_aaa 사전지정, 별 m) / family_3 driver β attribution(BY 제외)."
  m_eff: "Li-Ji(2005) eigenvalue, test-statistic(IC 시계열) 상관행렬. raw m=36 → M_eff=20.0(near-dup 정확 포착). family_1 BY threshold(rank1)=0.00137."
  eff_n_double: "시계열 eff_N≈T/h × 횡단면 N/(1+(N−1)ρ̄). breadth-IR=IC·√(유효breadth×ts_eff_n). 24M overlap eff_N≈4.7 degenerate(primary 강등)."
  basket: "cyclical = basket화 불필요(60종 cross-sectional 유효, mega_tech 전용)."

# ── 블록1 LENS ──
lens:
  pricing_principle: >
    미국 cyclical(SOXX/XLB/XLI/XLE/XLF) = ★peak-EPS-robust value(PBR/EV-EBITDA) sector-neutral premium (CONFIRMED).
    PER 약(peak-EPS trap). vol 변동성 프리미엄 약(sector-neutral 후 비유의). credit(HY OAS/baa_aaa) regime = risk-on/off.
  cycle_reading: >
    credit regime = cyclical↔defensive rotation 분류기(Fama-French 1989 default spread). HY OAS(BAMLH0A0HYM2)=2023-05~
    37mo INSUFFICIENT → ★Baa-Aaa(FRED, 1919~) proxy 채택(family_2 사전지정 regime). dollar β = Bruno-Shin US 도달 약 caveat.
  estimation_note: >
    universe 60종(5 sector × 12). ★sector-neutral z(sector당 median 9~12종 = small-n hedge, magnitude 보수·방향 신뢰).
    cross-sectional avgN 53(pbr)/37(ev_ebitda). ★primary = PBR/EV-EBITDA sector-neutral value.

