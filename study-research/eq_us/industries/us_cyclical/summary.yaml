       source_id: "raw-v3/validation-metrics-v3.json:dollar_beta_H4.hy_oas",
       note: "★HY OAS 확대 = cyclical 약세(risk-off), β=-0.093 t=-10.04 강유의. ★단 n=36 month(2023~ 한정) = hedge(CI 넓음, 추가 검증 필요). direction R1 'HY OAS 주요 분류기(상대 강)' 정합."}
    - {factor: rate, beta: -0.0388, beta_ci_95: [-0.065, -0.012], contemporaneous: true, note: "rate↑ = cyclical 약 음(t=-2.86 유의). duration 효과."}
    - {factor: vix, beta: -0.0027, beta_ci_95: [-0.005, -0.001], contemporaneous: true, note: "VIX↑ = 약세(t=-2.45 유의, risk-off)."}
    - {factor: dollar, beta: -0.2279, beta_ci_95: [-0.664, 0.208], contemporaneous: true,
       note: "★dollar β 비유의(t=-1.02). = direction R2 'Bruno-Shin EM 메커니즘 US cross-sectional 도달 약' 정합. H4 = 약."}
  directional_spillover: []   # DY = supervisor 통합
  structural_linkage:
    - supplier_or_customer: null
      verdict: "AI capex→Mag7 EPS supply-chain momentum = us_mega_tech(T0) sleeve 영역. us_cyclical 은 macro(HY OAS/rate) regime 의존이 dominant. skip(한국 패턴 동일)."
  # ⛔ sector-rotation clock = myth.

# ── ★valuation 횡단면 (§M.7 — EDGAR PIT, ★PER 작동 발견) ──
valuation_cross_sectional:
  data_source: "raw-v3/validation-metrics-v3.json (EDGAR 27637 rows + yfinance 가격)"
  mechanism_works: true   # ★EDGAR PIT 재구성 작동(파이프라인 검증). PBR cov 5607 / PER cov 4935 cells.
  pipeline_validation: "★미국 1단계 = EDGAR(companyconcept XBRL, filed date PIT) + yfinance + FRED 파이프라인 작동 입증. 60종 EDGAR equity/net_income/shares 수집(filed date = lookahead 회피)."
  pit_note: "EDGAR filing acceptance date(filed) 이후만 적용 = lookahead 회피(Large accel 10-K 60d/10-Q 40d 자동 반영)."
  cyclical_finding: >
