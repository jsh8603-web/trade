     note: "★PER value premium block-boot 유의, LOO sector robust. partial-corr = supervisor RegimeGlasso."}

# ── 블록4 WEIGHT_RULES ──
weight_rule_candidates:
  - indicator_id: cs_per_z_24m
    base_weight_range: [0.05, 0.12]
    modulate_by: [archetype, regime, cycle_phase]
    direction: "저PER z 상위(싼) overweight (value). ★미국 cyclical = PER 작동(한국 auto 와 반대). long-only-implementable."
    granularity: cross_sectional
    gate_status: {n: pass, se: pass, power: pass, fdr: marginal, oos: pass}  # block-boot 유의 / BY borderline
    source_ids: ["raw-v3/validation-metrics-v3.json:indicators.per_z__24M_value"]
    hedge_note: "★PER value premium 방향 강(block-boot 유의, LOO robust, within 0.70) but BY 미생존(borderline). PARTIAL. FF5+Mom+QMJ+BAB neutralize = supervisor 단계."

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 ──
confidence_hooks:
  - hypothesis_id: us_cyclical_per_value_premium
    affects_indicator: cs_per_z_24m   # ★필수
    affects_edge: [cs_per_z_24m, us_cyclical_fwd_24m]
    confirm_signal: "live 저PER z 상위 종목 forward rank IC < 0 유지 (value, rolling 24M)"
    reject_signal: "PER value premium IC e-CUSUM 부호 반전/소멸 (peak-EPS 전환)"
    emit_where: "panel-score-IC 축"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 → PER base_weight 변동"
    action_threshold: "e-value > 20 → retract / 회복 = score_ic_recovery_eprocess"

# ── 블록6 COLLECTOR_PLAN ──
collector_plan_industry:
