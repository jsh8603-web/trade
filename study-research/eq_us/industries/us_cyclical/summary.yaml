    priority: high   # ★미국 universe = 현 holdings 큐레이션 = 생존편향 강
  - missing: "★HY OAS 장기 시계열 (현 BAMLH0A0HYM2 = 2023-05~만 = regime INSUFFICIENT)"
    source: "ICE BofA HY OAS = FRED 2023~만. 장기 = Bloomberg/Moody's Baa-Aaa spread proxy"
    priority: high   # ★H3 HY OAS rotation regime 핵심 제약 (eq_us_defensive H3 ERROR 패턴)
