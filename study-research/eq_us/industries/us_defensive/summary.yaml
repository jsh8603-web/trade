# summary.yaml — us_defensive sleeve v3 (frame v3 §M exposure card 계약)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge, BY/FDR, block-boot/LOO).
# 산출 범위 = §M.7 exposure card (측정 전용). 한국 consumer/auto + battery summary.yaml 미러.
# raw 재현: raw-v3/{collect, measure, measure_cross, exposure_card, (collect_edgar, measure_valuation)}.py
# ★valuation §10 = EDGAR XBRL (#15 us_cyclical 파이프라인 검증 후 박제) = placeholder.

industry: us_defensive        # eq_us sleeve (asset_stable, XLP/XLU/XLV/XLC-mature)
asset_scope: [equity.us]
archetype: asset_stable       # 방어주 (소비필수/유틸/헬스케어/성숙통신) — 안정 현금흐름·배당·듀레이션 민감
archetype_attestation:
  valid_from: "2010-01-01"    # ★PIT 사전선언 (§M.5 ex-post 금지). asset_stable = 안정 현금흐름 방어주
  declared_at: "2026-06-03"
  primary_metric: per         # asset_stable primary (PER value premium — 한국 consumer/telecom 동형)
  secondary: dividend_yield   # 배당 (방어주 핵심, EDGAR §10 보조)
  basis: >
    방어주 안정 현금흐름 1차 가설. ★실측 검증: 가격 momentum 무효(한국 consumer/telecom asset_stable 동형) +
    저변동성 프리미엄(vol_60 IC +0.076) + 단기 reversal(rev_1m -0.045 유의) + ★real_rate 듀레이션 민감(β -0.171 t=-4.1).
    → asset_stable 지지(momentum 무효 + 채권 대용 rate 민감). valuation(PER value) = EDGAR §10.
as_of: "2026-05-31"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    us_defensive = asset_stable. "싸다" = PER·배당수익률 (안정 EPS → value premium, 한국 consumer/telecom 동형).
    ★실측 결론: 가격 momentum 무효, 저변동성(vol_60 양) + 단기 reversal(rev_1m 음) + real_rate 듀레이션 민감(채권 대용).
    valuation 횡단면(PER) = EDGAR XBRL 재구성(§10, #15 후). asset_stable = valuation·저변동성이 진짜 신호.
  cycle_reading: >
    2010-2026 = QE→정상화→COVID→인플레이션·금리급등(2022-23)→pivot. ★real_rate(DFII10) 상승 시 방어주 약세
    (듀레이션 민감, t=-4.1 강). HY OAS regime: normal 28 / stress 9 month(>p75=3.55). credit stress 시 defensive 상대강세.
  estimation_note: >
    2026-05 시점: universe 48종(XLP/XLU/XLV/XLC-mature 대표 대형주, yfinance). avg N 47종 = 한국 대비 breadth 우수.
    n=183개월(2010~) = 한국(71-88개월) 대비 표본 길어 통계력 강. 가격신호 약(asset_stable) → valuation·저변동성 우위. 본 산출 = 측정+peer-relative z card.

# ── 블록2 INDICATORS (forward 횡단면 Rank-IC, horizon-tagged, ★block-boot) ──
indicators_passed:
  - id: cs_rev_1m
    layer: 3
    family: reversal           # ★단기 reversal (asset_stable, 가장 안정적)
    horizon: 3M
    ic_mean: -0.045
    ic_ci_95: [-0.081, -0.014]  # ★block-bootstrap(block=6M, autocorr 보정). NW CI [-0.077,-0.012] 정합. 둘 다 0 배제.
    ic_se_nw: 0.0166
    t_nw: -2.70
    n_effective: 193           # months (2010~, 한국 대비 장기)
    oos_ratio: 0.93            # CPCV OOS hit=0.93
    avg_universe_n: 47.5
    source_id: "raw-v3/validation-metrics-v3.json:indicators.rev_1m__3M"
    notes: |
      cross-sectional 1M 단기수익 z → 3M forward = 음(단기 reversal). t_NW=-2.70 p=0.008.
      ★NW+block-boot CI 둘 다 0 배제 = 유의. leave-episode 생존(ex-peak -0.053). within 0.647.
      cap-weighted -0.041(대형주 일관). ★BY 보정(16테스트) raw_p=0.0077 → 미생존(BY 임계 미달) = small-n hedge.
  - id: cs_lowvol
    layer: 3
    family: low_volatility     # ★저변동성 프리미엄 (asset_stable 핵심, 한국 bio 동형)
    horizon: 12M_mom
    ic_mean: 0.076
    ic_ci_95: [0.006, 0.144]   # ★block-bootstrap 0 배제. NW CI [-0.011, 0.163] 0 포함(보수 NW 채택 시 TENTATIVE).
    ic_se_nw: 0.0443
    t_nw: 1.71
    n_effective: 183
    oos_ratio: 0.87
    avg_universe_n: 47.4
    source_id: "raw-v3/validation-metrics-v3.json:indicators.vol_60__12M_mom"
    notes: |
      cross-sectional 60d 변동성 z → 12M forward = 양(★저변동성→고forward = 저변동성 프리미엄).
      ★block-boot CI [0.006,0.144] 0 배제 but NW CI 0 포함(보수 채택) → TENTATIVE DIRECTIONAL.
      cap-weighted +0.079(대형주 일관 강). leave-episode 생존. within 0.625. BY 미생존. 한국 bio cs_lowvol 동형.

# ── 블록3 RELATIONSHIPS ──
relationships_passed:
  - {node_a: cs_rev_1m, node_b: defensive_fwd_3m, lag_months: 0, corr: -0.045,
     corr_ci_95: [-0.081, -0.014], conditioning_set: [], n: 193,
     source_id: "raw-v3/validation-metrics-v3.json:indicators.rev_1m__3M",
     note: "cross-sectional IC(unconditional, 단기 reversal 유의). partial-corr = 통합 RegimeGlasso 단계."}

# ── 블록4 WEIGHT_RULES ──
weight_rule_candidates:
  - indicator_id: cs_rev_1m
    base_weight_range: [-0.07, -0.02]   # 음 IC(reversal) → 1M 하락 종목 overweight. CI 반영.
    modulate_by: [archetype, regime, real_rate_phase]
    direction: "cross-sectional 1M 단기수익 z 하위(하락) 종목 overweight (단기 reversal). long-only-implementable."
    granularity: cross_sectional
    gate_status: {n: pass, se: pass, power: pass, fdr: fail, oos: pass}  # ★FDR(BY) fail = small-n hedge
    source_ids: ["raw-v3/validation-metrics-v3.json:indicators.rev_1m__3M"]
    hedge_note: "n=193 months 장기. CI [-0.081,-0.014] 0 배제 유의. ★BY 미생존 → supervisor conservative cap. valuation(§10) 보강 권장."
  - indicator_id: cs_lowvol
    base_weight_range: [0.0, 0.10]      # 양 IC(저변동성) → 저변동성 종목 overweight. NW 0 포함 보수.
    modulate_by: [archetype, regime]
    direction: "cross-sectional 60d 변동성 z 하위(저변동성) 종목 overweight (저변동성 프리미엄). long-only."
    granularity: cross_sectional
    gate_status: {n: pass, se: marginal, power: weak, fdr: fail, oos: pass}  # NW 0 포함 = TENTATIVE
    source_ids: ["raw-v3/validation-metrics-v3.json:indicators.vol_60__12M_mom"]
    hedge_note: "block-boot 0 배제 but NW 0 포함 = TENTATIVE. supervisor weight 보수. 한국 bio cs_lowvol 동형 = asset_stable 저변동성 신호 일반성 가능."

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 ──
confidence_hooks:
  - hypothesis_id: us_defensive_short_reversal
    affects_indicator: cs_rev_1m       # ★★필수 — indicators_passed.id 매칭
    affects_edge: [cs_rev_1m, defensive_fwd_3m]
    confirm_signal: "live 횡단면 1M 단기수익 z 하위 종목의 3M forward rank IC 음 유지 (rolling 12M, reversal 지속)"
    reject_signal: "Rank-IC e-CUSUM 부호 양 전환 누적 K=3 month (reversal 소멸)"
    emit_where: "panel-score-IC 축 (backtest SELL 아님)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    feeds_weight: "derive_weights 재적합 → 단기 reversal base_weight 변동 (부호 음 유지)"
    action_threshold: "e-value > 1/alpha=20 → retract / 회복 = score_ic_recovery_eprocess"

