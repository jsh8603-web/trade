# ── ★cross (분석 단위 간 상관) — §M.3 3소비자 라우팅 (산업=보고만) ──
cross:
  common_factor_exposure:
    # ★sub-sector β 분기 = asset_stable 핵심 (DEFENSIVE_ALL 대표값, HAC maxlags=6, n=36 small)
    - {factor: real_rate, beta: -0.171, beta_ci_95: [-0.255, -0.087], contemporaneous: true,
       source_id: "raw-v3/validation-cross-v3.json:sub_sector_factor_beta.DEFENSIVE_ALL.real_rate",
       note: "★실질금리(DFII10) 상승 시 방어주 약세 = 듀레이션 민감(채권 대용, t=-4.1 유의). H2(TSY long duration) 정합. ★n=36 small."}
    - {factor: rate, beta: 0.038, beta_ci_95: [-0.009, 0.085], contemporaneous: true,
       note: "명목금리(DGS10) 약 양 비유의. ★real_rate 가 진짜 듀레이션 채널. utilities rate +0.070(H5 부분)."}
    - {factor: dollar, beta: -0.098, contemporaneous: true, note: "비유의 (CI 넓음)"}
    - {factor: hy_oas, beta: 0.004, contemporaneous: true, note: "비유의 (sub-sector 별 상이: staples +0.022 약)"}
    - {factor: vix, beta: 0.000, contemporaneous: true, note: "비유의 (staples -0.002 t=-2.2 약 음만)"}
  # ★sub-sector 분기 (H5): utilities real_rate -0.213(t=-2.9 듀레이션 민감 상대 강) / staples -0.154(t=-3.1) / healthcare -0.137(t=-1.9 약)
  sub_sector_rate_sensitivity:
    - {sector: utilities, real_rate_beta: -0.213, t: -2.9, note: "★듀레이션 민감 상대 강(sub-sector 중 최대) = 채권 대용 (H5 utility rate−). n=36 small hedge."}
    - {sector: staples, real_rate_beta: -0.154, t: -3.1, note: "듀레이션 민감"}
    - {sector: healthcare, real_rate_beta: -0.137, t: -1.9, note: "약 (방어적이나 성장 성분)"}
    - {sector: comm_mature, real_rate_beta: -0.197, t: -1.8, note: "듀레이션 (배당주)"}
  directional_spillover: []   # DY = supervisor 통합
  structural_linkage: []      # defensive = supply-chain lead-lag 약 → sector-rotation 만 (REJECTED as alpha 전제)

# ── ★valuation 횡단면 (§M.7 핵심 — EDGAR XBRL PIT, 박제 완료 2026-06-03) ──
valuation_cross_sectional:
  data_source: "raw-v3/validation-valuation-v3.json (SEC EDGAR XBRL 21149 rows + yfinance 가격)"
  mechanism_works: true   # ★EDGAR PIT 재구성 작동. PBR cov 5150 / PER cov 5108 cells. avg_N 26종(30종 valuation 가용).
  pipeline_validation: "EDGAR companyconcept XBRL(StockholdersEquity/NetIncomeLoss/shares, filed date PIT) = us_cyclical 검증 파이프라인 미러. 48종 수집 21149 rows."
  pit_note: "재무 = filed date(filing acceptance) 이후만(forward-fill) = lookahead 회피(Large accel 10-K 60d/10-Q 40d). 한국 DART rcept_dt 대응."
  archetype_note: >
    ★asset_stable PER value premium 예상했으나 ★실측 = battery valuation 처럼 약·비유의. PER value premium 방향(음)만 약,
    PBR 역방향(양=저PBR→저forward, value trap 가능). = 미국 defensive 는 한국 consumer/telecom 강 value premium 재현 안 됨.
  indicators:
    - id: cs_per_z_24m
      signal: "PER cross-sectional z (저PER=value)"
      horizon: 24M_value
      ic_mean: -0.025       # 부호 음 = value premium 방향(저PER→고forward) 일치하나 약
      ic_ci_95_nw: [-0.144, 0.094]      # NW(n=173) = 0 포함 → 비유의
      ic_ci_95_block_boot: [-0.106, 0.049]  # block-boot(6M) = 0 포함
      t_nw: -0.41
      n_effective: 173
      cpcv_oos_hit: 0.53
      within_period: 0.47
      avg_universe_n: 25.8
      source_id: "raw-v3/validation-valuation-v3.json:indicators.per_z__24M_value"
      verdict: "INSUFFICIENT signal — PER value premium 방향(음)만 약, NW+boot CI 0 포함 비유의(p=0.68), BY 미생존. 한국 consumer/telecom value premium 방향 미재현. ★★[frame §M.12] 24M overlap eff_indep_N = 173/24 ≈ 7.2 = degenerate(월간 샘플링 23/24 겹침). 어차피 비유의라 verdict 영향 X — 방향만, magnitude+significance overlap inflation 라벨."
    - id: cs_pbr_z_24m
      signal: "PBR cross-sectional z (저PBR=value)"
      horizon: 24M_value
      ic_mean: 0.062        # ★부호 양 = 역방향(저PBR→저forward = value trap 가능)
      ic_ci_95_nw: [-0.072, 0.195]
      ic_ci_95_block_boot: [-0.019, 0.148]
      t_nw: 0.91
      n_effective: 173
      avg_universe_n: 25.9
      source_id: "raw-v3/validation-valuation-v3.json:indicators.pbr_z__24M_value"
      verdict: "INSUFFICIENT signal — ★부호 역방향(저PBR→저forward, value premium 반대 = 방어주 저PBR value trap 가능). 비유의(p=0.37). BY 미생존. ★★[frame §M.12] 24M overlap eff_indep_N ≈ 7.2 = degenerate = 방향만(어차피 역방향·비유의, verdict 영향 X)."
  multiple_testing: "8 테스트(2 신호×4 horizon) BY factor 2.72. raw_p_min=0.366(pbr_z__24M). ★BY 생존 0 = 전 valuation 비유의."
  verdict: >
    valuation 횡단면 메커니즘 = 작동(EDGAR PIT, avgN 26, cov 5150). 단 us_defensive 내 IC = 약·비유의
    (PER value premium 방향 약, PBR 역방향). ★momentum 무효 + rev_1m 단기 reversal(유의) + real_rate 듀레이션이
    defensive dominant 신호 — valuation 은 약. 사용자 "PER/PBR 평균대비 골고루" 산출 구조 완성, IC 유효성은 us_defensive 한정 약.
    ★battery(valuation 약) 패턴 = us_defensive 도 동일. cf. us_cyclical PER 작동 = sleeve 별 valuation IC 상이.

# ── robustness_checks ──
robustness_checks:
  - indicator_id: cs_rev_1m          # primary
    leave_episode: pass              # ex-peak -0.053 (full -0.045), 부호 생존
    within_period: pass              # 0.647
    partial_corr_ratio: null         # 통합 RegimeGlasso 단계
    net_sharpe_ratio: null           # |IC| 0.045 > 8bps/월(US 저비용) → net 보존 양호
    forward_vs_contemp: "forward present (단기 reversal 유의)"
    family_neutralized_ic: null      # FF5+Mom+QMJ+BAB = 통합 단계
    eff_n_tier: Validated            # ★n=193 months (≥100 = Validated) = 한국 대비 강
    multiple_testing_gate: fail      # BY 미생존(raw_p 0.0077)
    block_boot_applied: true         # ★IID 아님 (small-n rule §1.4, 기존 IID 격하 교훈)
  - indicator_id: cs_lowvol
    leave_episode: pass
    within_period: marginal          # 0.625
    eff_n_tier: Validated            # n=183
    forward_vs_contemp: "forward present (저변동성, NW 0 포함 = TENTATIVE)"
    multiple_testing_gate: fail
    block_boot_applied: true         # block-boot 0 배제 vs NW 0 포함 (보수 NW)

# ── horizon_verdict ──
horizon_verdict:
  best_horizon: "3M (rev_1m 단기 reversal 유의) + 12M (vol_60 저변동성 TENTATIVE)"
  forward_alpha_present: true        # ★rev_1m forward alpha 유의(단기 reversal). vol_60 TENTATIVE.
  note: >
    ★asset_stable horizon: momentum(mom_6/mom_12_1) 무효(한국 consumer/telecom 동형) + rev_1m 단기 reversal 유의(-0.045)
    + vol_60 저변동성 프리미엄 방향 안정적(NW 비유의). = 방어주 = valuation·저변동성·reversal 이 신호, momentum 아님.
    real_rate 듀레이션 민감(채권 대용)이 dominant 공통인자. valuation(PER value) = EDGAR §10.

# ── net-cost (US 비대칭 없음) ──
net_cost:
  model: "spread/2 + commission (★US: STT 없음, 대칭) — §M.4"
  roundtrip_bps: 16.0
  monthly_cost_bps: 8.0    # turnover 0.5/월
  note: "US 비용 = 한국(33bps) 대비 낮음(STT 없음). |IC| rev 0.045 > 8bps/월 → net 보존 양호. impact = supervisor 캘리브레이션."

