# summary.yaml — us_defensive sleeve v3 (★재작업 2026-06-03, sector-neutral z + G-B 자문 수렴)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge, BY/FDR, block-boot/LOO). comm_mature 4종 = magnitude 보수.
# ★재작업 핵심 = (1) S1 신규 신호(EDGAR 17 concept: payout/CFO 포함) (2) 자문 R2 4수정(family 3분리/M_eff/eff_N/basket불필요)
#   (3) sector-neutral z 정식 (4) ★G-B 트리거(BY 0/48) → 자체검증 + G-B 자문 수렴 = sleeve INSUFFICIENT.
# ★핵심 발견 = defensive 는 cyclical(PBR value 작동)과 정반대 = anti-value/anti-yield (단 BY 미생존 + regime 의존).
# raw 재현: raw-v3/{collect, measure}.py + _gb_self_verify.py → validation-metrics-v3.json + _gb_verify.json

industry: us_defensive        # eq_us Tier 1 sleeve (XLP/XLU/XLV/XLC-mature, 48종 = 15 staples + 15 utilities + 15 healthcare + 4 comm)
asset_scope: [equity.us]
archetype: asset_stable       # 방어주 (소비필수/유틸/헬스케어/성숙통신) — 안정 현금흐름·배당·듀레이션 민감
archetype_attestation:
  valid_from: "2010-01-01"    # ★PIT 사전선언 (yfinance 가용 + HY OAS 후 충분 표본)
  declared_at: "2026-06-03"
  primary_metric: net_issuance # ★breadth sweep: anti-issuance/buyback-aversion(단일 FDR family BY 생존, incremental). PARTIAL hedge.
  secondary: ep_yield         # anti-value (TENTATIVE, fixed-b size-valid but FDR 미생존). real_rate 듀레이션 = family_3 QUALIFIED
  basis: >
    ★asset_stable 방어주 = 안정 현금흐름·배당·bond-proxy 듀레이션. ★재작업 결론(cyclical 반대 가설 검증) =
    cross-sectional value/quality/payout 모두 ★약·역방향·regime 의존 (BY 0/48 생존, G-B 트리거).
    ep_yield(E/P) anti-value = TENTATIVE_DIRECTIONAL(regime-conditional, value premium 역방향). payout/dividend = QE artifact(2022+ 역전).
    ★sleeve INSUFFICIENT = cross-sectional factor-tilt 부적절. dominant = real_rate 듀레이션 β(family_3 macro overlay).
as_of: "2026-05-28"

# ── ★재작업 방법 정정 (자문 R2 4수정 + sector-neutral) ──
method_corrections:
  z_standardization: >
    ★sector-neutral z (frame §M.7 'within-industry peer-relative cross-sectional z') 정식 채택. 단일산업(한국 7산업)은
    sector-neutral=universe-demean byte-identical(무회귀). ★단 us_defensive 는 sector-neutral 전환해도 BY 0 유지 =
    us_cyclical(BY 0→8 회복)과 ★다름 = sector-mixing 이 주범 아님 = 신호 본질이 약/역방향(검증 b 입증).
  sector_z_mechanism: >
    ★검증(b) sector_z_decomposition: pbr 12M universe-z +0.021 / sector-neutral-z +0.016 / sector-LEVEL-component +0.009 =
    ★세 성분 모두 약·동부호 = sector-mixing 희석 ★아님. us_cyclical(within −0.117 vs sector-level +0.140 부호반대)과 대조 =
    defensive PBR 는 within-sector 도 약/역방향 = buyback book 왜곡 noise-trap 부분 지지(문헌). cross-std 0.959≈1(over-neutralize 아님).
    ★sleeve별 sector-neutral 효과 상이 = us_cyclical 결함교정 ↔ us_defensive 무회복(본질 약).
  by_family_3way: "family_1 unconditional 예측 IC(BY 검정) / family_2 regime-conditional gated(baa_aaa 사전지정, 별 m) / family_3 driver β attribution(real_rate/vix/dollar, BY 제외)."
  m_eff: "Li-Ji(2005) eigenvalue, test-statistic(IC 시계열) 상관행렬. raw m=48 → M_eff=26.0. family_1 BY threshold(rank1)=0.000998. ★survivors=0."
  eff_n_double: "시계열 eff_N≈T/h × 횡단면 N/(1+(N−1)ρ̄). 24M overlap eff_N≈7.2 degenerate(primary 강등). comm_mature 4종 = within-sector small-n."
  basket: "defensive = basket화 불필요(48종 cross-sectional 유효, mega_tech 전용)."

# ── ★B″ lock-blocking 게이트 (STEP 1~3, 자문 3R 대안 B″) ──
b2_gate:
  step1_payout_interaction: >
    ★현 regime_conditional(baa_aaa quintile split) = frame line 323 위반 → payout_interaction 전환(_payout_interaction.py).
    duration-orthogonalize(FWL, order=duration 먼저: payout~ΔReal_rate β_dur=0.016 t0.47 비유의) → ΔReal_rate continuous
    interaction(split 폐기, mega_tech regime_interaction 이식) → credit(baa_aaa) 적층. ★verdict 어휘 = armed-pending.
  step2_per_test_calibration: >
    ⑤ effective_n = n/(1+2Σρ_k) NW VIF(n=185 → n_eff 44~83, ρ1 0.78~0.88 고지속). ⑦ ★per-test calibration =
    fixed-b CV(Kiefer-Vogelsang 2005 Bartlett) + wild-cluster(block) bootstrap = small-block size-valid. 단일 FDR family.
  step3_ridge_lambda_pit: "⑥ Ridge λ = expanding-window PIT 동결(train 60% CV → eval 40% 미접촉) + λ∈{0.1λ*,λ*,10λ*} 3점 hedge → sign_stable=True(전부)."
  payout_result: >
    ★payout interaction = NO_INTERACTION(size-valid 비유의). 12M: IC~ΔReal_rate β=0.028 t_asy=0.43, fixed-b CV 2.09 기준
    비유의, wild-cluster p=0.68. dividend/payout 6M 동일. = ★split 의 QE −0.122 t−2.86 이 size-valid continuous interaction
    에서 소멸 = split 이 (a) garden-of-forking-paths(사후 가설) + (b) small-block NW asymptotic over-rejection(size-invalid)
    artifact 였음 입증(자문 R3 Claude size-invalid 경고 실증). ⛔armed-pending 조차 진입 불가 = rejected 강화.
  step4_add_family: >
    ★단일 FDR family(ep_yield + idio_vol + residual_mom, 9 test, M_eff=7.0). idio_vol 무신호(t0.73).
    residual_mom 12M IC+0.039 t2.55 size-valid 개별 유의 but 6M/3M 약. ep_yield 3M/6M/12M ★fixed-b size-valid 유의(t−2.4~−2.6,
    anti-value artifact 아님 입증=power 우려 반박) but FDR family BY 생존 0(raw_p_min 0.0122>threshold 0.0053). ★size-valid survivors 0.
  breadth_sweep: >
    ★사용자 지적("변경 B″ 프레임으로 후보 전수 검토했나") → breadth 6 신규(net_issuance/high_52w/amihud/op_profitability/roe/accruals)
    + 기존 ep/idio/rmom = 27 test 단일 FDR family(M_eff=19.0). ★★net_issuance 3M/6M/12M = ★단일 FDR family BY 생존(raw_p 3e-05)
    + fixed-b size-valid + ★incremental(직교화: ⊥ep_yield t3.71 / ⊥payout t2.41 잔존 = buyback-specific, anti-value cluster 너머).
    amihud 12M t1.98 경계(FDR 미생존). high_52w/op_prof/roe/accruals 무신호. ★SUE-PEAD 이연(8-K Item 2.02 furnish date anchor 데이터게이트).
    = ★verdict INSUFFICIENT → PARTIAL_CONFIRMED 변동(net_issuance 1 생존). _breadth_sweep.py + _breadth_sweep.json.
  raw_source: "raw-v3/_payout_interaction.py + _step4_add_factors.py + _breadth_sweep.py + _b2_stats.py(공용) → _payout_interaction.json + _step4_add.json + _breadth_sweep.json"

# ── 블록1 LENS ──
lens:
  pricing_principle: >
    ★us_defensive cross-sectional value/quality/payout 모두 약·역방향(BY 0/48). ep_yield(E/P) anti-value(저PER→저forward=value premium
    역방향, sign 일관 TENTATIVE). payout/dividend anti-yield = reach-for-yield QE artifact(2022+ 부호 역전). gross_prof≈0. vol_60 저변동성 약.
    = ★dominant 신호 = real_rate 듀레이션(bond-proxy, family_3 β−0.066 robust). sleeve alpha = macro overlay(supervisor 몫).
  cycle_reading: >
    2010-2026 = QE→정상화→COVID→인플레·금리급등(2022-23)→pivot. ★2010-2021 QE era = anti-value/anti-yield 강(성장형 defensive 압도).
    ★2022-2026 value-revival era = payout/dividend 부호 역전(고배당 부활) but ep_yield anti-value 부호 유지. credit regime(Baa-Aaa, family_2).
  estimation_note: >
    universe 48종(15 staples/15 utilities/15 healthcare/★4 comm_mature). ★comm_mature 4종 = sector-neutral within-sector small-n(magnitude 보수·hedge 라벨).
    n=185개월(2010~) = 한국 대비 장기. ★cross-sectional 신호 약(BY 0). real_rate 듀레이션 = sleeve common factor(보고만).

