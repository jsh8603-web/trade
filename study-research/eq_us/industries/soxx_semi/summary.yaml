    priority: low

# ════════════════════════════════════════════════════════════════════
# ── ★★CONDITIONAL IC SURFACE (한국 양식 복제, 2026-06-08) ──
# IC(지표, regime, horizon) = "어느 국면에 어느 지표가 forward return 예측하나".
# 측정: raw-v3/measure_conditional.py → validation-conditional-v1.json
# regime: rate10y(★nominal, NOT DFII10) tercile × credit(Baa-Aaa) tercile. horizon: y_5d/y_20d/y_60d daily.
# ════════════════════════════════════════════════════════════════════
conditional_ic_surface:
  cell_collapse: >
    셀 45 (지표5 × regime6 × horizon) 모두 powered (daily n 충분). ★단 y_60d overlapping = 자기상관 inflation
    (eff_N 보정, magnitude hedge). 2축 merge(rate×credit) = 통합단계.
  fdr_family:
    m_naive: 55               # 45 conditional 셀 + 10 family-2 interaction
    by_survivors: "pending_R4"  # ★BY 보정 R4 의무 (garden-of-forking-paths)
    note: "★현 = raw wc_p only. 단일 FDR family BY 보정 = R4. M_eff(value/quality 상관) 통합 supervisor."
  # ── ★핵심 발견: horizon 효과 (unconditional 단일 horizon 누락 보완) ──
  horizon_findings:
    - finding: "value = horizon 단조 증가 (장기 horizon value premium)"
      cells:
        - {signal: value, horizon: y_5d, ic: 0.032, wc_p: 0.004, n: 2862}
        - {signal: value, horizon: y_20d, ic: 0.068, wc_p: 0.002, n: 2847}
        - {signal: value, horizon: y_60d, ic: 0.104, wc_p: 0.0, n: 2807}
      mechanism: "value premium 은 장기 horizon 에서 발현. ★R3 y_20d 단독은 약·freeze 오판 → y_60d 로 명확."
    - finding: "low_vol(BAB) = horizon 단조 강화 (신규 강신호)"
      cells:
        - {signal: low_vol, horizon: y_5d, ic: -0.049, wc_p: 0.0, n: 2802}
        - {signal: low_vol, horizon: y_20d, ic: -0.075, wc_p: 0.001, n: 2787}
        - {signal: low_vol, horizon: y_60d, ic: -0.118, wc_p: 0.0, n: 2747}
      mechanism: "BAB(Frazzini-Pedersen 2014). 섹터 내 저변동 > 고변동. ★horizon 길수록 강."
  # ── ★regime conditional (y_20d) ──
  regime_findings:
    - finding: "value rate-extreme U자 (고/저 금리서 증폭, mid 소멸)"
      cells:
        - {signal: value, regime: "rate=low", ic: 0.103, wc_p: 0.0, n: 958, status: powered}
        - {signal: value, regime: "rate=mid", ic: -0.004, wc_p: 0.917, n: 953, status: powered}
        - {signal: value, regime: "rate=high", ic: 0.105, wc_p: 0.001, n: 936, status: powered}
      mechanism: "nominal 금리 극단 국면서 value 증폭. mid 소멸 = U자 conditional."
    - finding: "low_vol credit-stress 강화"
      cells:
        - {signal: low_vol, regime: "credit=high", ic: -0.117, wc_p: 0.001, n: 923, status: powered}
      mechanism: "credit 스트레스(Baa-Aaa 확대) 국면서 BAB 강화 (risk-off flight-to-safety)."
    - finding: "quality credit_low 한정 발현"
      cells:
        - {signal: quality, regime: "credit=low", ic: 0.092, wc_p: 0.01, n: 940, status: powered}
      mechanism: "credit 양호(스프레드 좁음) 국면서만 ROIC 발현. 그 외 무신호."
  # ── ★family_2 interaction (signal × regime_high dummy, day-clustered) ──
  family_2_interaction:
    method: "pooled panel: ret_rank ~ sig_rank + regime_hi + sig_rank×regime_hi, day-clustered SE"
    results:
      - {signal: value, regime: rate_high, b_main: 0.046, t_main: 6.66, b_interaction: 0.059, t_interaction: 4.61, verdict: "★interaction 유의 (rate_high서 value 증폭)"}
      - {signal: mom_12_1, regime: rate_high, b_main: 0.002, t_main: 0.23, b_interaction: 0.069, t_interaction: 4.48, verdict: "★interaction 유의 (uncond 비유의→conditional 발현)"}
      - {signal: low_vol, regime: credit_high, b_main: -0.054, t_main: -6.29, b_interaction: -0.064, t_interaction: -4.21, verdict: "★interaction 유의 (credit-stress BAB 강화)"}
      - {signal: rev_1m, regime: credit_high, b_main: -0.027, t_main: -3.66, b_interaction: 0.082, t_interaction: 5.82, verdict: "★interaction 유의 (credit-stress 단기 reversal)"}
      - {signal: quality, regime: credit_high, b_main: 0.023, t_main: 3.26, b_interaction: -0.023, t_interaction: -1.86, verdict: "interaction 비유의 (진짜 무신호)"}
    interpretation: >
      ★value/mom_12_1/low_vol/rev_1m = main 약/비유의여도 interaction 유의 = "국면 따라 신호 발현"(frame A-5 동형, 한국
      mom_6×KRW_weak 패턴). unconditional 약신호가 conditional 로 명확. ★quality 만 interaction 도 비유의 = 진짜 무신호.
  # ── ★walk-forward OOS (y_20d, IS 2015-21 / OOS 2022-26) ──
  walk_forward_oos:
    value: {is_ic: 0.057, oos_ic: 0.085, oos_wc_p: 0.019, verdict: "✅부호+magnitude 유지(강화) = in-sample artifact 아님"}
    low_vol: {is_ic: -0.077, oos_ic: -0.071, oos_wc_p: 0.10, verdict: "✅부호+magnitude 유지 (OOS wc_p 0.10 경계)"}
    mom_12_1: {is_ic: -0.012, oos_ic: 0.080, oos_wc_p: 0.042, verdict: "★IS/OOS 부호반전 = unstable, conditional only"}
    quality: {is_ic: 0.020, oos_ic: 0.009, verdict: "무신호 일관(IS/OOS 둘 다 무)"}
    rev_1m: {is_ic: -0.016, oos_ic: 0.024, verdict: "부호반전 비유의"}
  verdict: >
    ★FREEZE 철회 (team-lead 지적 실증): R3 unconditional 단일 horizon(y_20d) freeze 는 측정 축 부족(horizon 누락) 오판.
    conditional×horizon×family-2×OOS 전체 보면 (a) value y_60d +0.104 + rate-extreme + OOS robust (b) low_vol(BAB) y_60d
    −0.118 + credit_high + OOS robust = ★살아남. = (D) granular 부분 정당. ★단 TENTATIVE(생존편향 PARTIAL + overlapping
    inflation + FDR 미보정). quality = 진짜 무신호. mom/rev = conditional only(OOS 불안정).

# ── Hard-fail 4 (B C D I) self-check ──
hard_fail_self_check:
  B_real_data: {status: PASS, note: "합성 0%. yfinance prices(2867 daily) + EDGAR(22,798 rows) + FRED macro 실측. raw-v3 .py 재현."}
  C_traceability: {status: PASS, note: "모든 IC = validation-{vq,conditional}-v1.json key 매핑."}
  D_pit: {status: PASS, note: "EDGAR (ticker,concept,end) 최초 filed + forward shift. macro ffill PIT. ★단 filed-end lag median 227d = 최초 filed 채택 완화."}
  I_survivor_bias:
    status: PARTIAL
    note: >
      ★현 12종 = SOXX/ICE 현 holdings only. MRVL/NXPI 등 현 편입종목 누락 + 과거 편출/상폐 부재. historical membership
      무료부재(CRSP/Compustat 유료). → ★TENTATIVE 상한(CONFIRMED 금지). I축 PARTIAL.

# ── verdict (small-n rule) ──
verdict_label: PARTIAL          # ★전체 = PARTIAL (conditional 발현 but TENTATIVE)
verdict_detail:
  value: >
    PARTIAL — y_60d IC +0.104(wc_p 0, CI 0배제) + rate-extreme conditional + OOS +0.085(부호+magnitude 유지) + family-2
    t=4.61. ★단 TENTATIVE(생존편향 PARTIAL + y_60d overlapping inflation + FDR 45셀 R4 미보정). value 단독 채택(결합은 희석).
  low_vol: >
    PARTIAL — y_60d IC −0.118(wc_p 0) + credit_high + OOS −0.071(wc_p 0.10 경계) + family-2 t=−4.21. BAB 신규 발견. TENTATIVE.
  quality: "REJECTED(무신호) — 전 horizon/regime/family-2 비유의. value+quality 결합 희석 원인."
  mom_12_1: "conditional only — rate_high family-2 t=4.48 유의나 OOS 부호반전(IS−0.01/OOS+0.08) = unstable."
  rev_1m: "conditional only — credit_high family-2 t=5.82 + y_60d −0.060이나 OOS 비유의."
verdict_note: >
  ★FREEZE 철회. 미국 반도체 within-sector value-selection = (D) 부분 정당(value + low_vol = conditional×horizon×OOS robust).
  R3 unconditional 단일 horizon freeze 는 horizon 누락 오판(team-lead 지적 실증). ★자문 통설 2건 반증: (1) Novy-Marx
  value+quality 결합강화 = 우리 데이터선 quality 무신호로 희석 (2) momentum 미국 작동 가설 = OOS 부호반전 unstable. ★tier
  = TENTATIVE 전반(생존편향 PARTIAL + overlapping inflation + FDR R4 미보정 + small-n). ★data 라벨 정정(rate10y=nominal,
  NOT DFII10 실질) = R4 DFII10 재fetch 의제. R4 = FDR BY 보정 + DFII10 재측정 + 15axis-audit + 생존편향 보강 후 tier 재판정.
