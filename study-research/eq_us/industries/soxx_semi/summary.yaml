# summary.yaml — SOXX(미국 반도체) 섹터 granular (frame v3 §M / SECTOR-GRANULAR-GUIDE §10 계약)
# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-n rule(hedge 어휘, BY 보정 R4, block-boot/wild-cluster).
# 산출 범위 = within-sector value-selection(primary) conditional IC surface (한국 semiconductor 양식 복제).
# raw 재현: raw-v3/{measure_value_quality, measure_conditional}.py → validation-{vq,conditional}-v1.json

industry: us_soxx_semi          # eq_us 섹터 granular 파일럿 1번 (반도체)
asset_scope: [equity.us]
archetype: cyclical_growth      # 메모리 cycle + AI capex reflexivity + long-duration growth (한국 메모리 IDM 과 차이)
archetype_attestation:
  valid_from: "2015-01-01"      # prices coverage (★IS 2010 가정 불가, 2015~)
  declared_at: "2026-06-08"
  primary_metric: ev_ebitda     # cyclical primary (peak-EPS trap 경계). PBR 병용
  secondary: value_quality_combined  # ★실측 falsify: 결합이 value 희석(quality 무신호) = Novy-Marx 통설 반증
  basis: >
    미국 반도체 = 다각화(팹리스/메모리/장비/아날로그) + AI capex reflexivity. ★within-sector value-selection(ρ) primary,
    rotation/timing(κ) 회의(~30%, book-to-bill 데이터 사망+주가선행 = falsify). 한국 KRW_weak regime 이식불가 → 미국 =
    nominal금리×credit regime. ★실측 = unconditional 단일 horizon 약했으나 conditional×horizon×OOS 로 value/low_vol 살아남.
as_of: "2026-05-28"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    미국 반도체 = cyclical_growth. "싸다" = EV/EBITDA·P/B (★peak-EPS trap: 사이클 정점 EPS高→PER低 함정 = Intel legacy
    vs NVDA leading-edge value-trap). ★value 단독은 약 작동(y_60d IC +0.104), ★value+quality 결합은 quality(ROIC) 무신호로
    오히려 희석(0.068→0.030) = Novy-Marx "결합 강화" 통설 우리 데이터 반증. low_vol(BAB) = 신규 강신호(y_60d −0.118).
  cycle_reading: >
    2015-2026: 메모리 down(2018-19)→COVID(2020-21)→AI/HBM hyper-cycle(2023-26). ★AI capex reflexivity(NVDA/AVGO 시총지배,
    하이퍼스케일러 capex positive feedback) = episode-dependence 위험 → IS/OOS walk-forward 의무. regime = nominal금리 tercile
    × credit(Baa-Aaa) tercile.
  estimation_note: >
    universe = SOXX/ICE 현 holdings 12종(생존편향 PARTIAL, MRVL/NXPI 등 누락 + historical membership 무료부재). N=12 small-N
    → 검정력 시계열에서(단월 IC SE≈0.30). ★daily horizon 5d/20d/60d. y_60d overlapping = 자기상관 inflation hedge.
    ★data: rate10y = nominal 10y(NOT DFII10 실질, 음수0 = DGS10). regime 해석 = nominal 금리 국면.

# ── 블록2 INDICATORS (forward 횡단면 Rank-IC, horizon-tagged) ──
# ★점추정 금지: ic_mean + ci_95(block-boot) + wc_p + n + oos + tier
indicators_passed:
  - id: value_pbr_ev_ebitda
    layer: 1                    # valuation (PBR + EV/EBITDA z 평균)
    family: value
    horizon: y_60d              # ★horizon 단조 증가 = y_60d 본진
    ic_mean: 0.104              # ★부호 양 = cheap(저PBR/저EV-EBITDA) → forward+
    ic_ci_95: [0.054, 0.154]    # block-bootstrap(block=20d, B=1000). 0 배제
    wc_p: 0.0                   # wild-cluster bootstrap (block=20d)
    n_days: 2807
    horizon_structure: "y_5d +0.032 / y_20d +0.068 / y_60d +0.104 (단조 증가)"
    oos: "IS 2015-21 +0.057 → OOS 2022-26 +0.085 (wc_p 0.019, 부호+magnitude 유지=강화)"
    conditional: "rate-extreme U자(rate_low +0.103 / rate_high +0.105 / rate_mid −0.004 소멸). family-2 rate_high b_inter +0.059 t=4.61"
    source_id: "raw-v3/validation-conditional-v1.json:unconditional.value.y_60d"
    tier: TENTATIVE             # 생존편향 PARTIAL + overlapping inflation + FDR 미보정
    notes: |
      ★within-sector value premium = primary. y_60d 단조 강화 + OOS robust + rate-extreme conditional.
      ⚠️ value+quality 결합(IC 0.030)은 quality 무신호로 희석 = ★Novy-Marx 결합강화 통설 반증(우리 데이터). value 단독 채택.
      magnitude hedge: y_60d overlapping 자기상관 inflation, small-n, FDR(45셀+family-2) R4 미보정.
  - id: low_vol_bab
    layer: 3                    # price-based (저변동/BAB)
    family: low_vol
    horizon: y_60d
    ic_mean: -0.118             # ★부호 음 = 저변동(z sign −1로 정렬) → 저변동 종목 forward+ = BAB 작동
    ic_ci_95: [-0.169, -0.064]  # block-boot 0 배제
    wc_p: 0.0
    n_days: 2747
    horizon_structure: "y_5d −0.049 / y_20d −0.075 / y_60d −0.118 (단조 강화)"
    oos: "IS −0.077 → OOS −0.071 (wc_p 0.10 경계, 부호+magnitude 유지)"
    conditional: "credit_high −0.117 (wc_p 0.001) / rate-extreme. family-2 credit_high b_inter −0.064 t=−4.21"
    source_id: "raw-v3/validation-conditional-v1.json:unconditional.low_vol.y_60d"
    tier: TENTATIVE
    notes: "★신규 발견 = BAB(Frazzini-Pedersen 2014) 작동. 섹터 내 저변동(TXN/MCHP) > 고변동(NVDA/AMD). credit-stress서 강화."

# ── 블록3 RELATIONSHIPS (partial-corr) — 통합 RegimeGlasso 입력 ──
relationships_passed:
  - {node_a: value_pbr_ev_ebitda, node_b: semi_fwd_60d, lag_months: 0, corr: 0.104,
     corr_ci_95: [0.054, 0.154], conditioning_set: [], n: 2807,
     source_id: "raw-v3/validation-conditional-v1.json:unconditional.value.y_60d",
     note: "cross-sectional IC(unconditional). partial-corr(공통인자 통제) = 통합 단계."}

# ── 블록4 WEIGHT_RULES — (range, 점추정 금지) ──
weight_rule_candidates:
  - indicator_id: value_pbr_ev_ebitda
    base_weight_range: [0.04, 0.12]    # ★양 IC = cheap 종목 overweight. CI 반영 보수 range
    modulate_by: [regime, horizon, cycle_phase]
    direction: "저PBR/저EV-EBITDA(cheap) 종목 overweight, peer-relative. rate-extreme regime서 증폭."
    granularity: cross_sectional
    gate_status: {n: pass, se: pass, power: pass_y60d, fdr: pending_R4, oos: pass}
    source_ids: ["raw-v3/validation-conditional-v1.json:unconditional.value.y_60d"]
    hedge_note: "TENTATIVE: 생존편향 PARTIAL + y_60d overlapping inflation + FDR(45셀) R4 미보정. magnitude 보수 cap."
  - indicator_id: low_vol_bab
    base_weight_range: [0.04, 0.12]
    modulate_by: [regime, horizon]
    direction: "섹터 내 저변동 종목 overweight (BAB). credit-stress regime서 강화."
    gate_status: {n: pass, se: pass, power: pass_y60d, fdr: pending_R4, oos: pass_marginal}
    hedge_note: "TENTATIVE: OOS wc_p 0.10 경계 + overlapping + FDR R4."

# ── 블록5 CONFIDENCE_HOOKS — ★affects_indicator 필수 ──
confidence_hooks:
  - hypothesis_id: semi_value_premium_long_horizon
    affects_indicator: value_pbr_ev_ebitda
    affects_edge: [value_pbr_ev_ebitda, semi_fwd_60d]
    confirm_signal: "live 저PBR/저EV-EBITDA 종목 60d forward rank > 고밸류 유지 (rolling, rate-extreme regime서 증폭)"
    reject_signal: "Rank-IC e-CUSUM 부호 반전 누적 K=3 (value premium 소멸) 또는 rate_mid 일관 무신호"
    feeds_weight: "derive_weights 재적합 → value base_weight 변동 (부호 양 유지 조건)"
    action_threshold: "e-value > 1/alpha=20 → retract"
  - hypothesis_id: semi_bab_low_vol
    affects_indicator: low_vol_bab
    affects_edge: [low_vol_bab, semi_fwd_60d]
    confirm_signal: "live 저변동 종목 60d forward > 고변동, credit-stress서 강화"
    reject_signal: "IC 부호 양 전환 누적 (BAB 소멸)"
    feeds_weight: "low_vol base_weight 변동"

