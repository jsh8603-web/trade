  declared_at: "2026-06-03"
  primary_metric: fwd_eps_growth   # compounder primary (성장·fwd EPS, ★PER value 아님 = expensive_trap)
  secondary: quality_lowvol        # 저변동성 quality (안정 mega-cap 복리)
