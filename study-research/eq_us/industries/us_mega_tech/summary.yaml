# ⛔ 점추정 prior 박제 금지 — 분포·CI·게이트. small-basket(N=11) hedge 강(§M.12 eff_N/breadth-IR/magnitude haircut).
# ★재작업 핵심 = (1) S1 신호(Gormsen-Lazarus duration) (2) 자문 R2 4수정(family 3분리/M_eff/eff_N/★수정4 basket화)
#   (3) ★basket-level time-series factor timing 우선(N=11 cross-sec 통계력 약, Grinold breadth) + cross-sec small-basket hedge
#   (4) ⛔ sector-neutral z 비적용(단일 archetype compounder basket, peer 구조 없음) — us_cyclical multi-sector 와 분기(15axis G-A.5)
# raw 재현: raw-v3/{collect, measure}.py + data/{prices, amount, edgar_fundamentals}.parquet + us_defensive/raw/fred → validation-metrics-v3.json

industry: us_mega_tech        # eq_us sleeve T0 (compounder, Mag7 custom basket 11종: Mag7+AVGO/AMD/ORCL/ASML)
asset_scope: [equity.us]
archetype: compounder         # long-duration growth + quality. expensive_trap(고PER 정상 = value premium 부재)
archetype_attestation:
  valid_from: "2015-01-01"    # ★PIT 사전선언 (yfinance 가용 시작)
  declared_at: "2026-06-03"
  primary_metric: real_rate_exposure   # ★basket-level duration(real-rate β) 노출 — Gormsen-Lazarus. ★노출≠alpha(timing 약). fwd EPS growth(IBES 유료 gap)
  secondary: quality_lowvol        # 저변동성 quality(cross-sec small-basket hedge, basket-level low-beta)
  basis: >
    ★mega-tech = long-duration growth(Gormsen-Lazarus 2023 JF duration). ★실측 = ★basket-level real_rate Δ β −0.154 단독
    / −0.210 multivariate(t−5.14) 강 음 = ★duration factor **노출** 강(QUALIFIED, us_defensive −0.066 대비 3배 = 이론 정합).
    ⛔ 단 ★노출(contemporaneous β) ≠ alpha(예측) — forward timing ts_IC −0.191 p0.032 = ★약 유의(노출 강·예측 약). duration timing alpha
    는 supervisor macro overlay 몫. VIX β 강 음(고베타 risk-on, risk overlay). PER 무신호(expensive_trap 가설 확인). cross-sec vol_60(+0.241)
    = small-basket hedge(N=11 BY 미생존). ★sleeve 종합 = factor alpha 빈약 + duration overlay 가 본질(자문 R2 수정4 basket화).
as_of: "2026-05-28"

# ── ★재작업 방법 정정 (자문 R2 4수정 + ★수정4 basket화) ──
method_corrections:
  basket_level_primary: >
    ★자문 R2 수정4 = N=11 small-basket → cross-sectional rank-IC 통계력 약(Grinold IR=IC√breadth, breadth 11×ρ̄ 0.429
    보정 시 cross_eff_n=2.08). → ★basket-level time-series factor exposure timing(real_rate/VIX/dollar/rate β + forward
    timing) 우선 = family_1b 신규. cross-sectional 은 small-basket hedge(breadth-IR ρ̄ 보정 + magnitude 50~70% haircut),
    단독 verdict 금지.
  sector_neutral_NA: >
    ⛔ sector-neutral z 비적용 = 단일 archetype(compounder) basket, 11종 모두 mega-tech 그룹 = sub-sector demean 할
    peer 구조 없음 → universe-demean = sector-neutral 동치(별 sector factor 없음). us_cyclical(multi-sector 5개)는 sector-neutral
    필수였으나 mega_tech 비적용. ★15axis G-A.5 사유 명시.
  by_family_3way: "family_1 cross-sectional unconditional 예측 IC(BY) / family_1b basket-level factor timing(별 측정) / family_2 regime-conditional(VIX 사전지정, 별 m) / family_3 driver β attribution(BY 제외, family_1b 단독/multivariate 겸용)."
  m_eff: "Li-Ji(2005) eigenvalue, test-stat(IC 시계열) 상관행렬. raw m=30 → M_eff=19.0. nondegenerate(24M strip) M_eff=16.0. family_1 BY threshold(rank1)=0.001484."
  eff_n_double: "★시계열 eff_N≈T/h × 횡단면 eff_N=N/(1+(N−1)ρ̄). ★mega-tech ρ̄=0.429 높아 cross_eff_n=11→2.08 급감(small-basket degenerate 민감). breadth-IR 에 cross_eff_n 사용(과대 방지). 24M overlap ts_eff_n≈4.6 degenerate."

# ── 블록1 LENS ──
lens:
  pricing_principle: >
    us_mega_tech = compounder(long-duration growth + quality). "싸다" ≠ 저PER(★expensive_trap: 고PER 정상 = growth-duration,
    Gormsen-Lazarus). ★primary = basket-level real_rate(duration) factor **노출** β = −0.21(강 음, ★노출≠alpha = timing 예측 약).
    VIX β 강 음(고베타 risk-on, risk overlay). quality(저변동) = cross-sec small-basket hedge(+0.241 but BY 미생존). value premium 부재(PER 무신호).
    ★sleeve 본질 = factor alpha 빈약 + duration overlay(supervisor macro 입력).
  cycle_reading: >
    2015-2026 = 모바일→클라우드→AI(2023~) 복리. ★duration 채널 = 할인율(real rate Δ) 민감(level 아닌 Δ). NDX yoy regime
    bull 편중. ★reflexivity(H9 risk overlay): intra-corr recent 0.355<0.70 + breadth +0.08 = 정점 아님(cap-down 미발동).
  estimation_note: >
    universe 11종 custom basket. ★N=11 = Grinold breadth 협소 → basket-level time-series timing 우선 + cross-sec small-basket
    hedge(ρ̄=0.429, cross_eff_n 2.08). n=136개월(2015~). ⛔ sector-neutral 비적용(단일 archetype).

