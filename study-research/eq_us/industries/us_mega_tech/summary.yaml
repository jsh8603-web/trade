as_of: "2026-05-31"

# ── 블록1 LENS (정성) ──
lens:
  pricing_principle: >
    us_mega_tech = compounder. "싸다" ≠ 저PER(★expensive_trap: 고PER 정상 = growth-duration). primary = fwd EPS 성장·quality.
    ★실측 결론: vol_60 저변동성 quality(AAPL/MSFT 안정 mega-cap) IC +0.241 dominant. PER value premium 없음(고PER 정상).
    momentum 약 양(성장 persistence). valuation(PBR 약 value/PER 무신호/capex) = §10(EDGAR). VIX 민감(고베타 risk-on).
  cycle_reading: >
    2015-2026 = 모바일→클라우드→AI(2023~) 복리 성장. NDX yoy regime: bull 84 / neutral 45 / bear 8 month(compounder bull 편중).
    ★reflexivity(H9): intra-Mag7 60d corr full 0.45/recent 0.355(p75 0.534) + breadth EW-top3 spread +0.08 = ★현재 정점 아님(corr<0.70, breadth 양).
  estimation_note: >
    2026-05 시점: universe 11종 custom basket(Mag7+AVGO/AMD/ORCL/ASML). ★n=11 = 횡단면 avg_N 11 small-basket =
    small-n hedge 강(magnitude haircut + breadth-IR 병기). n=123개월(2015~). 본 산출 = 측정+peer-relative z card + reflexivity monitor.

