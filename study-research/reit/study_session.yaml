# ============================================================================
# 블록1 LENS — 정성 렌즈 (단정 표현 모두 강등, 실측 인용 + 한계 명시)
# ★가변: 블록5 flag 누적이 본 필드 (특히 estimation_note, regime_reading) 와 블록4 가중치
# 미세변동시킴. v1 의 단정 매핑은 H4/H5 confirm + H1/H3 reject 로 모두 폐기.
# ============================================================================
lens:
  pricing_principle: >
    REIT 가격 ≈ AFFO / (r_f + ERP_REIT + ΔCapRate − g_NOI). 90%+ 배당 의무로 retained earnings
    부재 → growth = 외부조달 또는 development pipeline. long-duration cash-flow 자산. ERP_REIT
    historical 3-5% (NAREIT 50y ~3.8%). NAV anchor + P/AFFO + DCF 3 cross-check 가 실무 standard.

  report_relations:
    - "10Y rate ↑ → discount rate ↑ → REIT 가격 하향 압력 (학설 negative 합의: Giliberto-Shulman 2017 외)"
    - "HY OAS ↑ → REIT 차입금 refinancing cost ↑ + capital outflow → 하향 압력"
    - "implied cap rate − private appraisal cap rate spread = mean-reverting anchor (proxy 검증
      CONFIRMED, 단 2008 GFC episode 처럼 deep discount 가 더 깊어질 수 있음)"
    - "AFFO/FFO 비율 sector standard 차이: triple-net 95-100% / industrial-multifamily 85-95% /
      office-retail-lodging 70-85% → sector-adjusted transform 필요"
    - "★ window 길이 (1d/30d/365d) 에 따라 sub-sector ranking 이 essentially random — 단일 window
      regime 매핑은 본질적 noise (H4 실측 Kendall τ=0.077, swap rate 88% on n=77 anchor 2020-2026)"
    - "★ rate-shock window 후 60d 의 cross-section: long-WALT REIT (Healthcare/Datacenter/Specialty)
      가 outperform 가설 (Rank-IC +0.240 z+3.18, n=23, single Fed hike cycle 2022-2025) — v1 의
      direction 가설 정반대 (long-WALT underperform) reject 됨"

  regime_reading: >
    ⚠ v1 의 단정 매핑 ("Reflation → industrial 강세", "Recession → 후반 강세" 등) 모두 폐기 — H5
    실측으로 quantitative reject (Reflation 12 quarter 의 Industrial avg rank = 4.83 / 9 = mid).
    대신 다음 *경험적 분포* (n=33 quarter 2018-2025 한계) 만 잠정 기록:
    - Reflation (n=12): Healthcare (rank 3.75) + Specialty (4.17) 우위
    - Recovery (n=7): Healthcare (3.43) + Hotel (3.86) + Datacenter (4.14) 우위
    - Overheat (n=6): Storage (3.00) + Apartment (4.33) 우위
    - Stagflation (n=2 ★ 극소수): Industrial (2.00) + Retail (2.50) — n 부족 신뢰 낮음
    - Recession (n=3 ★ 극소수): Healthcare (3.00) + Retail (3.00) — n 부족
    - Mean inter-regime Spearman ρ = +0.087 (essentially random) — 단일 매핑 무효.
    - 단 Recession-Stagflation (ρ=0.768) + Recession-Recovery (ρ=0.849) 만 cluster 일관.

  estimation_note: >
    2025~2026 시점 anchor (Nareit primary):
    - Cap rate spread Q3 2022 peak 243bp → Q4 2023 123bp → Q2 2024 130bp → Q3 2024 60bp est
      (REIT recovery 거의 완료). ⚠ R1 인용 "Q4 2024 120bp" 는 primary 미확인 — baseline 제외.
    - 2024 sub-sector 실측: specialty +35.9% / data center +25.2% / healthcare +24.2% / office +21.5%
      / industrial −17.7% (Nareit webinar recap primary).
    - 2025 YTD: healthcare +28.5% / industrial +17.0% / diversified +15.5%. Dec 2025: healthcare
      WORST (-8.4%, 10Y +16bp 동행) — single-month flip 직접 증거.
    - Q2 2023 sub-sector cap rate spread: Office 259bp / Apartment 194bp / Retail 150bp /
      Industrial 93bp (Nareit primary) — industrial 의 좁은 spread 가 2024 −17.7% sell-off 의
      mechanism (낙관 fully priced).
    가변경로: H2 의 cap rate spread mean-revert 가 6Q+ 미회복 시 (reject signal b) lens 의
    "mean-reverting anchor" 신뢰 약화 (2008 GFC 두 episode 가 reject signal trigger 실사례).

