# ============================================================================
# 블록5 CONFIDENCE_HOOKS — (확신/거부) flag 코드 구현
# 실측 검증 (H1~H5) 의 confirm/reject 가 *이미* trigger 된 hypothesis 포함.
# 코드 구현 = weight_falsification.score_ic_breakdown_eprocess REIT scope sub-IC.
# ============================================================================
confidence_hooks:
  - hypothesis_id: H4_window_flip_meta
    status: "CONFIRMED (실측 mean Kendall τ=+0.077, swap rate 88%, n=77 anchor 2020-2026)"
    confirm_signal: "rolling 24m window 의 1d vs 365d sub-sector ranking swap rate > 30% OR Kendall τ < 0.7"
    reject_signal: "Kendall τ > 0.7 across all window pairs (consistent ranking)"
    emit_where: "scripts/train_weights.py REIT batch 진입 시 cross-section ranking flip 진단 hook"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess (REIT scope meta-sub-IC)"
    confidence_metric: "swap rate + Kendall τ (e-process 불요 — direct cross-tabulation)"
    store: "AssumptionRegistry weight.equity.reit.window_flip 카드 confidence_now + RulePerformance"
    action_threshold: "이미 confirmed (swap 88%) → block4 의 모든 weight_rule 에 window_length modulate 강제"
    feeds_weight: "block4 modulate_by enum 'window_length' 추가의 root cause; 12m forward / 1d / 30d 각 window 별 별도 score 생성"

  - hypothesis_id: H1_long_walt_rate_shock
    status: "★ REJECTED with sign mismatch (실측 mean Rank-IC +0.240, z+3.18, n=23, 2018-2025 single Fed hike cycle). Bonferroni α/5 보정 후도 sig (z+3.18 > 2.81)."
    confirm_signal: "(v1 가설) cross-section Rank-IC (WALT_rank vs fwd_60d_return_rank) < -0.05"
    reject_signal: "cross-section Rank-IC > +0.05 (sign mismatch) — 실측 trigger 됨"
    emit_where: "core/assume/judge.py post-LLM 사후평가 hook + backtest engine SELL outcome 시 cross-section IC 계산. rate-shock window 라벨 = FRED DGS10 4w diff > 50bp"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess (REIT scope sub-IC 1)"
    confidence_metric: "anytime-valid e-value (mixture-SPRT e-process)"
    store: "registry RulePerformance + lens.regime_reading 의 'long-WALT outperform 가설' 잠정 채택"
    action_threshold: "✅ v1 'rate-shock + long-WALT → beta_rate 가중↑↑↑' 규칙 폐기. v2 잠정 '가중↑ 단 reverse direction' (defensive rotation 가설) — tier 'structural prior (저신뢰)' 라벨. 추가 rate cycle 검증 (1994/2004/2013) 시 confidence 상향"
    feeds_weight: "block3 walt_years ↔ beta_rate prior_sign 'pos' → 'neg' 변경. block4 의 beta_rate base_weight 0.15 → 0.10 강등"

  - hypothesis_id: H2_cap_rate_spread_mean_revert
    status: "PARTIAL CONFIRMED (VNQ proxy Rank-IC -0.361 p<<0.001, deep-discount 275 obs +32.5% mean fwd 12m / 단 2008 GFC 2 episode reject 사례). Direct cap rate spread sparse (n=4 quarter primary)"
    confirm_signal: "VNQ price 24m rolling Z < -1.5 → 12m fwd Rank-IC > +0.15 (proxy 부호) OR direct cap rate spread Z < -1.5 (post-GFC 환경)"
    reject_signal: "(a) Rank-IC < 0 sign mismatch OR (b) deep discount (Z<-2) 6Q+ 지속 미회복 = regime change (2008 episode 실사례)"
    emit_where: "backtest engine Q-end rebalance hook + judge 사후평가. cap rate spread 시계열 = Nareit T-tracker quarterly fetch"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess (REIT scope sub-IC 2 + secondary 'persistence' test)"
    confidence_metric: "e-process anytime-valid + structural break test (Chow-like, secondary)"
    store: "registry 카드 confidence_now + lens.estimation_note 의 'mean-revert anchor' 문장 신뢰도"
    action_threshold: "Q3'24 60bp est = recovery 거의 완료 신호. block4 implied_cap_rate_spread base_weight 0.08 (validated 부분만). Q4'24 120bp baseline 제외 (E축). 6Q+ 지속 거부 시 base_weight 0.0 + lens 약화"
    feeds_weight: "block4 implied_cap_rate_spread + price_to_nav base_weight 동시 micro-adjust"

  - hypothesis_id: H3_debt_wam_rate_shock
    status: "★ REJECTED (실측 mean Rank-IC -0.117, z-2.09, n=23). Bonferroni α/5 보정 시 borderline (z<2.81). sector-WAM proxy range 2.5y 좁음 — 검정력 한계 명시."
