# ============================================================================
# 블록3 RELATIONSHIPS — partial-corr prior (glasso corr_prior 주입)
# v1 의 force-include 일부 prior_sign 변경 (H1/H3 실측 반영).
# conditioning_set 에 rate factor 명시 (L축 통합 상관행렬 중복 차단 prerequisite).
# ============================================================================
relationships:
  # === force-include 후보 (이론·회계 강한 관계, 4개) ===
  - node_a: affo_yield
    node_b: implied_cap_rate_spread
    edge_type: direct
    conditioning_set: []                  # 회계 정의식 (둘 다 NOI 분자 + price 분모)
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.70
    theory_basis: "정의식: AFFO yield ≈ NOI yield ≈ implied cap rate. 직접 강한 관계"

  - node_a: same_store_noi_growth
    node_b: occupancy_rate
    edge_type: direct
    conditioning_set: []
    lag_routing: lagged
    prior_sign: pos
    prior_strength: 0.65
    theory_basis: "NOI = rent × occupancy. 회계 직접 (occupancy 가 NOI growth leading 1-2Q)"

  - node_a: beta_rate
    node_b: realized_vol
    edge_type: direct
    conditioning_set: [beta_credit]       # credit factor 분리
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.55
    theory_basis: "rate-shock 이 REIT vol 자극 (long-duration discount rate sensitivity)"

  - node_a: fwd_ep_ratio
    node_b: affo_yield
    edge_type: direct
    conditioning_set: []
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.55
    theory_basis: "REIT 에서 EP ≈ AFFO yield × (1 − D/A adj). 회계 정합"

  # === 시변·conditioning_set 강조 (학설 inconclusive + L축 중복 차단) ===
  - node_a: beta_credit
    node_b: beta_rate
    edge_type: common_cause
    conditioning_set: [realized_vol]      # 공통원인 = 유동성/위험 regime
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.35
    theory_basis: "rate β 와 credit β 의 공통원인 = risk-off regime. vol conditioning 으로 direct 분리"

  - node_a: leverage_debt_ebitda
    node_b: beta_credit
    edge_type: direct
    conditioning_set: [sector_archetype]  # archetype 별 leverage baseline 차이 흡수
    lag_routing: lagged
    prior_sign: pos
    prior_strength: 0.45
    theory_basis: "고레버리지 → credit 충격 전달 큼. archetype baseline 분리"

  # === ★ H1/H3 실측 반영 — 부호 변경 ===
  - node_a: walt_years
    node_b: beta_rate                     # H1 결과: long-WALT 가 *outperform* in rate-shock window
    edge_type: direct
    conditioning_set: [sector_archetype, debt_maturity_wam_years]  # H3 와 partial-corr 분리
    lag_routing: contemporaneous
    prior_sign: neg                       # ★ v1 'pos' → v2 'neg' (long-WALT 가 rate-shock 시 더 *덜* 빠짐, defensive rotation)
    prior_strength: 0.30                  # single rate cycle 2022 한계 (G축 강등)
    theory_basis: "★ H1 실측 (mean Rank-IC +0.240, z+3.18, n=23, 2018-2025 single Fed hike cycle). v1 의 long-duration → rate β ↑ 가설 reject. Mechanism 가설 = defensive rotation + secular growth confounding"

  - node_a: debt_maturity_wam_years
    node_b: beta_rate                     # H3 결과: long-WAM 가 *underperform* (H1 과 부호 반대!)
    edge_type: direct
    conditioning_set: [sector_archetype, walt_years]    # H1 (WALT) 와 partial-corr 분리
    lag_routing: contemporaneous
    prior_sign: pos                       # ★ v1 'neg' → v2 'pos' (long-WAM 가 rate-shock 시 underperform — 실측 반전)
    prior_strength: 0.20                  # sector-WAM proxy range 2.5y 좁음 (검정력 약함)
    theory_basis: "★ H3 실측 (mean Rank-IC -0.117, z-2.09, n=23). H1 과 부호 mismatch — proxy collinearity 시사. ticker-level WAM (EDGAR NLP) 후 partial-corr 분리 시 정확화"

  # === H2 (cap rate spread mean-revert) ===
  - node_a: implied_cap_rate_spread
    node_b: realized_vol                  # spread 와 fwd return 간 관계는 lagged (block5 H2)
    edge_type: direct
    conditioning_set: [beta_rate]
    lag_routing: lagged                   # 12m forward
    prior_sign: neg                       # spread Z 음 (압축) → 12m fwd vol 음 (recovery)
    prior_strength: 0.40
    theory_basis: "H2 proxy 결과 (Spearman ρ=-0.361 p<<0.001 on n=4629 VNQ). 단 2008 GFC 2 episode reject 사례 (regime change)"

  - node_a: mom_12_1
    node_b: earnings_revision_breadth
    edge_type: common_cause
    conditioning_set: []
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.40
    theory_basis: "둘 다 information arrival 의 reflection. 공통원인 분리"

  - node_a: ffo_payout_ratio
    node_b: realized_vol
    edge_type: direct
    conditioning_set: [leverage_debt_ebitda]
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.30
    theory_basis: "payout 100% 초과 = 배당 cut 위험 = vol spike. leverage conditioning"


# ============================================================================
# 블록4 WEIGHT_RULES — ★최종 산출 (실측 반영, v1 단정 규칙 모두 폐기/수정)
# H4 confirm → modulate_by 에 'window_length' 추가 (joint with regime/industry).
# H1 reject → "rate-shock + long-WALT → 가중↑↑↑" 폐기, 대신 잠정 defensive 가설.
# H3 reject → "long-WAM 가중↑" 폐기.
# H5 confirm → regime 단정 매핑 폐기, archetype × regime joint 만.
# ============================================================================
weight_rules:
  - indicator_id: fwd_ep_ratio
    base_weight: 0.10
    modulate_by: []
    direction: "§6 코어 baseline. REIT 에선 affo_yield 가 더 적합 — weak signal"
    granularity: sleeve

  - indicator_id: affo_yield
    base_weight: 0.18                     # REIT 특화 핵심 valuation
    modulate_by: [industry, window_length]
    direction: "industry archetype 별 AFFO/FFO standard 차 반영 (triple-net 95% vs office 75%). H4 confirm 에 따라 window 명시 의무 — 12m forward 평가 시 가중↑"
    granularity: industry

  - indicator_id: implied_cap_rate_spread
    base_weight: 0.08                     # H2 partial confirm + 시계열 sparse
    modulate_by: [window_length]
