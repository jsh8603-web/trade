# ============================================================================
# 블록3 RELATIONSHIPS — partial-corr prior (glasso corr_prior 주입)
# v1 의 force-include 일부 prior_sign 변경 (H1/H3 실측 반영).
# conditioning_set 에 rate factor 명시 (L축 통합 상관행렬 중복 차단 prerequisite).
# ============================================================================
relationships:
  # === force-include 후보 (이론·회계 강한 관계, 4개) ===
  - node_a: affo_yield
    node_b: implied_cap_rate_spread
    edge_type: direct
    conditioning_set: []                  # 회계 정의식 (둘 다 NOI 분자 + price 분모)
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.70
    theory_basis: "정의식: AFFO yield ≈ NOI yield ≈ implied cap rate. 직접 강한 관계"

  - node_a: same_store_noi_growth
    node_b: occupancy_rate
    edge_type: direct
    conditioning_set: []
    lag_routing: lagged
    prior_sign: pos
    prior_strength: 0.65
    theory_basis: "NOI = rent × occupancy. 회계 직접 (occupancy 가 NOI growth leading 1-2Q)"

  - node_a: beta_rate
    node_b: realized_vol
    edge_type: direct
    conditioning_set: [beta_credit]       # credit factor 분리
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.55
    theory_basis: "rate-shock 이 REIT vol 자극 (long-duration discount rate sensitivity)"

  - node_a: fwd_ep_ratio
    node_b: affo_yield
    edge_type: direct
    conditioning_set: []
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.55
    theory_basis: "REIT 에서 EP ≈ AFFO yield × (1 − D/A adj). 회계 정합"

  # === 시변·conditioning_set 강조 (학설 inconclusive + L축 중복 차단) ===
  - node_a: beta_credit
    node_b: beta_rate
    edge_type: common_cause
    conditioning_set: [realized_vol]      # 공통원인 = 유동성/위험 regime
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.35
    theory_basis: "rate β 와 credit β 의 공통원인 = risk-off regime. vol conditioning 으로 direct 분리"

  - node_a: leverage_debt_ebitda
    node_b: beta_credit
    edge_type: direct
    conditioning_set: [sector_archetype]  # archetype 별 leverage baseline 차이 흡수
    lag_routing: lagged
    prior_sign: pos
    prior_strength: 0.45
    theory_basis: "고레버리지 → credit 충격 전달 큼. archetype baseline 분리"

  # === ★ H1/H3 실측 반영 — 부호 변경 ===
  - node_a: walt_years
    node_b: beta_rate                     # H1 결과: long-WALT 가 *outperform* in rate-shock window
    edge_type: direct
    conditioning_set: [sector_archetype, debt_maturity_wam_years]  # H3 와 partial-corr 분리
    lag_routing: contemporaneous
    prior_sign: neg                       # ★ v1 'pos' → v2 'neg' (long-WALT 가 rate-shock 시 더 *덜* 빠짐, defensive rotation)
    prior_strength: 0.30                  # single rate cycle 2022 한계 (G축 강등)
    theory_basis: "★ H1 실측 (mean Rank-IC +0.240, z+3.18, n=23, 2018-2025 single Fed hike cycle). v1 의 long-duration → rate β ↑ 가설 reject. Mechanism 가설 = defensive rotation + secular growth confounding"

  - node_a: debt_maturity_wam_years
    node_b: beta_rate                     # H3 결과: long-WAM 가 *underperform* (H1 과 부호 반대!)
    edge_type: direct
    conditioning_set: [sector_archetype, walt_years]    # H1 (WALT) 와 partial-corr 분리
    lag_routing: contemporaneous
    prior_sign: pos                       # ★ v1 'neg' → v2 'pos' (long-WAM 가 rate-shock 시 underperform — 실측 반전)
    prior_strength: 0.20                  # sector-WAM proxy range 2.5y 좁음 (검정력 약함)
    theory_basis: "★ H3 실측 (mean Rank-IC -0.117, z-2.09, n=23). H1 과 부호 mismatch — proxy collinearity 시사. ticker-level WAM (EDGAR NLP) 후 partial-corr 분리 시 정확화"

  # === H2 (cap rate spread mean-revert) ===
  - node_a: implied_cap_rate_spread
    node_b: realized_vol                  # spread 와 fwd return 간 관계는 lagged (block5 H2)
    edge_type: direct
    conditioning_set: [beta_rate]
    lag_routing: lagged                   # 12m forward
    prior_sign: neg                       # spread Z 음 (압축) → 12m fwd vol 음 (recovery)
    prior_strength: 0.40
    theory_basis: "H2 proxy 결과 (Spearman ρ=-0.361 p<<0.001 on n=4629 VNQ). 단 2008 GFC 2 episode reject 사례 (regime change)"

  - node_a: mom_12_1
    node_b: earnings_revision_breadth
    edge_type: common_cause
    conditioning_set: []
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.40
    theory_basis: "둘 다 information arrival 의 reflection. 공통원인 분리"

  - node_a: ffo_payout_ratio
    node_b: realized_vol
    edge_type: direct
    conditioning_set: [leverage_debt_ebitda]
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.30
    theory_basis: "payout 100% 초과 = 배당 cut 위험 = vol spike. leverage conditioning"


# ============================================================================
# 블록4 WEIGHT_RULES — ★최종 산출 (실측 반영, v1 단정 규칙 모두 폐기/수정)
# H4 confirm → modulate_by 에 'window_length' 추가 (joint with regime/industry).
# H1 reject → "rate-shock + long-WALT → 가중↑↑↑" 폐기, 대신 잠정 defensive 가설.
# H3 reject → "long-WAM 가중↑" 폐기.
# H5 confirm → regime 단정 매핑 폐기, archetype × regime joint 만.
# ============================================================================
weight_rules:
  - indicator_id: fwd_ep_ratio
    base_weight: 0.10
    modulate_by: []
    direction: "§6 코어 baseline. REIT 에선 affo_yield 가 더 적합 — weak signal"
    granularity: sleeve

  - indicator_id: affo_yield
    base_weight: 0.18                     # REIT 특화 핵심 valuation
    modulate_by: [industry, window_length]
    direction: "industry archetype 별 AFFO/FFO standard 차 반영 (triple-net 95% vs office 75%). H4 confirm 에 따라 window 명시 의무 — 12m forward 평가 시 가중↑"
    granularity: industry

  - indicator_id: implied_cap_rate_spread
    base_weight: 0.08                     # H2 partial confirm + 시계열 sparse
    modulate_by: [window_length]
    direction: "spread Z < -1.5 + post-GFC 환경 → 12m forward 가중↑ (H2 proxy CONFIRMED). 단 GFC-급 regime change 에선 deep discount 가 더 깊어질 수 있음 (2008 episode reject)"
    granularity: sleeve

  - indicator_id: price_to_nav
    base_weight: 0.05                     # data 미가용 (Green Street 유료) — 잠정 base
    modulate_by: [industry]
    direction: "deep discount Z<-1.5 + same-store NOI 양 → 가중↑ (NAV mean-revert mechanism). office archetype 의 structural -25% (2024 +21.5% rebound) 와 일관"
    granularity: industry

  # --- quality / leverage ---
  - indicator_id: leverage_debt_ebitda
    base_weight: 0.10
    modulate_by: [regime, name_specific]
    direction: "Risk-off (HY OAS > +1σ) → 가중↑↑. ticker leverage > 7x → 추가 가중↑. 음의 부호 (높을수록 위험)"
    granularity: ticker

  - indicator_id: fixed_charge_coverage
    base_weight: 0.05
    modulate_by: [regime]
    direction: "Risk-off → 가중↑ (default risk channel)"
    granularity: sleeve

  - indicator_id: roe
    base_weight: 0.03
    modulate_by: []
    direction: "§6 코어. REIT 에선 D&A 노이즈 — weak signal"
    granularity: sleeve

  - indicator_id: margin_trend
    base_weight: 0.03
    modulate_by: []
    direction: "§6 코어. REIT NOI margin trend — weak signal"
    granularity: sleeve

  # --- growth / revision (NOI 가 REIT organic earnings) ---
  - indicator_id: same_store_noi_growth
    base_weight: 0.08
    modulate_by: [industry, window_length]
    direction: "rent reset 사이클 (12m forward) 평가 시 가중↑. apartment archetype 의 rent escalator 빠른 패스스루 mechanism. ⚠ v1 의 'Reflation regime → 가중↑↑' 단정 폐기 (H5 reject)"
    granularity: industry

  - indicator_id: occupancy_rate
    base_weight: 0.04
    modulate_by: [industry]
    direction: "office archetype (structural occupancy 하락 중) → 가중↑ (signal-to-noise 높음). industrial/datacenter 는 가중↓ (saturated)"
    granularity: industry

  - indicator_id: earnings_revision_breadth
    base_weight: 0.04
    modulate_by: [regime]
    direction: "§6 코어"
    granularity: sleeve

  - indicator_id: fwd_eps_momentum
    base_weight: 0.03
    modulate_by: []
    direction: "§6 코어. REIT 에선 consensus dispersion 큼 — weak signal"
    granularity: sleeve

  # --- momentum + macro sensitivity ---
  - indicator_id: mom_12_1
    base_weight: 0.05                     # H4 confirm 에 따라 window 의존성 강 — 강등
    modulate_by: [window_length]
    direction: "H4 confirm (window flip 88%): momentum signal 은 evaluation window 길이에 매우 강하게 의존. 12-1m momentum 의 signal 은 30d~365d window 에선 ranking flip 큼 → 보수 base"
    granularity: sleeve

  - indicator_id: beta_rate
    base_weight: 0.10                     # ★ v1 0.15 → 0.10 강등 (H1/H3 의 sign mismatch 발견)
    modulate_by: [regime, name_specific]
    direction: >
      ⚠ v1 의 "rate-shock + long-WALT → beta_rate 가중↑↑↑" 규칙 폐기 (H1 reject, sign mismatch).
      v2 잠정 가설: rate-shock window 진입 시 long-WALT REIT (Healthcare/Datacenter/Specialty)
      가 *outperform* — defensive rotation (H1 실측 Rank-IC +0.240, z+3.18). 단 single Fed hike
      cycle sample (n=23, 2018-2025) → "structural prior (저신뢰)" tier 라벨.
      Bonferroni 5-test α/5 보정 시 z+3.18 > 2.81 PASS.
    granularity: ticker

  - indicator_id: beta_credit
    base_weight: 0.07
    modulate_by: [regime]
    direction: "HY OAS spike (+1σ over 4w) → 가중↑↑. archetype 별 baseline 차이 흡수"
    granularity: sleeve

  - indicator_id: beta_dollar
    base_weight: 0.02
    modulate_by: []
    direction: "§6 코어. US REIT minor"
    granularity: sleeve

  - indicator_id: beta_oil
    base_weight: 0.02
    modulate_by: []
    direction: "§6 코어. REIT 거의 무관"
    granularity: sleeve

  # --- risk / duration ---
  - indicator_id: realized_vol
    base_weight: 0.04
    modulate_by: [regime]
    direction: "Risk-off → 가중↑ (low-vol premium)"
    granularity: sleeve

  - indicator_id: walt_years
    base_weight: 0.04
    modulate_by: [name_specific, window_length]
    direction: >
      ⚠ v1 의 "rate-shock 시 가중↑↑ (long-WALT 가 더 빠짐)" 단정 폐기 (H1 reject, sign mismatch).
      v2 잠정: rate-shock 후 60d cross-section 에서 long-WALT 가 *outperform* (defensive rotation).
      WALT 가 sector archetype 과 collinear (Healthcare 12y, Datacenter 8y = secular growth).
      H1 mechanism 가설 별도 검증 후속 (WALT × sector partial-corr 분리).
    granularity: ticker

  - indicator_id: debt_maturity_wam_years
    base_weight: 0.02                     # ★ H3 reject + proxy 한계 → 매우 약함
    modulate_by: [name_specific]
    direction: >
      ⚠ v1 의 "long-WAM → 가중↑ (refinancing protection)" 단정 폐기 (H3 reject, mean Rank-IC -0.117
      z-2.09). 가설과 부호 반대. sector-average proxy range 좁음 (2.5y) → 검정력 약함.
      ticker-level WAM (EDGAR NLP) 후 재검증 필요. 잠정 base 매우 낮음.
    granularity: ticker

  - indicator_id: ffo_payout_ratio
    base_weight: 0.03
    modulate_by: [regime]
    direction: "Recession / Stagflation → 가중↑ (배당 cut 위험 selection). payout > 100% 음의 부호 강화"
