    store: "registry RulePerformance + block1 lens.regime_reading 단정 매핑 모두 폐기 기록"
    action_threshold: "✅ v1 의 모든 'regime → sub-sector 강세' 단정 매핑 폐기 완료 (block1 regime_reading 의 실측 분포만 잠정 기록). block4 의 modulate_by enum 'regime' 단독 규칙 모두 폐기, joint [regime, industry, window_length] 만"
    feeds_weight: "block1 lens.regime_reading 의 v1 단정 문장 모두 제거 + 실측 분포만 잠정 기록 + Recession-Stagflation-Recovery cluster 만 일관 명시"

