study_id: eq_intl
asset_scope: [equity.intl]
as_of: "2026-05-30"

# =============================================================================
# 블록1: LENS (정성 렌즈 — LLM 주입용. 일반론+리포트의 정제 결과)
# ★가변: 블록5 flag 누적(확신/거부)→신뢰도→이 필드(특히 estimation_note·regime_reading)와
#   블록4 가중치가 미세 변동. lens=초안, flag=갱신 경로.
#
# eq_intl = 국가/지역 지수 ETF (EFA/VEA 선진국, EEM/VWO 신흥국, EWJ/EWG/EWZ/INDA/EWY/EWT/FXI 등
#   단일국, VGK/EWW 지역). 단일 종목이 아니라 "국가 = 한 자산" 단위로 평가한다.
# =============================================================================
lens:
  pricing_principle: >
    국가지수 ETF 의 달러표시 총수익 = (현지통화 지수수익) + (현지통화/USD 환수익) + 배당.
    unhedged ETF(EEM/EFA 등 대부분)는 환이 1차 driver — 종목 평가에서 환을 빼면 절반을 놓친다.
    현지 지수수익 자체는 (글로벌 위험선호 × 국가 베타) + (국가 거시: 성장·금리·재정) + (지수
    섹터구성에 실린 글로벌 사이클: 반도체·원자재·금융). 즉 국가지수 가격 = 글로벌 유동성/위험선호를
    공통인자로, 거기에 국가별 (통화 레짐 × 섹터구성 × 거시) 민감도가 곱해진 형태.
    핵심 등식(직관): R_usd ≈ β_global·(risk-on factor) − β_usd·ΔDXY + β_commodity·Δcommod
                      + β_rate·Δ(US real yield) + 국가 alpha(밸류·모멘텀·revision).
  report_relations:
    - "달러(broad DXY)↑ → EM 주식↓ (외화부채 부담·자본유출·원자재 압박). US real yield 고정 시에도 직접효과 잔존 = 가장 강한 단일 관계"
    - "US 10Y real yield↑ → 자본이 US 로 회귀 → EM·고듀레이션 신흥국 압박. 달러강세의 공통원인이기도 함(real yield→DXY→EM 매개)"
    - "China credit impulse(신용자극)↑ → 6~12개월 lag 로 원자재·원자재수출국(브라질·인니·남아공) 지수 선행. EM 사이클의 marginal demand"
    - "글로벌 위험선호(VIX↓·HY OAS 축소) → EM 고베타 아웃퍼폼. risk-off 시 EM 이 가장 먼저·크게 빠짐(high beta to global risk)"
    - "원자재 가격↑ → 원자재수출국(LatAm·자원국) terms-of-trade 개선 → 통화·지수 동반 강세 / 원자재수입국(인도·한국·일본)은 반대"
    - "엔(JPY) 약세 → 일본 수출주 EPS↑(EWJ 현지수익↑) 그러나 unhedged USD 투자자는 환손실 — 헤지/언헤지 분기 핵심"
    - "현지 정책금리↑(EM 중앙은행 통화방어 hike) → 단기 통화방어 but 성장둔화 → 지수 양면적. 금리차(carry)는 환에 우호"
    - "cross-country value(CAPE/forward E-P 스프레드): 싼 국가가 장기 아웃퍼폼하나 value-trap(구조적 디스카운트=러시아·터키) 리스크 — 모멘텀과 병용 필수"
    - "cross-country momentum(12-1): 국가단위 모멘텀은 가장 견고한 횡단면 신호(AQR). 단 risk-off 전환점에서 momentum crash"
  regime_reading: >
    [risk-on·달러약세·US real yield 하락] = EM·ex-US DM 이 US 를 아웃퍼폼(EM bull, reflation).
      → 모멘텀·밸류·환carry 가중↑, 방어(vol·credit beta) 가중↓.
    [risk-off·달러강세·US real yield 상승] = flight-to-quality(USD/US 우위), EM 언더퍼폼.
      → 달러베타·realized vol·credit beta 가중↑, 모멘텀 가중↓(crash 회피).
    [commodity 강세 사이클] = 원자재수출국 archetype 아웃퍼폼 → 해당 국가 commodity/terms-of-trade
      베타 가중↑. 동시에 원자재수입국(인도·한국·일본)은 반대 신호.
    [글로벌 성장둔화·China 디레버리징] = EM 전반 언더퍼폼, China credit impulse 음전환이 선행지표.
  estimation_note: >
    2026-05-30 기준 anchor(추정·확신도 중): 환(달러 방향)이 국가지수 횡단면 수익을 지배하는 국면이
    구조적으로 길어졌다(2022~ 고금리·강달러 잔재). 따라서 eq_intl lens 의 1차 축은 단일종목 §6
    하드룰의 valuation/quality 가 아니라 **macro_sensitivity(dollar·commodity·rate beta)** 라고
    초기 가중을 둔다. 이 anchor 는 블록5 flag(달러베타 신호의 OOS Rank-IC)로 검증되며, 달러지배가
    풀리면(real yield 하락 + DXY 추세 꺾임) estimation_note 와 블록4 base_weight 가 모멘텀/밸류
    쪽으로 재배분된다.
    ★2026-05-30 5y Yahoo daily 실측 (raw/analysis-output.txt):
      (a) DXY↔국가ETF 일별 상관: 모두 음수 -0.23~-0.57, prior 강확인 — anchor 채택.
      (b) regime 분해(VIX>25 risk-off): DXY-EM 상관이 risk-on -0.64→risk-off -0.80 으로 강화,
          regime-conditional amplification 확인.
      (c) 통념 부분 기각: DM Europe(germany/uk/dm_exus/europe) dxy_beta 가 EM(brazil/china/india)
          보다 강함 — archetype dm_europe 의 dollar 채널이 1순위, em 은 5y 부분 decoupling(china
          특히 capital controls 영향 추정).
      (d) momentum 5y 무력화: cross-country 12-1 Rank-IC mean +0.015, IC-IR +0.13(연), IC>0 50% —
          AQR prior 기간 의존성 큼. mom_12_1 base_weight 하향 + regime 가변 더 강조.

# =============================================================================
# 블록2: INDICATORS (정량 지표 — 우리 시스템 자료로 귀결)
# §6 하드룰 코어셋(is_core: true)은 국가지수 = "지수집계 펀더멘털" 레벨로 해석.
# eq_intl 특화(is_core: false)는 환·flow·terms-of-trade — 단일종목엔 없는 국가단위 축.
# =============================================================================
indicators:
  # --- §6 통일 하드룰 코어셋 (지수 집계 레벨) ---
  - id: fwd_ep_country
    family: valuation
    is_core: true
    in_our_system: false   # 국가지수 forward 컨센서스 E/P 미수집 → 블록6
    source_or_collector: "블록6: MSCI/index forward earnings yield 또는 country ETF 구성종목 가중 E/P"
    transform: own_history_z
    vintage_policy: point_in_time
    lag: 1
  - id: roe_country
    family: quality
    is_core: true
    in_our_system: false
    source_or_collector: "블록6: 지수 집계 ROE/margin (MSCI country aggregate)"
    transform: own_history_z
    vintage_policy: point_in_time
    lag: 1
  - id: eps_revision_breadth_country
    family: revision
    is_core: true
    in_our_system: false
    source_or_collector: "블록6: 국가지수 analyst revision breadth(상향-하향)/(전체). 국가로테이션 최강 신호 중 하나"
    transform: level
    vintage_policy: point_in_time
    lag: 0
  - id: mom_12_1_country
    family: momentum
    is_core: true
    in_our_system: false   # ETF 가격패널 도착 시 자체계산 가능
    source_or_collector: "블록6: 국가 ETF TR 가격패널 → 12-1 모멘텀 자체계산(FinanceDataReader)"
    transform: rank
    vintage_policy: point_in_time
    lag: 1
  - id: dollar_beta_country
    family: macro_sensitivity
    is_core: true
    in_our_system: false   # ★broad dollar index(DTWEXBGS) FRED_SERIES 미등록 — 블록6+블록7 learn
    source_or_collector: "블록6/블록7: FRED DTWEXBGS(broad USD) + 국가ETF 수익 → 롤링 beta. main 선구축 DXY/FxStore 보완"
    transform: level
    vintage_policy: point_in_time
    lag: 0
  - id: rate_beta_country
    family: macro_sensitivity
    is_core: true
    in_our_system: true
    source_or_collector: "fred_adapter[T10Y2Y]+US real yield(DFII10 블록6) vs 국가ETF 수익 롤링 beta"
    transform: level
    vintage_policy: point_in_time
    lag: 0
  - id: oil_beta_country
    family: macro_sensitivity
    is_core: true
    in_our_system: false   # ★oil(DCOILWTICO) FRED_SERIES 미등록 — 블록6+블록7 learn
    source_or_collector: "블록6/블록7: FRED DCOILWTICO(WTI) 또는 Yahoo → 국가ETF 수익 롤링 beta(원자재수출국 분별)"
    transform: level
    vintage_policy: point_in_time
    lag: 0
  - id: credit_beta_country
    family: macro_sensitivity
    is_core: true
    in_our_system: true
    source_or_collector: "fred_adapter[BAMLH0A0HYM2] HY OAS vs 국가ETF 수익(risk-on/off 베타)"
    transform: level
    vintage_policy: point_in_time
    lag: 0
  - id: realized_vol_country
    family: risk
    is_core: true
    in_our_system: false
    source_or_collector: "블록6: 국가 ETF TR 가격패널 → 실현변동성 자체계산"
    transform: own_history_z
    vintage_policy: point_in_time
    lag: 0
  # --- eq_intl 특화 (is_core: false, weight cap. 단 sleeve 승격 후보 = fx) ---
  - id: fx_carry_momentum   # ★sleeve 승격 요청 후보(블록6/§6 3-test): unhedged 환은 1차 driver
    family: macro_sensitivity
    is_core: false
    in_our_system: false   # main 선구축 FxStore(DXY/USDKRW) 일부 → 다국가 확장 필요
    source_or_collector: "블록6: FxStore 다국가 확장(현지/USD 환율). carry=금리차, momentum=환율 3-12m 추세"
    transform: own_history_z
    vintage_policy: point_in_time
    lag: 0
  - id: real_exchange_rate_valuation   # 환 밸류(REER 갭) — 장기 평균회귀
    family: valuation
    is_core: false
    in_our_system: false
    source_or_collector: "블록6: BIS REER 또는 FRED 시리즈. 통화 고/저평가(terms-of-trade 조정)"
    transform: own_history_z
    vintage_policy: point_in_time
    lag: 1
  - id: china_credit_impulse   # EM·원자재수출국 6-12m 선행
    family: macro_driver
    is_core: false
    in_our_system: false
    source_or_collector: "블록6: China TSF(total social financing) YoY. FRED/외부 소스"
    transform: yoy
    vintage_policy: point_in_time
    lag: 2
  - id: foreign_equity_flow   # 외국인 포트폴리오 flow(EM 단기수급)
    family: macro_driver
    is_core: false
    in_our_system: false   # main 선구축 외국인순매수(pykrx)는 한국한정 → 다국가는 블록6
    source_or_collector: "블록6: IIF/EPFR EM flow(유료) 또는 국가별 외국인순매수 프록시"
    transform: own_history_z
    vintage_policy: point_in_time
    lag: 1
  - id: terms_of_trade   # 원자재수출국 archetype 분별 핵심
    family: macro_driver
    is_core: false
    in_our_system: false
    source_or_collector: "블록6: 국가별 수출가격/수입가격 지수(World Bank/BIS)"
    transform: yoy
    vintage_policy: point_in_time
    lag: 2
  - id: sovereign_cds_spread   # 테일/디폴트 리스크(EM 방어)
    family: risk
    is_core: false
    in_our_system: false
    source_or_collector: "블록6: 5Y 국채 CDS(유료) 또는 EMBI 스프레드 프록시(FRED EM OAS)"
    transform: own_history_z
    vintage_policy: point_in_time
    lag: 0

# =============================================================================
# 블록3: RELATIONSHIPS (관계 가설 — glasso prior. partial-corr 기준!)
# §8: 공통원인 매개는 edge=0, C→A·C→B 분해. conditioning_set 필수 명시.
# 거시 driver named 채널 = dollar/real_rate/oil/credit (cglasso B 행렬). 나머지 거시=regime 조건키.
# 이론 강한 ≤4 엣지만 force-include 화이트리스트 후보 표시.
# =============================================================================
relationships:
  - node_a: dollar_beta_country
    node_b: rate_beta_country
    edge_type: common_cause   # US real yield 가 둘의 공통원인 → EM-dollar 직접효과는 real yield 고정 후 평가
    conditioning_set: [credit_beta_country]
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.55
    theory_basis: "US real yield↑가 달러강세와 EM자본유출을 동시 유발 — real rate 채널 분해 후 dollar 잔차효과 측정"
  - node_a: dollar_beta_country
    node_b: mom_12_1_country
    edge_type: direct
    conditioning_set: [credit_beta_country, rate_beta_country]
    lag_routing: lagged
    prior_sign: neg
    prior_strength: 0.30   # ★2026-05-30 실측 하향 (was 0.50): pearson(dxy_beta, avg_mom)=-0.27 / spearman=-0.11. 부호 prior 일치하나 강도 약함
    theory_basis: "강달러 추세가 EM모멘텀을 꺾음(모멘텀=환추세 동반). 위험/금리 고정 후에도 환 자체 추세효과 잔존. ★실측: 5y cross-country dxy_beta(-2.30~-0.80)와 평균 monthly return 간 pearson -0.27 — 부호 일치 강도 약함, mom 자체가 5y 무력화(H6) 영향. 데이터 길이 확대 시 재평가."
    force_include_candidate: true   # 유지(이론 강함, 5y 만으론 부족). prior_strength 약화로 EBIC 가 자체 발견하게 허용
  - node_a: oil_beta_country
    node_b: china_credit_impulse
    edge_type: common_cause   # China 수요가 oil 과 원자재수출국 지수의 공통 driver → 직접 oil-equity 는 분해
    conditioning_set: [credit_beta_country]
    lag_routing: lagged
    prior_sign: pos
    prior_strength: 0.45
    theory_basis: "China 신용자극→원자재수요→유가·원자재수출국 동반. 공통원인 China 분해 시 oil 직접효과 축소"
  - node_a: credit_beta_country
    node_b: realized_vol_country
    edge_type: direct
    conditioning_set: []
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.35   # ★2026-05-30 실측 하향 (was 0.60): VIX proxy 로 본 vix_beta↔realized_vol pearson +0.055(거의 0). 단 vix_beta 분해능 부족(|β|<0.2) + HY OAS 직접 채널 미검증
    theory_basis: "risk-off(HY OAS 확대) 시 EM 변동성 동반 급등 — 글로벌 위험선호 공통인자의 직접 발현. ★실측: vix proxy 로 본 cross-country vix_beta↔realized_vol pearson +0.055 — 거의 0. 단 vix_beta 자체가 모두 작아 분해능 부족(|β|<0.2). H2(VIX↔국가ETF 일별)는 모든 국가 -0.33~-0.76 강음수 = risk-off 채널 자체는 확인. HY OAS(BAMLH0A0HYM2) 가용 → 블록7 learn 직후 HY OAS 직접 베타로 재시험 필수."
    force_include_candidate: true   # 유지(이론 강함, vix proxy 5y 분해능 부족, HY OAS 직접 미측정)
  - node_a: fwd_ep_country
    node_b: mom_12_1_country
    edge_type: direct
    conditioning_set: [credit_beta_country]
    lag_routing: contemporaneous
    prior_sign: neg
    prior_strength: 0.35
    theory_basis: "value(싼 국가)와 momentum(오른 국가)은 횡단면에서 음의 동시상관 — 분산 효과(value+momentum 병용 근거)"
  - node_a: fx_carry_momentum
    node_b: dollar_beta_country
    edge_type: direct
    conditioning_set: [rate_beta_country]
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.50
    theory_basis: "환carry/모멘텀과 달러베타는 같은 환 채널 — 금리차 고정 후 잔차는 환추세 공유"
  - node_a: terms_of_trade
    node_b: oil_beta_country
    edge_type: common_cause   # 원자재가격이 terms-of-trade 와 oil-beta 의 공통 driver(수출국)
    conditioning_set: []
    lag_routing: lagged
    prior_sign: pos
    prior_strength: 0.40
    theory_basis: "원자재수출국은 유가↑가 교역조건·지수 동반 개선 — archetype(수출국) 한정 양, 수입국은 부호반전"

# =============================================================================
# 블록4: WEIGHT_RULES (★최종 산출 — 종목별 가중치 동적 변경)
# 종목 세분화 = 부록B hierarchical pooling: w_global + δ_regime + δ_arch(국가 archetype) + ticker shrink.
# 국가 archetype(soft membership π, _regime_pi 로 주입): commodity_exporter / tech_exporter /
#   domestic_demand / dm_europe / dm_japan / em_china. 한 국가가 복수 archetype 에 soft 소속.
# =============================================================================
weight_rules:
  - indicator_id: dollar_beta_country
    base_weight: 0.22   # ★eq_intl anchor: 단일종목보다 dollar 비중 크게(estimation_note)
    modulate_by: [regime, industry, name_specific]
