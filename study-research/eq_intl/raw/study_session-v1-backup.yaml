# =============================================================================
# 블록5: CONFIDENCE_HOOKS (신뢰도 누적 — 확신/거부 flag를 *코드로 구현*할 계획)
# ★lens↔flag↔weight 한 루프. 매 거래마다 flag 누적→가정 신뢰도→렌즈/가중치 미세변동.
# 매핑 검증: core/assume/weight_falsification.py score_ic_breakdown_eprocess(L66, e-CUSUM 단측) +
#   weight_card_verdict(L109) → update_controller.step(hard_falsifier) RETIRE/KEEP 라우팅 실측 확인.
# =============================================================================
confidence_hooks:
  - hypothesis_id: dollar_dominance_anchor   # 블록1 estimation_note + 블록2 dollar_beta_country
    confirm_signal: "dollar_beta 로 사이징한 국가의 OOS outcome Rank-IC 양 유지(강달러기 방어 성공)"
    reject_signal: "dollar_beta 신호 합성 score 의 Rank-IC e-CUSUM 단측 붕괴(baseline 아래 지속)"
    emit_where: "backtest engine SELL outcome + 라이브 judge 사후평가(국가ETF buy 결정의 forward TR)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess(ic_series=OOS 윈도별 Rank-IC)"
    confidence_metric: "e-value anytime-valid 누적(e_cusum, Ville: 거짓kill≤alpha)"
    store: "registry 카드 confidence_now(weight_card_verdict 가 abs(ic_last)*10 clip) + RulePerformance"
    action_threshold: "e-value≥1/alpha → dollar 지배 anchor 거부 → estimation_note 재배분(dollar→momentum/value) + retract live 차단. 유지 → adopt 강화"
    feeds_weight: "신뢰도 변화 → derive_weights 재적합 trigger(secondary_refit 플래그) → base_weight(dollar 0.22) 미세조정"
  - hypothesis_id: commodity_exporter_oil_link   # 블록3 oil-china common_cause + archetype
    confirm_signal: "commodity_exporter archetype(π高) 국가에서 oil_beta 가중 사이징의 Rank-IC 양"
    reject_signal: "oil_beta score Rank-IC e-CUSUM 단측 붕괴 OR archetype membership π 와 부호 불일치"
    emit_where: "backtest engine outcome(archetype별 분해) + judge 사후평가"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess(archetype 서브패밀리)"
    confidence_metric: "e-value 누적 + archetype별 Rank-IC 분해(hierarchical FDR 부모노드)"
    store: "registry 카드(weight.equity.intl.{regime}.{archetype}) confidence_now"
    action_threshold: "붕괴 → 해당 archetype oil_beta delta_arch 약화. 유지 → delta_arch_by_type[commodity_exporter] 강화"
    feeds_weight: "composed_weights 의 delta_arch_by_type[commodity_exporter] 미세조정(soft membership 혼합)"
  - hypothesis_id: momentum_crash_regime   # 블록4 momentum modulate_by regime
    confirm_signal: "risk-off 전환점에서 모멘텀 가중↓ 적용한 국면의 drawdown 완화(OOS)"
    reject_signal: "모멘텀 score Rank-IC 가 risk-on 에서도 붕괴(모멘텀 신호 자체 무력화)"
    emit_where: "backtest engine(regime transition window 라벨) + judge"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess + omega_drift(SECONDARY)"
    confidence_metric: "PRIMARY e-value(IC 붕괴) + SECONDARY Ω drift(상관구조 변화 → re-fit)"
    store: "RulePerformance + 카드 secondary_falsification 필드"
    action_threshold: "PRIMARY 붕괴 → momentum 카드 retract. SECONDARY drift만 → regime 조건부 momentum 가중 재적합(TRANSITION)"
    feeds_weight: "needs_refit(fro_rel/logdet) → derive_weights 재실행 → mom_12_1 base_weight·delta_regime 갱신"
  - hypothesis_id: fx_sleeve_promotion   # 블록4 fx_carry 부당캡 → §6 3-test
    confirm_signal: "fx_carry_momentum 의 native 신호가 cap(0.04) 때문에 Rank-IC 손실(uncapped 시뮬 IC > capped)"
    reject_signal: "uncapped 해도 IC 개선 없음(부당캡 가설 기각 → is_core:false 유지)"
    emit_where: "backtest A/B(capped vs uncapped) outcome 비교 + §6 3-test(부호상충/조건부상관 decoupling/신호스택 발산)"
    accumulate_in: "core/assume/weight_falsification(capped/uncapped 두 카드 IC 시계열 비교)"
    confidence_metric: "IC gap e-value + 3-test 통과 카운트"
    store: "main 에 sleeve 승격 요청 트리거(블록6 collector_plan fx 확장 선행)"
    action_threshold: "3-test 중 1+ 통과 AND uncapped IC 유의 → main 에 intl-fx sleeve 승격 요청. 미충족 → cap 유지"
    feeds_weight: "승격 시 fx_carry base_weight cap 해제 → regime_to_weights SLEEVES 에 intl_fx 추가(블록7 inject)"

