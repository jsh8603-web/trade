# ===========================================================================
# 메타: macro 방의 특수성 — macro 는 *매매 sleeve 가 아니라 regime 엔진*이다.
#   macro 지표는 Investment Clock 국면을 분류해 belief b(t) 를 만들고, 그 belief 가
#   ③ inject 단계 regime_to_weights._belief_conditional_cov 로 *모든 다른 자산 sleeve*
#   의 공분산(Σ_eff)을 조절한다. 따라서 macro 의 weight_rules 는 "어떤 거시지표가
#   어떤 국면 분류에 더/덜 기여하나(modulate_by: regime)" + "그 국면 belief 가
#   downstream sleeve 가중을 어떻게 흔드나"의 두 층이다.
# 검증: study-research/macro/raw/analysis_output.txt + validation-findings.md (실데이터 756일 2021-12~2024-12).
# ★2-3 검증 핵심: 가설0 PASS(공분산 정보이득 5배) + 가설2 FAIL(partial-corr 네트워크는 regime 불변,
#   permutation p=0.35) → regime 신호는 *분산/변동성+공통원인 매개*에 있지 직접엣지 네트워크 구조변화엔 없다.
#   직접 거시구조(금리↔달러↔금)는 국면 불변=구조 상수(force-include 정당). 따라서 hard 국면별 Ω 스위칭이
#   아니라 [안정 직접구조 + regime별 분산스케일 + soft belief-mix Σ_eff(보유)] 가 데이터 정합 설계.
# ===========================================================================

# 블록1: LENS (정성 렌즈 — LLM 주입용. ★가변: 블록5 flag 누적이 estimation_note·regime_reading·블록4 가중을 미세변동)
lens:
  pricing_principle: >
    거시 자산가격 = 성장·인플레·유동성·리스크프리미엄의 4요인 조합. 가격결정 근사:
    P ≈ E[CF | 성장] / (real_rate + term_premium + risk_premium | 인플레·유동성). 핵심 driver
    는 7축(2-2 theory-notes): (1) Growth(분자, CFNAI/PMI) (2) real rate(할인율 본체, DFII10)
    (3) breakeven(명목→실질 Fisher 분해) (4) credit premium(HY OAS) (5) dollar/liquidity(DXY)
    (6) risk/volatility(VIX/MOVE) (7) supply shock(oil). + 잠재 공통원인 proxy(VIX/OIS) 통제.
    Investment Clock 4국면(Reflation/Recovery/Overheat/Stagflation)이 성장×인플레 2축으로 자산군
    우위를 가른다 — 단 국면은 *외생 조건키*이지 내생 추정 대상이 아니다(HMM/DCC 기각, 자문 §8; DCC/Markov는
    벤치마크로만).
  report_relations:
    - "real rate(10Y 실질금리)↑ → 금·고듀레이션 자산(성장주/장기채) 멀티플 압박. [실데이터 검증: gold~us10y partial -0.24~-0.29 직접엣지]"
    - "dollar(DXY)↑ ↔ real rate↑ 동조(달러=금리차 펀딩). [검증: dxy~us10y partial +0.24~+0.27 직접엣지]"
    - "dollar↑ → 금↓(달러표시 실물 역). [검증: dxy~gold partial -0.28~-0.31 직접엣지, regime 무관 안정]"
    - "주식↔달러·주식↔금리 역상관은 *직접*이 아니라 real-rate/dollar 공통원인 매개. [검증: rate-up 국면 nasdaq~dxy Pearson -0.40 → partial -0.04, 매개 0.36]"
    - "HY OAS(하이일드 스프레드) 확대 → 리스크오프 regime 신호(주식·크레딧 동반 약세). real rate 와 분리된 risk-premium 채널."
    - "10Y-2Y 커브 역전 → 침체 선행(12~18개월 lag). 역전 해소(steepening)=국면전환 anchor."
    - "통화량 M2 확대 → 위험자산 선호. 단 인플레 동반 시 명목금리↑ 상쇄(Overheat)."
    - "일본 국채(BOJ YCC/정책금리) ↔ 미-일 금리차 ↔ 엔캐리 ↔ 글로벌 유동성 ↔ 위험자산. 미-일 금리차 축소=엔캐리 청산 압력."
  regime_reading: >
    Reflation(성장↑인플레↓): 주식·원자재 우위, 채권↓, real rate 가중↑·credit 가중↓.
    Recovery(성장↑인플레↑초입): 주식 우위 지속, 듀레이션 민감↑. Overheat(성장↑인플레↑): 원자재·금
    우위, 명목채↓↓, inflation breakeven 가중↑. Stagflation(성장↓인플레↑): 금·현금·단기채 우위,
    HY OAS 가중↑(방어). ★rate-up 국면에선 주식-채권 상관이 *양→음 반전*(채권 분산효과 소멸) =
    실데이터 입증(sp500~us10y rate-up -0.18 vs rate-down +0.09, Δ-0.26) → 국면별 sleeve 분산가정 재조정.
    ★2-3 검증 재조정: 이 반전은 *직접 배선*이 아니라 공통원인/변동성 loading 변화(sp500~us10y 직접
    pcorr 양 regime CI∋0=매개). 직접 거시구조(dxy~us10y +0.28/gold~us10y -0.21/dxy~gold -0.37)는
    *국면 불변*(가설4/5 CI 거의 동일). 즉 국면이 바꾸는 건 변동성·공통인자 노출이지 직접 인과배선이 아님 →
    regime 조절 = 분산스케일+soft belief-mix(hard Ω 네트워크 스위칭 아님, 가설2 p=0.35 FAIL이 지지).
  estimation_note: >
    2026-05 추정(국면전환 anchor, 신뢰도 中, 외부검색 기반·재검증 대상): 커브 역전 해소+steepening,
    HY OAS 중립안정, Fed 인하 사이클 진행, DXY 하향안정+엔캐리 매력↓ → **Reflation/Recovery 초입** 추정.
    이 시각 이후 real rate 하락 → 금·고듀레이션 우위 재평가 anchor. ⚠️ 이 추정은 블록5 confidence_hooks
    가 OOS Rank-IC 로 갱신한다 — 어긋나면 (거부) flag 로 regime_reading 비중 하향. (raw/gemini-current-regime-202605.txt)

