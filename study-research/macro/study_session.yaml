# 블록8: FACTOR_BETA_VALIDATION (B그룹 실측 검증, 2026-05-31)
# ★12축 audit 통과(Hard-fail 0, 충실, bit-identical 재현 — main 2026-05-31). 재현 스크립트:
#   raw/bgroup_{vif_rate_split,credit_beta,regime_harness}.py + raw/validation-bgroup-2026-05-31.md.
#   small-N rigor 준수(n/p/Newey-West HAC/block-bootstrap/Bonferroni). ⛔점추정 covariance prior 박제 금지.
factor_beta_validation:
  # --- B(b) rate축 분리: real_rate(DFII10) + term_spread(yield_10y_2y=T10Y2Y) 2축 직교 ---
  - finding: rate_axis_split
    verdict: CONFIRMED
    validated_alpha: true
    evidence: "daily Δ VIF 1.14 / corr +0.351 / condition# 1.4, n=5854 (2003-2026, 2008·2020·2022 위기포함)"
    fisher_rule: "⛔{nominal(DGS10), real(DFII10), breakeven(T10YIE)} 동시투입 금지 — Fisher 정확항등
      (nominal−real−breakeven resid mean/std=0.0000) → VIF=∞, condition# 1.8e14. {real_rate, term_spread}
      분리는 무공선 안전(append-only, β=None HOLD seed). nominal level 미포함 시 정확공선 회피."
    affects: "core/study/factor_betas_seed.FACTORS rate→{real_rate,term_spread} 분리 (별 commit, core/study 범위 — 본 yaml 경계 외)"
  # --- B(c) credit factor β per sleeve: Δ HY OAS contemp 표준화 β ---
  - finding: credit_beta_per_sleeve
    verdict: CONFIRMED_DIRECTION  # 방향 confirmed, 크기 structural(잠정)
    validated_alpha: false
    prior_tier: structural_low_confidence
    base_weight_cap: 0.25
    shrinkage: james_stein
    coverage: "PRIMARY HY OAS(BAMLH0A0HYM2) 2023-05~2026-05, n=750(joined) ~36개월 ⚠️위기표본 부재
      (2008/2020/2022 credit 확대 윈도우 밖 → tail β 미관측). ROBUSTNESS BAA10Y 2000-2026 n=6586 위기포함 corroborate."
    tail_finding: "crisis β ≈ normal β 의 2~2.8배(ΔBAA 상위10% 일): cyclical -0.36 vs -0.17 / defensive
      -0.28 vs -0.10. 점추정이 tail risk 과소표현 → crisis-conditional β 또는 James-Stein 수축 의무."
    sleeve_betas:  # (β, NW-HAC t, n=750(joined), Bonferroni α/11 임계 |t|>2.84)
      eq_us_cyclical:        {beta: -0.62, t: -8.74, bonferroni: pass, tier: structural, note: "XLB/XLI/XLY/XLF/XLE 합성. walk-fwd 부호안정. 방향 robust, 크기 잠정"}
      eq_us_defensive_pure:  {beta: -0.22, t: -3.21, bonferroni: pass, tier: structural, note: "XLP/XLU/XLV 합성. 약 credit β"}
      XLV:                   {beta: -0.26, t: -4.74, bonferroni: pass, tier: structural, note: "defensive 중 유일 robust credit β driver"}
      XLP:                   {beta: -0.12, t: -1.89, bonferroni: fail, tier: HOLD, note: "비유의(CI 상단 -0.00) — credit 무차원 가설 기각(F축)"}
      eq_intl:               {tier: HOLD, note: "미측정(본 study US sector 한정)"}
      gold:                  {tier: HOLD, note: "INSUFFICIENT — macro_yahoo(2021-2024) ∩ HY(2023-05~) overlap ~1.5yr 단정 부적격"}
      reit:                  {tier: HOLD, note: "INSUFFICIENT — VNQ 가격 데이터 공백(collector 필요)"}
      commodity:             {tier: HOLD, note: "INSUFFICIENT — DBC 가격 데이터 공백(collector 필요)"}
    affects: "core/study/factor_betas_seed.SEED_CELLS credit 칸 (별 commit, core/study 범위 — 본 yaml 경계 외).
      해당 framework 의 TIER_STRUCTURAL = _W_MAX_STRUCTURAL 0.25 cap + James-Stein 수축 이미 구현(prior 강수축)."
  # --- B(a) dollar/oil JM feature 활성: REJECTED (보류 유지) ---
  - finding: dollar_oil_regime_activation
    verdict: REJECTED
    validated_alpha: false
    action: "보류 유지(활성화 차단) — regime_classifier.py _build_jm_matrix 보류 주석 존치, JM feature 미추가"
    evidence: "forward 21d SPY risk-off 예측 OOS Rank-IC 게이트 4/4 FAIL (dxy.level IS+0.075→OOS-0.056
      부호반전 / dxy.mom OOS-0.009 / oil.level OOS-0.002 / oil.mom OOS-0.238 CI∋0). 증분: baseline
      (real_rate,term_spread,VIX) OOS-IC +0.206 → +dxy/oil mom -0.095 악화."
    interpretation: "tautology 우려가 testable 하게 입증 — 시장가격은 risk 동시반영(contemporaneous)일 뿐
      forward 예측력 無. deprecation-evidence: quantitative null result 첨부(자동기각 아닌 실측 기각)."
