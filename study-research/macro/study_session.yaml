# 블록4: WEIGHT_RULES (★최종 산출 — 거시지표가 국면분류에 기여하는 가중 + downstream sleeve 조절)
# ★2-3 검증 재조정(가설2 FAIL): regime modulation 은 *hard 국면별 Ω 네트워크 스위칭이 아니라* —
#   ①직접구조(force-include 엣지)는 국면 공통 유지 ②regime별 *분산/변동성 스케일* 조절 ③soft belief-mix
#   Σ_eff(between-dispersion)로 전이 de-risk. modulate_by:regime 의 실제 작동 = 변동성·belief 가중이지
#   배선 재구성 아님. derive_weights 는 EB shrinkage 공통 prior 수축 유지(regime hard 분리 過적합 회피).
# ★base_weight 라벨(main 감사): 아래 base_weight 값(hy_oas 0.25 / real_rate 0.22 등)은 regime-IC 추적·실측값이
#   아니라 *이론 prior 라벨*이다. live regime-IC 누적(블록5 hook)이 아직 dead 상태라 IC-driven 재가중 미작동.
#   → regime-eval harness 확보 후 derive_weights/flag_router 가 실 IC 로 재칼리브레이트하기 전까지 prior 고정.
weight_rules:
  - {indicator_id: credit_spread_hy_oas, base_weight: 0.25, modulate_by: [regime],
     direction: "Stagflation/리스크오프 국면 → HY OAS 가중↑(방어 강화). Reflation → 가중↓",
     granularity: sleeve}
  - {indicator_id: real_rate_10y, base_weight: 0.22, modulate_by: [regime],
     direction: "rate-shock(real rate 급등) 국면 → real rate 가중↑ + 고듀레이션 sleeve(성장주/장기채) 사이징↓. 실데이터: rate-up 국면 nasdaq~us10y -0.18 듀레이션 페널티",
     granularity: sleeve}
  - {indicator_id: breakeven_5y, base_weight: 0.15, modulate_by: [regime],
     direction: "Overheat 국면 → inflation breakeven 가중↑(원자재·금 우위 신호). Reflation → 가중↓",
     granularity: sleeve}
  - {indicator_id: yield_10y_2y, base_weight: 0.18, modulate_by: [regime],
     direction: "커브 역전→해소 전환 시 가중↑(국면전환 anchor). steepening = Recovery 진입 신호",
     granularity: sleeve}
  - {indicator_id: dollar_dxy, base_weight: 0.12, modulate_by: [regime, industry],
     direction: "달러강세 국면 → 수출/원자재 sleeve 가중 조절(dxy~gold 직접 -0.3). EM/달러부채 민감 sleeve 페널티",
     granularity: industry}
  - {indicator_id: nfci, base_weight: 0.08, modulate_by: [regime],
     direction: "NFCI 긴축(>0) → 전 sleeve risk-off 틸트. HY OAS 와 중복신호라 합산 cap 적용",
     granularity: sleeve}

# 블록5: CONFIDENCE_HOOKS (★신뢰도 누적 — 확신/거부 flag 를 코드로 구현. weight_falsification 에 매핑)
# 매 거래마다 flag 누적 → 가정 신뢰도 → 렌즈 미세변화 → 동적 가중. 실데이터 발견: regime 신호는
# 평균이 아니라 *공분산 구조*에 있으므로(Σ_eff dispersion=0 on daily returns), confirm/reject 는
# score Rank-IC(예측력)와 Ω drift(구조변화) 둘 다로 본다(DUAL).
# ★hook-wire 라벨(main 감사, §4.5 dead-hook 점검): hy_oas_risk_regime + real_rate_duration_penalty 두 hook 은
#   flag_router.register 로 등록되고 측정기계(flag_router.emit_from_ic→rank_ic→score_ic_breakdown_eprocess
#   e-CUSUM)도 존재하나, emit_where 가 가리키는 "backtest engine SELL outcome" 의 **실측경로가 부재**한다 —
#   core 에 backtest 엔진 없음 + emit_ic_outcome/emit_from_ic 를 두 feature 의 실 scores+returns 로 호출하는
#   곳 0건(study_register L237 wrapper 만 존재, 호출자 無). 따라서 두 hook 은 현재 **dead-hook(§4.5)**:
#   emit_where 선언만 있고 regime-IC 실측·기록이 일어나지 않아 confidence 가 prior 에 고정된다.
#   → backtest 엔진이 emit_ic_outcome(hid, hy_oas_scores, fwd_returns) 로 실 IC 를 주입해야 활성. (omega_drift
#   /regime_belief_calibration 등 나머지 hook 의 실측경로 여부는 별도 점검 대상.)
confidence_hooks:
  - hypothesis_id: hy_oas_risk_regime
    affects_indicator: credit_spread_hy_oas
    confirm_signal: "HY OAS 확대 시 방어 틸트가 OOS outcome 에서 수익방어(합성 score Rank-IC 양 유지)"
    reject_signal: "HY OAS 신호 score Rank-IC e-CUSUM 단측 붕괴(baseline 아래)"
    emit_where: "backtest engine SELL outcome + 라이브 judge 사후평가(L1 score vs forward return)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess (e-CUSUM 단측)"
    confidence_metric: "e-value anytime-valid 누적(Ville: 거짓kill≤alpha)"
    store: "registry WeightAssumptionCard.confidence_now + ValidationVerdict.evidence"
    action_threshold: "e-value ≥ 1/alpha → PRIMARY kill(retract live) / 안정 → adopt 강화"
    feeds_weight: "kill→derive_weights 에서 해당 series IC→0 / 안정→base_weight 유지·소폭 상향"
  - hypothesis_id: real_rate_duration_penalty
    affects_indicator: real_rate_10y
    confirm_signal: "rate-up 국면 분류 시 고듀레이션 sleeve 페널티가 drawdown 방어(국면별 OOS IC)"
    reject_signal: "rate-up 페널티가 OOS 에서 음의 알파(과조정) → e-CUSUM 붕괴"
    emit_where: "backtest 국면조건부 outcome + regime 분류 confidence calibration"
    accumulate_in: "core/assume/weight_falsification.evaluate_weight_card (PRIMARY+SECONDARY)"
    confidence_metric: "국면조건부 Rank-IC e-process + classifier calibration(temperature, conditional_correlation.TemperatureCalibrator)"
    store: "regime별 WeightAssumptionCard(weight.macro.{regime}).confidence_now"
    action_threshold: "붕괴 → 해당 regime 카드 retract / 안정 → delta_regime 강화"
    feeds_weight: "신뢰도 → composed_weights 의 delta_regime 재적합(GlassoWeightLearner re-fit)"
  - hypothesis_id: omega_structure_drift
    note_2_3: "★검증: partial-corr 네트워크는 rate-regime 간 *불변*(permutation p=0.35) — 평시 drift 신호는
      약함. drift 임계는 보수적으로(과민 re-fit 회피). 주 regime 신호는 Ω구조가 아니라 변동성·belief. 단
      구조단절(2022전쟁/2023 SVB, Bai-Perron) 같은 진짜 재배선 시에만 SECONDARY re-fit 발동 의도."
    confirm_signal: "regime별 partial-corr 구조(Ω)가 OOS 윈도에서 안정(‖ΔΩ‖ 작음 — 평시 기대값)"
    reject_signal: "‖ΔΩ‖/‖Ω‖ > tau_fro(0.5) 또는 |Δlogdet| > tau_logdet(1.0) = 구조 drift"
    emit_where: "배치 재학습 시점 Ω_new vs Ω_old 비교(train_weights 사이클)"
    accumulate_in: "core/assume/weight_falsification.omega_drift + needs_refit"
    confidence_metric: "상대 Frobenius + logdet divergence(SECONDARY, kill 아닌 re-fit)"
    store: "WeightAssumptionCard.secondary_falsification + omega_hash 갱신"
    action_threshold: "drift>tau → TRANSITION(derive_weights 재실행) / score IC 견디면 비중 robust 유지"
    feeds_weight: "re-fit → 새 Ω_eff 로 derive_weights → delta_regime/delta_inter 갱신(hash pin 교체)"
  - hypothesis_id: regime_belief_calibration
    confirm_signal: "macro 분류기 belief b(t) 가 실현 국면과 calibrated(ECE 낮음)"
    reject_signal: "belief 과신(overconfident) → ECE 악화 → temperature>1 보정 필요"
    emit_where: "regime 분류 직후 logit→label outcome(분기별 NBER/실현 국면 대조)"
    accumulate_in: "core/structure/conditional_correlation.TemperatureCalibrator.fit (frozen+hash-pin)"
    confidence_metric: "ECE(expected calibration error) before/after + NLL(temperature scaling)"
    store: "WeightAssumptionCard.calibration_hash(frozen replay pin)"
    action_threshold: "ECE>임계 → belief temperature 재보정 / calibrated → belief 그대로 Σ_eff 주입"
    feeds_weight: "보정된 belief → effective_precision(Σ_eff) → _belief_conditional_cov → sleeve 배분(과신 시 between-dispersion inflate=transition de-risk)"
  - hypothesis_id: curve_regime_transition
    affects_indicator: yield_10y_2y
    confirm_signal: "10Y-2Y 역전→해소 전환이 Recovery 진입을 선행(12~18M lag) OOS 검증"
    reject_signal: "커브 신호 lag 가 불안정(국면 오분류) → score IC 붕괴"
    emit_where: "장기 backtest 국면전환 정합 + lag 민감도"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    confidence_metric: "lag-aligned Rank-IC e-process"
    store: "weight.macro.transition 카드 confidence_now"
    action_threshold: "붕괴 → curve 가중 하향 / 안정 → yield_10y_2y base_weight 상향"
    feeds_weight: "transition anchor 신뢰도 → estimation_note(블록1) 갱신 + curve 가중 미세조정"

