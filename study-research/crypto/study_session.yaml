# 블록4: WEIGHT_RULES (★★실측 prior ladder 정정 반영. coin 예외: granularity=sleeve 만)
# claude r3 hybrid (offline 표 = shrinkage target + internal glasso). 본 yaml = offline 표.
# ★실측 prior ladder (자문 vs 실측):
#   on-chain MVRV: 자문 0.4 → 실측 sharpe 1.27 → 0.55 상향
#   micro funding: 자문 0.6 → 실측 sharpe 0.97 + cascade REJECT → 0.45 하향
#   macro stablecoin: 자문 0.3 → 실측 sharpe -0.43 → 0.20 하향
#   ETF flow: probation observe-only 0.05 유지
#   halving: regime label only 0.10 유지
weight_rules:
  - {indicator_id: mvrv_btc, base_weight: 0.55, modulate_by: [regime, industry],
     direction: "on-chain rolling sharpe 1.27 (eff_n~16 신뢰 낮음). conditioning regime = FGI 5 × halving 4. mvrv 신호 = *conditional only* (marginal 단독 사용 X). ★20 cell raw IC 전부 음(mean-revert 방향 일관)이나 eff_n<30 전 cell + Bonferroni α/16 생존 0 = magnitude 점추정 불가(이전 -0.65/-0.03 강·약 박제 철회 = cell-label 혼동 정정, audit C축). coin_sizing Kelly 보수화 = 방향성 약 prior 한정, cell별 강도 차등 없음",
     granularity: sleeve}
  - {indicator_id: funding_rate, base_weight: 0.15, modulate_by: [regime],
     direction: "★[자문 정정] cascade 가설 REJECT → trend follow 부호로 재정의. extreme long funding (p95+) 진입 시 = bull trend 지속 정황 → coin_sizing fraction 유지 또는 소폭 확대 (Kelly 보수화 trigger X). 단 rolling sharpe 0.97 (양수 안정) — 신호 자체는 보존, 부호만 반전",
     granularity: sleeve}
  - {indicator_id: stablecoin_total_supply, base_weight: 0.20, modulate_by: [regime],
     direction: "Granger lead 확인 (p<0.005 lag 7d) but bidirectional reflexive. growth (Δsupply z-score) > 1 진입 + macro risk-on regime 동시 충족 시에만 가중. rolling sharpe -0.43 부호 반전 시기 다수 → reject_signal 빨리 발화하도록 임계 보수",
     granularity: sleeve}
  - {indicator_id: etf_net_flow_usd, base_weight: 0.05, modulate_by: [regime],
     direction: "probation observe-only. 5d cum>0 + risk-off macro regime 시에만 'digital-gold demand' 가중 적용 (자문 가설). 데이터 누적 시 confidence_hooks 가 OOS reject_signal 발화. glasso 노드 미포함 (complete-case window 수축 회피)",
     granularity: sleeve}
  - {indicator_id: halving_phase, base_weight: 0.10, modulate_by: [regime],
     direction: "regime label only (standalone IC 산출 X). belief b(t) regime 입력. ★phase별 raw IC 음 일관이나 eff_n<30 + Bonferroni 비유의 → magnitude 미박제(이전 phase별 mean-revert 강·약 가중 차등 철회 = audit C축). regime label conditioning 역할만, 강도 단정 없음",
     granularity: sleeve}
  - {indicator_id: fgi, base_weight: 0.10, modulate_by: [regime],
     direction: "FGI 5-state = belief b(t) primary 축 (D5 합의). soft membership. extreme_fear/extreme_greed conditioning 시 다른 가설의 weight modulator 적용. 자체 가중치는 conditioning 역할 정도만 (15→10)",
     granularity: sleeve}

