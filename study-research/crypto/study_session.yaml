  - hypothesis_id: crypto_mvrv_conditional_mean_revert
    confirm_signal: "FGI × halving_phase conditioning 후 MVRV → fwd_30d Rank-IC 음 유지 (실측: 20 cell raw IC -0.065~-0.653 전부 음=방향 일관, ★단 eff_n<30 전 16 cell + Bonferroni α/16=0.0031 생존 0 = 개별 cell 비유의. 방향성 약 prior 한정, N≥30 claim 철회)"
    reject_signal: "조건부 IC 가 양으로 부호 반전 OR e-CUSUM 단측 붕괴 (baseline_ic=0=score⊥fwd null, sd=empirical rolling-IC std≈0.345). ★e-CUSUM 은 window overlap 자기상관으로 small-n spurious → 의사결정 보조 라벨만(단독 retract 근거 X)"
    emit_where: "instrument_source.run_mvrv_closed_loop (이미 ledger 운영) + scripts/h1_mvrv.py 의 conditional Rank-IC 라이브 갱신"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess (regime별 baseline_ic 사전등록)"
    confidence_metric: "e-value anytime-valid (Ville 이론, alpha=0.05) — 우리 e_cusum_one_sided 사용 가능"
    store: "registry crypto.mvrv_conditional_mean_revert 카드 confidence_now + EventLedger FDR_DECISION"
    action_threshold: "e-value>=20 = retract / 안정 = base_weight 0.55 유지 또는 소폭 상향"
    feeds_weight: "kill → coin_sizing.size_coin_portfolio 의 MVRV-conditional 사이징 가중 0. confirm → 가중 유지"
  - hypothesis_id: crypto_funding_trend_follow
    confirm_signal: "[★자문 정정 반영] extreme long funding (p95+) 진입 후 fwd_3d 양 hit rate 유지 (현재 실측 51.7% at p95+long, 50/118 음 — borderline)"
    reject_signal: "hit rate 0.5 미달 + binomial p>0.05 OR Rank-IC 부호 반전 (자문 원래 가설 = neg cascade 회귀)"
    emit_where: "scripts/h2_funding.py + coin_consensus_lens 의 funding extreme 트리거 후 outcome"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    confidence_metric: "regime-conditional Rank-IC e-process"
    store: "crypto.funding_trend_follow 카드 confidence_now"
    action_threshold: "p<0.05 + IC 양 안정 = trend follow 부호 확정 / 붕괴 = cascade 가설 재검증 (부호 재반전 가능)"
    feeds_weight: "neutral → coin_sizing 에 funding 입력 가중치 보수화"
  - hypothesis_id: crypto_stablecoin_lead_with_reflexive_guard
    confirm_signal: "Granger supply->BTC p<0.05 유지 + rolling Rank-IC 부호 양 + BTC->supply Granger p>0.05 (단방향)"
    reject_signal: "BTC->supply p<0.01 + supply->BTC p>0.05 = 역인과 우세 / 또는 rolling sharpe <0 누적"
    emit_where: "scripts/h3_stablecoin.py 의 Granger + CCF 정기 재실행 (월 1회 권고)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess + lead_lag_validity gate"
    confidence_metric: "양방향 Granger F-test p-value 비율 + rolling Rank-IC sharpe"
    store: "crypto.stablecoin_dry_powder 카드 confidence_now + lead-lag-validity gate"
    action_threshold: "lead 우세 = base_weight 0.20 유지 / reflexive 위협 = 가중 0 (raw signal 차단)"
    feeds_weight: "신뢰도 → consensus lens prompt 의 stablecoin 라인 가중 + sizing modulator"
  - hypothesis_id: crypto_etf_flow_probation
    confirm_signal: "post-2024 rolling Rank-IC 양 유지 + 5d cum>0 후 fwd_30d>0 binomial p<0.05 누적"
    reject_signal: "OOS rolling IC 단측 붕괴 OR ETF flow price-chasing (reflexive: flow=f(prev_ret) 유의)"
    emit_where: "scripts/h4_etf.py (정기 재실행) + farside daily 누적"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess"
    confidence_metric: "OOS rolling IC sharpe + reflexive F-test"
    store: "crypto.etf_flow_probation 카드 confidence_now"
    action_threshold: "1.5yr 더 누적 후 prior 0.05 → 0.15 promotion 가능 / 붕괴 = 즉시 0 차단"
    feeds_weight: "prior_strength probation 동적 갱신 (자동 ramp)"
  - hypothesis_id: crypto_halving_phase_conditional
    confirm_signal: "phase 별 H1 MVRV → fwd_30d IC 일관성 (현재 실측 5 phase 중 5 phase 음, 절대값 0.03~0.61 차이)"
    reject_signal: "phase 간 IC 부호 반전 (mean-revert vs trend follow regime 충돌)"
    emit_where: "scripts/h5_halving.py + 각 halving 후 분기별 재평가"
    accumulate_in: "core/assume/weight_falsification.omega_drift (secondary, kill 아님)"
    confidence_metric: "phase-conditional IC stability (4-cycle bootstrap, CI 매우 넓음 명시)"
    store: "crypto.halving_phase_conditional 카드 secondary_falsification 필드"
    action_threshold: "drift>tau = estimation_note 신뢰도 라벨 하향 (中→低) / 안정 = anchor 유지"
    feeds_weight: "신뢰도 → lens estimation_note (LLM 주입 시 신뢰도 표기) 자동 갱신"
  - hypothesis_id: crypto_macro_abstain
    confirm_signal: "coin_track_macro.H29 abstain (macro unavailable) 시 buy→hold 차단이 drawdown 방어 — OOS hit rate"
    reject_signal: "abstain 빈도 과다로 missed-rally 누적 (Type II error 음 알파)"
    emit_where: "coin_track_macro.generate_candidate 의 H29 차단 시점 → 7~14d outcome"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess (abstain hit-rate)"
    confidence_metric: "abstain-conditional Rank-IC + missed-rally 페널티"
    store: "crypto.macro_abstain 카드 confidence_now"
    action_threshold: "안정 = H29 임계 유지 / 거부 = abstain 임계 완화"
    feeds_weight: "신뢰도 → macro_view 의 belief 게이트 가중"

