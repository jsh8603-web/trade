# 블록1: LENS (정성 — LLM 주입용. ★가변: 블록5 flag → estimation_note·가중 미세변동)
lens:
  pricing_principle: >
    코인 가격결정 5축 (실측 보정):
    (1) 투기적 자본흐름 = stablecoin 시총·거래소 입출금·funding rate.
    (2) 공급 schedule = halving 4년 사이클 (N=4 검정 불가, regime label only).
    (3) 거시 유동성 = real_rate·DXY·M2 — Liu&Tsyvinski 2021 null 근거 macro 채널 2020-03 fit start.
    (4) 시장 미시구조 = perpetual funding/OI, BTC dominance rotation.
    (5) 네트워크 가치 = realized cap (cost-basis), Metcalfe-like.
    ★펀더멘털 cash flow 부재 = DCF 비성립 (coin_consensus_lens.dcf_not_used()).
    MVRV = market_cap / realized_cap = 코인판 P/B 유사 cycle 진동자.
  report_relations:
    - "MVRV>2.4 (실측 1154 일수, 19.9% of 5795d) → marginal fwd_30d 평균 +22.9% (★trend 지속, 자문 mean-revert 가설 marginal 정반대). partial corr | FGI×halving = -0.085 p<0.001 (조건부 mean-revert 잔존, but BB95%CI=(-0.235, +0.073) = 0 포함 = partial 직접엣지 약)"
    - "★[REJECT] funding cascade — Binance BTCUSDT 8h funding 7363 obs. |funding|>0.05%/8h 진입 후 fwd_3d 가 양 (+1.9% at p99+long n=24, +0.8% at p95+long n=118), cascade 가설 부호 정반대. Rank-IC=-0.041 BB95%CI=(-0.11,+0.02) = 0 포함. extreme long funding 은 cascade 아니라 trend 지속의 *수반 현상*"
    - "stablecoin growth → BTC: Granger lag 7d p=0.0005 / lag 14d p=0.0022 = supply lead 확인. ★단 BTC→supply 도 lag 7d p=0.0138 = bidirectional (reflexive 위험). rolling Rank-IC sharpe=-0.43 (역방향 시기 다수). dry powder 효과 = regime-dependent, prior 보수화 필수"
    - "halving 4 phase: post_0_6m / post_6_18m / post_18_24m / post_24_36m 의 fwd_30d 단순평균 = +6.6% / +8.5% / -7.5% / +1.1%. post_6_18m 최대 +, post_18_24m distribution → bear 전이 가설 데이터 일치 but N=4 통계 검정 불가 (구조적 prior 라벨)"
    - "BTC ETF (post-2024) net flow → 5d cum > 0 인 경우 fwd_30d > 0 hit rate = 56.7% (n=374, binomial p=0.006). digital-gold 채택 가설 1차 검증, but CI 포함. 1.5~2yr probation observe-only prior 유지"
    - "FGI×halving 20 cell: raw IC 모두 음 (-0.065 ~ -0.653) = mean-revert 방향성 일관(약 prior). ★단 effective_n(자기상관 보정) *전 16 cell <30* (raw N≥30 claim 무효, audit B축) + Bonferroni α/16=0.0031 per-cell p(eff_n 기반) 생존 = 0 cell → 개별 cell 통계 비유의(tentative). conditioning 후 신호 = 방향성 힌트만, magnitude 점추정 불가"
    - "거시 transmission: M2↑→stablecoin demand↑→BTC. real_rate↑→ 위험자산 멀티 압박 (post-2020 채널, 2024 ETF 부분 디커플)"
  regime_reading: >
    FGI 5단계 × halving phase 4단계 conditioning 으로 가설별 부호 달라짐.
    ★실측 정정(audit C축 label 강·약 뒤바뀜 + 점추정 박제 교정): extreme_fear post_6_18m raw IC=-0.653(eff_n 14.6) / extreme_greed post_6_18m=-0.065(eff_n 5.7) / extreme_fear post_18_24m=-0.487(eff_n 12.8). 이전 "markup IC-0.03 약 / distribution IC-0.51 강"은 extreme_fear↔extreme_greed 혼동 + 점추정 박제(철회). ★전 cell eff_n<30 + Bonferroni 후 생존 0 = 개별 cell 강·약 단정 불가(비유의). 방향(전 cell 음=mean-revert)만 약 prior 일관. funding extreme long = trend 지속(자문 cascade 기각, 별도 가설). belief b(t) primary = FGI 5-state soft membership, macro·halving = parametric multiplier(약 prior, magnitude 미박제).
  estimation_note: >
    2026-05 추정 (실데이터 anchor, ★신뢰도 中→低, 후속 OOS 재검증 의무):
    (a) 현재 MVRV (CoinMetrics 최신) = 1.36 (low, 9th percentile 부근), MVRV<1.5 영역.
    (b) BTC dominance 57.5% (CoinGecko snapshot), alt-season 비활성.
    (c) 2024-04 halving 후 약 13개월 → post_6_18m markup phase 중후반.
    (d) 일별 funding rate (7363 obs 평균 +0.000108) = 평소 수준.
    ★fwd 30d 예상 시 marginal trend 우세 (post_6_18m +8.5% 평균), but MVRV<1.5 = mean-revert 신호 활성도 낮음.
    ⚠️ 본 추정은 블록5 confidence_hooks 가 OOS Rank-IC 로 갱신 — H1·H2 가설 부호 정정 사항이 추가 데이터로 재검증되면 lens 다시 갱신.

