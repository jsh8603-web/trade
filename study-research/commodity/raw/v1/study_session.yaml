    vintage_policy: point_in_time
    lag: 1

  - id: dxy_index
    family: macro_driver
    is_core: true
    in_our_system: false
    source_or_collector: "FxStore (main 선구축, DXY/USDKRW PIT) — 이미 §7 계획됨"
    transform: own_history_z
    vintage_policy: point_in_time
    lag: 0

  - id: global_pmi_manufacturing
    family: macro_driver
    is_core: true
    in_our_system: false
    source_or_collector: "FRED NAPM (US ISM Manufacturing PMI) + China Caixin (manual 또는 OpenBB) — 블록6"
    transform: level
    vintage_policy: point_in_time
