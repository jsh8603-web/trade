# ============================================================================
# 블록1 LENS — 정성 렌즈 (일반론 + 리포트 정제. judge LLM 평가 시 주입)
# ★가변: 블록5 confidence_hooks 누적이 estimation_note·regime_reading 을 미세 변동시킨다.
# ============================================================================
lens:
  pricing_principle: |
    원자재 가격 = 현물 수급(spot S/D) × 보유비용(real rate + storage − convenience yield) × 통화 표시단위(USD).
    Theory of Storage(Kaldor-Working-Brennan): 만기별 선물가격 F(t,T) = S·exp((r + u − y)·(T−t)).
      r=real rate, u=storage cost, y=convenience yield(현물 보유 옵션 가치 — 재고 타이트할수록 ↑).
    → Backwardation (F<S, 곡선 우하향): convenience yield 우세 = 재고 타이트 = 양의 carry → 롱 보유 수익.
    → Contango       (F>S, 곡선 우상향): 보유비용 우세 = 재고 잉여 = 음의 carry → 롤 손실.
    원자재는 **현금흐름·배당 없음** → 가격결정에서 (a) 거시 driver(real rate↑ → 비현금자산 압박,
    DXY↑ → USD 표시 가격 압박), (b) 산업 demand cycle(글로벌 PMI/중국), (c) 공급 충격(OPEC·기상·
    geopolitical), (d) 재고 cushion 4축이 동등 중요.

  report_relations:
    - "Real rate(DFII10) ↑ → 금/장기보유 commodity 압박(보유비용 ↑). 단 inflation hedge demand 가 상쇄"
    - "DXY ↑ → 대부분 USD-denominated commodity 가격 ↓(달러 표시 메커니즘 + EM 구매력 ↓)"
    - "Global PMI(특히 China Caixin Manufacturing) ↑ → industrial metal(Cu/Al/Steel)·oil demand ↑"
    - "Inventory(EIA crude stocks, LME warehouse, USDA stock-to-use) ↓ → convenience yield ↑ → backwardation 심화"
    - "Term structure slope(F2-F1) → 양수 contango = 잉여 / 음수 backwardation = 타이트. roll yield 결정"
    - "OPEC+ 감산·생산쿼터 → 공급 shock(crude·Brent). gold 와 무관, industrial metal 부분 동반"
    - "USDA WASDE(grains), EIA STEO(energy) — 월간 수급 발표가 implied vol spike trigger"
    - "BCOM·GSCI index roll 시 contango regime 에선 roll cost drag 누적(buy-and-hold 손실)"
    - "Gold ↔ real rate 강한 음의 상관(−0.6~−0.8 long-run), gold ↔ DXY 음 상관, gold ↔ VIX/risk-off 양"
    - "Oil ↔ geopolitical premium(시아 vs 수니, Russia-Ukraine, Middle East) — discrete jump risk"

  regime_reading: |
    [Reflation/Recovery] real rate 안정·PMI↑·DXY 약 → industrial metal(Cu/Al) 우위, crude oil demand↑.
                         carry 가중 ↑ (백워데이션 깊어짐, convenience yield 활성).
    [Overheat]           real rate↑·인플레↑·DXY 강 → gold 양면(real rate 압박 vs inflation hedge), oil 강세,
                         agricultural commodity 강세. carry 가중 유지, real rate macro_sensitivity 가중 ↑.
    [Stagflation]        성장↓·인플레↑ → gold 강력 우위, energy mixed, industrial metal 약. inventory glut
                         risk → contango_flip flag 발생 시 carry 가중 즉시 감액.
    [Reflation→Recovery] HY OAS 안정 + PMI 반등 → industrial metal demand 회복, term structure 가파른 backwardation 진입.
    [Risk-off/Crash]     gold·oil 분리. gold safe-haven 매수, oil demand-destruction 매도. dollar 동반 강세
                         (USD 표시 commodity 추가 압박). VIX>30 → 모든 carry 신호 권한↓, risk indicator 가중↑.

  estimation_note: |
    2026-05 시점 추정(블록5 flag 누적 전 초안):
      - real rate(DFII10) ~1.8%대 안정, DXY 105 횡보 → gold $2,300+ 강세 정당화.
      - 중국 PMI 50 근방 횡보 → industrial metal demand 회복 미지근(Cu 정당 가격 검증 필요).
      - oil: OPEC+ 감산 지속 + geopolitical premium → Brent $80~85 carry 양수 유지(백워데이션).
      - 인플레 hedge demand 가 real rate 압박을 상쇄 중 — 둘 partial-corr 약화(conditioning_set 필수).
    이 anchor 는 confirm/reject flag 누적에 따라 weight_rules base_weight·direction 미세 변동.

# ============================================================================
