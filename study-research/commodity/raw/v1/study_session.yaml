    source_or_collector: "신규 collector: front/back month futures (CME/ICE) — 블록6 commodity_futures_term_structure"
    transform: level         # 부호·절대값 의미 (백워데이션 = +, contango = −). 분위변환 금지(commodity_carry.yaml 명시)
