# ============================================================================
# 블록3 RELATIONSHIPS — partial-corr 기준 (glasso prior). conditioning_set 필수.
# ============================================================================
relationships:
  - node_a: real_rate_dfii10
    node_b: roll_yield
    edge_type: undetermined         # gold/oil 채널 분리 필요 — conditioning_set 으로 분리
    conditioning_set: [dxy_index, global_pmi_manufacturing]
    lag_routing: contemporaneous
    prior_sign: neg                 # real rate ↑ → 보유비용 ↑ → carry 약화 (gold·long-storage 강함, oil 약)
    prior_strength: 0.45
    theory_basis: "Theory of Storage: r↑ → F-S spread 확대 → backwardation 약화. dxy/PMI 통제 후 직접효과"

  - node_a: dxy_index
    node_b: roll_yield
    edge_type: direct
    conditioning_set: [real_rate_dfii10]
    lag_routing: contemporaneous
    prior_sign: neg
    prior_strength: 0.55
    theory_basis: "USD 표시 commodity: DXY↑ → 가격↓ → spot 약세 → backwardation 약화. real rate 분리 필수"

  - node_a: global_pmi_manufacturing
    node_b: days_of_supply
    edge_type: direct
    conditioning_set: [credit_spread_hy_oas]
    lag_routing: lagged              # PMI 1-3개월 선행 → demand → inventory drawdown
    prior_sign: neg
    prior_strength: 0.50
    theory_basis: "글로벌 산업수요 ↑ → industrial commodity 재고 소진 → days_of_supply ↓"

  - node_a: days_of_supply
    node_b: convenience_yield_z
    edge_type: direct
    conditioning_set: []
    lag_routing: contemporaneous
    prior_sign: neg
    prior_strength: 0.70             # 이론 강함 — force-include 화이트리스트 후보 (≤4 엣지)
    theory_basis: "Working: 재고 타이트(낮은 days_of_supply) ↔ convenience yield 증가. 직접 동치"

  - node_a: convenience_yield_z
    node_b: roll_yield
    edge_type: direct
    conditioning_set: []
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.65             # 이론 강함 — force-include 후보
    theory_basis: "F=S·exp((r+u−y)(T−t)): convenience yield y↑ → F<S(backwardation) → roll yield+"

  - node_a: credit_spread_hy_oas
    node_b: realized_vol_60d
    edge_type: common_cause          # risk-off regime(C)이 둘을 동시에 끌어올림
    conditioning_set: []
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.50
    theory_basis: "risk-off regime 이 매개. partial-corr 으로 분해 시 regime 통제 후 약화"

  - node_a: momentum_12_1
    node_b: roll_yield
    edge_type: undetermined
    conditioning_set: [global_pmi_manufacturing, dxy_index]
    lag_routing: lagged
    prior_sign: pos                  # 가격 모멘텀 → spot 강세 지속 → backwardation 유지 경향
    prior_strength: 0.30
    theory_basis: "carry-momentum 결합 효과(commodity asset pricing literature: Asness-Moskowitz-Pedersen 2013)"

  - node_a: cot_net_specs_z
    node_b: momentum_12_1
    edge_type: common_cause
    conditioning_set: []
    lag_routing: contemporaneous
    prior_sign: pos
    prior_strength: 0.35
    theory_basis: "speculator net long 과 모멘텀은 가격 trend(C) 매개. Sanders-Irwin: COT 자체 예측력 약(companion)"

# ============================================================================
# 블록4 WEIGHT_RULES — 최종 산출. modulate_by: regime/industry/size/name_specific
# (commodity 의 industry = sector subgroup: energy/metals/agri/precious)
# ============================================================================
weight_rules:
  - indicator_id: roll_yield
    base_weight: 0.25
    modulate_by: [regime, industry]
    direction: "Reflation/Overheat → roll_yield 가중↑(carry premium 활성). Stagflation+contango_flip → 즉시 감액 → 0"
    granularity: industry        # energy/metals/agri/precious 별 sleeve

  - indicator_id: convenience_yield_z
    base_weight: 0.15
    modulate_by: [regime, industry]
    direction: "industrial metal(Cu·Al) regime 에선 가중↑(수급 타이트 신호 핵심). gold 에선 가중↓(monetary 우세)"
    granularity: industry

  - indicator_id: days_of_supply
    base_weight: 0.15
    modulate_by: [regime, name_specific]
    direction: "oversupply_decoupling flag 발생 시 가중↓(평균회귀 메커니즘 무력화 — value trap). 정상 regime 에선 평균회귀 베팅"
    granularity: ticker          # 종목별(WTI·Brent·Cu·Au) days_of_supply 다름

  - indicator_id: real_rate_dfii10
    base_weight: 0.15
    modulate_by: [industry]
    direction: "gold·precious metal sleeve: 가중↑·부호 강제 음. industrial/agri: 가중 보통. oil: 가중↓"
    granularity: industry

  - indicator_id: dxy_index
    base_weight: 0.10
    modulate_by: [regime]
    direction: "risk-off(VIX>30) regime → 가중↑(DXY 강세가 commodity 압박 증폭). 평상시 보통"
    granularity: sleeve

  - indicator_id: global_pmi_manufacturing
    base_weight: 0.10
    modulate_by: [industry]
    direction: "industrial metal(Cu·Al·Ni)·energy(oil): 가중↑(demand cycle 직결). gold·grain: 가중↓"
    granularity: industry

  - indicator_id: momentum_12_1
    base_weight: 0.05
    modulate_by: [regime]
    direction: "trending regime(VIX 안정 + autocorr+)에선 가중↑. mean-reverting regime(VIX>25)에선 가중↓"
    granularity: sleeve

  - indicator_id: realized_vol_60d
    base_weight: 0.05
    modulate_by: [regime]
    direction: "risk-off regime → 가중↑(vol scale 사이징). 부호 음(고 vol = 보수)"
    granularity: sleeve

  # composed_weights hierarchical pooling 사용:
  #   w_global = 위 base_weight 8개
  #   delta_regime: regime 별 (Reflation/Overheat/Stagflation/Risk-off) 보정
  #   delta_arch_by_type = {energy, metals_industrial, metals_precious, agri} soft membership
  #   delta_inter: 얇으면 자동 가법 강등

# ============================================================================
# 블록5 CONFIDENCE_HOOKS — flag 코드화 (어디서 발생·누적·저장·작동)
# ★ 매 거래 (확신)/(거부) flag → 신뢰도 누적 → lens 미세변화 → 가중치 동적
# ============================================================================
confidence_hooks:
  - hypothesis_id: carry_premium_holds              # commodity_assumptions.build_commodity_cards() id 와 매핑
    confirm_signal: "backwardation 진입 종목 buy 후 OOS Rank-IC(roll_yield → fwd_return) 양 유지"
    reject_signal:  "carry_forward_slope.sign_flip=True (prequential 부호전환) OR score IC e-CUSUM 단측 붕괴"
    emit_where: "backtest/engine SELL outcome + 라이브 judge 사후평가 (commodity_assumptions.carry_forward_slope 매 사이클 호출)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess + commodity_assumptions.CarrySlopeResult.sign_flip 누적 카운터"
    confidence_metric: "e-value anytime-valid (Ramdas SAVI) — log e_t 누적, e_t = (1 + κ·(s_t·ic_t − baseline_ic))"
    store: "AssumptionRegistry 카드 confidence_now (WeightAssumptionCard.secondary_falsification 필드 옆 신규) + RulePerformance.flag_history"
    action_threshold: "e-value > 20 → adopt 강화(base_weight×1.1, cap 내). e-value < 0.05 OR sign_flip 연속 3회 → retract live 차단(UpdateAction.RETIRE)"
    feeds_weight: "derive_weights 재적합 트리거 (route_lifecycle.secondary_refit 경로) → omega_eff·ic 재계산 → new w → transition_card(v+1)"

  - hypothesis_id: inventory_mean_reverts            # commodity_assumptions.build_commodity_cards() id
    confirm_signal: "days_of_supply 평균회귀 후 fwd_return 회복 (variance_ratio.mean_reverting=True 유지)"
    reject_signal:  "oversupply_decoupling.decoupled=True (정상 regime slope<0 인데 oversupply regime slope≈0/+) OR threshold_regression breakdown"
    emit_where: "commodity_assumptions.variance_ratio + oversupply_decoupling 를 매 사이클 산출 → judge 사후평가에서 outcome 매핑"
    accumulate_in: "core/assume/weight_falsification.evaluate_weight_card + commodity_assumptions.OversupplyResult.decoupled 카운터"
    confidence_metric: "Beta(α,β) posterior — α 누적 confirm, β 누적 reject. 신뢰도 = α/(α+β)"
    store: "AssumptionRegistry.RulePerformance + WeightAssumptionCard.secondary_falsification 텍스트"
    action_threshold: "신뢰도 > 0.75 → days_of_supply base_weight 0.15→0.20. 신뢰도 < 0.30 → 0.05 + value trap guard 활성"
    feeds_weight: "weight_rules[days_of_supply].base_weight 미세조정 (registry transition 으로 새 카드 버전)"

  - hypothesis_id: real_rate_gold_negative_partial   # 블록3 real_rate ↔ roll_yield 가설 (gold 특화)
    confirm_signal: "gold sleeve 한정 real_rate_dfii10 partial-corr(controlling dxy) < -0.4 유지 + gold buy 후 real_rate 하락 outcome 일치"
    reject_signal:  "partial-corr |z| < 0.15 (관계 붕괴) OR Sanders-Irwin 식 decoupling — 36m rolling beta 부호 전환"
    emit_where: "core/structure/conditional_correlation.RegimeGlasso.fit 산출 partial-corr matrix → gold 노드 페어 추출 → 사이클 별 기록"
    accumulate_in: "core/assume/weight_falsification.omega_drift 의 gold-specific projection + 신규 utility partial_corr_drift_tracker"
    confidence_metric: "Bayesian online partial-corr 분포 (Normal-Inverse-Wishart) — posterior precision 의 (gold, real_rate) 셀 변화 추적"
    store: "WeightAssumptionCard.omega_hash 변화 시퀀스 + registry timeline"
    action_threshold: "분포 mean < -0.4 유지 시 weight_rules[real_rate_dfii10] gold sleeve direction='force negative coef 0.4'. 붕괴 시 0.1 으로 약화"
    feeds_weight: "weight_rules[real_rate_dfii10].direction 의 gold sleeve 분기 갱신 (composed_weights.delta_arch_by_type 의 metals_precious 항)"

  - hypothesis_id: seasonality_present              # commodity_assumptions.seasonal_f_test 산출
    confirm_signal: "월별 seasonal_f_test.significant=True 유지 (p<0.05 AND strength>0.3) + 시즌별 OOS hit_rate > 55%"
    reject_signal:  "seasonal_strength < 0.2 지속 OR climate change 로 historical seasonal pattern 약화 (3년 rolling)"
    emit_where: "월말 cron — commodity_assumptions.seasonal_f_test(agri/energy ticker별) → SeasonalFResult.significant 기록"
    accumulate_in: "신규 utility seasonal_decay_tracker (deque of last 36 months F-stat)"
    confidence_metric: "rolling 36m significant 비율"
    store: "WeightAssumptionCard regime_id='seasonal_window' 의 카드 별도 + RulePerformance"
    action_threshold: "비율 > 0.70 → seasonal regime 에서 momentum_12_1 base_weight×1.3 + agri/energy sleeve. 비율 < 0.35 → seasonal 가중 0"
