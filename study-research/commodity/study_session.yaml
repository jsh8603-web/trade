# ============================================================================
# 블록1 LENS — 정성 렌즈 (LLM 주입). ★가변: 블록5 flag 누적이 estimation_note/regime_reading 미세 변동
# 학파 정독 (theory-notes.md Part A+B+C 결과) 반영
# ============================================================================
lens:
  pricing_principle: |
    원자재 가격 = 현물 수급 (Theory of Storage: F(t,T) = S·exp((r+u−y)(T−t))) × 보유비용 (real rate + storage − convenience yield)
    × USD 표시단위 (DXY). 현금흐름·배당 없음 → (a) 거시 driver (real rate·DXY·credit) (b) 산업 demand cycle (글로벌 PMI/중국)
    (c) 공급 충격 (OPEC·기상·geopolitical, discrete jump) (d) 재고 cushion 4축 동등 중요.
    ★Gorton-Hayashi-Rouwenhorst (2013) 통합 명제: KWB(storage) + HK(backwardation) = inventory state variable 매개.
    ★Deaton-Laroque (1992) competitive storage: 재고 ≥ 0 → positive skewness, 공급부족 시 spike, 공급과잉 시 mean revert.

  report_relations:
    - "Theory of Storage: F=S·exp((r+u−y)(T−t)). y(convenience yield) ↑ → backwardation, y ↓ → contango"
    - "Tang-Xiong 2012 financialization: ★실측 압도적 재현. 2004 이후 sub-sector 교차상관 0.045→0.30 (6배 급등). 2008 위기 spike 0.37"
    - "Real rate ↑ → 비현금자산 압박 (gold/precious 특히, single partial corr 약 — 36m rolling mean ≈ -0.07, regime 의존)"
    - "DXY ↑ → 모든 USD 표시 commodity 가격 ↓ (Q3 cross-sleeve covariance에 대한 단일 정적 prior 금지)"
    - "Kilian 2009 SVAR: oil shock 의 macro 효과는 source 의존 (supply-driven → equity-, demand-driven → equity+, precautionary → mixed)"
    - "Hamilton NOI: WTI 1년 NOI > 10% (★검증된 임계, 원안 30% 너무 strict) → 12m forward CFNAI mean −0.46 (vs normal −0.13)"
    - "★ Copper bellwether (Dr. Copper): INDPRO YoY ↔ copper return optimal **lag 12m** (spearman 0.40 p=1e-12), 3m 보다 강함"
    - "GHR 2013 inventory state variable: norm_inv 가 basis + prior return 동시 설명. H2/H3/BGR redundant 가능성"
    - "BGR 2019 basis_momentum: Basis = ln(F1)−ln(F2), RelBasis = Basis − 12m MA, BasisMom = sign×sign ∈ {-1,0,+1}"
    - "Deaton-Laroque positive skewness: 가격 분포 right tail heavy, 2020-04 negative WTI 의 이론적 base (storage capacity 한계)"
    - "Bioenergy 채널 (corn ethanol RFS, soy biodiesel): WTI ↑ → biofuel margin → agri demand (B matrix 분리, claude R3 refinement)"
    - "Look-ahead bias 차단: ALFRED real-time vintage 필수 (CFNAI/WASDE 대폭 revise, final vintage 사용 시 IC 부풀려짐)"

  regime_reading: |
    [Reflation/Recovery] DXY 약·real rate 안정·INDPRO YoY > +3%: industrial sleeve 우위 (copper 12m forward +5.85% expected — 실측).
                         carry indicator 가중 ↑, financialization low (cross-corr < 0.2)
    [Overheat]           real rate ↑·인플레 ↑·DXY 강: gold 양면 (real rate vs inflation hedge), precious sleeve mixed
    [Stagflation]        성장 ↓·인플레 ↑: gold·precious 우위, energy mixed, industrial 약
                         contango_flip flag 시 carry 가중 즉시 감액 (roll cost drag)
    [Risk-off / VIX>30]  ★Tang-Xiong financialization 가속 — cross-sector mean corr spike 0.37 (2008 학습).
                         diversification 사라짐 → weight 보수 (sleeve 간 corr ~1 가정), vol weight ↑.
                         precious safe-haven, energy demand-destruction 분리.
    [NOI > 10% shock]    ★ 검증된 12m forward CFNAI = −0.46. recession lead 위험.
                         모든 risk-on commodity 가중 ↓, gold/precious 가중 ↑.
    [Inflationary boom]  Kilian supply shock 우세 시 energy↔equity negative cov (-0.3~-0.5), 단 demand-shock 우세 시 + cov.
                         단일 정적 prior 금지.

  estimation_note: |
    2026-05 검증 시점 anchor (가변 — 매월 갱신):
      - cross-sector mean corr 60d ≈ 0.18 (post-2011 평균 0.17 부근, 위험 회피 mode 아님)
      - 실측 partial-corr(Au, DFII10 | DXY) 36m = -0.078 → real rate 압박 weak regime (gold 안정대)
      - WTI 1yr NOI 최근 수치 → recession lead 위험 평가 (NOI > 10% 진입 여부 모니터)
      - INDPRO YoY 최근 → copper 12m forward outlook
      - DBC vs WTI 12m drag = −3.6%/yr 평균 — contango 누적 손실 진행 중

