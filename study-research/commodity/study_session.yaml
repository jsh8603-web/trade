    feeds_weight: "weight_rules[real_rate_dfii10] gold sleeve direction 정정"

  - hypothesis_id: contango_flip_value_trap   # ★ 코드 기존 보유 활용
    confirm_signal: "carry 양수 유지 + roll cost drag < 평균 (검증 DBC -3.6%/yr 기준)"
    reject_signal: "term_structure_slope > 0 (contango) 진입 + roll yield 음전환 + 6주 누적 roll cost drag > 2σ"
    emit_where: "주간 commodity_assumptions.carry_forward_slope → sign_flip 체크 + term_structure_slope 부호"
