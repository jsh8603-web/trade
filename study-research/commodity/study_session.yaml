# ============================================================================
# 블록4 WEIGHT_RULES — ★archetype pooling (부록 B) 적용. ticker 독립 학습 X
# modulate_by: regime/industry/size/name_specific
# composed_weights = w_global + δ_regime + δ_arch_by_type + δ_inter
# ============================================================================
weight_rules:
  - indicator_id: roll_yield
    base_weight: 0.20
    modulate_by: [regime, industry]
    direction: |
      Reflation/Overheat → roll_yield 가중 ↑ (carry premium 활성).
      Stagflation + contango_flip → 즉시 감액 → 0.05.
      ★Cushing 가동률 > 85% → 0 (storage_limit_nonlinearity flag, 2020-04 학습)
    granularity: industry   # archetype: energy / industrial / precious_non_gold / agri
    delta_regime_keys: [reflation, overheat, stagflation, risk_off]

  - indicator_id: bgr_basis_momentum_12m
    base_weight: 0.15
    modulate_by: [regime, industry]
    direction: |
      모든 regime 에서 신호 +1 = long 강화. 단 GHR conditioning_set (convenience_yield_z) 통제 후
      residual signal 만 weighting (redundancy 회피).
    granularity: industry

  - indicator_id: indpro_yoy   # ★검증된 핵심 driver
    base_weight: 0.15
    modulate_by: [industry]
    direction: |
      ★ industrial sleeve 에서 lag 12m forward 적용 (★ 검증 spearman 0.40).
      INDPRO YoY > +3% → industrial archetype +0.05.
      INDPRO YoY < -1% → industrial archetype -0.05, precious archetype +0.03.
    granularity: industry

  - indicator_id: convenience_yield_z
    base_weight: 0.10
    modulate_by: [regime, industry]
    direction: |
      industrial (Cu/Al) regime 가중 ↑ (수급 타이트 핵심).
      precious_non_gold 가중 ↓ (monetary driver 우세).
    granularity: industry

  - indicator_id: days_of_supply   # 명명 reflexive 회피
    base_weight: 0.10
    modulate_by: [regime, name_specific]
    direction: |
      oversupply_decoupling flag (commodity_assumptions 보유) 발생 시 가중 ↓ (평균회귀 무력화).
      정상 regime 평균회귀 베팅. 저장 한계 임계 (Cushing>85%) → tail flag (storage_limit_nonlinearity)
    granularity: ticker   # archetype pooling 으로 종목별 다름 (WTI vs Brent, Cu vs Al)

  - indicator_id: real_rate_dfii10
    base_weight: 0.10
    modulate_by: [industry]
    direction: |
      precious_non_gold sleeve: 가중 ↑, 부호 강제 음 (regime 의존 ★ 검증 -0.07 weak 단 sub-period 강해질 수)
      industrial/agri: 가중 보통. energy: 가중 ↓
    granularity: industry

  - indicator_id: dxy_index
    base_weight: 0.05
    modulate_by: [regime]
    direction: |
      risk-off (VIX>30) regime: 가중 ↑ (DXY 강세 → commodity 압박 증폭)
      평상시 보통
    granularity: sleeve

  - indicator_id: momentum_12_1
    base_weight: 0.05
    modulate_by: [regime]
    direction: |
      trending regime (vol 안정 + autocorr+): 가중 ↑
      mean-reverting regime (VIX>25): 가중 ↓
    granularity: sleeve

  - indicator_id: realized_vol_60d
    base_weight: 0.05
    modulate_by: [regime]
    direction: |
      risk-off → 가중 ↑ (vol scale 사이징). 부호 음 (고 vol = 보수)
    granularity: sleeve

  - indicator_id: cross_sector_mean_corr_60d   # ★H5 검증
    base_weight: 0.05
    modulate_by: [regime]
    direction: |
      ★검증된 financialization 가속 signal. mean_corr > 0.30 (2008 학습) → diversification 무효 가정
      → Risk Parity prior 재계산, vol weight ↑, 모든 sleeve corr ≈ 1 가정으로 사이징 보수.
      mean_corr < 0.15 → normal sleeve allocation
    granularity: sleeve

# ============================================================================
# 블록5 CONFIDENCE_HOOKS — flag 코드화 (★ 검증된 통계 → action threshold 정량)
# ============================================================================
confidence_hooks:
  - hypothesis_id: h5_financialization_high_vix   # ★ 검증 완료
    confirm_signal: "VIX > 30 후 mean cross-corr 60d > 0.30 (Tang-Xiong financialization 재현, 2008 학습)"
    reject_signal: "VIX > 30 후 cross-corr < 0.15 (financialization 해소)"
    emit_where: "주간 cron: 가격 → log return → 4-sleeve pairwise 60d rolling corr 평균 → VIX 매칭"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess + 신규 financialization_tracker"
    confidence_metric: "Beta(α,β) posterior — α: confirm count, β: reject count, 신뢰도 = α/(α+β)"
    store: "AssumptionRegistry + RulePerformance.financialization_regime"
    action_threshold: "신뢰도 > 0.75 → risk-off regime weight_rules diversification adjust ↓, vol weight ↑. 신뢰도 < 0.30 → 평상 BL"
    feeds_weight: "Σ_eff between-term 재계산 → derive_weights re-fit (route_lifecycle SECONDARY)"

  - hypothesis_id: h4_china_copper_lag12m   # structural prior (저신뢰) — validated alpha 미주장
    prior_tier: structural_low_confidence   # ★ main 감사 G/K축
    validated_alpha: false   # SE 보정 (Newey-West/block-bootstrap) + lag-selection deflation = 후속 라운드
    confirm_signal: "INDPRO YoY > +3% (또는 Caixin > 52 Phase 1.5) 후 12m forward copper return > 0 (관찰 spearman 0.40 latest-vintage)"
    reject_signal: "확장 regime 12m forward copper return < 0 (Welch t-test 2y rolling p > 0.10 6m 지속)"
    emit_where: "월말 cron: INDPRO YoY 갱신 → copper future return tracking (12m forward)"
    accumulate_in: "core/assume/weight_falsification.evaluate_weight_card + 신규 commodity_confidence_tracker.china_demand_signal"
    confidence_metric: "e-value anytime-valid (Ramdas SAVI), e_t 누적"
    store: "AssumptionRegistry.RulePerformance + WeightAssumptionCard.confidence_now"
    action_threshold: "e-value > 20 → copper base_weight × 1.15, delta_regime[expansion] += 0.05. e-value < 0.05 → 0.8, RETIRE 후보. ★structural prior tier 이므로 sizing alpha 주장 금지, 보수적 조정만"
    feeds_weight: "weight_rules[indpro_yoy].base_weight 미세조정 + composed_weights.delta_regime[expansion]"

  - hypothesis_id: h4b_china_credit_impulse_lead   # ★누락지표 (M3 실검증 2026-05-31) — structural_low_confidence
    prior_tier: structural_low_confidence
    validated_alpha: false   # ★실검증 18 test Bonferroni/HAC/FDR 0 생존. 방향성 약 prior 만
    confirm_signal: "China credit impulse(BIS credit-to-GDP 4q diff) +1σ 후 4-6분기 copper return > 0 (관찰 ρ+0.14~0.18)"
    reject_signal: "credit impulse +1σ 후 6분기 forward copper return < 0 6m 지속 (Welch t-test p>0.10)"
    emit_where: "분기 cron: BIS WS_TC China credit-to-GDP 갱신 → 4q diff impulse → copper forward tracking"
    accumulate_in: "신규 commodity_confidence_tracker.china_credit_impulse_signal"
    confidence_metric: "e-value anytime-valid (small-N, 비유의 출발)"
    store: "registry + RulePerformance"
    action_threshold: "★validated alpha 아님 — sizing alpha 주장 금지. e-value>20 + ★TSF 재검증 통과 시에만 structural→validated 승격. 그 전엔 INDPRO conditioning 보강용만"
    feeds_weight: "weight_rules[indpro_yoy] 보강 conditioning (독립 weight 아님). TSF 재검증 falsifier 후 재평가"
    affects_indicator: indpro_yoy   # ★감사 보강(§4.5 죽은 hook 방지): flag 누적이 indpro conditioning tilt 로 전달
    affects_edge: [china_credit_impulse_z, momentum_12_1]   # corr_prior 약화 대상 edge 명시
    falsifier: "TSF(사회융자) flow/GDP 실데이터 확보 시 재측정 — BIS stock proxy 한계 해소. HAC p<0.05 미달이면 freeze 유지"

  - hypothesis_id: h7_oil_macro_NOI_threshold_10pct   # ★ 검증 완료 (threshold 10% 정정)
    confirm_signal: "WTI 1yr NOI > ★10% 후 12m forward CFNAI mean < -0.30 (검증 기반: 평균 -0.46)"
    reject_signal: "NOI > 10% 후 12m forward CFNAI > 0 유지 (음효과 부재)"
    emit_where: "월말 cron: WTI 가격 → NOI 계산 → CFNAI lag tracking"
    accumulate_in: "신규 commodity_confidence_tracker.noi_recession_flag"
    confidence_metric: "Beta posterior + threshold-conditional mean shift test"
    store: "registry + RulePerformance"
    action_threshold: |
      NOI > 10% 진입 시 risk-on commodity 가중 ↓ 15%, precious_non_gold 가중 ↑ 10%.
      NOI > 15% 진입 시 weight_rules entire sleeve risk_off mode (energy → 0.5x, precious → 1.3x)
    feeds_weight: "weight_rules[roll_yield, momentum_12_1].base_weight regime trigger"

  - hypothesis_id: h1_ref_gold_real_rate_weak   # ★ 검증된 weak partial-corr (-0.07 mean)
