# ============================================================================
# 블록4: WEIGHT_RULES (★실측 IC 기반 재calibrate, v1 합성 시뮬값 폐기)
# ★base_weight = 실측 effect size 비례 (v1 prior 의 1/2 ~ 1/3 수준)
# ============================================================================
weight_rules:
  # --- §6 코어셋 (실측 기반 재calibrate) ---
  - {indicator_id: fwd_ep, base_weight: 0.10, modulate_by: [regime, industry],
     direction: "실측 미수행 — base 보수적 유지. EDGAR 펀더멘털 적재 후 재calibrate", granularity: industry}

  - {indicator_id: roe_margin_trend, base_weight: 0.10, modulate_by: [regime, industry],
     direction: "실측 미수행 (H4 원안 deferred). 종목 단위 ROE/FCF/D/E 데이터 부재. EDGAR 적재 prerequisite", granularity: industry}

  - {indicator_id: price_mom_12_1, base_weight: 0.04, modulate_by: [regime],
     direction: "방어주 mean-reversion 우위 — base 매우 낮음 (v1 0.06 → v2 0.04)", granularity: sleeve}

  - {indicator_id: rate_beta, base_weight: 0.10, modulate_by: [regime, industry, name_specific],
     direction: "★실측 H1 anchor: XLU partial IC=-0.167 / XLF +0.129. 시장 베타 흡수 후 effect size 합성 prior 의 1/3. industry 부호 분기 (utility/staples NEG / banks POS). rolling sign-flip 25~43% 모니터",
     granularity: ticker}

  - {indicator_id: dollar_beta, base_weight: 0.08, modulate_by: [regime, industry],
     direction: "★M3 실측: rate-regime conditional. rate-up XLU β_dxy=+0.57 (방어 강노출) / rate-down -0.18 (방어 면역). XLF rate-regime 무관 +0.15 안정",
     granularity: industry}

  - {indicator_id: credit_beta, base_weight: 0.06, modulate_by: [regime, industry],
     direction: "★실측: industry-level 부호 분기. XLF partial IC=-0.166 (banks penalty in risk-off) / defensive +0.09 (residual 회복력). v1 0.12 → v2 0.06 (H3 reversed 결과 반영)",
     granularity: industry}

  - {indicator_id: realized_vol, base_weight: 0.06, modulate_by: [regime],
     direction: "방어주 저변동 특성, 실측 검증 미수행", granularity: sleeve}

  # --- 금융 특화 ---
  - {indicator_id: yield_curve_slope_beta, base_weight: 0.08, modulate_by: [regime, industry],
     direction: "★실측: contemporaneous IC=+0.171 p=0.002 (n=317 월). Stigum lag X. XLF banks 한정 contemporaneous 양. v1 0.10 → v2 0.08 (실측 effect size)",
     granularity: industry}

  - {indicator_id: pb_ratio, base_weight: 0.06, modulate_by: [industry],
     direction: "은행/보험 valuation 표준 — 실측 미수행", granularity: industry}

# ============================================================================
# 블록5: CONFIDENCE_HOOKS (★실측 confirm/reject 조건 — 자문 prior 대신 실측 anchor)
# ★실측 baseline 명시: confirm = 실측 IC 부호 유지 / reject = 부호 반전 또는 무효
# ============================================================================
confidence_hooks:
  - hypothesis_id: real_rate_dichotomy_h1
    confirm_signal: "rolling 60M partial IC(ΔDFII10, XLU_ret | SPY) < -0.10 AND partial IC(XLF) > +0.07 (60% 기간 유지)"
    reject_signal: "rolling partial IC 부호 반전 (XLU > 0 또는 XLF < 0) 12M 지속 OR sign-flip rate > 50%"
    emit_where: "raw/run_validation.py rolling 60D rate beta 시계열 + score_ic_breakdown_eprocess regime=rate_shock"
    accumulate_in: "weight_falsification.score_ic_breakdown_eprocess + Ω drift (omega_drift Frobenius)"
    confidence_metric: "Spearman partial IC e-process anytime-valid (Ville P(거짓kill) ≤ alpha=0.05)"
    store: "WeightAssumptionCard.confidence_now (sub_key=rate_dichotomy) + RulePerformance"
    action_threshold: "e-value ≥ 20 (1/alpha) → rate_beta base 0.10 유지. reject → base 0.05 강등 + lens.estimation_note IRA capex 중화 문구 추가"
    feeds_weight: "rate_beta delta_arch_by_type 의 banks (+0.13 anchor) / util (-0.17) 강도 동적 조정"

  - hypothesis_id: slope_xlf_contemporaneous_h2_redefined
    confirm_signal: "월별 contemporaneous IC(Δslope, XLF_excess) > +0.10 + p<0.10 (rolling 60M 유지)"
    reject_signal: "contemporaneous IC 무유의 (p>0.20) 24M 지속 OR Stigum lag 3-6M 부활 (IC>+0.10 at k=3~6)"
    emit_where: "월별 lag-scan 분기 재실행 (run_validation.py H2 block)"
    accumulate_in: "weight_falsification.score_ic_breakdown_eprocess (regime=slope_signal)"
    confidence_metric: "contemporaneous IC vs prior lag 3-6M IC 비교 시계열"
    store: "registry yield_curve_slope_beta confidence_now"
    action_threshold: "lag=0 IC 지속 → yield_curve_slope_beta base 0.08 유지 / 부활 시 lag=4M 모델 도입 검토"
    feeds_weight: "yield_curve_slope_beta delta_arch_by_type XLF banks 가중 조정"

  - hypothesis_id: hy_oas_sleeve_inversion_h3_reversed
    confirm_signal: "Credit Stress regime (HY OAS > p75) 시 sleeve excess < -0.5%/월 유지 (실측 -1.5%/월 baseline)"
    reject_signal: "Credit regime 시 sleeve excess > +0.5%/월 — 전통 BAB 방어 thesis 부활 신호"
    emit_where: "분기별 regime classifier + monthly excess return tracker (m3_macro_linkage.py)"
    accumulate_in: "weight_falsification.score_ic_breakdown_eprocess (regime=credit)"
    confidence_metric: "Bootstrap 10k t-test on Credit regime sleeve excess mean (현 anchor -1.5%/월 n=9)"
    store: "WeightAssumptionCard.confidence_now (regime=credit sub-key)"
    action_threshold: "현 실측 지속 → Credit regime 진입 시 sleeve 비중 축소 (자문 prior 반대). 부활 시 비중 복원"
