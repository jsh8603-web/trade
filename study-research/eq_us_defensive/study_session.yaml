  - {id: roe_margin_trend, family: quality, is_core: true, in_our_system: true,
     source_or_collector: "EDGAR edgar_provider 재무. 방어주 안정성 본질 (단 실측 미수행 — H4 원안 deferred)", transform: yoy, vintage_policy: point_in_time, lag: 1}
  - {id: earnings_revision_breadth, family: revision, is_core: true, in_our_system: false,
