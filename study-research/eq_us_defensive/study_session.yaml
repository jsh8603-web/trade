# ============================================================================
# ★보강 1 (D축): walk-forward backtest (10Y rolling threshold, lookahead 차단)
# ============================================================================
audit_enhancement_walkforward:
  script: raw/run_validation_v4_walkforward.py
  metrics: raw/validation-metrics-v4-walkforward.json
  method: "threshold_t = quantile_p75(history[t-120 : t]) — 매 month t 10Y rolling, .shift(1)"
  in_sample: "2010-01-31 ~ 2026-05-31 (n=197 mo, 16.4년)"
  oos_dropped: "pre-2010 (first 120mo rolling window 시작 이전)"
  regime_distribution:
    nfci_p75_wf: {n: 29, pct: 14.7}
    baa10y_p75_wf: {n: 24, pct: 12.2}
    intersection: 6
  # ★G축 보강 (main audit follow-up 2026-05-31): effective_n distinct crisis episodes
  effective_n_baa10y:
    distinct_crisis_episodes: 4  # ★실측 (gap<4mo 기준 consecutive months collapse)
    raw_stress_months: 24
    cluster_ratio: 6  # 24mo / 4 episodes = 평균 6mo/episode (autocorr cluster)
    episodes:
      - {epoch: 1, start: "2010-06", end: "2010-11", n_months: 3, label: "post-GFC after-shock"}
      - {epoch: 2, start: "2011-08", end: "2012-08", n_months: 11, label: "Eurozone sovereign crisis"}
      - {epoch: 3, start: "2015-09", end: "2016-03", n_months: 7, label: "oil crash + China devaluation"}
      - {epoch: 4, start: "2020-03", end: "2020-05", n_months: 3, label: "COVID-19 shock"}
    implication: |
      ★raw n=24 stress months 는 4 episodes 로 cluster — autocorr 무시 (rule §1.4) 시 표본 6배 overstate.
      BAA10Y FIN LOO p_max=0.051 (★거의 robust 단 경계성) = episode 의존 명시:
      특정 episode (예: 2011-12 Eurozone 11mo dominant) 제거 시 p 약화 가능성.
      효과적 statistical power = 4 episode 수준 (8 episodes/decade ≈ 1 cycle/decade 통상).
  results:
    direction_consistency: "★4/4 cell DEF_PURE ≥ FIN (방향 일관)"
    cross_sleeve_gap:
      nfci_p75_wf: {gap: +0.0045, welch_t: 0.463, welch_p: 0.6448}
      baa10y_p75_wf: {gap: +0.0154, welch_t: 1.637, welch_p: 0.1090}
    bonferroni_alpha_0125: "0/2 regime PASS (BAA10Y wf 가장 가까운 p=0.109)"
  tier_verdict: "structural prior TENTATIVE 유지 (방향 일관 단 magnitude 약)"
  # ★main audit follow-up 보강: promotion_pending 수정 (n→독립 episode)
  promotion_pending: |
    ★독립 stress episode 증가 (현 effective_n≈4 distinct episodes, multi-cycle wait) 시
    Bonferroni 1+ PASS 후 structural VALIDATED 승격 가능.
    이전 표현 "n 증가" = raw stress months 24 overstate — episode-aware 정정 (G축 보강).
    BAA10Y FIN LOO 0.051 경계성 = single episode (Eurozone 11mo dominant) 의존 가능성 명시.
  # ★D축 보강 (main audit follow-up 2026-05-31): NFCI vintage 정직 명시
  pit_status_one_liner: |
    ★NFCI walk-forward = quantile-window causal (rolling history[t-120:t-1]) 단 ★value 는
    current-revision 사용 (★value-vintage lookahead 잔존) — 진정한 PIT 미준수.
    BAA10Y primary = ★PIT-pure (Treasury yield, revision 거의 없음).
    NFCI ALFRED 진짜 PIT walk-forward (2011-05~ vintage 가용 범위) = ★todo 정직 유지.

