# 블록5: CONFIDENCE_HOOKS (★v3 — INSUFFICIENT/TENTATIVE 격하 + 재검증 조건 명시)
# ============================================================================
confidence_hooks:
  - hypothesis_id: real_rate_dichotomy_h1_contemporaneous_v3
    confirm_signal: "rolling 60M contemp partial IC(ΔDFII10, XLU_ret | SPY) < -0.10 AND
      partial IC(XLF) > +0.07 (60% 기간 유지)"
    reject_signal: "rolling contemp partial IC 부호 반전 (XLU > 0 또는 XLF < 0) 12M 지속 OR
      sign-flip rate > 50%"
    predictive_monitor: "★v3 NEW: rolling 60M forward 3M partial IC 가 |IC| > 0.05 + p<0.10
      등장 시 spec text 재정의 검토 (현 fwd3M FAILS REJECTED)"
    emit_where: "raw/run_validation.py rolling 60D rate beta + USE_FORWARD_3M=True forward 3M"
    accumulate_in: "weight_falsification.score_ic_breakdown_eprocess + Ω drift"
    confidence_metric: "contemp partial IC e-process (Ville) + fwd3M IC monitor 분리"
    store: "WeightAssumptionCard.confidence_now (sub_key=rate_dichotomy_contemp)"
    action_threshold: "e-value ≥ 20 → rate_beta base 0.08 유지. reject → base 0.04 강등 +
      lens.estimation_note IRA capex 중화 문구 추가"
    feeds_weight: "rate_beta delta_arch_by_type banks (+0.13) / util (-0.17) contemp 한정 anchor"

  - hypothesis_id: slope_xlf_contemporaneous_h2_redefined
    confirm_signal: "월별 contemporaneous IC(Δslope, XLF_excess) > +0.10 + p<0.10 (rolling 60M 유지)"
    reject_signal: "contemporaneous IC 무유의 (p>0.20) 24M 지속 OR Stigum lag 3-6M 부활"
    emit_where: "월별 lag-scan 분기 재실행 (run_validation.py H2 block)"
    accumulate_in: "weight_falsification.score_ic_breakdown_eprocess (regime=slope_signal)"
    confidence_metric: "contemporaneous IC vs prior lag 3-6M IC 비교 시계열"
    store: "registry yield_curve_slope_beta confidence_now"
    action_threshold: "lag=0 IC 지속 → yield_curve_slope_beta base 0.08 유지 / 부활 시 lag=4M 모델 도입"
    feeds_weight: "yield_curve_slope_beta delta_arch_by_type XLF banks 가중 조정"

  # ★v4 회복: NFCI/BAA10Y stress regime cross-check (v3 PENDING_ALFRED 해제)
  - hypothesis_id: credit_stress_sleeve_split_h3_v4
    status: TENTATIVE_DIRECTIONAL_CONFIRMED_방향  # 방향 일관 4/4, 통계 비유의
    confirm_signal: "rolling 60M: NFCI p75 또는 BAA10Y p75 stress regime 진입 시
      DEF_PURE excess > 0 AND FIN excess < 0 4/4 epoch 일관 유지 + Bonferroni 후 ≥1 PASS"
    reject_signal: "방향 반전: DEF_PURE excess < 0 OR FIN excess > 0 2개 이상 regime 등장"
    emit_where: "분기별 NFCI/BAA10Y p75 regime 재실측 (run_validation_v4.py H3 block)"
    accumulate_in: "weight_falsification.score_ic_breakdown_eprocess (regime=credit_stress_v4)
      — TENTATIVE 단계에서 e-process 약 가중 (방향 confirm + 통계 비유의 반영)"
    confidence_metric: "Block bootstrap (block=4mo) + Welch t-test + LOO p_max + Bonferroni m=4"
    store: "WeightAssumptionCard.confidence_now (regime=credit_stress_v4 sub-key)"
    action_threshold: "v4 anchor: NFCI p75 n=23 / BAA10Y p75 n=113. DEF_PURE/FIN gap > 0 유지
      → credit_beta base 0.07 유지. magnitude p<0.05 회복 시 base 0.10 승격"
    feeds_weight: "credit_beta base 0.07 + sleeve_grouping 분리 의무 (rule §1.6)"
    walk_forward_todo: "★main caveat (c) — full-historical p75 threshold lookahead. walk-forward
      (10Y rolling threshold) 분석 follow-up"

  - hypothesis_id: baa10y_credit_beta_industry_split_h4a_v4
    status: CONFIRMED_BONFERRONI  # ★n=6588 strong anchor
    confirm_signal: "rolling 24M partial IC(ΔBAA10Y, sector | SPY) — DEF_PURE > +0.04 AND XLF < -0.04
