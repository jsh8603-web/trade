    = sleeve 분리 정당성 ★실증 (단 통계 비유의).
  weighting_recommendation: |
    Stress regime 진입 시: defensive ↑ / financial ↓ (RELATIVE 가중, eq-weight 회피).
    Normal regime: factor exposure 균형 가능.

