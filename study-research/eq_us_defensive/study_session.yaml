study_id: eq_us_defensive
asset_scope: [equity.us]
as_of: "2026-05-30"
version: v2  # v1 합성 시뮬 기반 → v2 실측 calibration

# ============================================================================
# v2 재칼리브레이션 노트 (사용자 + main 지적 반영)
# v1 = 합성 240m seed 20260530 (raw/lens-hypothesis-quickcheck.txt) prior-consistent 시뮬 = 폐기 동등
# v2 = 실데이터 검증 (FRED + Yahoo, 2003-01~2026-05) — raw/run_validation.py + raw/m3_macro_linkage.py
#
# ★실측으로 발견된 핵심 결과:
#   H1 (Real Rate Dichotomy)     = ★CONFIRMED 강력 — XLU partial IC=-0.167 / XLF +0.129 (n=5844)
#   H2 (Yield Curve 3-6M NIM lag) = ★REJECTED — Stigum lag 실측 X, contemporaneous lag=0 만 강 (IC=+0.171 p=0.002)
#   H3 (HY OAS defensive outperform) = ★REVERSED — Credit regime 시 sleeve excess -1.5%/월 (BAB X)
#   H4a (Credit beta sub-sleeve)   = PARTIAL CONFIRMED — defensive +0.09 / XLF -0.166 (n=752, short window)
#   M3 (★Dollar 채널 rate-regime 부호 반전) = M1 가설 직접 확인
#
# 범위: 미국 방어주 + 금융주 통합 sleeve (사용자 task spec)
# 분류: XLP(Staples) · XLU(Utilities) · XLV(Healthcare) · XLF(Financials) · XLC mature
# intra-sleeve dispersion 최대 — industry archetype 강제 분해 (실측 H1·H4a 부호 분기 anchor)

# ============================================================================
# 블록1: LENS (정성 렌즈 — LLM 주입용. 실측 anchor 박제)
# ★가변: 블록5 flag 누적이 estimation_note·regime_reading·블록4 가중을 미세 변동
# ============================================================================
lens:
  pricing_principle: >
    미국 방어주+금융주 = 5 sub-archetype 통합 sleeve. P = M × E 동일 골격이지만 결정요인이
    sub-archetype 별 부호 반대라 한 카드로 합치면 신호 cancel. 실측 H1 partial IC sign-split
    (XLU -0.167 / XLF +0.129, n=5844 일) 가 archetype 분리 필요성의 정량 anchor.
    [Utility] EPS = Rate_Base × Allowed_ROE. duration 15~25Y, 채권 대체재. real rate 1순위 driver.
    [Staples] P = M(brand_equity) × E(Vol × Price × Margin). pricing power vs commodity input.
    듀레이션 10~15Y, EM 매출 비중에 따라 DXY 노출.
    [Healthcare] sub 4종 (pharma/biotech/device/HMO) macro 민감도 극명 — pharma 만 IRA 영향.
    [Bank] V = BV + Σ(ROE-COE)·BV/(1+COE)^t. duration 5~8Y. NIM 의 leading=slope (단 실측 lag=0).
    [Insurance] Embedded Value, life duration 30Y+ (★reinvestment risk = 은행 NIM 보다 훨씬 장기).
  report_relations:
    - "★실측: 일별 ΔDFII10 → XLU partial IC=-0.167 / XLF +0.129 (p<0.0001, n=5844 일). Ilmanen bond proxy + Boyd-Gertler 학술 anchor 강력 지지"
    - "★실측: Δslope(DGS10-DGS2) → XLF excess return contemporaneous IC=+0.171 (p=0.002, n=317 월). Stigum 의 3-6M lag *실데이터 미관측* (시장 효율성). lag=0 만 유의"
    - "★실측 REVERSED: HY OAS > p75 (Credit Stress regime n=9) 시 본 sleeve excess -1.5%/월 (Bootstrap p=0.005). financials 제외해도 def_only -1.96%/월. Frazzini-Pedersen BAB 가 modern QE 시대 본 sleeve 에서 X"
    - "★실측: ΔHY OAS → XLF partial IC=-0.166 (banks provisioning channel 시장 베타 초과) / defensive partial IC mean +0.09 (시장 베타 흡수 후 residual 회복력, n=752)"
    - "★M3 발견: rate-up regime (E3 2023Q3) 에 방어 sleeve dollar loading β_dxy +0.21~+0.66 폭증 / rate-down regime (E4) -0.01~-0.18 부호 반전. M1 'dollar 채널 rate-up 2배' 직접 확인"
    - "XLF (banks) β_dxy rate-regime 무관 +0.15~+0.20 일관 — 다국적 결제·자산운용 채널 안정"
    - "within-sleeve corr 0.556 vs 방어~SPY corr 0.732 → 본 sleeve 내부는 equity common factor (market beta) dominant. M4 거시 named factor 는 sub-archetype 부호 분기로만 의미"
  regime_reading: >
    Reflation/Recovery: 방어 underperform (현 E4 pivot 시기 sleeve-SPY -0.78%/월 실측).
    Slowdown/Stagflation: ★자문 prior (방어 lead) 가 실측 X — Credit Stress regime 시 sleeve
    -1.5%/월 underperform. financials 제외해도 def_only -1.96%/월. 본 sleeve 의 *방어 alpha
    실증 X*. modern QE 시대 패턴 + XLF 비중이 GFC 등에서 큰 underperform 유발 가능성.
    → sleeve 비중 *축소* 가 risk-off 권고 (자문 prior 반대).
    단 sub-archetype 별 분기: XLF 가 가장 큰 negative (provisioning channel), defensive 는
    시장 베타 흡수 후 residual POS. 즉 *상대* 가중은 defensive ↑ / financial ↓.
  estimation_note: >
    2026-05 추정 (실측 anchor): 현 E4 pivot·인하 시기. 본 sleeve sleeve-SPY -0.78%/월
    underperform 추세 지속. rate-down 시 방어 dollar loading 음수 (η_dxy XLU -0.18 / XLP -0.14)
    → 강달러는 본 sleeve 에 *부정적*. credit cycle 안정 시 XLF 가중 유지 가능.
    ★실측 anchor 가 hook update 의 1순위 검증 대상:
    (a) H1 sign split 부호 안정성 (rolling 60D sign-flip 25~43% — sub-sleeve 별 차이 모니터)
    (b) H3 reversed 결과의 지속성 (Credit regime sample 증가 시 재검증)
    (c) M3 dollar 채널 rate-regime 부호 반전의 안정성 (E3 vs E4 비교 표본 증가)

# ============================================================================
# 블록2: INDICATORS (정량 지표 — 우리 시스템 자료로 귀결)
# §6 주식 통일 하드룰 코어셋 10종 = is_core:true (us/kr/intl/reit 비교가능성)
# ★실측 검증 완료: rate_beta (H1) / credit_beta (H4a) — base_weight·prior_strength 실측 IC 비례
# ============================================================================
indicators:
  # --- §6 코어셋 (통일 하드룰) — cyclical 방과 동일 id ---
