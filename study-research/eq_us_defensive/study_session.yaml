  - {id: dollar_beta, family: macro_sensitivity, is_core: true, in_our_system: false,
     source_or_collector: "★M3 실측: rate-up regime XLU β_dxy=+0.57 / rate-down -0.18 — rate-regime conditional 필수", transform: level, vintage_policy: point_in_time, lag: 0}
  - {id: oil_beta, family: macro_sensitivity, is_core: true, in_our_system: true,
     source_or_collector: "종목수익률 vs WTI 회귀. 본 검증 미수행 (블록6 추가 요청)", transform: level, vintage_policy: point_in_time, lag: 0}
  - {id: credit_beta, family: macro_sensitivity, is_core: true, in_our_system: true,
     source_or_collector: "★실측 anchor: 일별 ΔHY OAS partial IC|SPY. XLU=+0.076 / XLP=+0.105 / XLV=+0.091 / XLF=-0.166 / XLC=+0.005 (n=752, short window). industry-level 부호 분기 명확", transform: level, vintage_policy: point_in_time, lag: 0}
