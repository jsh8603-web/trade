# ============================================================================
# 블록1: LENS (정성 렌즈 — ★v3 격하 hedge 적용)
# ============================================================================
lens:
  pricing_principle: >
    미국 방어주+금융주 = 5 sub-archetype 통합 sleeve. P = M × E 동일 골격이지만 결정요인이
    sub-archetype 별 부호 반대라 한 카드로 합치면 신호 cancel. ★v3 격하: 실측 H1 contemp
    partial IC sign-split (XLU -0.167 / XLF +0.129, n=5844 일) 가 archetype 분리 필요성의
    정량 anchor — 단 contemp 한정, predictive fwd3M FAILS (spec text 직접 매칭 실패).
    [Utility] EPS = Rate_Base × Allowed_ROE. duration 15~25Y, 채권 대체재. real rate 1순위 driver.
    [Staples] P = M(brand_equity) × E(Vol × Price × Margin). pricing power vs commodity input.
    듀레이션 10~15Y, EM 매출 비중에 따라 DXY 노출.
    [Healthcare] sub 4종 (pharma/biotech/device/HMO) macro 민감도 극명 — pharma 만 IRA 영향.
    [Bank] V = BV + Σ(ROE-COE)·BV/(1+COE)^t. duration 5~8Y. NIM 의 leading=slope (단 실측 lag=0).
    [Insurance] Embedded Value, life duration 30Y+ (★reinvestment risk = 은행 NIM 보다 훨씬 장기).
  report_relations:
    - "★v3 hedge: 일별 ΔDFII10 → XLU contemp partial IC=-0.167 / XLF +0.129 (p<0.0001, n=5844 일).
       Ilmanen bond proxy + Boyd-Gertler 학술 anchor 지지. ★lag_routing=contemporaneous 한정 —
       predictive fwd3M FAILS (rule §2 REJECTED, spec text 원안 무효)"
    - "실측: Δslope(DGS10-DGS2) → XLF excess return contemporaneous IC=+0.171 (p=0.002, n=317 월).
       Stigum 의 3-6M lag 실데이터 미관측 (시장 효율성). lag=0 만 유의"
    - "★v3 INSUFFICIENT: HY OAS > p75 Credit Stress regime n=9 (rule §1.2 <10) sleeve excess
       raw mean -1.5%/월 (Bootstrap p=0.005, ★IID autocorr 무시). LOO 5/9 시 p>0.05 붕괴.
       단일 cycle 표본 (2023-2024, 8mo 연속). REVERSED 단정 철회 — ALFRED HY OAS full historical
       fetch (2000-01~) 후 재검증 필수"
    - "실측: ΔHY OAS → XLF partial IC=-0.166 / defensive partial IC mean +0.09 (n=752 short
       window). banks provisioning channel 시장 베타 초과 잔여 — industry 부호 분기 anchor"
    - "★v3 TENTATIVE DIRECTIONAL (rule §2): rate-up regime (E3 2023Q3) 방어 sleeve dollar
       loading β_dxy +0.21~+0.66 vs rate-down regime (E4) -0.01~-0.18. 단 Welch z=1.34
       p_diff=0.18 비유의, Bonferroni α/4=0.0125 후 0/4 sector PASS. M1 '강력 확인 / 2배'
       단정 철회 — 방향성 약 prior 한정"
    - "XLF (banks) β_dxy rate-regime 무관 +0.15~+0.20 일관 — 다국적 결제·자산운용 채널 안정"
    - "within-sleeve corr 0.556 vs 방어~SPY corr 0.732 → 본 sleeve 내부는 equity common
       factor (market beta) dominant. M4 거시 named factor 는 sub-archetype 부호 분기로만 의미"
  regime_reading: >
    Reflation/Recovery: 방어 underperform (현 E4 pivot 시기 sleeve-SPY -0.78%/월 실측, n=32mo).
    Slowdown/Stagflation: ★v3 INSUFFICIENT — Credit Stress regime n=9 (rule §1.2 <10) 단일
    cycle (2023-2024) 라 BAB defensive thesis 의 confirm/reject 모두 본 데이터로 판정불가.
    자문 BAB prior 의 REVERSED 단정 철회. ALFRED HY OAS full historical (2008 GFC + 2020
