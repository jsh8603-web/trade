# 블록4: WEIGHT_RULES (★최종 산출. gold=단일 sleeve → granularity:sleeve. 종목 단위 없음)
# ───────────────────────────────────────────────────────────────────────────
weight_rules:
  - {indicator_id: real_rate_10y, base_weight: 0.35, modulate_by: [regime],
     direction: "real-rate 하락 국면(완화/Stagflation)→real_rate beta 가중↑. ★cb_demand decoupling regime 감지 시 가중↓(전통모델 신뢰도 하락)", granularity: sleeve}
  - {indicator_id: dollar_index, base_weight: 0.20, modulate_by: [regime],
     direction: "달러 약세 사이클→가중↑. Fed 완화 + 쌍둥이적자 확대 국면에서 real_rate 와 동조 강화", granularity: sleeve}
  - {indicator_id: credit_spread_hy_oas, base_weight: 0.12, modulate_by: [regime],
     direction: "리스크오프/Stagflation 국면→safe-haven 가중↑. 단 유동성위기 초기 부호불안정 → flag 로 down-weight", granularity: sleeve}
  - {indicator_id: breakeven_10y, base_weight: 0.10, modulate_by: [regime],
     direction: "Overheat/Stagflation 인플레 국면→인플레헤지 가중↑. Recovery 에선 명목금리 상쇄로 가중↓", granularity: sleeve}
  - {indicator_id: cb_demand_proxy, base_weight: 0.15, modulate_by: [regime],
     direction: "real-rate decoupling regime(잔차 양 지속)→구조수요 가중↑. 전통 driver 가 설명 못 하는 랠리 보정", granularity: sleeve}
  - {indicator_id: gold_mom_12_1, base_weight: 0.08, modulate_by: [regime],
     direction: "추세지속 국면→모멘텀 보조가중. cap 낮게(반사성 위험) — 가격기반이라 is_core=false 준해 약가중", granularity: sleeve}

# ───────────────────────────────────────────────────────────────────────────
# 블록5: CONFIDENCE_HOOKS (★매 거래 확신/거부 flag→신뢰도 누적→렌즈·가중치 미세변동. affects_indicator=G6 tilt 연결)
# ───────────────────────────────────────────────────────────────────────────
confidence_hooks:
  - hypothesis_id: real_rate_beta_holds
    affects_indicator: real_rate_10y
    confirm_signal: "real_rate 하락 시 금 매수 outcome 의 OOS Rank-IC 양(+) 유지 — 전통 anti-real-rate 가설 성립"
    reject_signal: "real_rate↔금 합성 score Rank-IC e-CUSUM 단측 붕괴 — 임계: rolling 252d Pearson 의 부호반전(≥0) 또는 절댓값 0.10 미만 일수 비율 직전 16y 베이스라인(3.1%) 의 3배 초과(★실측 historic 음전환 0회·median -0.349 기준)"
    emit_where: "backtest engine SELL outcome + 라이브 judge 사후평가(FlagRouter.on_trade)"
    accumulate_in: "core/assume/weight_falsification.score_ic_breakdown_eprocess → core/study/flag_router.FlagRouter.emit_from_ic"
    confidence_metric: "e-value anytime-valid(eprocess_backbone.e_cusum) + FlagAccumulator Beta(α,β) posterior"
    store: "FlagRouter FlagAccumulator(confidence) + registry 카드 confidence_now(weight.gold.{regime})"
    action_threshold: "e-value>1/alpha(=20) → real_rate 가중 강화 / 붕괴 → real_rate 가중↓ + cb_demand 로 질량 이전(SECONDARY refit, kill 아님)"
    feeds_weight: "FlagRouter.tilt_weights(base_weight, series_ids) → study_register._build_card 재적합 → derive_weights"
  - hypothesis_id: cb_demand_regime
    affects_indicator: cb_demand_proxy
    confirm_signal: "★*레벨* 회귀(ln_gold ~ a + b*real_rate + c*ln_dollar) 잔차 추세성분이 cb_demand_proxy 누적순매수와 양의 상관 지속 = level-shift regime 실재(변화율 단위 decoupling 미관측, 16y 안정 — 본 anchor 는 *수준* 잔차에서만 작동)"
    reject_signal: "중앙은행 순매수 둔화 후 잔차 설명력 소멸 → cb_demand 가중 회수, real_rate 로 복귀"
    emit_where: "backtest outcome 배치 + 분기 WGC 데이터 갱신 시 judge 사후평가"
    accumulate_in: "core/study/flag_router.FlagRouter.emit_from_ic(cb_demand_regime)"
    confidence_metric: "e-value 누적 + 잔차-cb 부분상관 anytime-valid"
    store: "FlagRouter FlagAccumulator + registry confidence_now"
    action_threshold: "확신↑ → cb_demand 가중↑ & estimation_note 의 decoupling anchor 강화 / 거부 → real_rate beta 복원"
    feeds_weight: "tilt_weights → cb_demand_proxy 동적 가중 + lens.estimation_note 갱신 경로"
  - hypothesis_id: safe_haven_holds
    affects_indicator: credit_spread_hy_oas
    confirm_signal: "리스크오프(HY OAS 확대) 시 금 방어 outcome Rank-IC 양 — safe-haven 채널 성립"
    reject_signal: "유동성위기 동반매도로 HY OAS↔금 Rank-IC 음전환/붕괴 → safe-haven 가정 부분기각"
    emit_where: "backtest SELL outcome(위기 구간) + 라이브 judge"
    accumulate_in: "core/study/flag_router.FlagRouter.emit_from_ic(safe_haven_holds)"
    confidence_metric: "e-value anytime-valid(단측 붕괴)"
    store: "FlagRouter FlagAccumulator + registry confidence_now"
    action_threshold: "붕괴 → credit_spread_hy_oas 가중↓(위기초기 band 보수) / 유지 → safe-haven 가중 유지"
    feeds_weight: "tilt_weights → credit_spread_hy_oas 가중 변조"

