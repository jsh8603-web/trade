# 블록1: LENS (정성 렌즈 — judge LLM 주입용. ★가변: 블록5 flag→신뢰도→lens·블록4 가중치 미세변동)
# ════════════════════════════════════════════════════════════════════════════
lens:
  pricing_principle: >
    금은 cashflow·coupon·dividend 부재 → 내재가치 평가 불가. 가격 = *보유 기회비용* + *대체 화폐 수요*.
    핵심 방정식: ΔlnGold ≈ -β_r·Δ(real_rate) - β_$·Δ(ln_dollar) + β_c·(risk_off) + β_i·Δ(breakeven)
                          + structural(cb_demand · GPR · de-dollarization).
    실질금리 (= nominal − breakeven_expected_inflation) 음수일수록·하락할수록 무수익자산 금 상대매력↑.
    ★H4 압도적 기각 (실측 std β_rate=-0.274 vs sys [-0.5, -0.8]) = sys_priors gold loading 재보정 필수
    (G6 게이트 사안). numeraire trap 정량 확인 (gold/USD → gold/SDR β_dollar 감쇠 +66.8%).
    - "★H2 PARTIAL (v3 격하): unexplained ln_gold trend +39%→+391% 의 descriptive 관찰은 유지. 단 'STRONGLY SUPPORTED' = json coint_support=false + Johansen rank=0 자체 모순 over-claim 격하. cointegration 부재로 균형식 재구성 단정 X — descriptive trend only"
    - "★H8 SUPPORTED 취소 (v3 격하): dual e-process 의 e_level 기반 ln_gold~real+ln$ level 회귀가 3변수 I(1) + 잔차 ADF p=0.845 + DW=0.002 = ★spurious OOS 외삽. τ change-point (2022-02-21/2025-12-30) 수치 재현되나 'LEVEL > Δ-beta 위계' 해석 ill-posed. 'cointegration 기각·재정식화 필요' 라벨, return/diff 단위 재정식화 후 재검증 의무"
    - "H1 SUPPORTED: 변화율 β 안정 (sign-flip 1.86%, QLR sup-F=15.26 임박 cv5%=16.45). 일별 변화 단위에서 decoupling 미관측 — *수준* 단위에서만 발현"
    - "H4 ★압도적 기각 + numeraire trap: 일별 std β_rate=-0.274 < 0.40, β_dollar gold_USD=-0.289 → gold_SDR=-0.10 (+66.8% 감쇠, 자문 30~50% 상회)"
    - "H7 SUPPORTED: γ-분해 = rolling 504d EG ADF pre-2022 -3.11 → post-2022 -2.26 (γ 점진 붕괴, H2 정합) + GPR quantile q90/OLS=5.91× tail amplified (gap 10.76σ)"
    - "H6 SUPPORTED: BE common-cause = gold-BE partial=-0.054 (real_rate 조건화 후), basis B (nominal+real+BE) VIF 1.04→12996 = 항등식 게이트 1만배 발산 정량 확인"
    - "H3 PARTIAL: cb_demand level 운반 = WGC annual 누적 CB ↔ unexplained ln_gold +0.784 (n=15 power 한계, quarterly main collector 대기)"
    - "H5 TENTATIVE DIRECTIONAL: BAA10Y/VIX 일별 Baur-Lucey threshold = Bonferroni α/8=0.00625 비유의, Markov crisis state 시 gold 평균 return ★음수 (panic sell 동조). HY OAS full history (1996~) 대기"
  regime_reading: >
    Investment Clock 기준 금 = Reflation:up / Recovery:down / Overheat:up / Stagflation:up.
    본질 키 = *실질금리 regime* (real_rate 하락=강 / 상승=약). Stagflation (성장↓ 인플레↑) =
    real_rate 압착 + 위기프리미엄 = 금 최강. Recovery (성장↑ real_rate↑ 위험선호) = 금 약.
    ★2022-2026 = real_rate 상승에도 금 신고가. 실측 = ★(a) 변화율 β 안정 (H1 SUPPORTED) +
    (b) level intercept shift (H2 STRONGLY SUPPORTED) + (c) dual e-process level mechanism 우선
    (H8 SUPPORTED). cb_demand regime 이 *수준* anchor 만 끌어올려 전통 모델 잔차를 양으로 박은 것.
    regime 키에 "cb_demand_regime" + "real_rate_decoupling_monitor" 보조축 ★필요 (main 지시).
  estimation_note: >
    실데이터 (2010-01-04 ~ 2026-05-29, n=4279일, FRED DFII10/T10YIE/DTWEXBGS + Yahoo GLD):
    real_rate↔gold 일별 변화 Pearson 전체 ≈ -0.32, pre-2020 -0.31, 2022-26 -0.30 (사실상 불변).
    rolling 252d 부호반전 0회 (sign-flip 1.86%, median -0.349). dollar↔gold -0.31→-0.38.
    BE↔gold direct +0.04 (real_rate 조건화 후 partial -0.054, H6 SUPPORTED). ★결론 (8 가설 종합):
    "2022-2026 사상최고 랠리" = EM 중앙은행 매수·지정학·탈달러 구조수요가 *level intercept* 를
    끌어올린 *수준* shift 이지, 베타 약화가 아니다. H8 ordering 으로 level mechanism 우선 정량 확인.
    ★sys_priors gold loading [-0.5 rate, -0.8 dollar, 0 oil, -0.2 credit] = H4 압도 기각 → 실측
    기반 재보정 의무 (main G6 게이트). 본 lens 는 ★G6 재보정 + WGC quarterly + HY OAS full history
    적재 시점에 큰 폭 갱신될 것 (블록5 hook 라이브 갱신 경로).

