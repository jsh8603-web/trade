study_id: gold
asset_scope: [gold]          # study_register._domain_of → "commodity" 도메인. regime_to_weights 에 이미 sleeve 존재(SLEEVE_BLOC[gold]=USD, BASE_WEIGHTS 0.08)
as_of: "2026-05-30"

# ───────────────────────────────────────────────────────────────────────────
# 블록1: LENS (정성 렌즈 — judge LLM 주입용. ★가변: 블록5 flag→신뢰도→이 필드+블록4 가중치 미세변동)
# ───────────────────────────────────────────────────────────────────────────
lens:
  pricing_principle: >
    금은 현금흐름·쿠폰·배당이 없는 자산 → 내재가치 평가 불가. 가격은 *보유 기회비용*과 *대체 화폐
    수요*로 결정된다. 핵심 방정식: ΔlnGold ≈ -β_r·Δ(실질금리) - β_$·Δ(달러) + β_c·(리스크오프)
    + β_i·Δ(기대인플레, 단 명목금리 동반상승분 상쇄) + structural(중앙은행·탈달러 수요).
    실질금리(=명목 - 기대인플레)가 음수일수록·하락할수록 무수익 자산 금의 상대매력↑. = "anti-real-rate
    bond." 우리 시스템 system_priors.py 의 gold factor loading [-0.5 rate, -0.8 dollar, 0.0 oil,
    -0.2 credit] 이 이 노출구조의 실증 추정치(rate·dollar 음, oil 무관, credit 음=safe-haven).
  report_relations:
    - "실질금리(10Y TIPS=DFII10) ↔ 금: 강한 음. 단일 최강 driver (보유 기회비용). 명목금리 단독 아님 — real rate"
    - "달러지수(DXY/DTWEXBGS) ↔ 금: 음. 금은 USD 표시 → 달러 강세 시 타통화 구매력↓. rate 와 공통(Fed)으로 얽혀 partial-corr 필요"
    - "기대인플레(breakeven T10YIE) ↔ 금: 양(인플레 헤지). 단 명목금리 동반상승하면 real rate 로 상쇄 → 純효과는 real rate 가 흡수(common_cause)"
    - "HY OAS/리스크오프 ↔ 금: 양(safe-haven). 단 유동성위기 초기엔 금도 현금화 동반매도 후 반등 → 부호 국면의존(undetermined)"
    - "중앙은행 순매수·탈달러·ETF 플로우 ↔ 금: 구조적 수요. 일별 변화율 베타는 16y 안정(real-gold 상관 pre2020 -0.310 vs 2022-26 -0.304, 거의 동일)이나 *level intercept shift* (real rate 상승에도 금 신고가) 가 cb_demand 의 실제 자취"
  regime_reading: >
    Investment Clock(regime_to_weights REGIME_DIRECTION) 기준 금 방향 — Reflation:up / Recovery:down
    / Overheat:up / Stagflation:up. 본질 키는 *실질금리 regime*: real rate 하락국면=금 강세,
    상승국면=약세. Stagflation(성장↓인플레↑)=실질금리 압착+위기프리미엄=금 최강. Recovery(성장↑
    실질금리↑위험선호)=금 약세. ★단 2022-2024 는 real rate 상승에도 금 신고가 — 실측은 **변화율 베타
    유지(decoup 구간 -0.304) + level intercept shift** 가 실체. 중앙은행수요 regime 이 *수준* anchor 만
    끌어올려 전통 모델 잔차를 양(+)으로 박은 것 — regime 키에 "cb_demand" 보조축 필요.
  estimation_note: >
    실데이터 대조(2010-01~2026-05, n=4279일, FRED DFII10/T10YIE/DTWEXBGS + GLD):
    real_rate↔gold 일별 변화 Pearson 전체 -0.318, pre2020 -0.310, 2022-26 -0.304 (사실상 불변).
    rolling 252d 부호반전 0회(median -0.349, max -0.009). dollar↔gold 도 -0.310→-0.377 로 오히려 강화.
    breakeven↔gold 직접 +0.04 로 매우 약함(common_cause 분해 가설 부합). ★결론: **변화율 단위에서
    decoupling 미관측** — "2024-2026 사상최고 랠리" 의 정체는 EM 중앙은행 매수·지정학·탈달러 구조수요가
    level intercept 를 끌어올린 *수준* shift 이지, 베타 약화가 아니다. 따라서 (a) real_rate 가중은
    기존 prior 유지, (b) cb_demand_proxy 신규 driver 로 *level residual* 의 추세 흡수, (c) sys_priors
    gold loading 절댓값(real=-0.5, dollar=-0.8) 은 일별 corr(-0.32/-0.33) 대비 ~2배 — production 단계
    factor-model 정합성 별도 검증. 확신도 中상 — 블록5 두 flag 가 OOS 로 이 결론을 끊임없이 갱신한다.

