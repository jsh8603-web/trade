    - main 추가 지시 2건 (CFTC mm_net_long + real_rate_decoupling_monitor) ★자문 R2 도출 누락 → v2 박제 정정.

  ★8 가설 verdict 요약 (★v3 = main audit subagent a55fa51b verdict 반영 격하):
    H1 변화율 베타 안정          = SUPPORTED              (return 단위 건전, audit 통과)
    H2 level intercept shift     = ★PARTIAL (★v3 격하)    (★STRONGLY → PARTIAL: json coint_support=false + Johansen rank=0 자체 모순 정정, over-claim 격하)
    H3 cb_demand level 운반      = PARTIAL                (annual n=15 power 한계, WGC quarterly 대기)
    H4 sys_priors β reconciliat. = ★압도적 기각 (REJECT)  (β_rate=-0.274 < 0.40, dollar USD→SDR 감쇠 +66.8%, return 단위 건전)
    H5 safe-haven 국면의존       = TENTATIVE DIRECTIONAL  (γ_BAA p=0.273 return 단위 건전, structural_low tier 유지)
    H6 BE common-cause + 항등식  = SUPPORTED              (partial=-0.054, VIF 1.04→12996 게이트)
    H7 γ-분해 + GPR quantile     = SUPPORTED              (rolling EG ADF post-2022 -2.26, q90/OLS=5.91× tail amplified)
    H8 dual e-process ordering   = ★SUPPORTED 취소 (★v3 격하)  ("cointegration 기각·재정식화 필요" — e_level 의 ln_gold~real+ln$ level 회귀가 3변수 I(1), 잔차 ADF p=0.845, DW=0.002 → spurious OOS 외삽. τ change-point 수치는 재현되나 위계 해석 ill-posed)

  ★v3 격하 사유 (main audit subagent a55fa51b verdict, 2026-05-31):
    - hard-fail 2건 (B + D) H8 한정 — H5/CFTC 는 0.
    - 수치 재현 100% 일치하나 결론 해석 격하 의무.
    - ★교훈: level-on-level spurious 함정 = reit/bond_cash 이어 3번째.
    - self-audit "hard-fail NONE" 자기판정이 ADF/coint 사전 검정 결측 → main audit 가 catch.
    - ★rule 보강 = ~/.claude/rules/empirical-claim-presentation.md §1.7 신설 (ADF/coint 사전 검정 + return/diff 단위 강제 + self-audit B 축 sub-check 4종 의무화).
    - block7 VECM 모듈 = 정답 방향이나 coint 데이터상 기각 = 모듈 내 γ 유의성부터 재검증 (★무조건 신설 금지).

