     conditioning_set: [real_rate_10y], lag_routing: contemporaneous, prior_sign: neg, prior_strength: 0.5,
     theory_basis: "금은 USD numeraire — 달러 강세=타통화 표시가격↑→수요↓. real_rate 조건화로 통화정책 공통원인 분리", force_include: true}
  - {node_a: breakeven_10y, node_b: gold_mom_12_1, edge_type: common_cause,
     conditioning_set: [real_rate_10y], lag_routing: contemporaneous, prior_sign: pos, prior_strength: 0.3,
     theory_basis: "명목금리=real+breakeven 항등식. breakeven↔금은 real_rate 로 매개 → real 조건화하면 직접엣지 약화(분해)", force_include: false}
  - {node_a: credit_spread_hy_oas, node_b: gold_mom_12_1, edge_type: undetermined,
     conditioning_set: [real_rate_10y], lag_routing: contemporaneous, prior_sign: pos, prior_strength: 0.25,
     theory_basis: "리스크오프 safe-haven(양)이나 유동성위기 초기 동반매도(음) — 국면의존 부호불안정 → undetermined", force_include: false}
  - {node_a: cb_demand_proxy, node_b: gold_mom_12_1, edge_type: direct,
     conditioning_set: [real_rate_10y, dollar_index], lag_routing: lagged, prior_sign: pos, prior_strength: 0.4,
     theory_basis: "중앙은행 구조수요 = real_rate/dollar 로 설명 안 되는 잔차의 driver(2022~ decoupling). 둘 조건화 후 잔차 엣지", force_include: false}

