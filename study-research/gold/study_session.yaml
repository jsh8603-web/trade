# 블록4: WEIGHT_RULES
# ★small-N + AUDIT-GUIDE §0 Provenance: base_weight = ★sign-only prior + magnitude freeze
# ★점추정 박제 금지 — H 검증 verdict 부호 prior 기반 보수 매핑만
# ════════════════════════════════════════════════════════════════════════════
weight_rules:
  trust_tier:
    label: structural_prior_with_validated_sign
    validated_alpha: false
    rationale: |
      ★H4 압도 기각 + sys_priors 재보정 필요 (G6) → base_weight magnitude 박제 ★금지.
      sign-only prior + regime-conditional modulation. Bonferroni α/8=0.00625 통과 cell = H2(p≈0) + H8(e>160).
      나머지 = wide CI 또는 freeze. live 적용 = sys_priors G6 재보정 + WGC quarterly + HY OAS full 선행 조건.

  formula_intent: "direction-aware sign prior 만, magnitude 미지지 (eq_us_cyclical v4 격하 패턴 적용)"
  magnitude_freeze_reason: |
    (a) H4 압도적 기각 → sys_priors [-0.5 rate, -0.8 dollar] 와 실측 -0.27/-0.29 충돌 = magnitude 재보정 의무 G6.
    (b) 본 study 8 가설 Bonferroni α/8=0.00625 통과 = 2/8 (H2 + H8). 나머지 multi-test 후 magnitude 단정 불가.
    (c) WGC quarterly + HY OAS full history 부재로 H3/H5 magnitude 검증 미완.

  rules:
    - indicator_id: real_rate_10y
      base_weight_sign: neg
      base_weight_magnitude: FREEZE
      modulate_by: [regime, decoupling_monitor]
      direction: |
        real_rate 하락 국면 (완화/Stagflation) → real_rate channel 가중 sign neg 강. ★단 decoupling_monitor 발동 시 (H2/H7/H8 결합) → real_rate channel 가중 *↓* (전통 모델 신뢰도 하락, cb_demand 로 질량 이전).
      granularity: sleeve
      verdict_anchor: "H1 SUPPORTED + H4 REJECT + H8 SUPPORTED"
    - indicator_id: dollar_index_broad_TWI
      base_weight_sign: neg
      base_weight_magnitude: FREEZE
      modulate_by: [regime, numeraire]
      direction: |
        달러 약세 사이클 → 가중 sign neg 강. ★numeraire trap 대응 — gold/USD denom 일관성 유지 시만 활성, SDR/non-USD basket 비교 의무 (G5 cross-currency 가드).
      granularity: sleeve
      verdict_anchor: "H4 REJECT + numeraire trap +66.8% 감쇠"
    - indicator_id: cb_demand_proxy
      base_weight_sign: pos
      base_weight_magnitude: FREEZE
      modulate_by: [regime, decoupling_monitor]
      direction: |
        ★decoupling regime (real_rate 채널 약화) → cb_demand 가중 ↑↑ (level anchor 운반). transitional regime → 점진. main collector WGC quarterly + Kalman 적재 후 magnitude 활성 path.
      granularity: sleeve
      verdict_anchor: "H3 PARTIAL (annual n=15 → quarterly 대기)"
    - indicator_id: gpr_daily
      base_weight_sign: pos
      base_weight_magnitude: FREEZE
      modulate_by: [regime, tail]
      direction: |
        ★tail-amplified (q90/OLS=5.91×) → 평균 channel 약 + tail channel 강. GPR q90 임계 돌파 시 가중 ↑↑. mean regime 시 보수 (OLS t=2.19 boundary).
      granularity: sleeve
      verdict_anchor: "H7 SUPPORTED"
    - indicator_id: breakeven_10y
      base_weight_sign: 0
      base_weight_magnitude: BASIS_PIN_OFF_EQUATION
      modulate_by: []
      direction: |
        ★force_include 비포함. nominal+real+BE 동시 회귀 ★금지 (VIF 12996). {real_rate, BE} 기저 외부 가드 (H6 SUPPORTED).
      granularity: sleeve
      verdict_anchor: "H6 SUPPORTED (basis pin)"
    - indicator_id: credit_spread_hy_oas
      base_weight_sign: regime_conditional
      base_weight_magnitude: FREEZE
      modulate_by: [regime, liquidity_crisis_flag]
      direction: |
        ★H5 TENTATIVE: 단기 liquidity crisis 시 부호 ★불안정 (Markov crisis state gold panic sell). HY OAS full history 적재 + monthly Markov 재검증 후 활성 path.
      granularity: sleeve
      verdict_anchor: "H5 TENTATIVE DIRECTIONAL"
    - indicator_id: cftc_mm_net_long_gold
      base_weight_sign: contrarian
      base_weight_magnitude: FREEZE
      modulate_by: [positioning_extreme]
      direction: |
        ★main 지시 신규 — over-positioning (z > +2σ) 시 정점 risk indicator (sign 반대 contrarian). 본 v2 미검증, 후속 round 위임.
      granularity: sleeve
      verdict_anchor: "untested in v2"
    - indicator_id: real_rate_decoupling_monitor
      base_weight_sign: triggers_cb_demand_uplift
      base_weight_magnitude: FREEZE
      modulate_by: [composite_3_axis]
      direction: |
        ★main 지시 신규 — 3 axis (H2 unexplained + H7 EG decoupling + 252d Pearson) 동시 (+2σ) → cb_demand 가중 uplift trigger + real_rate 가중 down trigger. regime 전환 indicator.
      granularity: sleeve
      verdict_anchor: "derived from H2+H7+H8"
    - indicator_id: vix_proxy
      base_weight_sign: neg
      base_weight_magnitude: FREEZE
      modulate_by: [regime]
      direction: "보조 risk regime indicator. H5 검증 시 약한 음 magnitude."
      granularity: sleeve
    - indicator_id: gold_mom_12_1
      base_weight_sign: pos
      base_weight_magnitude: CAP_0.04
      modulate_by: [regime]
      direction: "추세지속 국면 → 모멘텀 보조 가중. cap 낮게 (반사성 risk + 가격기반 is_core=false)."
      granularity: sleeve

